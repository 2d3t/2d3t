<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заметки PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e14;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1a1f26;
            padding: 24px 20px 30px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid #2d3744;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #2d3744;
            padding-bottom: 14px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #94a3b8;
            background: #2d3744;
            padding: 4px 14px;
            border-radius: 30px;
        }
        .status-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 18px;
        }
        .status {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            background: #1e293b;
            transition: 0.2s;
        }
        .online { color: #4ade80; }
        .offline { color: #f87171; }
        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .add-section input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #334155;
            border-radius: 40px;
            font-size: 1rem;
            background: #0f141a;
            color: #f1f5f9;
            outline: none;
            transition: 0.15s;
        }
        .add-section input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
        }
        .add-section input::placeholder {
            color: #64748b;
        }
        .add-section button {
            background: #4ade80;
            color: #0a0e14;
            border: none;
            border-radius: 40px;
            padding: 0 24px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .add-section button:hover {
            background: #5eea92;
            transform: scale(0.97);
        }
        .add-section button:active {
            transform: scale(0.94);
        }
        .list-container {
            background: #12181f;
            border-radius: 24px;
            padding: 6px 4px;
            min-height: 200px;
            border: 1px solid #2d3744;
        }
        .empty-message {
            text-align: center;
            color: #64748b;
            padding: 40px 10px;
            font-style: italic;
            font-size: 0.95rem;
        }
        .note-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid #26303d;
            border-radius: 12px;
            margin: 2px 0;
            transition: 0.1s;
        }
        .note-item:hover {
            background: #1e293b;
        }
        .note-text {
            flex: 1;
            word-break: break-word;
            font-size: 1rem;
            line-height: 1.4;
            color: #e2e8f0;
        }
        .note-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .note-actions button {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.1s;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .note-actions button:hover {
            background: #2d3744;
        }
        .note-actions .copy-btn:hover {
            background: #1e3a2f;
            color: #4ade80;
        }
        .note-actions .delete-btn:hover {
            background: #3f1e1e;
            color: #f87171;
        }
        .footer-info {
            margin-top: 18px;
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: 0.25s ease;
            pointer-events: none;
            z-index: 999;
            border: 1px solid #334155;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            📋 Заметки
            <small id="counter">0</small>
        </h1>

        <div class="status-bar">
            <div class="status online" id="status">🟢 Онлайн</div>
        </div>

        <div class="add-section">
            <input type="text" id="noteInput" placeholder="Новая заметка..." autofocus>
            <button id="addBtn">➕ Добавить</button>
        </div>

        <div class="list-container" id="listContainer">
            <div class="empty-message" id="emptyMessage">Список пуст · создайте заметку</div>
            <div id="noteList"></div>
        </div>

        <div class="footer-info">
            ✦ сохраняется в localStorage ✦ работает офлайн ✦ копировать, удалять
        </div>
    </div>

    <div id="toast" class="toast">Готово</div>

    <script>
        (function() {
            // ----- состояние -----
            let notes = [];
            const STORAGE_KEY = 'my_notes_list_pwa';

            // DOM
            const noteListEl = document.getElementById('noteList');
            const emptyMessageEl = document.getElementById('emptyMessage');
            const counterEl = document.getElementById('counter');
            const noteInput = document.getElementById('noteInput');
            const addBtn = document.getElementById('addBtn');
            const toastEl = document.getElementById('toast');
            const statusEl = document.getElementById('status');

            // ----- статус сети (как в примере) -----
            function updateStatus() {
                if (navigator.onLine) {
                    statusEl.textContent = '🟢 Онлайн';
                    statusEl.className = 'status online';
                } else {
                    statusEl.textContent = '🔴 Офлайн (кэш)';
                    statusEl.className = 'status offline';
                }
            }
            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);
            updateStatus();

            // ----- загрузка / сохранение -----
            function loadNotes() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed)) {
                            notes = parsed.filter(item => typeof item === 'string' && item.trim() !== '');
                            return;
                        }
                    }
                } catch (_) {}
                notes = [];
            }

            function saveNotes() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            }

            // ----- рендер -----
            function render() {
                noteListEl.innerHTML = '';
                const count = notes.length;
                counterEl.textContent = count;

                if (count === 0) {
                    emptyMessageEl.style.display = 'block';
                    return;
                }
                emptyMessageEl.style.display = 'none';

                notes.forEach((text, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'note-item';

                    const textSpan = document.createElement('span');
                    textSpan.className = 'note-text';
                    textSpan.textContent = text;
                    itemDiv.appendChild(textSpan);

                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'note-actions';

                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = '📋';
                    copyBtn.setAttribute('aria-label', 'Копировать и закрыть');
                    copyBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleCopy(index);
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = '✕';
                    deleteBtn.setAttribute('aria-label', 'Удалить заметку');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        handleDelete(index);
                    });

                    actionsDiv.appendChild(copyBtn);
                    actionsDiv.appendChild(deleteBtn);
                    itemDiv.appendChild(actionsDiv);
                    noteListEl.appendChild(itemDiv);
                });
            }

            // ----- действия -----
            function handleDelete(index) {
                if (index < 0 || index >= notes.length) return;
                notes.splice(index, 1);
                saveNotes();
                render();
                showToast('🗑️ Удалено');
            }

            function handleCopy(index) {
                if (index < 0 || index >= notes.length) return;
                const text = notes[index];
                if (!text) return;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('📋 Скопировано!');
                        attemptCloseWindow();
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('📋 Скопировано!');
                    attemptCloseWindow();
                } catch (_) {
                    showToast('❌ Не удалось скопировать');
                }
                document.body.removeChild(textarea);
            }

            function attemptCloseWindow() {
                try {
                    window.close();
                } catch (_) {}
                // ничего не делаем, если не закрылось
            }

            function addNote() {
                const raw = noteInput.value.trim();
                if (raw === '') {
                    showToast('✏️ Введите текст');
                    return;
                }
                notes.push(raw);
                saveNotes();
                render();
                noteInput.value = '';
                noteInput.focus();
                showToast('✅ Добавлено');
            }

            // ----- тост -----
            let toastTimeout = null;
            function showToast(message) {
                toastEl.textContent = message;
                toastEl.classList.add('show');
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2000);
            }

            // ----- инициализация -----
            loadNotes();
            render();

            addBtn.addEventListener('click', addNote);
            noteInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addNote();
                }
            });

            // ----- Service Worker (как в примере) -----
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('[SW] ✅ Зарегистрирован'))
                    .catch(err => console.log('[SW] ❌ Ошибка:', err));
            }

            // дополнительно: при обновлении страницы данные подтянутся из localStorage
            // и всё будет работать офлайн благодаря SW (если sw.js закеширует страницу)
        })();
    </script>
</body>
</html>
