<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>VAD-кодек lite — запись с шумом</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui;
            max-width: 560px;
            margin: 2rem auto;
            padding: 1rem;
            background: #0f0f13;
            color: #e0e0e0;
        }
        .container {
            background: #1a1a22;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid #2a2a35;
        }
        button {
            background: #2a2a3f;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin: 4px;
            transition: 0.2s;
        }
        button:hover:not(:disabled) {
            background: #3d3d5c;
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .status-box {
            margin: 12px 0;
            padding: 12px;
            background: #111118;
            border-radius: 8px;
            border-left: 3px solid #4a6cf7;
            min-height: 60px;
        }
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .recording { background: #ef4444; color: #fff; }
        .idle { background: #4a6cf7; color: #fff; }
        .meter {
            height: 4px;
            background: #2a2a3f;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a6cf7, #22c55e);
            transition: width 0.05s;
        }
        .file-info {
            background: #111118;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin: 8px 0;
            word-break: break-all;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: auto auto;
            gap: 4px 20px;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .stats-grid .label { color: #94a3b8; }
        .stats-grid .value { color: #e2e8f0; text-align: right; }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #2a2a3f;
            border-radius: 2px;
            margin: 6px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4a6cf7;
            transition: width 0.3s;
        }
        .status-msg {
            font-size: 0.85rem;
            color: #9ca3af;
            margin: 4px 0;
        }
        .bitrate-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111118;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 6px 0 10px 0;
            flex-wrap: wrap;
            border: 1px solid #2a2a35;
        }
        .bitrate-control label {
            font-size: 0.85rem;
            color: #c0c8d4;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bitrate-control input[type="range"] {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            background: #2a2a3f;
            border-radius: 2px;
            outline: none;
            flex-shrink: 0;
        }
        .bitrate-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4a6cf7;
            cursor: pointer;
        }
        .bitrate-control input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4a6cf7;
            cursor: pointer;
            border: none;
        }
        .bitrate-value {
            font-weight: bold;
            color: #4ade80;
            min-width: 65px;
            text-align: right;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .step-btn {
            background: #2a2a3f;
            border: 1px solid #4a4a5a;
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0 2px;
            cursor: pointer;
            transition: 0.15s;
            line-height: 1;
            flex-shrink: 0;
        }
        .step-btn:hover {
            background: #3d3d5c;
            border-color: #6a6a8a;
        }
        .step-btn:active {
            transform: scale(0.92);
        }
        .slider-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .noise-controls {
            background: #111118;
            border-radius: 8px;
            padding: 10px 12px;
            margin: 8px 0;
            border: 1px solid #2a3a2a;
        }
        .noise-controls .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
        }
        .noise-controls input[type="range"] {
            width: 100px;
            height: 3px;
            -webkit-appearance: none;
            background: #2a2a3f;
            border-radius: 2px;
            outline: none;
            flex-shrink: 0;
        }
        .noise-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #b8860b;
            cursor: pointer;
        }
        .noise-controls input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #b8860b;
            cursor: pointer;
            border: none;
        }
        .noise-value {
            font-weight: bold;
            color: #b8860b;
            min-width: 35px;
            text-align: right;
            font-size: 0.8rem;
        }
        .noise-toggle-btn {
            background: #2a3a2a;
            border: 1px solid #4a6a4a;
            font-size: 0.8rem;
            padding: 4px 14px;
        }
        .noise-toggle-btn.active {
            background: #3a5a3a;
            border-color: #4ade80;
        }
        .noise-toggle-btn:hover:not(:disabled) {
            background: #3a4a3a;
        }
        .noise-status {
            font-size: 0.75rem;
            color: #b8860b;
            margin-left: 4px;
        }
        .playback-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }
        .btn-stop-play {
            background: #3a2a2a;
            border: 1px solid #6a4a4a;
        }
        .btn-stop-play:hover:not(:disabled) {
            background: #5a3a3a;
        }
        .btn-play {
            background: #2a3a4a;
            border: 1px solid #4a6a8a;
        }
        .btn-play:hover:not(:disabled) {
            background: #3a4a5a;
        }
        .load-section {
            border-top: 1px solid #2a2a35;
            padding-top: 10px;
            margin-top: 10px;
        }
        .btn-load-audio { background: #2a3a4a; }
        .btn-load-audio:hover { background: #3a4a5a; }
        .noise-saved-badge {
            display: inline-block;
            font-size: 0.65rem;
            background: #2a3a2a;
            color: #6b8a6b;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            border: 1px solid #3a5a3a;
        }
        #audioContainer {
            margin: 10px 0;
            padding: 10px;
            background: #0a0a0f;
            border-radius: 8px;
            font-size: 0.85rem;
            min-height: 30px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
        }
        @media (max-width: 480px) {
            .bitrate-control input[type="range"] { width: 70px; }
            .bitrate-value { min-width: 55px; font-size: 0.75rem; }
            .noise-controls input[type="range"] { width: 70px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ VAD-lite</h2>
    <p style="font-size:0.85rem;color:#9ca3af;">Запись + коричневый шум</p>

    <!-- БИТРЕЙТ -->
    <div class="bitrate-control">
        <label>
            <span>🎛️ Битрейт</span>
            <div class="slider-wrapper">
                <button class="step-btn" data-target="bitrateSlider" data-dir="-1" data-step="100">−</button>
                <input type="range" id="bitrateSlider" min="4000" max="128000" value="8000" step="100">
                <button class="step-btn" data-target="bitrateSlider" data-dir="1" data-step="100">+</button>
            </div>
            <span class="bitrate-value" id="bitrateDisplay">8.0 kbps</span>
        </label>
        <span style="font-size:0.65rem;color:#6b7280;">(ниже — компактнее)</span>
    </div>

    <!-- КОРИЧНЕВЫЙ ШУМ -->
    <div class="noise-controls">
        <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:4px;">
            🟫 Коричневый шум (фон)
            <span class="noise-saved-badge" id="noiseSavedBadge">💾 сохраняется в .vad</span>
        </div>
        <div class="control-row">
            <button class="noise-toggle-btn active" id="btnToggleNoise">🔊 Шум ВКЛ</button>
            <div class="slider-wrapper">
                <button class="step-btn" data-target="noiseVolumeSlider" data-dir="-1" data-step="0.005">−</button>
                <input type="range" id="noiseVolumeSlider" min="0.005" max="0.3" value="0.05" step="0.005">
                <button class="step-btn" data-target="noiseVolumeSlider" data-dir="1" data-step="0.005">+</button>
            </div>
            <span class="noise-value" id="noiseVolumeDisplay">0.05</span>
            <span class="noise-status" id="noiseStatus">🟫 Коричневый шум</span>
        </div>
    </div>

    <div class="row">
        <button id="btnRecord">🔴 Запись</button>
        <button id="btnStop" disabled>⏹ Стоп</button>
        <button id="btnPlay" disabled class="btn-play">▶️ Воспр.</button>
        <button id="btnExport" disabled>💾 Экспорт .vad</button>
        <button id="btnLoad" style="background:#2a2a3f;">📂 Загрузить .vad</button>
    </div>

    <div class="playback-controls">
        <button id="btnStopPlay" disabled class="btn-stop-play">⏹️ Остановить воспр.</button>
    </div>

    <div class="load-section">
        <button id="btnLoadAudio" class="btn-load-audio">📁 Загрузить аудио (MP3/WAV/OGG)</button>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="status-box" id="statusBox">
        <div>
            <span class="badge idle" id="statusBadge">⏸ Ожидание</span>
            <span id="infoText">Длительность: 0с</span>
        </div>
        <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
    </div>

    <div class="stats-grid">
        <span class="label">Длительность:</span>
        <span class="value" id="totalDuration">0с</span>
        <span class="label">Размер файла:</span>
        <span class="value" id="dataSize">0 KB</span>
        <span class="label">Битрейт:</span>
        <span class="value" id="bitrateInfo">8.0 kbps</span>
    </div>

    <div id="audioContainer"></div>

    <div class="file-info" id="fileInfo">Готов к работе</div>
</div>

<script>
// ============================================================
// КОНФИГ
// ============================================================
const DEFAULTS = {
    bitrate: 8000,
    mimeType: 'audio/webm;codecs=opus',
    noiseEnabled: true,
    noiseType: 'brown',
    noiseVolume: 0.05,
};

const CFG = {
    bitrate: DEFAULTS.bitrate,
    mimeType: DEFAULTS.mimeType,
    noiseEnabled: DEFAULTS.noiseEnabled,
    noiseType: DEFAULTS.noiseType,
    noiseVolume: DEFAULTS.noiseVolume,
};

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let state = {
    isRecording: false,
    mediaRecorder: null,
    audioCtx: null,
    analyser: null,
    dataArray: null,
    stream: null,
    isPlaying: false,
    allChunks: [],
    fullAudioBlob: null,
    fullAudioBuffer: null,
    recordingStartTime: 0,
    isProcessing: false,
    playbackSource: null,
    playbackTimeout: null,
    abortController: null,
    isPlaybackComplete: false,
    noiseGainNode: null,
    noiseSource: null,
};

const $ = id => document.getElementById(id);

const btnRecord = $('btnRecord');
const btnStop = $('btnStop');
const btnPlay = $('btnPlay');
const btnStopPlay = $('btnStopPlay');
const btnExport = $('btnExport');
const btnLoad = $('btnLoad');
const btnLoadAudio = $('btnLoadAudio');
const statusBadge = $('statusBadge');
const infoText = $('infoText');
const meterFill = $('meterFill');
const audioContainer = $('audioContainer');
const fileInfo = $('fileInfo');
const totalDuration = $('totalDuration');
const dataSize = $('dataSize');
const bitrateInfo = $('bitrateInfo');
const progressFill = $('progressFill');
const statusMsg = $('statusMsg');

const bitrateSlider = $('bitrateSlider');
const bitrateDisplay = $('bitrateDisplay');

const noiseVolumeSlider = $('noiseVolumeSlider');
const noiseVolumeDisplay = $('noiseVolumeDisplay');
const btnToggleNoise = $('btnToggleNoise');
const noiseStatus = $('noiseStatus');
const noiseSavedBadge = $('noiseSavedBadge');

// ============================================================
// КНОПКИ +/-
// ============================================================
function applyStep(btn) {
    const targetId = btn.dataset.target;
    const dir = parseInt(btn.dataset.dir, 10);
    const step = parseFloat(btn.dataset.step);
    const slider = document.getElementById(targetId);
    if (!slider) return;
    let val = parseFloat(slider.value) + dir * step;
    const min = parseFloat(slider.min);
    const max = parseFloat(slider.max);
    if (val < min) val = min;
    if (val > max) val = max;
    slider.value = val;
    slider.dispatchEvent(new Event('input', { bubbles: true }));
}

document.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.preventDefault();
        applyStep(this);
    });
});

// ============================================================
// ОБНОВЛЕНИЕ ОТОБРАЖЕНИЯ
// ============================================================
function updateBitrateDisplay() {
    const val = parseInt(bitrateSlider.value, 10);
    if (val >= 1000) {
        bitrateDisplay.textContent = (val / 1000).toFixed(1) + ' kbps';
    } else {
        bitrateDisplay.textContent = val + ' bps';
    }
    CFG.bitrate = val;
    bitrateInfo.textContent = bitrateDisplay.textContent;
}
bitrateSlider.addEventListener('input', updateBitrateDisplay);
updateBitrateDisplay();

noiseVolumeSlider.addEventListener('input', () => {
    const val = parseFloat(noiseVolumeSlider.value);
    noiseVolumeDisplay.textContent = val.toFixed(2);
    CFG.noiseVolume = val;
    if (state.noiseGainNode) {
        state.noiseGainNode.gain.setTargetAtTime(val, state.audioCtx.currentTime, 0.05);
    }
});
noiseVolumeSlider.value = DEFAULTS.noiseVolume;
noiseVolumeDisplay.textContent = DEFAULTS.noiseVolume.toFixed(2);

btnToggleNoise.addEventListener('click', () => {
    CFG.noiseEnabled = !CFG.noiseEnabled;
    if (CFG.noiseEnabled) {
        btnToggleNoise.textContent = '🔊 Шум ВКЛ';
        btnToggleNoise.classList.add('active');
        noiseStatus.textContent = '🟫 Коричневый шум';
    } else {
        btnToggleNoise.textContent = '🔇 Шум ВЫКЛ';
        btnToggleNoise.classList.remove('active');
        noiseStatus.textContent = '🔇 Без шума';
    }
});

// ============================================================
// АУДИО-ДЕТЕКТОР (только для индикатора)
// ============================================================
async function getAudioContext() {
    if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (state.audioCtx.state === 'suspended') await state.audioCtx.resume();
    return state.audioCtx;
}

function setupAnalyser(stream) {
    const ctx = state.audioCtx;
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    state.analyser = analyser;
    state.dataArray = new Uint8Array(analyser.fftSize);
    return analyser;
}

function getRMS() {
    const analyser = state.analyser;
    if (!analyser) return 0;
    const data = state.dataArray;
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
    }
    return Math.sqrt(sum / data.length);
}

// ============================================================
// ГЕНЕРАЦИЯ КОРИЧНЕВОГО ШУМА
// ============================================================
function generateBrownNoise(ctx, duration, volume) {
    const sampleRate = ctx.sampleRate;
    const length = Math.floor(sampleRate * duration);
    const buffer = ctx.createBuffer(1, length, sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + white * 0.02) / 1.02;
        data[i] = last * volume * 0.8;
    }
    return buffer;
}

// ============================================================
// ЗАПИСЬ (БЕЗ ВЫРЕЗАНИЯ ПАУЗ)
// ============================================================
function startRecording() {
    if (state.isRecording) return;
    if (state.isPlaying) stopPlayback();

    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(async stream => {
            state.stream = stream;
            await getAudioContext();
            setupAnalyser(stream);
            state.allChunks = [];
            state.recordingStartTime = performance.now();

            const options = {
                mimeType: CFG.mimeType,
                audioBitsPerSecond: CFG.bitrate,
            };

            const recorder = new MediaRecorder(stream, options);
            state.mediaRecorder = recorder;

            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    state.allChunks.push(e.data);
                }
            };

            // Индикатор громкости
            const meterInterval = setInterval(() => {
                if (!state.isRecording) {
                    clearInterval(meterInterval);
                    return;
                }
                const rms = getRMS();
                meterFill.style.width = Math.min(rms * 400, 100) + '%';
            }, 100);

            recorder.start(250);
            state.isRecording = true;
            updateUI();

            btnRecord.disabled = true;
            btnStop.disabled = false;
            btnPlay.disabled = true;
            btnExport.disabled = true;
            btnStopPlay.disabled = true;

            const stopHandler = () => {
                clearInterval(meterInterval);
                if (state.allChunks.length > 0) {
                    const fullBlob = new Blob(state.allChunks, { type: options.mimeType });
                    state.fullAudioBlob = fullBlob;

                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const ctx = await getAudioContext();
                            const buffer = await ctx.decodeAudioData(e.target.result);
                            state.fullAudioBuffer = buffer;
                            btnPlay.disabled = false;
                            btnExport.disabled = false;
                            updateUI();
                            updateStats();
                            const duration = buffer.duration;
                            fileInfo.textContent = `✅ Запись завершена. Длительность: ${duration.toFixed(1)}с, ${(fullBlob.size/1024).toFixed(1)} KB, битрейт ${(CFG.bitrate/1000).toFixed(1)} kbps`;
                            audioContainer.innerHTML = `✅ Запись: ${duration.toFixed(2)}с, ${(fullBlob.size/1024).toFixed(1)} KB`;
                        } catch (err) {
                            console.error('Ошибка декодирования:', err);
                            fileInfo.textContent = '❌ Ошибка декодирования аудио';
                        }
                    };
                    reader.readAsArrayBuffer(fullBlob);
                }
                recorder.removeEventListener('stop', stopHandler);
            };

            recorder.addEventListener('stop', stopHandler);
            recorder.onerror = (e) => { console.error('Recorder error:', e); stopRecording(); };
        })
        .catch(err => { alert('Ошибка микрофона: ' + err.message); });
}

function stopRecording() {
    if (!state.isRecording) return;
    state.isRecording = false;
    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        state.mediaRecorder.stop();
    }
    if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
    }
    btnRecord.disabled = false;
    btnStop.disabled = true;
    meterFill.style.width = '0%';
    updateUI();
}

// ============================================================
// ВОСПРОИЗВЕДЕНИЕ С КОРИЧНЕВЫМ ШУМОМ (НЕПРЕРЫВНЫЙ ФОН)
// ============================================================
async function playWithNoise() {
    if (state.isPlaying) return;
    if (!state.fullAudioBuffer) {
        audioContainer.innerHTML = '❌ Аудио не загружено.';
        return;
    }

    try {
        const ctx = await getAudioContext();
        if (ctx.state === 'suspended') await ctx.resume();
        state.abortController = new AbortController();
        state.isPlaying = true;
        state.isPlaybackComplete = false;
        btnPlay.disabled = true;
        btnStopPlay.disabled = false;
        audioContainer.innerHTML = '🔄 Воспроизведение...<br>';

        const buffer = state.fullAudioBuffer;
        const totalDuration = buffer.duration;

        // === ЗАПУСКАЕМ НЕПРЕРЫВНЫЙ КОРИЧНЕВЫЙ ШУМ ===
        let noiseGain = null;
        let noiseSource = null;
        if (CFG.noiseEnabled) {
            try {
                const noiseBuffer = generateBrownNoise(ctx, totalDuration + 2, CFG.noiseVolume);
                noiseSource = ctx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;

                noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(CFG.noiseVolume, ctx.currentTime);

                noiseSource.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noiseSource.start();

                state.noiseSource = noiseSource;
                state.noiseGainNode = noiseGain;
                audioContainer.innerHTML += `🔊 Коричневый шум `;
            } catch (e) {
                console.warn('Ошибка запуска шума:', e);
            }
        }

        // === ВОСПРОИЗВОДИМ ВЕСЬ ТРЕК ===
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        state.playbackSource = source;

        source.start();
        audioContainer.innerHTML += `🎵 Трек (${totalDuration.toFixed(2)}с)`;

        await new Promise((resolve) => {
            const timeout = setTimeout(resolve, (totalDuration * 1000) + 500);
            state.playbackTimeout = timeout;
            source.onended = () => { clearTimeout(timeout); resolve(); };
        });

        // Останавливаем шум
        if (noiseSource) {
            try { noiseSource.stop(); noiseSource.disconnect(); } catch(e) {}
            state.noiseSource = null;
        }
        if (noiseGain) {
            try { noiseGain.disconnect(); } catch(e) {}
            state.noiseGainNode = null;
        }

        if (!state.abortController.signal.aborted) {
            state.isPlaybackComplete = true;
            audioContainer.innerHTML += `<br>✅ Воспроизведение завершено`;
            resetPlayback();
        } else {
            audioContainer.innerHTML += '<br>⏹️ Воспроизведение остановлено';
            state.isPlaybackComplete = true;
            resetPlayback();
        }

    } catch (err) {
        console.error('Playback error:', err);
        audioContainer.innerHTML = `❌ Ошибка: ${err.message}`;
        resetPlayback();
    }
}

function stopPlayback() {
    if (state.isPlaying) {
        if (state.abortController) {
            state.abortController.abort();
            state.abortController = null;
        }
        state.isPlaybackComplete = true;
        // Останавливаем шум
        if (state.noiseSource) {
            try { state.noiseSource.stop(); state.noiseSource.disconnect(); } catch(e) {}
            state.noiseSource = null;
        }
        if (state.noiseGainNode) {
            try { state.noiseGainNode.disconnect(); } catch(e) {}
            state.noiseGainNode = null;
        }
        resetPlayback();
    }
}

function resetPlayback() {
    state.isPlaying = false;
    if (state.playbackSource) { try { state.playbackSource.stop(); } catch(e) {} state.playbackSource = null; }
    if (state.playbackTimeout) { clearTimeout(state.playbackTimeout); state.playbackTimeout = null; }
    if (state.abortController) { state.abortController = null; }
    btnPlay.disabled = false;
    btnStopPlay.disabled = true;
}

// ============================================================
// ЭКСПОРТ / ИМПОРТ (VAD9 с настройками шума)
// ============================================================
function exportVAD() {
    if (!state.fullAudioBlob) {
        alert('Нет аудиоданных для экспорта. Сначала запишите или загрузите аудио.');
        return;
    }

    const encoder = new TextEncoder();
    const magic = encoder.encode('VAD9');
    const parts = [magic];

    // Сохраняем настройки шума (всегда коричневый, сохраняем только громкость)
    const noiseTypeByte = 2; // 2 = коричневый
    const noiseTypeBuf = new ArrayBuffer(1);
    const ntView = new DataView(noiseTypeBuf);
    ntView.setUint8(0, noiseTypeByte);
    parts.push(noiseTypeBuf);

    const noiseVolBuf = new ArrayBuffer(4);
    const nvView = new DataView(noiseVolBuf);
    nvView.setFloat32(0, CFG.noiseVolume, true);
    parts.push(noiseVolBuf);

    // Заголовок: кол-во сегментов = 1 (целый трек)
    const header = new ArrayBuffer(2);
    const hView = new DataView(header);
    hView.setUint16(0, 1, true);
    parts.push(header);

    // Размер аудио
    const size = state.fullAudioBlob.size;
    const sizeBuf = new ArrayBuffer(4);
    const sView = new DataView(sizeBuf);
    sView.setUint32(0, size, true);
    parts.push(sizeBuf);
    parts.push(state.fullAudioBlob);

    // Один сегмент типа "speech"
    const typeBuf = new ArrayBuffer(1);
    const tView = new DataView(typeBuf);
    tView.setUint8(0, 0);
    parts.push(typeBuf);

    const duration = Math.round(state.fullAudioBuffer.duration * 1000);
    const durBuf = new ArrayBuffer(4);
    const dView = new DataView(durBuf);
    dView.setUint32(0, duration, true);
    parts.push(durBuf);

    const startOffsetBuf = new ArrayBuffer(4);
    const sView2 = new DataView(startOffsetBuf);
    sView2.setUint32(0, 0, true);
    parts.push(startOffsetBuf);

    const endOffsetBuf = new ArrayBuffer(4);
    const eView = new DataView(endOffsetBuf);
    eView.setUint32(0, duration, true);
    parts.push(endOffsetBuf);

    const blob = new Blob(parts);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vad_${Date.now()}.vad`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    fileInfo.textContent = `💾 Экспортировано: ${(blob.size/1024).toFixed(1)} KB, шум: коричневый (${CFG.noiseVolume.toFixed(2)})`;
}

function loadVAD(file) {
    file.arrayBuffer().then(buffer => {
        const data = new Uint8Array(buffer);
        let offset = 0;

        const magic = new TextDecoder().decode(data.slice(0, 4));
        if (!['VAD5', 'VAD6', 'VAD7', 'VAD8', 'VAD9'].includes(magic)) {
            alert('Неверный формат .vad');
            return;
        }
        offset += 4;

        let loadedNoiseVolume = null;

        if (magic === 'VAD9') {
            const noiseTypeByte = new DataView(buffer, offset, 1).getUint8(0);
            offset += 1;
            const vol = new DataView(buffer, offset, 4).getFloat32(0, true);
            offset += 4;
            loadedNoiseVolume = Math.min(Math.max(vol, 0.005), 0.3);
            // Всегда коричневый, игнорируем тип из файла
        }

        const segCount = new DataView(buffer, offset, 2).getUint16(0, true);
        offset += 2;

        const audioSize = new DataView(buffer, offset, 4).getUint32(0, true);
        offset += 4;

        if (audioSize > 0) {
            const audioData = data.slice(offset, offset + audioSize);
            state.fullAudioBlob = new Blob([audioData], { type: CFG.mimeType });
            offset += audioSize;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const ctx = await getAudioContext();
                    const audioBuffer = await ctx.decodeAudioData(e.target.result);
                    state.fullAudioBuffer = audioBuffer;
                    btnPlay.disabled = false;
                    btnExport.disabled = false;
                    btnStopPlay.disabled = true;
                    updateUI();
                    updateStats();

                    if (loadedNoiseVolume !== null) {
                        CFG.noiseVolume = loadedNoiseVolume;
                        noiseVolumeSlider.value = loadedNoiseVolume;
                        noiseVolumeDisplay.textContent = loadedNoiseVolume.toFixed(2);
                        CFG.noiseEnabled = true;
                        btnToggleNoise.textContent = '🔊 Шум ВКЛ';
                        btnToggleNoise.classList.add('active');
                        noiseStatus.textContent = '🟫 Коричневый шум';
                        noiseSavedBadge.textContent = '💾 восстановлено из .vad';
                        noiseSavedBadge.style.color = '#4ade80';
                        noiseSavedBadge.style.borderColor = '#4ade80';
                        setTimeout(() => {
                            noiseSavedBadge.textContent = '💾 сохраняется в .vad';
                            noiseSavedBadge.style.color = '#6b8a6b';
                            noiseSavedBadge.style.borderColor = '#3a5a3a';
                        }, 4000);
                        fileInfo.textContent += ` | 🎛️ Шум: ${loadedNoiseVolume.toFixed(2)}`;
                    }
                } catch (err) { console.error('Ошибка декодирования:', err); }
            };
            reader.readAsArrayBuffer(state.fullAudioBlob);
        } else {
            state.fullAudioBlob = null;
            state.fullAudioBuffer = null;
        }

        // Пропускаем сегменты (нам не нужны)
        for (let i = 0; i < segCount; i++) {
            const type = new DataView(buffer, offset, 1).getUint8(0);
            offset += 1;
            if (type === 0) {
                const duration = new DataView(buffer, offset, 4).getUint32(0, true);
                offset += 4;
                let startTimeOffset = 0, endTimeOffset = 0;
                if (['VAD6', 'VAD7', 'VAD8', 'VAD9'].includes(magic)) {
                    startTimeOffset = new DataView(buffer, offset, 4).getUint32(0, true);
                    offset += 4;
                    endTimeOffset = new DataView(buffer, offset, 4).getUint32(0, true);
                    offset += 4;
                }
            } else {
                const duration = new DataView(buffer, offset, 4).getUint32(0, true);
                offset += 4;
            }
        }

        btnPlay.disabled = false;
        btnExport.disabled = false;
        btnStopPlay.disabled = true;
        updateUI();
        updateStats();

        fileInfo.textContent = `📂 Загружено: ${state.fullAudioBlob ? (state.fullAudioBlob.size/1024).toFixed(1) : 0} KB аудио`;
        if (loadedNoiseVolume !== null) {
            fileInfo.textContent += ` | 🎛️ Шум: ${loadedNoiseVolume.toFixed(2)}`;
        }
    });
}

// ============================================================
// ЗАГРУЗКА АУДИОФАЙЛА
// ============================================================
async function loadAudioFile(file) {
    if (state.isProcessing) return;
    state.isProcessing = true;
    progressFill.style.width = '5%';
    statusMsg.textContent = '⏳ Декодирование...';

    try {
        const ctx = await getAudioContext();
        const arrayBuffer = await file.arrayBuffer();
        progressFill.style.width = '30%';
        statusMsg.textContent = '⏳ Конвертация в Opus...';

        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

        // Конвертируем в Opus
        const dest = ctx.createMediaStreamDestination();
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(dest);

        const recorder = new MediaRecorder(dest.stream, {
            mimeType: CFG.mimeType,
            audioBitsPerSecond: CFG.bitrate,
        });

        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

        await new Promise((resolve) => {
            recorder.onstop = resolve;
            recorder.start(250);
            source.start();
            setTimeout(() => {
                try { if (recorder.state !== 'inactive') recorder.stop(); } catch(e) {}
                source.stop();
            }, (audioBuffer.duration * 1000) + 500);
        });

        const opusBlob = new Blob(chunks, { type: CFG.mimeType });
        state.fullAudioBuffer = audioBuffer;
        state.fullAudioBlob = opusBlob;

        progressFill.style.width = '100%';
        statusMsg.textContent = '✅ Готово!';
        btnPlay.disabled = false;
        btnExport.disabled = false;
        btnStopPlay.disabled = true;
        updateUI();
        updateStats();

        fileInfo.textContent = `✅ "${file.name}" (${(opusBlob.size/1024).toFixed(1)} KB, ${(CFG.bitrate/1000).toFixed(1)} kbps)`;
        audioContainer.innerHTML = `✅ "${file.name}" загружен<br>📦 ${audioBuffer.duration.toFixed(2)}с, ${(opusBlob.size/1024).toFixed(1)} KB`;

        setTimeout(() => { progressFill.style.width = '0%'; statusMsg.textContent = ''; }, 3000);

    } catch (err) {
        console.error('Ошибка:', err);
        fileInfo.textContent = `❌ Ошибка: ${err.message}`;
        progressFill.style.width = '0%';
        statusMsg.textContent = `❌ Ошибка: ${err.message}`;
    }
    state.isProcessing = false;
}

// ============================================================
// UI ОБНОВЛЕНИЯ
// ============================================================
function updateUI() {
    if (state.isRecording) {
        statusBadge.className = 'badge recording';
        statusBadge.textContent = '🔴 ЗАПИСЬ';
    } else {
        statusBadge.className = 'badge idle';
        statusBadge.textContent = '⏹ Стоп';
    }
    if (state.fullAudioBuffer) {
        infoText.textContent = `Длительность: ${state.fullAudioBuffer.duration.toFixed(1)}с`;
    } else {
        infoText.textContent = 'Длительность: 0с';
    }
}

function updateStats() {
    if (state.fullAudioBuffer) {
        totalDuration.textContent = state.fullAudioBuffer.duration.toFixed(2) + 'с';
    } else {
        totalDuration.textContent = '0с';
    }
    if (state.fullAudioBlob) {
        dataSize.textContent = (state.fullAudioBlob.size / 1024).toFixed(1) + ' KB';
    } else {
        dataSize.textContent = '0 KB';
    }
}

// ============================================================
// ОБРАБОТЧИКИ
// ============================================================
btnRecord.addEventListener('click', startRecording);
btnStop.addEventListener('click', stopRecording);
btnPlay.addEventListener('click', playWithNoise);
btnStopPlay.addEventListener('click', stopPlayback);
btnExport.addEventListener('click', exportVAD);

btnLoad.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.vad';
    input.onchange = (e) => { if (e.target.files[0]) loadVAD(e.target.files[0]); input.remove(); };
    input.click();
});

btnLoadAudio.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'audio/*';
    input.onchange = (e) => { if (e.target.files[0]) loadAudioFile(e.target.files[0]); input.remove(); };
    input.click();
});

// Инициализация
updateUI();
updateStats();
fileInfo.textContent = '🎙️ Нажми "Запись" или загрузи аудиофайл';
console.log('✅ VAD-lite загружен (коричневый шум, без вырезания пауз)');
</script>

<script>
(function() {
    "use strict";

    function openGame(url, title) {
        const oldOverlay = document.querySelector('.transition-overlay');
        if (oldOverlay) oldOverlay.remove();

        const overlay = document.createElement('div');
        overlay.className = 'transition-overlay';

        const topBar = document.createElement('div');
        topBar.className = 'transition-topbar';

        const backBtn = document.createElement('button');
        backBtn.className = 'transition-back';
        backBtn.textContent = '← Назад';
        backBtn.onclick = function() { overlay.remove(); };

        const titleEl = document.createElement('span');
        titleEl.className = 'transition-title';
        titleEl.textContent = title || '🌐 Загрузка...';

        topBar.appendChild(backBtn);
        topBar.appendChild(titleEl);
        overlay.appendChild(topBar);

        const iframe = document.createElement('iframe');
        iframe.className = 'transition-iframe';
        iframe.src = url;
        iframe.allow = 'camera; microphone; payment; fullscreen; geolocation; downloads';
        iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-presentation allow-downloads';
        overlay.appendChild(iframe);
        document.body.appendChild(overlay);

        const escapeHandler = function(e) {
            if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escapeHandler); }
        };
        document.addEventListener('keydown', escapeHandler);

        iframe.onload = function() {
            try {
                const frameTitle = iframe.contentDocument?.title;
                if (frameTitle && frameTitle !== '' && frameTitle !== 'Загрузка...') {
                    titleEl.textContent = frameTitle;
                }
            } catch (e) {}
        };

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.remove();
        });

        window.addEventListener('message', function(event) {
            if (event.source !== iframe.contentWindow) return;
            const data = event.data;
            if (data && data.type === 'download') {
                handleDownload(data.content, data.filename, data.mimeType);
            }
        });

        return overlay;
    }

    function handleDownload(content, filename, mimeType) {
        try {
            if (typeof content === 'string' && content.startsWith('http')) {
                const a = document.createElement('a');
                a.href = content;
                a.download = filename || 'download';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showNotification('✅ Скачивание началось!', 'success');
                return;
            }
            let blob;
            if (typeof content === 'string') {
                blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
            } else if (content instanceof Blob) {
                blob = content;
            } else {
                throw new Error('Неподдерживаемый формат данных');
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            showNotification('✅ Файл "' + (filename || 'download') + '" сохранён!', 'success');
        } catch (error) {
            console.error('Ошибка скачивания:', error);
            showNotification('❌ Ошибка скачивания: ' + error.message, 'error');
        }
    }

    function showNotification(message, type) {
        const old = document.querySelector('.download-notification');
        if (old) old.remove();
        const notification = document.createElement('div');
        notification.className = 'download-notification ' + (type || '');
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s';
            setTimeout(() => notification.remove(), 500);
        }, 3000);
    }

    window.openGame = openGame;
    window.handleDownload = handleDownload;
    window.showNotification = showNotification;

    function registerSW() {
        if (!('serviceWorker' in navigator)) {
            console.warn('[SW] ❌ Service Worker не поддерживается');
            return;
        }
        navigator.serviceWorker.getRegistration()
            .then(function(registration) {
                if (registration) {
                    console.log('[SW] ✅ Уже зарегистрирован:', registration);
                    return;
                }
                navigator.serviceWorker.register('sw.js')
                    .then(function(reg) { console.log('[SW] ✅ Зарегистрирован:', reg); })
                    .catch(function(err) { console.error('[SW] ❌ Ошибка:', err); });
            })
            .catch(function(err) { console.error('[SW] ❌ Ошибка проверки:', err); });
    }

    function checkNetwork() {
        const status = navigator.onLine ? 'Онлайн' : 'Офлайн (из кэша)';
        console.log('📡 ' + status);
    }

    function setupNetworkListeners() {
        window.addEventListener('online', function() {
            console.log('📡 Сеть восстановлена');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready
                    .then(function(registration) { registration.update(); console.log('[SW] 🔄 Проверка обновлений...'); })
                    .catch(function() {});
            }
        });
        window.addEventListener('offline', function() {
            console.log('📡 Сеть отключена (работаем из кэша)');
        });
    }

    function init() {
        registerSW();
        checkNetwork();
        setupNetworkListeners();
        console.log('[APP] ✅ Офлайн-функционал активирован');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>
