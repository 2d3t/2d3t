<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAD-кодек v8 (исправленное дублирование)</title>
    <style>
        body {
            font-family: system-ui;
            max-width: 700px;
            margin: 2rem auto;
            padding: 1rem;
            background: #0f0f13;
            color: #e0e0e0;
        }
        .container {
            background: #1a1a22;
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid #2a2a35;
        }
        button {
            background: #2a2a3f;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        button:hover:not(:disabled) {
            background: #3d3d5c;
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .status-box {
            margin: 15px 0;
            padding: 12px;
            background: #111118;
            border-radius: 8px;
            border-left: 3px solid #4a6cf7;
            min-height: 70px;
        }
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .speaking {
            background: #22c55e;
            color: #000;
        }
        .silence {
            background: #6b7280;
            color: #fff;
        }
        .idle {
            background: #4a6cf7;
            color: #fff;
        }
        .meter {
            height: 4px;
            background: #2a2a3f;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a6cf7, #22c55e);
            transition: width 0.05s;
        }
        .meta-view {
            max-height: 150px;
            overflow-y: auto;
            background: #0a0a0f;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: monospace;
            margin: 8px 0;
        }
        .meta-view .segment {
            display: inline-block;
            padding: 2px 8px;
            margin: 2px;
            border-radius: 4px;
        }
        .meta-view .speech-seg {
            background: #1a3a2a;
            color: #4ade80;
        }
        .meta-view .pause-seg {
            background: #2a2a3a;
            color: #94a3b8;
        }
        .file-info {
            background: #111118;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin: 8px 0;
            word-break: break-all;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0;
        }
        #audioContainer {
            margin: 10px 0;
            padding: 10px;
            background: #0a0a0f;
            border-radius: 8px;
            font-size: 0.9rem;
            min-height: 30px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: auto auto;
            gap: 4px 20px;
            margin: 8px 0;
            font-size: 0.85rem;
        }
        .stats-grid .label {
            color: #94a3b8;
        }
        .stats-grid .value {
            color: #e2e8f0;
            text-align: right;
        }
        .prebuffer-info {
            background: #1a2a3a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin: 5px 0;
            border-left: 3px solid #4a6cf7;
        }
        .segment-list {
            max-height: 200px;
            overflow-y: auto;
            background: #0a0a0f;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: monospace;
            margin: 8px 0;
        }
        .segment-item {
            padding: 2px 6px;
            margin: 1px 0;
            border-radius: 3px;
        }
        .segment-item.speech {
            color: #4ade80;
            background: #1a3a2a;
        }
        .segment-item.pause {
            color: #94a3b8;
            background: #1a1a2a;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎙️ VAD-кодек v8</h2>
    <p style="font-size:0.9rem;color:#9ca3af;">Речь → Opus, тишина → логи (исправлено дублирование)</p>

    <div class="row">
        <button id="btnRecord">🔴 Запись</button>
        <button id="btnStop" disabled>⏹ Стоп</button>
        <button id="btnPlay" disabled>▶️ Воспр.</button>
        <button id="btnExport" disabled>💾 Экспорт .vad</button>
        <button id="btnLoad" style="background:#2a2a3f;">📂 Загрузить .vad</button>
    </div>

    <div class="status-box" id="statusBox">
        <div>
            <span class="badge idle" id="statusBadge">⏸ Ожидание</span>
            <span id="counterText">Сегментов: 0</span>
        </div>
        <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
        <div id="debugInfo" style="font-size:0.75rem;color:#6b7280;margin-top:4px;"></div>
    </div>

    <div class="prebuffer-info" id="prebufferInfo">
        ⚡ Пре-буфер: записываем всё целиком, потом обрезаем по меткам
    </div>

    <div class="stats-grid">
        <span class="label">Речевых сегментов:</span>
        <span class="value" id="speechCount">0</span>
        <span class="label">Пауз:</span>
        <span class="value" id="pauseCount">0</span>
        <span class="label">Общая длительность:</span>
        <span class="value" id="totalDuration">0с</span>
        <span class="label">Размер данных:</span>
        <span class="value" id="dataSize">0 KB</span>
    </div>

    <div class="segment-list" id="segmentList"></div>

    <div id="audioContainer"></div>

    <div class="file-info" id="fileInfo">Готов к работе</div>
</div>

<script>
// ============================================================
// КОНФИГ
// ============================================================
const CFG = {
    threshold: 0.01,
    minSilenceMs: 300,
    bitrate: 5500,
    mimeType: 'audio/webm;codecs=opus',
    prebufferMs: 500,
    vadInterval: 700, // Более частый анализ для точности
};

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let state = {
    isRecording: false,
    isSpeaking: false,
    segments: [],
    silenceStart: 0,
    mediaRecorder: null,
    audioCtx: null,
    analyser: null,
    dataArray: null,
    stream: null,
    isPlaying: false,
    _checkInterval: null,
    speechStartTime: 0,
    lastSegmentTime: 0,
    allChunks: [],
    speechBoundaries: [],
    fullAudioBlob: null,
    fullAudioBuffer: null,
    recordingStartTime: 0,
    prebufferChunks: [],
    isPrebuffering: false,
    currentSpeechStart: 0,
    speechStartOffset: 0,
    hasActiveSpeech: false,
    lastSpeechEndTime: 0,
};

// DOM
const $ = id => document.getElementById(id);
const btnRecord = $('btnRecord');
const btnStop = $('btnStop');
const btnPlay = $('btnPlay');
const btnExport = $('btnExport');
const btnLoad = $('btnLoad');
const statusBadge = $('statusBadge');
const counterText = $('counterText');
const meterFill = $('meterFill');
const debugInfo = $('debugInfo');
const audioContainer = $('audioContainer');
const fileInfo = $('fileInfo');
const speechCount = $('speechCount');
const pauseCount = $('pauseCount');
const totalDuration = $('totalDuration');
const dataSize = $('dataSize');
const prebufferInfo = $('prebufferInfo');
const segmentList = $('segmentList');

// ============================================================
// АУДИО-ДЕТЕКТОР
// ============================================================
async function getAudioContext() {
    if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (state.audioCtx.state === 'suspended') {
        await state.audioCtx.resume();
    }
    return state.audioCtx;
}

function setupAnalyser(stream) {
    const ctx = state.audioCtx;
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    state.analyser = analyser;
    state.dataArray = new Uint8Array(analyser.fftSize);
    return analyser;
}

function getRMS() {
    const analyser = state.analyser;
    if (!analyser) return 0;
    const data = state.dataArray;
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
    }
    return Math.sqrt(sum / data.length);
}

// ============================================================
// ОСНОВНАЯ ЛОГИКА (исправленная)
// ============================================================
function startRecording() {
    if (state.isRecording) return;

    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(async stream => {
            state.stream = stream;
            await getAudioContext();
            setupAnalyser(stream);

            state.segments = [];
            state.allChunks = [];
            state.speechBoundaries = [];
            state.isSpeaking = false;
            state.silenceStart = 0;
            state.speechStartTime = 0;
            state.lastSegmentTime = 0;
            state.recordingStartTime = performance.now();
            state.prebufferChunks = [];
            state.hasActiveSpeech = false;
            state.currentSpeechStart = 0;
            state.speechStartOffset = 0;
            state.lastSpeechEndTime = 0;

            const options = {
                mimeType: CFG.mimeType,
                audioBitsPerSecond: CFG.bitrate,
            };
            
            const recorder = new MediaRecorder(stream, options);
            state.mediaRecorder = recorder;
            
            let isCurrentlySpeaking = false;
            let speechStartTime = 0;
            let silenceStartTime = 0;
            let lastSpeechEndTime = 0;
            let segmentStartTime = 0;
            let isFirstSpeech = true;

            // Запись чанков
            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    state.allChunks.push(e.data);
                    state.prebufferChunks.push(e.data);
                    
                    // Ограничиваем пре-буфер
                    const prebufferLimit = Math.ceil(CFG.prebufferMs / 250) * 2;
                    if (state.prebufferChunks.length > prebufferLimit) {
                        state.prebufferChunks.shift();
                    }
                }
            };

            // Основной цикл VAD
            const checkInterval = setInterval(() => {
                if (!state.isRecording) {
                    clearInterval(checkInterval);
                    return;
                }

                const now = performance.now();
                const rms = getRMS();
                meterFill.style.width = Math.min(rms * 400, 100) + '%';

                const isVoice = rms > CFG.threshold;

                if (isVoice && !isCurrentlySpeaking) {
                    // РЕЧЬ НАЧАЛАСЬ
                    isCurrentlySpeaking = true;
                    state.isSpeaking = true;
                    state.hasActiveSpeech = true;
                    
                    // Определяем время начала с учетом пре-буфера
                    const prebufferTime = Math.min(CFG.prebufferMs, 1000);
                    const speechAbsoluteStart = now - prebufferTime;
                    const speechRelativeStart = Math.max(0, (now - state.recordingStartTime) - prebufferTime);
                    
                    state.currentSpeechStart = speechAbsoluteStart;
                    state.speechStartOffset = speechRelativeStart;
                    
                    // Добавляем паузу перед речью, если была
                    if (lastSpeechEndTime > 0) {
                        const pauseDuration = (speechAbsoluteStart - lastSpeechEndTime);
                        if (pauseDuration > 100) {
                            state.segments.push({
                                type: 'pause',
                                duration: pauseDuration,
                                startTime: lastSpeechEndTime,
                                endTime: speechAbsoluteStart,
                            });
                            console.log(`⏸ Пауза: ${(pauseDuration/1000).toFixed(2)}с`);
                        }
                    }
                    
                    state.speechStartTime = speechAbsoluteStart;
                    console.log(`🎤 Речь началась (${(speechRelativeStart/1000).toFixed(2)}с)`);
                    
                    isFirstSpeech = false;

                } else if (!isVoice && isCurrentlySpeaking) {
                    // РЕЧЬ ЗАКАНЧИВАЕТСЯ (тишина)
                    if (silenceStartTime === 0) {
                        silenceStartTime = now;
                    } else if (now - silenceStartTime > CFG.minSilenceMs) {
                        // Фиксируем конец речи
                        const speechEndTime = now;
                        const speechDuration = speechEndTime - state.currentSpeechStart;
                        
                        // Создаем сегмент речи
                        const speechSegment = {
                            type: 'speech',
                            duration: speechDuration,
                            startTime: state.currentSpeechStart,
                            endTime: speechEndTime,
                            startTimeOffset: state.speechStartOffset,
                            endTimeOffset: Math.max(0, (now - state.recordingStartTime)),
                            buffer: null,
                            blob: null,
                        };
                        
                        state.segments.push(speechSegment);
                        state.speechBoundaries.push({
                            start: state.currentSpeechStart,
                            end: speechEndTime,
                            startTime: state.speechStartOffset,
                            endTime: (now - state.recordingStartTime),
                        });
                        
                        console.log(`🎤 Речь: ${(speechDuration/1000).toFixed(2)}с (${(state.speechStartOffset/1000).toFixed(2)}с - ${((now - state.recordingStartTime)/1000).toFixed(2)}с)`);
                        
                        // Сбрасываем состояние
                        isCurrentlySpeaking = false;
                        state.isSpeaking = false;
                        state.hasActiveSpeech = false;
                        lastSpeechEndTime = speechEndTime;
                        state.lastSpeechEndTime = speechEndTime;
                        silenceStartTime = 0;
                        
                        // Очищаем пре-буфер после фиксации сегмента
                        state.prebufferChunks = [];
                        
                        updateUI();
                        updateSegmentList();
                        updateStats();
                    }
                } else if (!isVoice && !isCurrentlySpeaking) {
                    // Тишина
                    silenceStartTime = 0;
                }

                debugInfo.textContent = `RMS: ${rms.toFixed(4)} | ${isCurrentlySpeaking ? '🔴 РЕЧЬ' : '⚪ ТИШИНА'} | Сегментов: ${state.segments.length} | Пре-буфер: ${state.prebufferChunks.length} чанков`;
                updateUI();
            }, CFG.vadInterval);

            state._checkInterval = checkInterval;
            
            // Запускаем запись
            recorder.start(250);
            state.isRecording = true;
            updateUI();

            btnRecord.disabled = true;
            btnStop.disabled = false;
            btnPlay.disabled = true;
            btnExport.disabled = true;

            const stopHandler = () => {
                if (state._checkInterval) {
                    clearInterval(state._checkInterval);
                    state._checkInterval = null;
                }
                
                // Если речь активна - фиксируем последний сегмент
                if (isCurrentlySpeaking) {
                    const now = performance.now();
                    const speechDuration = now - state.currentSpeechStart;
                    const speechEndTime = Math.max(0, (now - state.recordingStartTime));
                    
                    state.segments.push({
                        type: 'speech',
                        duration: speechDuration,
                        startTime: state.currentSpeechStart,
                        endTime: now,
                        startTimeOffset: state.speechStartOffset,
                        endTimeOffset: speechEndTime,
                        buffer: null,
                        blob: null,
                    });
                    
                    console.log(`🎤 Последняя речь: ${(speechDuration/1000).toFixed(2)}с (${(state.speechStartOffset/1000).toFixed(2)}с - ${(speechEndTime/1000).toFixed(2)}с)`);
                    isCurrentlySpeaking = false;
                    state.isSpeaking = false;
                }
                
                // Создаем полный Blob
                if (state.allChunks.length > 0) {
                    const fullBlob = new Blob(state.allChunks, { type: options.mimeType });
                    state.fullAudioBlob = fullBlob;
                    
                    // Декодируем аудио
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const ctx = await getAudioContext();
                            const buffer = await ctx.decodeAudioData(e.target.result);
                            state.fullAudioBuffer = buffer;
                            console.log(`✅ Аудио декодировано: ${buffer.duration.toFixed(2)}с`);
                            
                            // Привязываем буфер к сегментам
                            state.segments.forEach(seg => {
                                if (seg.type === 'speech') {
                                    seg.buffer = buffer;
                                }
                            });
                            
                            btnPlay.disabled = false;
                            btnExport.disabled = false;
                            updateUI();
                            updateSegmentList();
                            updateStats();
                            
                            const speechSegments = state.segments.filter(s => s.type === 'speech').length;
                            prebufferInfo.textContent = `✅ Запись завершена. Сегментов речи: ${speechSegments}. Пре-буфер сохранил начало каждой фразы!`;
                        } catch (err) {
                            console.error('Ошибка декодирования:', err);
                            fileInfo.textContent = '❌ Ошибка декодирования аудио';
                            prebufferInfo.textContent = '❌ Ошибка декодирования аудио';
                        }
                    };
                    reader.readAsArrayBuffer(fullBlob);
                    
                    console.log(`📦 Полный аудиофайл: ${(fullBlob.size/1024).toFixed(1)} KB`);
                }
                
                fileInfo.textContent = `📦 Запись: ${state.segments.length} сегментов, ${state.fullAudioBlob ? (state.fullAudioBlob.size/1024).toFixed(1) : 0} KB`;
                
                recorder.removeEventListener('stop', stopHandler);
            };
            
            recorder.addEventListener('stop', stopHandler);

            recorder.onerror = (e) => {
                console.error('Recorder error:', e);
                stopRecording();
            };

        })
        .catch(err => {
            alert('Ошибка микрофона: ' + err.message);
        });
}

function stopRecording() {
    if (!state.isRecording) return;
    state.isRecording = false;
    
    if (state._checkInterval) {
        clearInterval(state._checkInterval);
        state._checkInterval = null;
    }

    if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        state.mediaRecorder.stop();
    }
    if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
    }

    btnRecord.disabled = false;
    btnStop.disabled = true;
    updateUI();
}

// ============================================================
// ВОСПРОИЗВЕДЕНИЕ (исправленное)
// ============================================================
async function playWithPauses() {
    if (state.isPlaying || state.segments.length === 0) return;
    if (!state.fullAudioBuffer) {
        audioContainer.innerHTML = '❌ Аудио не загружено. Попробуйте перезаписать.';
        return;
    }

    state.isPlaying = true;
    btnPlay.disabled = true;
    audioContainer.innerHTML = '🔄 Воспроизведение...<br>';

    try {
        const ctx = await getAudioContext();
        if (ctx.state === 'suspended') await ctx.resume();

        const buffer = state.fullAudioBuffer;
        const sampleRate = buffer.sampleRate;
        let totalTime = 0;
        let speechCount = 0;
        let currentTime = 0;

        for (let i = 0; i < state.segments.length; i++) {
            const seg = state.segments[i];
            
            if (seg.type === 'speech') {
                // Используем точные смещения
                const startOffset = seg.startTimeOffset || 0;
                const endOffset = seg.endTimeOffset || (startOffset + seg.duration);
                
                // Конвертируем в сэмплы
                const startSample = Math.floor((startOffset / 1000) * sampleRate);
                const endSample = Math.floor((endOffset / 1000) * sampleRate);
                const durationSamples = endSample - startSample;
                
                if (durationSamples <= 0) {
                    audioContainer.innerHTML += `⚠️ Пропуск сегмента ${i+1}<br>`;
                    continue;
                }

                // Создаем буфер для фрагмента
                const speechBuffer = ctx.createBuffer(
                    buffer.numberOfChannels,
                    durationSamples,
                    sampleRate
                );

                for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
                    const channelData = buffer.getChannelData(ch);
                    const newChannelData = speechBuffer.getChannelData(ch);
                    for (let j = 0; j < durationSamples; j++) {
                        newChannelData[j] = channelData[startSample + j] || 0;
                    }
                }

                const source = ctx.createBufferSource();
                source.buffer = speechBuffer;
                source.connect(ctx.destination);
                
                const durationSec = speechBuffer.duration;
                totalTime += durationSec;
                speechCount++;
                
                audioContainer.innerHTML += `🎵 Речь #${speechCount} (${durationSec.toFixed(2)}с) `;

                source.start();

                await new Promise((resolve) => {
                    const timeout = setTimeout(resolve, (durationSec * 1000) + 200);
                    source.onended = () => {
                        clearTimeout(timeout);
                        resolve();
                    };
                });

            } else if (seg.type === 'pause') {
                const pauseSec = seg.duration / 1000;
                totalTime += pauseSec;
                audioContainer.innerHTML += `⏸️ ${pauseSec.toFixed(2)}с `;
                await new Promise(resolve => setTimeout(resolve, Math.min(seg.duration, 5000)));
            }
            
            if (i < state.segments.length - 1) {
                audioContainer.innerHTML += '→ ';
            }
        }

        audioContainer.innerHTML += `<br>✅ Воспроизведение завершено (${totalTime.toFixed(2)}с, речевых сегментов: ${speechCount})`;

    } catch (err) {
        console.error('Playback error:', err);
        audioContainer.innerHTML = `❌ Ошибка: ${err.message}`;
    }

    state.isPlaying = false;
    btnPlay.disabled = false;
}

// ============================================================
// ЭКСПОРТ / ИМПОРТ .vad
// ============================================================
function exportVAD() {
    if (state.segments.length === 0) return;

    const encoder = new TextEncoder();
    const magic = encoder.encode('VAD8');
    const parts = [magic];

    const header = new ArrayBuffer(2);
    const hView = new DataView(header);
    hView.setUint16(0, state.segments.length, true);
    parts.push(header);

    if (state.fullAudioBlob) {
        const size = state.fullAudioBlob.size;
        const sizeBuf = new ArrayBuffer(4);
        const sView = new DataView(sizeBuf);
        sView.setUint32(0, size, true);
        parts.push(sizeBuf);
        parts.push(state.fullAudioBlob);
    } else {
        const sizeBuf = new ArrayBuffer(4);
        const sView = new DataView(sizeBuf);
        sView.setUint32(0, 0, true);
        parts.push(sizeBuf);
    }

    state.segments.forEach(seg => {
        const typeBuf = new ArrayBuffer(1);
        const tView = new DataView(typeBuf);
        tView.setUint8(0, seg.type === 'speech' ? 0 : 1);
        parts.push(typeBuf);

        if (seg.type === 'speech') {
            const durBuf = new ArrayBuffer(4);
            const dView = new DataView(durBuf);
            dView.setUint32(0, Math.round(seg.duration || 0), true);
            parts.push(durBuf);
            
            const startOffsetBuf = new ArrayBuffer(4);
            const sView = new DataView(startOffsetBuf);
            sView.setUint32(0, Math.round(seg.startTimeOffset || 0), true);
            parts.push(startOffsetBuf);
            
            const endOffsetBuf = new ArrayBuffer(4);
            const eView = new DataView(endOffsetBuf);
            eView.setUint32(0, Math.round(seg.endTimeOffset || 0), true);
            parts.push(endOffsetBuf);
        } else {
            const durBuf = new ArrayBuffer(4);
            const dView = new DataView(durBuf);
            dView.setUint32(0, Math.round(seg.duration), true);
            parts.push(durBuf);
        }
    });

    const blob = new Blob(parts);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vad_${Date.now()}.vad`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    fileInfo.textContent += ` | Экспортировано (${(blob.size/1024).toFixed(1)} KB)`;
}

function loadVAD(file) {
    file.arrayBuffer().then(buffer => {
        const data = new Uint8Array(buffer);
        let offset = 0;

        const magic = new TextDecoder().decode(data.slice(0, 4));
        if (!['VAD5', 'VAD6', 'VAD7', 'VAD8'].includes(magic)) {
            alert('Неверный формат .vad');
            return;
        }
        offset += 4;

        const segCount = new DataView(buffer, offset, 2).getUint16(0, true);
        offset += 2;

        const audioSize = new DataView(buffer, offset, 4).getUint32(0, true);
        offset += 4;
        
        if (audioSize > 0) {
            const audioData = data.slice(offset, offset + audioSize);
            state.fullAudioBlob = new Blob([audioData], { type: CFG.mimeType });
            offset += audioSize;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const ctx = await getAudioContext();
                    const audioBuffer = await ctx.decodeAudioData(e.target.result);
                    state.fullAudioBuffer = audioBuffer;
                    console.log(`✅ Аудио декодировано: ${audioBuffer.duration.toFixed(2)}с`);
                    
                    state.segments.forEach(seg => {
                        if (seg.type === 'speech') {
                            seg.buffer = audioBuffer;
                        }
                    });
                } catch (err) {
                    console.error('Ошибка декодирования:', err);
                }
            };
            reader.readAsArrayBuffer(state.fullAudioBlob);
        } else {
            state.fullAudioBlob = null;
            state.fullAudioBuffer = null;
        }

        const newSegments = [];
        for (let i = 0; i < segCount; i++) {
            const type = new DataView(buffer, offset, 1).getUint8(0);
            offset += 1;

            if (type === 0) {
                const duration = new DataView(buffer, offset, 4).getUint32(0, true);
                offset += 4;
                
                let startTimeOffset = 0, endTimeOffset = 0;
                if (['VAD6', 'VAD7', 'VAD8'].includes(magic)) {
                    startTimeOffset = new DataView(buffer, offset, 4).getUint32(0, true);
                    offset += 4;
                    endTimeOffset = new DataView(buffer, offset, 4).getUint32(0, true);
                    offset += 4;
                }
                
                newSegments.push({ 
                    type: 'speech', 
                    duration: duration,
                    startTimeOffset: startTimeOffset,
                    endTimeOffset: endTimeOffset || (startTimeOffset + duration),
                    buffer: state.fullAudioBuffer
                });
            } else {
                const duration = new DataView(buffer, offset, 4).getUint32(0, true);
                offset += 4;
                newSegments.push({ type: 'pause', duration: duration });
            }
        }

        state.segments = newSegments;

        btnPlay.disabled = false;
        btnExport.disabled = false;
        updateUI();
        updateSegmentList();
        updateStats();
        
        fileInfo.textContent = `📂 Загружено: ${state.segments.length} сегментов, ${state.fullAudioBlob ? (state.fullAudioBlob.size/1024).toFixed(1) : 0} KB аудио`;
        prebufferInfo.textContent = `📂 Загружен файл с ${state.segments.filter(s => s.type === 'speech').length} речевыми сегментами`;
    });
}

// ============================================================
// UI
// ============================================================
function updateUI() {
    if (state.isRecording) {
        if (state.isSpeaking) {
            statusBadge.className = 'badge speaking';
            statusBadge.textContent = '🔴 ГОВОРИТ';
        } else {
            statusBadge.className = 'badge silence';
            statusBadge.textContent = '⏸️ Тишина';
        }
    } else {
        statusBadge.className = 'badge idle';
        statusBadge.textContent = '⏹ Стоп';
    }

    const speechSegs = state.segments.filter(s => s.type === 'speech').length;
    const pauseSegs = state.segments.filter(s => s.type === 'pause').length;
    counterText.textContent = `Сегментов: ${state.segments.length} (речь: ${speechSegs}, паузы: ${pauseSegs})`;
}

function updateStats() {
    const speechSegs = state.segments.filter(s => s.type === 'speech');
    const pauseSegs = state.segments.filter(s => s.type === 'pause');
    
    speechCount.textContent = speechSegs.length;
    pauseCount.textContent = pauseSegs.length;
    
    let totalTime = 0;
    state.segments.forEach(s => {
        totalTime += s.duration || 0;
    });
    totalDuration.textContent = (totalTime / 1000).toFixed(2) + 'с';
    
    let totalSize = 0;
    if (state.fullAudioBlob) {
        totalSize = state.fullAudioBlob.size;
    }
    dataSize.textContent = (totalSize / 1024).toFixed(1) + ' KB';
}

function updateSegmentList() {
    if (state.segments.length === 0) {
        segmentList.innerHTML = '(нет сегментов)';
        return;
    }
    
    let html = '';
    let speechNum = 0;
    state.segments.forEach((seg, i) => {
        const dur = seg.duration || 0;
        if (seg.type === 'speech') {
            speechNum++;
            const start = seg.startTimeOffset || 0;
            const end = seg.endTimeOffset || (start + dur);
            html += `<div class="segment-item speech">🎤 #${speechNum} ${(dur/1000).toFixed(2)}с (${(start/1000).toFixed(2)}с-${(end/1000).toFixed(2)}с)</div>`;
        } else {
            html += `<div class="segment-item pause">⏸️ Пауза ${(dur/1000).toFixed(2)}с</div>`;
        }
    });
    segmentList.innerHTML = html;
}

// ============================================================
// ОБРАБОТЧИКИ
// ============================================================
btnRecord.addEventListener('click', startRecording);
btnStop.addEventListener('click', stopRecording);
btnPlay.addEventListener('click', playWithPauses);
btnExport.addEventListener('click', exportVAD);

btnLoad.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.vad';
    input.onchange = (e) => {
        if (e.target.files[0]) loadVAD(e.target.files[0]);
        input.remove();
    };
    input.click();
});

// Инициализация
updateUI();
updateSegmentList();
updateStats();
fileInfo.textContent = '🎙️ Нажми "Запись" - речь сохраняется с пре-буфером 2с';
prebufferInfo.textContent = '⚡ Пре-буфер: 2 секунды аудио всегда в буфере, чтобы не терять начало фразы';

console.log('✅ VAD-кодек v8 загружен (исправлено дублирование)');
</script>
