<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWA Offline Maker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f1117;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            max-width: 820px;
            width: 100%;
            background: #1a1e26;
            padding: 2.5rem;
            border-radius: 32px;
            border: 1px solid #2a2f3a;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sub {
            color: #8892a8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            border-left: 3px solid #22a67e;
            padding-left: 14px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 1rem;
            background: #0b0e14;
            border: 1px solid #2d3340;
            border-radius: 16px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            line-height: 1.6;
            resize: vertical;
            transition: 0.2s;
            tab-size: 2;
        }
        textarea::placeholder {
            color: #4a5a72;
            opacity: 0.7;
        }
        textarea:focus {
            outline: none;
            border-color: #22a67e;
            box-shadow: 0 0 0 3px rgba(34, 166, 126, 0.2);
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .btn {
            background: #22a67e;
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #1a8a68;
            flex: 0 0 auto;
        }
        .btn:hover {
            background: #1a8a68;
            transform: scale(1.01);
            box-shadow: 0 8px 20px -8px #1a8a68;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #3b4a5e;
            color: #d1d9e6;
        }
        .btn-outline:hover {
            background: #252c3a;
            border-color: #5f7390;
            box-shadow: none;
        }
        .btn-blue {
            background: #3b82f6;
            border-color: #2563eb;
        }
        .btn-blue:hover {
            background: #2563eb;
            box-shadow: 0 8px 20px -8px #2563eb;
        }
        .result-block {
            margin-top: 1.5rem;
            border-top: 1px solid #26303d;
            padding-top: 1.5rem;
        }
        .result-block .label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .result-block .label span {
            font-weight: 500;
            color: #b9cbe5;
        }
        .result-block .label .badge {
            background: #22a67e;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: white;
        }
        .result-code {
            background: #0b0e14;
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid #1e2a3a;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            color: #c8d6e8;
            position: relative;
        }
        .result-code .line-numbers {
            display: none;
        }
        .result-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 0.8rem;
        }
        .result-actions .btn-small {
            background: #2d3545;
            border: none;
            color: #d1d9e6;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .result-actions .btn-small:hover {
            background: #3d475b;
            color: white;
        }
        .result-actions .btn-small.green {
            background: #22a67e;
            color: white;
        }
        .result-actions .btn-small.green:hover {
            background: #1a8a68;
        }
        .toast {
            background: #1e293b;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            border-left: 3px solid #22a67e;
            display: inline-block;
            margin-top: 0.5rem;
            color: #b9cbe5;
        }
        .hidden {
            display: none !important;
        }
        .status-ok {
            color: #4ade80;
        }
        @media (max-width: 600px) {
            .card {
                padding: 1.5rem;
            }
            .actions .btn {
                width: 100%;
                justify-content: center;
            }
            .result-actions .btn-small {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📦 Offline Maker</h1>
        <div class="sub">Вставьте HTML-код → получите готовую офлайн-страницу</div>

        <!-- Поле ввода -->
        <label for="htmlInput">📄 Ваш HTML-код</label>
        <textarea id="htmlInput" placeholder="Вставьте сюда ваш HTML-код..."></textarea>

        <!-- Кнопки -->
        <div class="actions">
            <button class="btn" id="makeOfflineBtn">⚡ Сделать офлайн</button>
            <button class="btn btn-outline" id="clearBtn">✕ Очистить</button>
        </div>

        <!-- Результат -->
        <div id="resultBlock" class="result-block hidden">
            <div class="label">
                <span>✅ Готовый код с офлайн-поддержкой</span>
                <span class="badge">SW добавлен</span>
            </div>
            <div class="result-code" id="resultCode"></div>
            <div class="result-actions">
                <button class="btn-small green" id="copyResultBtn">📋 Копировать</button>
                <button class="btn-small" id="downloadResultBtn">⬇ Скачать HTML</button>
                <button class="btn-small" id="resetBtn">🔄 Заново</button>
            </div>
            <div id="toastMessage" class="toast hidden">✅ Готово!</div>
        </div>

        <div style="margin-top: 1.5rem; color: #4a5a72; font-size: 0.8rem; text-align: center; border-top: 1px solid #1a1e26; padding-top: 1rem;">
            Просто и быстро. Всё работает офлайн.
        </div>
    </div>

    <script>
        (function() {
            const htmlInput = document.getElementById('htmlInput');
            const makeOfflineBtn = document.getElementById('makeOfflineBtn');
            const clearBtn = document.getElementById('clearBtn');
            const resultBlock = document.getElementById('resultBlock');
            const resultCode = document.getElementById('resultCode');
            const copyResultBtn = document.getElementById('copyResultBtn');
            const downloadResultBtn = document.getElementById('downloadResultBtn');
            const resetBtn = document.getElementById('resetBtn');
            const toastMessage = document.getElementById('toastMessage');

            // ---- Универсальный скрипт для офлайн-поддержки ----
            const OFFLINE_SCRIPT = `
        <script>
        // ============================================================
        // УНИВЕРСАЛЬНЫЙ СКРИПТ ДЛЯ ХРАНЕНИЯ + ОФЛАЙН-ПОДДЕРЖКИ
        // Вставьте этот код в любую страницу — работает сразу
        // ============================================================

        (function(global) {
            'use strict';

            // ---------- 1. ХРАНИЛИЩЕ В LOCALSTORAGE ----------
            const Storage = {
                save(key, data) {
                    try {
                        localStorage.setItem(key, JSON.stringify(data));
                        return true;
                    } catch (e) {
                        console.error('[Storage] Ошибка сохранения:', e);
                        return false;
                    }
                },

                load(key, defaultData = null) {
                    try {
                        const raw = localStorage.getItem(key);
                        if (raw === null) {
                            if (defaultData !== null) {
                                this.save(key, defaultData);
                            }
                            return defaultData;
                        }
                        return JSON.parse(raw);
                    } catch (e) {
                        console.error('[Storage] Ошибка загрузки:', e);
                        return defaultData;
                    }
                },

                remove(key) {
                    try {
                        localStorage.removeItem(key);
                        return true;
                    } catch (e) {
                        console.error('[Storage] Ошибка удаления:', e);
                        return false;
                    }
                },

                has(key) {
                    return localStorage.getItem(key) !== null;
                },

                clear() {
                    try {
                        localStorage.clear();
                        return true;
                    } catch (e) {
                        console.error('[Storage] Ошибка очистки:', e);
                        return false;
                    }
                }
            };

            // ---------- 2. РАБОТА С МАССИВАМИ ----------
            const ArrayHelper = {
                add(key, item, defaultData = []) {
                    let data = Storage.load(key, defaultData);
                    if (!Array.isArray(data)) data = [];
                    data.push(item);
                    return Storage.save(key, data);
                },

                remove(key, identifier, idField = 'id', defaultData = []) {
                    let data = Storage.load(key, defaultData);
                    if (!Array.isArray(data)) return false;

                    let index = -1;
                    if (typeof identifier === 'function') {
                        index = data.findIndex(identifier);
                    } else if (typeof identifier === 'number' && Number.isInteger(identifier)) {
                        index = identifier;
                    } else if (identifier !== undefined && identifier !== null) {
                        index = data.findIndex(item => item && item[idField] === identifier);
                    }

                    if (index === -1) return false;
                    data.splice(index, 1);
                    return Storage.save(key, data);
                },

                update(key, identifier, newData, idField = 'id', defaultData = []) {
                    let data = Storage.load(key, defaultData);
                    if (!Array.isArray(data)) return false;

                    let index = -1;
                    if (typeof identifier === 'function') {
                        index = data.findIndex(identifier);
                    } else if (typeof identifier === 'number' && Number.isInteger(identifier)) {
                        index = identifier;
                    } else if (identifier !== undefined && identifier !== null) {
                        index = data.findIndex(item => item && item[idField] === identifier);
                    }

                    if (index === -1) return false;
                    data[index] = { ...data[index], ...newData };
                    return Storage.save(key, data);
                },

                get(key, defaultData = []) {
                    const data = Storage.load(key, defaultData);
                    return Array.isArray(data) ? data : [];
                },

                find(key, predicate, defaultData = []) {
                    const data = this.get(key, defaultData);
                    return data.find(predicate) || null;
                },

                filter(key, predicate, defaultData = []) {
                    const data = this.get(key, defaultData);
                    return data.filter(predicate);
                },

                clear(key) {
                    return Storage.save(key, []);
                }
            };

            // ---------- 3. СТАТУС СЕТИ ----------
            const Network = {
                getStatus() {
                    return navigator.onLine ? 'online' : 'offline';
                },

                isOnline() {
                    return navigator.onLine;
                },

                isOffline() {
                    return !navigator.onLine;
                },

                onChange(callback) {
                    const onlineHandler = () => callback('online', true);
                    const offlineHandler = () => callback('offline', false);
                    
                    window.addEventListener('online', onlineHandler);
                    window.addEventListener('offline', offlineHandler);
                    
                    return () => {
                        window.removeEventListener('online', onlineHandler);
                        window.removeEventListener('offline', offlineHandler);
                    };
                },

                // Обновить элемент с статусом
                updateStatusElement(elementId, onlineText = '🟢 Онлайн', offlineText = '🔴 Офлайн') {
                    const el = document.getElementById(elementId);
                    if (!el) return;
                    
                    const update = () => {
                        el.textContent = this.isOnline() ? onlineText : offlineText;
                        el.className = this.isOnline() ? 'status-online' : 'status-offline';
                    };
                    
                    update();
                    return this.onChange(update);
                }
            };

            // ---------- 4. SERVICE WORKER (ОФЛАЙН-ПОДДЕРЖКА) ----------
            const SW = {
                /**
                 * Зарегистрировать Service Worker
                 * @param {string} swPath - Путь к sw.js (по умолчанию 'sw.js')
                 * @param {Object} options - Опции регистрации
                 * @returns {Promise}
                 */
                register(swPath = 'sw.js', options = {}) {
                    if (!('serviceWorker' in navigator)) {
                        console.warn('[SW] Service Worker не поддерживается');
                        return Promise.reject(new Error('SW не поддерживается'));
                    }

                    return navigator.serviceWorker.register(swPath, options)
                        .then(registration => {
                            console.log('[SW] ✅ Зарегистрирован');
                            return registration;
                        })
                        .catch(error => {
                            console.error('[SW] ❌ Ошибка:', error);
                            throw error;
                        });
                },

                /**
                 * Проверить активен ли SW
                 * @returns {Promise<boolean>}
                 */
                async isActive() {
                    if (!('serviceWorker' in navigator)) return false;
                    try {
                        const registration = await navigator.serviceWorker.getRegistration();
                        return registration !== undefined && registration.active !== null;
                    } catch {
                        return false;
                    }
                },

                /**
                 * Создать и зарегистрировать SW из строки (встроенный SW)
                 * @param {string} swCode - Код Service Worker
                 * @param {string} scope - Scope для SW
                 * @returns {Promise}
                 */
                registerInline(swCode, scope = '/') {
                    if (!('serviceWorker' in navigator)) {
                        console.warn('[SW] Service Worker не поддерживается');
                        return Promise.reject(new Error('SW не поддерживается'));
                    }

                    try {
                        const blob = new Blob([swCode], { type: 'application/javascript' });
                        const swUrl = URL.createObjectURL(blob);
                        return navigator.serviceWorker.register(swUrl, { scope });
                    } catch (error) {
                        console.error('[SW] Ошибка создания inline SW:', error);
                        return Promise.reject(error);
                    }
                },

                /**
                 * Сгенерировать код SW для кеширования текущей страницы
                 * @param {string} cacheName - Имя кеша
                 * @param {Array} urls - URL для кеширования (по умолчанию текущая страница)
                 * @returns {string} - Код SW
                 */
                generateCacheSW(cacheName = 'app-v1', urls = null) {
                    if (!urls) {
                        urls = [window.location.pathname || '/'];
                        // Добавляем текущий URL с параметрами
                        if (window.location.search) {
                            urls.push(window.location.pathname + window.location.search);
                        }
                    }

                    return `
                const CACHE_NAME = '${cacheName}';
                const urlsToCache = ${JSON.stringify(urls)};

                self.addEventListener('install', event => {
                    event.waitUntil(
                        caches.open(CACHE_NAME)
                            .then(cache => {
                                console.log('[SW] Кеширование:', urlsToCache);
                                return cache.addAll(urlsToCache);
                            })
                            .then(() => self.skipWaiting())
                    );
                });

                self.addEventListener('activate', event => {
                    event.waitUntil(
                        caches.keys().then(cacheNames => {
                            return Promise.all(
                                cacheNames.map(name => {
                                    if (name !== CACHE_NAME) {
                                        console.log('[SW] Удаление старого кеша:', name);
                                        return caches.delete(name);
                                    }
                                })
                            );
                        }).then(() => self.clients.claim())
                    );
                });

                self.addEventListener('fetch', event => {
                    event.respondWith(
                        caches.match(event.request)
                            .then(response => response || fetch(event.request))
                            .catch(() => caches.match('/'))
                    );
                });
                `;
                },

                /**
                 * Автоматическая настройка SW (создаёт и регистрирует)
                 * @param {string} cacheName - Имя кеша
                 * @returns {Promise}
                 */
                async setupOffline(cacheName = 'app-v1') {
                    const swCode = this.generateCacheSW(cacheName);
                    return this.registerInline(swCode);
                }
            };

            // ---------- 5. ВСПОМОГАТЕЛЬНЫЕ УТИЛИТЫ ----------
            const Utils = {
                /**
                 * Глубокое копирование
                 */
                deepClone(obj) {
                    return JSON.parse(JSON.stringify(obj));
                },

                /**
                 * Генерация уникального ID
                 */
                generateId() {
                    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
                },

                /**
                 * Форматирование даты
                 */
                formatDate(date, format = 'DD.MM.YYYY HH:mm') {
                    const d = new Date(date);
                    const pad = n => String(n).padStart(2, '0');
                    const replacements = {
                        'YYYY': d.getFullYear(),
                        'MM': pad(d.getMonth() + 1),
                        'DD': pad(d.getDate()),
                        'HH': pad(d.getHours()),
                        'mm': pad(d.getMinutes()),
                        'ss': pad(d.getSeconds())
                    };
                    return format.replace(/YYYY|MM|DD|HH|mm|ss/g, match => replacements[match]);
                },

                /**
                 * Показать toast-уведомление
                 */
                showToast(message, duration = 2000) {
                    // Создаём элемент если его нет
                    let toast = document.getElementById('_toast');
                    if (!toast) {
                        toast = document.createElement('div');
                        toast.id = '_toast';
                        toast.style.cssText = \`
                            position: fixed;
                            bottom: 30px;
                            left: 50%;
                            transform: translateX(-50%) translateY(100px);
                            background: #1e293b;
                            color: white;
                            padding: 12px 24px;
                            border-radius: 60px;
                            font-size: 0.9rem;
                            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
                            opacity: 0;
                            transition: all 0.3s ease;
                            z-index: 9999;
                            pointer-events: none;
                            font-family: system-ui, sans-serif;
                        \`;
                        document.body.appendChild(toast);
                    }

                    toast.textContent = message;
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateX(-50%) translateY(0)';

                    clearTimeout(toast._timeout);
                    toast._timeout = setTimeout(() => {
                        toast.style.opacity = '0';
                        toast.style.transform = 'translateX(-50%) translateY(100px)';
                    }, duration);
                }
            };

            // ---------- 6. ЭКСПОРТ В ГЛОБАЛЬНЫЙ ОБЪЕКТ ----------
            const OfflineKit = {
                Storage,
                ArrayHelper,
                Network,
                SW,
                Utils,
                version: '1.0.0'
            };

            // Добавляем в глобальный объект
            global.OfflineKit = OfflineKit;

            // Для удобства добавляем сокращения
            global.Store = Storage;
            global.ArrayStore = ArrayHelper;
            global.NetworkStatus = Network;
            global.SWHelper = SW;
            global.Utils = Utils;

            console.log('[OfflineKit] ✅ Загружен v1.0.0');

        })(window);
        <\/script>`;

            // ---- Показать уведомление ----
            function showToast(msg, duration = 2500) {
                toastMessage.textContent = msg;
                toastMessage.classList.remove('hidden');
                clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => {
                    toastMessage.classList.add('hidden');
                }, duration);
            }

            // ---- Основная функция: сделать офлайн ----
            function makeOffline() {
                let html = htmlInput.value.trim();

                if (!html) {
                    showToast('⚠️ Вставьте HTML-код!', 2000);
                    return;
                }

                // Проверяем, есть ли уже регистрация SW
                if (html.includes('serviceWorker.register') || html.includes('OfflineKit')) {
                    showToast('⚠️ Код уже содержит офлайн-поддержку!', 2500);
                    return;
                }

                // Вставляем скрипт перед </body>
                const scriptTag = OFFLINE_SCRIPT;
                if (html.includes('</body>')) {
                    html = html.replace(/<\/body>/i, scriptTag + '\n</body>');
                } else {
                    // Если нет </body> - добавляем в конец
                    html = html + '\n' + scriptTag;
                }

                // Показываем результат
                resultCode.textContent = html;
                resultBlock.classList.remove('hidden');

                // Прокручиваем к результату
                resultBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });

                showToast('✅ Готово! Код теперь работает офлайн', 2500);
            }

            // ---- Копировать результат ----
            function copyResult() {
                const text = resultCode.textContent;
                if (!text) return;

                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 Код скопирован!');
                }).catch(() => {
                    // fallback
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast('📋 Код скопирован!');
                });
            }

            // ---- Скачать результат ----
            function downloadResult() {
                const text = resultCode.textContent;
                if (!text) return;

                const blob = new Blob([text], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'index.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast('⬇ Файл скачан!');
            }

            // ---- Сброс ----
            function resetAll() {
                htmlInput.value = '';
                resultBlock.classList.add('hidden');
                resultCode.textContent = '';
                htmlInput.focus();
                showToast('🔄 Готово к новой работе', 1500);
            }

            // ---- Очистка поля ----
            function clearField() {
                htmlInput.value = '';
                htmlInput.focus();
                showToast('🧹 Поле очищено', 1500);
            }

            // ---- Обработчики ----
            makeOfflineBtn.addEventListener('click', makeOffline);
            clearBtn.addEventListener('click', clearField);
            copyResultBtn.addEventListener('click', copyResult);
            downloadResultBtn.addEventListener('click', downloadResult);
            resetBtn.addEventListener('click', resetAll);

            // Ctrl+Enter для быстрой генерации
            htmlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    makeOffline();
                }
            });

            // ---- При загрузке ----
            console.log('📦 Offline Maker готов! Вставьте HTML и нажмите "Сделать офлайн"');

        })();
    </script>

</body>
</html>
