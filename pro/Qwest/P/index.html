<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя страница</title>
    <script>
// Базовая настройка
OfflineKit.PWA.setup({
    name: 'Моё Приложение',
    shortName: 'Приложение',
    themeColor: '#2563eb',
    color: '#2563eb'
});

// Или с полными параметрами
OfflineKit.PWA.setup({
    name: 'Моё Приложение',
    shortName: 'Приложение',
    description: 'Работает офлайн',
    themeColor: '#1e293b',
    backgroundColor: '#ffffff',
    display: 'standalone',
    startUrl: '/',
    scope: '/',
    color: '#2563eb',
    registerSW: true,  // Автоматически добавит Service Worker
    swCacheName: 'app-v1'
}); это куда вставлять 




// ============================================================
// УНИВЕРСАЛЬНЫЙ СКРИПТ ДЛЯ ХРАНЕНИЯ + ОФЛАЙН-ПОДДЕРЖКИ
// Вставьте этот код в любую страницу — работает сразу
// ============================================================

(function(global) {
    'use strict';

    // ---------- 1. ХРАНИЛИЩЕ В LOCALSTORAGE ----------
    const Storage = {
        save(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
                return true;
            } catch (e) {
                console.error('[Storage] Ошибка сохранения:', e);
                return false;
            }
        },

        load(key, defaultData = null) {
            try {
                const raw = localStorage.getItem(key);
                if (raw === null) {
                    if (defaultData !== null) {
                        this.save(key, defaultData);
                    }
                    return defaultData;
                }
                return JSON.parse(raw);
            } catch (e) {
                console.error('[Storage] Ошибка загрузки:', e);
                return defaultData;
            }
        },

        remove(key) {
            try {
                localStorage.removeItem(key);
                return true;
            } catch (e) {
                console.error('[Storage] Ошибка удаления:', e);
                return false;
            }
        },

        has(key) {
            return localStorage.getItem(key) !== null;
        },

        clear() {
            try {
                localStorage.clear();
                return true;
            } catch (e) {
                console.error('[Storage] Ошибка очистки:', e);
                return false;
            }
        }
    };

    // ---------- 2. РАБОТА С МАССИВАМИ ----------
    const ArrayHelper = {
        add(key, item, defaultData = []) {
            let data = Storage.load(key, defaultData);
            if (!Array.isArray(data)) data = [];
            data.push(item);
            return Storage.save(key, data);
        },

        remove(key, identifier, idField = 'id', defaultData = []) {
            let data = Storage.load(key, defaultData);
            if (!Array.isArray(data)) return false;

            let index = -1;
            if (typeof identifier === 'function') {
                index = data.findIndex(identifier);
            } else if (typeof identifier === 'number' && Number.isInteger(identifier)) {
                index = identifier;
            } else if (identifier !== undefined && identifier !== null) {
                index = data.findIndex(item => item && item[idField] === identifier);
            }

            if (index === -1) return false;
            data.splice(index, 1);
            return Storage.save(key, data);
        },

        update(key, identifier, newData, idField = 'id', defaultData = []) {
            let data = Storage.load(key, defaultData);
            if (!Array.isArray(data)) return false;

            let index = -1;
            if (typeof identifier === 'function') {
                index = data.findIndex(identifier);
            } else if (typeof identifier === 'number' && Number.isInteger(identifier)) {
                index = identifier;
            } else if (identifier !== undefined && identifier !== null) {
                index = data.findIndex(item => item && item[idField] === identifier);
            }

            if (index === -1) return false;
            data[index] = { ...data[index], ...newData };
            return Storage.save(key, data);
        },

        get(key, defaultData = []) {
            const data = Storage.load(key, defaultData);
            return Array.isArray(data) ? data : [];
        },

        find(key, predicate, defaultData = []) {
            const data = this.get(key, defaultData);
            return data.find(predicate) || null;
        },

        filter(key, predicate, defaultData = []) {
            const data = this.get(key, defaultData);
            return data.filter(predicate);
        },

        clear(key) {
            return Storage.save(key, []);
        }
    };

    // ---------- 3. СТАТУС СЕТИ ----------
    const Network = {
        getStatus() {
            return navigator.onLine ? 'online' : 'offline';
        },

        isOnline() {
            return navigator.onLine;
        },

        isOffline() {
            return !navigator.onLine;
        },

        onChange(callback) {
            const onlineHandler = () => callback('online', true);
            const offlineHandler = () => callback('offline', false);
            
            window.addEventListener('online', onlineHandler);
            window.addEventListener('offline', offlineHandler);
            
            return () => {
                window.removeEventListener('online', onlineHandler);
                window.removeEventListener('offline', offlineHandler);
            };
        },

        // Обновить элемент с статусом
        updateStatusElement(elementId, onlineText = '🟢 Онлайн', offlineText = '🔴 Офлайн') {
            const el = document.getElementById(elementId);
            if (!el) return;
            
            const update = () => {
                el.textContent = this.isOnline() ? onlineText : offlineText;
                el.className = this.isOnline() ? 'status-online' : 'status-offline';
            };
            
            update();
            return this.onChange(update);
        }
    };

    // ---------- 4. SERVICE WORKER (ОФЛАЙН-ПОДДЕРЖКА) ----------
    const SW = {
        /**
         * Зарегистрировать Service Worker
         * @param {string} swPath - Путь к sw.js (по умолчанию 'sw.js')
         * @param {Object} options - Опции регистрации
         * @returns {Promise}
         */
        register(swPath = 'sw.js', options = {}) {
            if (!('serviceWorker' in navigator)) {
                console.warn('[SW] Service Worker не поддерживается');
                return Promise.reject(new Error('SW не поддерживается'));
            }

            return navigator.serviceWorker.register(swPath, options)
                .then(registration => {
                    console.log('[SW] ✅ Зарегистрирован');
                    return registration;
                })
                .catch(error => {
                    console.error('[SW] ❌ Ошибка:', error);
                    throw error;
                });
        },

        /**
         * Проверить активен ли SW
         * @returns {Promise<boolean>}
         */
        async isActive() {
            if (!('serviceWorker' in navigator)) return false;
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                return registration !== undefined && registration.active !== null;
            } catch {
                return false;
            }
        },

        /**
         * Создать и зарегистрировать SW из строки (встроенный SW)
         * @param {string} swCode - Код Service Worker
         * @param {string} scope - Scope для SW
         * @returns {Promise}
         */
        registerInline(swCode, scope = '/') {
            if (!('serviceWorker' in navigator)) {
                console.warn('[SW] Service Worker не поддерживается');
                return Promise.reject(new Error('SW не поддерживается'));
            }

            try {
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                return navigator.serviceWorker.register(swUrl, { scope });
            } catch (error) {
                console.error('[SW] Ошибка создания inline SW:', error);
                return Promise.reject(error);
            }
        },

        /**
         * Сгенерировать код SW для кеширования текущей страницы
         * @param {string} cacheName - Имя кеша
         * @param {Array} urls - URL для кеширования (по умолчанию текущая страница)
         * @returns {string} - Код SW
         */
        generateCacheSW(cacheName = 'app-v1', urls = null) {
            if (!urls) {
                urls = [window.location.pathname || '/'];
                // Добавляем текущий URL с параметрами
                if (window.location.search) {
                    urls.push(window.location.pathname + window.location.search);
                }
            }

            return `
const CACHE_NAME = '${cacheName}';
const urlsToCache = ${JSON.stringify(urls)};

self.addEventListener('install', event => {
    event.waitUntil(
        caches.open(CACHE_NAME)
            .then(cache => {
                console.log('[SW] Кеширование:', urlsToCache);
                return cache.addAll(urlsToCache);
            })
            .then(() => self.skipWaiting())
    );
});

self.addEventListener('activate', event => {
    event.waitUntil(
        caches.keys().then(cacheNames => {
            return Promise.all(
                cacheNames.map(name => {
                    if (name !== CACHE_NAME) {
                        console.log('[SW] Удаление старого кеша:', name);
                        return caches.delete(name);
                    }
                })
            );
        }).then(() => self.clients.claim())
    );
});

self.addEventListener('fetch', event => {
    event.respondWith(
        caches.match(event.request)
            .then(response => response || fetch(event.request))
            .catch(() => caches.match('/'))
    );
});
`;
        },

        /**
         * Автоматическая настройка SW (создаёт и регистрирует)
         * @param {string} cacheName - Имя кеша
         * @returns {Promise}
         */
        async setupOffline(cacheName = 'app-v1') {
            const swCode = this.generateCacheSW(cacheName);
            return this.registerInline(swCode);
        }
    };

    // ---------- 5. ВСПОМОГАТЕЛЬНЫЕ УТИЛИТЫ ----------
    const Utils = {
        /**
         * Глубокое копирование
         */
        deepClone(obj) {
            return JSON.parse(JSON.stringify(obj));
        },

        /**
         * Генерация уникального ID
         */
        generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        },

        /**
         * Форматирование даты
         */
        formatDate(date, format = 'DD.MM.YYYY HH:mm') {
            const d = new Date(date);
            const pad = n => String(n).padStart(2, '0');
            const replacements = {
                'YYYY': d.getFullYear(),
                'MM': pad(d.getMonth() + 1),
                'DD': pad(d.getDate()),
                'HH': pad(d.getHours()),
                'mm': pad(d.getMinutes()),
                'ss': pad(d.getSeconds())
            };
            return format.replace(/YYYY|MM|DD|HH|mm|ss/g, match => replacements[match]);
        },

        /**
         * Показать toast-уведомление
         */
        showToast(message, duration = 2000) {
            // Создаём элемент если его нет
            let toast = document.getElementById('_toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = '_toast';
                toast.style.cssText = `
                    position: fixed;
                    bottom: 30px;
                    left: 50%;
                    transform: translateX(-50%) translateY(100px);
                    background: #1e293b;
                    color: white;
                    padding: 12px 24px;
                    border-radius: 60px;
                    font-size: 0.9rem;
                    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
                    opacity: 0;
                    transition: all 0.3s ease;
                    z-index: 9999;
                    pointer-events: none;
                    font-family: system-ui, sans-serif;
                `;
                document.body.appendChild(toast);
            }

            toast.textContent = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(100px)';
            }, duration);
        }
    };

    // ---------- 6. ЭКСПОРТ В ГЛОБАЛЬНЫЙ ОБЪЕКТ ----------
    const OfflineKit = {
        Storage,
        ArrayHelper,
        Network,
        SW,
        Utils,
        version: '1.0.0'
    };

    // Добавляем в глобальный объект
    global.OfflineKit = OfflineKit;

    // Для удобства добавляем сокращения
    global.Store = Storage;
    global.ArrayStore = ArrayHelper;
    global.NetworkStatus = Network;
    global.SWHelper = SW;
    global.Utils = Utils;

    console.log('[OfflineKit] ✅ Загружен v1.0.0');

})(window);


// ============================================================
// ДОПОЛНЕНИЕ: PWA ИКОНКА НА ТЕЛЕФОНЕ
// Добавьте этот код после основного скрипта
// ============================================================

(function(global) {
    'use strict';

    // ---------- 7. PWA / ИКОНКА НА ТЕЛЕФОНЕ ----------
    const PWA = {
        /**
         * Создать манифест для PWA
         * @param {Object} config - Конфигурация
         * @param {string} config.name - Полное имя приложения
         * @param {string} config.shortName - Короткое имя
         * @param {string} config.description - Описание
         * @param {string} config.themeColor - Цвет темы (HEX)
         * @param {string} config.backgroundColor - Цвет фона (HEX)
         * @param {string} config.display - 'standalone' | 'fullscreen' | 'minimal-ui' | 'browser'
         * @param {string} config.startUrl - Стартовый URL
         * @param {Array} config.icons - Массив иконок
         * @param {Array} config.screenshots - Скриншоты (опционально)
         * @param {string} config.scope - Scope приложения
         * @returns {string} - JSON манифеста
         */
        generateManifest({
            name = 'Моё приложение',
            shortName = 'Приложение',
            description = 'Описание приложения',
            themeColor = '#1e293b',
            backgroundColor = '#ffffff',
            display = 'standalone',
            startUrl = '/',
            icons = null,
            screenshots = null,
            scope = '/'
        } = {}) {
            
            // Иконки по умолчанию (генерируются из SVG)
            const defaultIcons = this.generateDefaultIcons(name);
            
            const manifest = {
                name: name,
                short_name: shortName,
                description: description,
                theme_color: themeColor,
                background_color: backgroundColor,
                display: display,
                start_url: startUrl,
                scope: scope,
                icons: icons || defaultIcons,
                orientation: 'portrait',
                categories: ['utility', 'productivity'],
                lang: 'ru',
                prefer_related_applications: false
            };

            if (screenshots) {
                manifest.screenshots = screenshots;
            }

            return JSON.stringify(manifest, null, 2);
        },

        /**
         * Создать иконки из SVG (встроенные)
         * @param {string} appName - Имя приложения для инициалов
         * @param {string} color - Цвет иконки
         * @returns {Array} - Массив иконок
         */
        generateDefaultIcons(appName = 'APP', color = '#1e293b') {
            const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
            const initial = appName.charAt(0).toUpperCase();
            
            // SVG шаблон с инициалами
            const svgTemplate = (size) => {
                const fontSize = size * 0.5;
                return `
                    <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
                        <rect width="${size}" height="${size}" rx="${size * 0.15}" fill="${color}"/>
                        <text x="${size/2}" y="${size/2 + fontSize * 0.35}" 
                              text-anchor="middle" 
                              font-family="Arial, sans-serif" 
                              font-size="${fontSize}" 
                              font-weight="bold" 
                              fill="white">${initial}</text>
                    </svg>
                `;
            };

            return sizes.map(size => {
                const svg = svgTemplate(size);
                const base64 = btoa(unescape(encodeURIComponent(svg)));
                return {
                    src: `data:image/svg+xml;base64,${base64}`,
                    sizes: `${size}x${size}`,
                    type: 'image/svg+xml',
                    purpose: 'any maskable'
                };
            });
        },

        /**
         * Сгенерировать HTML-код для вставки манифеста
         * @param {Object} config - Конфигурация манифеста
         * @returns {string} - HTML код
         */
        generateManifestHTML(config = {}) {
            const manifest = this.generateManifest(config);
            const encoded = encodeURIComponent(manifest);
            return `<link rel="manifest" href='data:application/json;charset=utf-8,${encoded}'>`;
        },

        /**
         * Создать HTML для мета-тегов PWA
         * @param {Object} config - Конфигурация
         * @returns {string} - HTML код
         */
        generateMetaTags({
            name = 'Моё приложение',
            themeColor = '#1e293b',
            appleTouchIcon = null,
            appleStatusBarStyle = 'black-translucent'
        } = {}) {
            let html = `
                <meta name="apple-mobile-web-app-capable" content="yes">
                <meta name="apple-mobile-web-app-status-bar-style" content="${appleStatusBarStyle}">
                <meta name="apple-mobile-web-app-title" content="${name}">
                <meta name="theme-color" content="${themeColor}">
                <meta name="mobile-web-app-capable" content="yes">
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            `;

            if (appleTouchIcon) {
                html += `
                    <link rel="apple-touch-icon" href="${appleTouchIcon}">
                    <link rel="apple-touch-icon-precomposed" href="${appleTouchIcon}">
                `;
            }

            return html;
        },

        /**
         * Автоматическая установка PWA (всё в одном)
         * @param {Object} config - Конфигурация
         * @param {boolean} injectManifest - Внедрить манифест в HTML
         * @param {boolean} registerSW - Зарегистрировать Service Worker
         * @returns {Promise}
         */
        async setup({
            name = 'Моё приложение',
            shortName = 'Приложение',
            description = 'Работает даже без интернета',
            themeColor = '#1e293b',
            backgroundColor = '#ffffff',
            display = 'standalone',
            startUrl = '/',
            scope = '/',
            color = '#1e293b',
            injectManifest = true,
            registerSW = true,
            swCacheName = 'app-v1'
        } = {}) {
            
            // 1. Создаём манифест
            const manifestConfig = {
                name,
                shortName,
                description,
                themeColor,
                backgroundColor,
                display,
                startUrl,
                scope,
                icons: this.generateDefaultIcons(name, color)
            };

            // 2. Внедряем манифест
            if (injectManifest) {
                const manifestHTML = this.generateManifestHTML(manifestConfig);
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = `data:application/json;charset=utf-8,${encodeURIComponent(this.generateManifest(manifestConfig))}`;
                document.head.appendChild(link);
            }

            // 3. Мета-теги
            const metaHTML = this.generateMetaTags({ name, themeColor });
            const metaContainer = document.createElement('div');
            metaContainer.innerHTML = metaHTML;
            while (metaContainer.firstChild) {
                document.head.appendChild(metaContainer.firstChild);
            }

            // 4. Регистрируем Service Worker
            if (registerSW && 'serviceWorker' in navigator) {
                try {
                    await global.SWHelper.setupOffline(swCacheName);
                    console.log('[PWA] ✅ Service Worker зарегистрирован');
                } catch (e) {
                    console.warn('[PWA] SW не зарегистрирован:', e);
                }
            }

            // 5. Добавляем подсказку об установке (для Android)
            this.addInstallPrompt();

            console.log('[PWA] ✅ Настроено:', name);
            
            return {
                manifest: manifestConfig,
                manifestHTML: this.generateManifestHTML(manifestConfig),
                metaHTML
            };
        },

        /**
         * Добавить подсказку об установке приложения
         */
        addInstallPrompt() {
            // Проверяем, не установлено ли уже
            if (window.matchMedia('(display-mode: standalone)').matches) {
                console.log('[PWA] Приложение уже установлено');
                return;
            }

            // Создаём кнопку установки
            let installPromptShown = false;
            
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                const deferredPrompt = e;
                
                // Проверяем, не показали ли уже
                if (installPromptShown) return;
                installPromptShown = true;

                // Создаём кнопку
                const installBtn = document.createElement('div');
                installBtn.id = '_installAppBtn';
                installBtn.innerHTML = `
                    <div style="
                        position: fixed;
                        bottom: 20px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: #1e293b;
                        color: white;
                        padding: 14px 28px;
                        border-radius: 60px;
                        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
                        font-family: system-ui, sans-serif;
                        font-size: 1rem;
                        font-weight: 600;
                        cursor: pointer;
                        z-index: 10000;
                        display: flex;
                        align-items: center;
                        gap: 12px;
                        animation: slideUp 0.5s ease;
                    ">
                        <span style="font-size: 1.5rem;">📱</span>
                        Установить приложение
                    </div>
                    <style>
                        @keyframes slideUp {
                            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
                            to { transform: translateX(-50%) translateY(0); opacity: 1; }
                        }
                        #_installAppBtn:hover {
                            transform: translateX(-50%) scale(1.05);
                        }
                    </style>
                `;
                document.body.appendChild(installBtn);

                // Обработчик установки
                installBtn.addEventListener('click', async () => {
                    installBtn.style.display = 'none';
                    try {
                        const result = await deferredPrompt.prompt();
                        if (result.outcome === 'accepted') {
                            console.log('[PWA] ✅ Установлено');
                            global.Utils.showToast('✅ Приложение установлено!', 3000);
                        } else {
                            console.log('[PWA] ❌ Установка отменена');
                        }
                    } catch (error) {
                        console.error('[PWA] Ошибка установки:', error);
                    }
                    installBtn.remove();
                });
            });

            // Скрываем кнопку после установки
            window.addEventListener('appinstalled', () => {
                const btn = document.getElementById('_installAppBtn');
                if (btn) btn.remove();
                console.log('[PWA] ✅ Приложение установлено');
                global.Utils.showToast('🎉 Приложение успешно установлено!', 3000);
            });
        },

        /**
         * Создать HTML-страницу для иконки Apple Touch (заглушка)
         * @param {string} text - Текст на иконке
         * @param {string} color - Цвет
         * @returns {string} - HTML изображение
         */
        generateAppleIconHTML(text = 'APP', color = '#1e293b') {
            return `
                <svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
                    <rect width="180" height="180" rx="40" fill="${color}"/>
                    <text x="90" y="115" text-anchor="middle" 
                          font-family="-apple-system, system-ui, sans-serif" 
                          font-size="72" font-weight="bold" 
                          fill="white">${text.charAt(0).toUpperCase()}</text>
                </svg>
            `;
        },

        /**
         * Проверить, запущено ли приложение в режиме standalone (PWA)
         * @returns {boolean}
         */
        isStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;
        },

        /**
         * Получить информацию о текущем PWA
         * @returns {Object}
         */
        getInfo() {
            return {
                isStandalone: this.isStandalone(),
                isOnline: global.Network.isOnline(),
                platform: navigator.platform,
                userAgent: navigator.userAgent,
                displayMode: window.matchMedia('(display-mode: standalone)').matches 
                    ? 'standalone' 
                    : 'browser'
            };
        }
    };

    // ---------- 7.1 АВТОЗАПУСК ----------
    const AutoPWA = {
        /**
         * Автоматическая настройка PWA с параметрами из атрибутов
         * Используйте data-pwa-* атрибуты на теге <html>
         */
        initFromAttributes() {
            const html = document.documentElement;
            
            const config = {
                name: html.getAttribute('data-pwa-name') || document.title || 'Приложение',
                shortName: html.getAttribute('data-pwa-short-name') || 
                           document.title?.slice(0, 12) || 'Приложение',
                description: html.getAttribute('data-pwa-description') || 
                            'Работает даже без интернета',
                themeColor: html.getAttribute('data-pwa-theme-color') || '#1e293b',
                backgroundColor: html.getAttribute('data-pwa-bg-color') || '#ffffff',
                color: html.getAttribute('data-pwa-color') || '#1e293b',
                startUrl: html.getAttribute('data-pwa-start-url') || '/',
                scope: html.getAttribute('data-pwa-scope') || '/'
            };

            return global.PWA.setup(config);
        }
    };

    // ---------- ЭКСПОРТ ----------
    global.PWA = PWA;
    global.AutoPWA = AutoPWA;

    // Автозапуск, если есть атрибуты
    if (document.documentElement.hasAttribute('data-pwa-auto')) {
        AutoPWA.initFromAttributes().catch(console.warn);
    }

    console.log('[PWA] ✅ Модуль иконок загружен');

})(window);

</script>
