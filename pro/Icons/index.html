<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <!-- Ваш manifest.json -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ваши иконки -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    
    <title>Иконки</title>
</head>

<body>



  <div class="container">
<div class="status" id="status">🟢 Онлайн</div>
    <h1>Загрузите изображение для создания иконок</h1>
    <input type="file" id="upload" accept="image/*">

    <div id="buttons" style="display:none;">
      <h2>Скачивание иконок</h2>
      <button onclick="downloadIcon(64)">64x64</button>
      <button onclick="downloadIcon(128)">128x128</button>
      <button onclick="downloadIcon(192)">192x192</button>
      <button onclick="downloadIcon(256)">256x256</button>
      <button onclick="downloadIcon(512)">512x512</button>
      <button onclick="downloadIcon(1024)">1024x1024</button>
    </div>

    <button class="exit-btn" onclick="window.location.href='https://2d3t.github.io/index.html/'">Выход</button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let img = new Image();

    document.getElementById('upload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        img.onload = function() {
          document.getElementById('buttons').style.display = 'block';
        }
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function downloadIcon(size) {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;

      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(img, 0, 0, size, size);

      const link = document.createElement('a');
      link.download = `icon_${size}x${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>



    <script>
        // Проверка статуса сети
        function updateStatus() {
            const status = document.getElementById('status');
            if (navigator.onLine) {
                status.textContent = '🟢 Онлайн';
                status.className = 'status online';
            } else {
                status.textContent = '🔴 Офлайн (работает из кэша)';
                status.className = 'status offline';
            }
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('[SW] ✅ Зарегистрирован'))
                .catch(err => console.log('[SW] ❌ Ошибка:', err));
        }
    </script>



</body>
</html>
