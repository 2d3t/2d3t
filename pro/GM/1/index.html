<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0a2e">
<link rel="manifest" href="manifest.json">

    <!-- Иконки PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

    <!-- Мета-теги для PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
<title>🎙️ Voice Transformer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(ellipse at top, #1a0a2e 0%, #000 70%);
    color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 12px calc(20px + env(safe-area-inset-bottom));
    padding-top: calc(16px + env(safe-area-inset-top));
    overflow-x: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }
  h1 {
    font-weight: 100; font-size: clamp(20px, 6vw, 32px); letter-spacing: 4px;
    text-transform: uppercase; margin-bottom: 4px;
    background: linear-gradient(90deg, #6cf, #c6f, #f6c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center;
  }
  .subtitle {
    color: rgba(150,200,255,0.5); font-size: clamp(10px, 3vw, 13px);
    letter-spacing: 1.5px; margin-bottom: 14px; text-align: center; padding: 0 8px;
  }
  .lang-switch {
    position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(150,200,255,0.25);
    color: #9df; border-radius: 20px; padding: 4px 10px; font-size: 11px;
    font-family: inherit; cursor: pointer; letter-spacing: 1px;
  }
  .lang-switch:hover { background: rgba(150,200,255,0.15); }
  .tabs {
    display: flex; gap: 4px; margin-bottom: 14px;
    background: rgba(255,255,255,0.04); padding: 4px; border-radius: 30px;
    border: 1px solid rgba(150,200,255,0.15); width: 100%; max-width: 340px;
  }
  .tab {
    flex: 1; padding: 10px 8px; border-radius: 26px; background: transparent; border: none;
    color: rgba(150,200,255,0.6); cursor: pointer; font-size: clamp(11px, 3.2vw, 13px);
    letter-spacing: 1px; transition: all 0.25s; font-family: inherit; white-space: nowrap;
  }
  .tab:hover { color: #9df; }
  .tab.active {
    background: linear-gradient(135deg, rgba(150,200,255,0.25), rgba(200,150,255,0.2));
    color: #fff; box-shadow: 0 0 15px rgba(150,220,255,0.25);
  }
  .panel { display: none; flex-direction: column; align-items: center; width: 100%; }
  .panel.active { display: flex; }
  .recorder { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 14px; }
  .rec-btn {
    width: 84px; height: 84px; border-radius: 50%; border: 3px solid rgba(255,80,120,0.6);
    background: radial-gradient(circle, rgba(255,80,120,0.25), rgba(255,80,120,0.05));
    cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    font-size: 26px; touch-action: manipulation;
  }
  .rec-btn:hover { transform: scale(1.05); border-color: #f6a; box-shadow: 0 0 30px rgba(255,80,120,0.4); }
  .rec-btn.recording { border-color: #f33; animation: recPulse 1s infinite; }
  @keyframes recPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,50,50,0.7); }
    50%      { box-shadow: 0 0 0 18px rgba(255,50,50,0); }
  }
  .drop-zone {
    width: 100%; max-width: 600px; min-height: 140px;
    border: 2px dashed rgba(150,200,255,0.3); border-radius: 16px;
    background: rgba(255,255,255,0.02); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; padding: 22px 16px;
    cursor: pointer; transition: all 0.3s; text-align: center; margin-bottom: 14px;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #9df; background: rgba(150,200,255,0.08);
    box-shadow: 0 0 40px rgba(150,200,255,0.15);
  }
  .drop-zone .big-icon { font-size: 38px; }
  .drop-zone .hint { color: rgba(150,200,255,0.6); font-size: clamp(11px, 3.2vw, 13px); letter-spacing: 0.5px; }
  .drop-zone .formats { color: rgba(150,200,255,0.35); font-size: clamp(9px, 2.6vw, 11px); letter-spacing: 1.5px; }
  .timer { font-size: 18px; font-variant-numeric: tabular-nums; color: #9df; letter-spacing: 1.5px; }
  .file-info {
    width: 100%; max-width: 600px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(150,200,255,0.2); border-radius: 12px; padding: 10px 14px;
    margin-bottom: 10px; display: none; justify-content: space-between;
    align-items: center; gap: 10px; font-size: clamp(11px, 3.2vw, 13px);
  }
  .file-info.visible { display: flex; }
  .file-info .fname { color: #9df; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
  .file-info .fdur { color: rgba(150,200,255,0.6); font-size: 11px; white-space: nowrap; }
  .trim-section {
    width: 100%; max-width: 600px; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(150,200,255,0.15); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 10px; display: none; flex-direction: column; gap: 10px;
  }
  .trim-section.visible { display: flex; }
  .trim-header {
    display: flex; justify-content: space-between; align-items: center; font-size: 11px;
    color: rgba(150,200,255,0.7); letter-spacing: 0.5px; gap: 8px; flex-wrap: wrap;
  }
  .trim-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; flex: 1; min-width: 0; }
  .trim-toggle input { accent-color: #6cf; cursor: pointer; width: 18px; height: 18px; flex-shrink: 0; }
  .trim-toggle span { line-height: 1.3; }
  .trim-range { display: flex; gap: 8px; align-items: center; font-size: 11px; color: rgba(150,200,255,0.6); }
  .trim-range input[type=range] { flex: 1; accent-color: #6cf; height: 24px; touch-action: pan-x; }
  .trim-time { font-variant-numeric: tabular-nums; color: #9df; min-width: 45px; text-align: right; font-size: 11px; }
  #visualizer {
    width: 100%; max-width: 600px; height: 80px; border-radius: 12px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(150,200,255,0.15);
    display: block; margin-bottom: 12px;
  }
  .effects {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    width: 100%; max-width: 800px; margin-top: 6px;
  }
  @media (min-width: 420px) { .effects { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 700px) { .effects { grid-template-columns: repeat(4, 1fr); gap: 10px; } }
  .effect-btn {
    padding: 10px 6px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(150,200,255,0.2); border-radius: 12px; color: #fff; cursor: pointer;
    transition: all 0.25s; font-size: 11px; display: flex; flex-direction: column;
    align-items: center; gap: 4px; position: relative; overflow: hidden; min-height: 74px;
    justify-content: center; font-family: inherit; touch-action: manipulation;
  }
  .effect-btn:hover:not(:disabled) {
    background: rgba(150,200,255,0.12); border-color: rgba(150,200,255,0.5);
    box-shadow: 0 8px 20px rgba(100,150,255,0.15);
  }
  .effect-btn:active:not(:disabled) { transform: scale(0.97); }
  .effect-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .effect-btn .emoji { font-size: 20px; }
  .effect-btn .name  { font-weight: 600; letter-spacing: 0.3px; font-size: 11px; }
  .effect-btn .desc  { font-size: 8px; color: rgba(150,200,255,0.6); text-align: center; line-height: 1.2; }
  .effect-btn.active {
    background: linear-gradient(135deg, rgba(150,200,255,0.25), rgba(200,150,255,0.15));
    border-color: #9df; box-shadow: 0 0 20px rgba(150,220,255,0.3);
  }
  .status {
    margin-top: 12px; color: rgba(150,200,255,0.6); font-size: clamp(11px, 3.2vw, 13px);
    letter-spacing: 0.5px; min-height: 18px; text-align: center; padding: 0 8px; line-height: 1.4;
  }
  .btn-row { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .action-btn {
    padding: 10px 18px; background: rgba(150,200,255,0.12);
    border: 1px solid rgba(150,200,255,0.35); border-radius: 22px; color: #9df;
    cursor: pointer; font-size: clamp(11px, 3.2vw, 12px); letter-spacing: 1.5px;
    transition: all 0.25s; font-family: inherit; display: none; flex: 1; max-width: 220px;
    min-width: 140px; touch-action: manipulation;
  }
  .action-btn:hover { background: rgba(150,200,255,0.25); border-color: #9df; }
  .action-btn:active:not(:disabled) { transform: scale(0.97); }
  .action-btn.visible { display: inline-block; }
  .action-btn.stop { background: rgba(255,80,120,0.15); border-color: rgba(255,80,120,0.4); color: #f8a; }
  .action-btn.stop:hover { background: rgba(255,80,120,0.3); }
  .action-btn.download { background: rgba(100,255,150,0.12); border-color: rgba(100,255,150,0.35); color: #6f9; }
  .action-btn.download:hover { background: rgba(100,255,150,0.25); }
  .action-btn:disabled { opacity: 0.4; cursor: wait; }
  .render-bar {
    width: 100%; max-width: 600px; height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 3px; margin-top: 10px; overflow: hidden; display: none;
  }
  .render-bar.visible { display: block; }
  .render-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6f9, #9df); transition: width 0.15s; }
  .render-text {
    font-size: 10px; color: rgba(150,200,255,0.5); margin-top: 4px;
    letter-spacing: 0.5px; display: none;
  }
  .render-text.visible { display: block; }
  .preview-audio { width: 100%; max-width: 600px; margin-top: 10px; display: none; }
  .preview-audio.visible { display: block; }
  .preview-audio audio { width: 100%; border-radius: 20px; filter: invert(0.9) hue-rotate(180deg); }
  .warn-note {
    color: #fa6; font-size: 10px; margin-top: 6px; text-align: center;
    max-width: 100%; letter-spacing: 0.5px; line-height: 1.3; padding: 0 4px;
  }
  @media (max-width: 340px) {
    .effect-btn .desc { display: none; }
    .effect-btn { min-height: 62px; }
    .tab { letter-spacing: 0; padding: 9px 4px; }
    h1 { letter-spacing: 2px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>

<button class="lang-switch" id="langSwitch" title="Language">🌐 EN</button>

<h1 data-i18n="title">Voice Lab</h1>
<div class="subtitle" data-i18n="subtitle">полный файл · без обрезки · скачивание MP3</div>

<div class="tabs">
  <button class="tab active" data-tab="record" data-i18n="tabRecord">🎤 Запись</button>
  <button class="tab" data-tab="upload" data-i18n="tabUpload">📁 Файл</button>
</div>

<div class="panel active" id="panel-record">
  <div class="recorder">
    <button class="rec-btn" id="recBtn" aria-label="Запись">🎤</button>
    <div class="timer" id="timer">00:00.00 / 00:15</div>
    <div class="warn-note" data-i18n="warnNote">Запись ограничена 15с — для длинного аудио используй вкладку «Файл»</div>
  </div>
</div>

<div class="panel" id="panel-upload">
  <div class="drop-zone" id="dropZone">
    <div class="big-icon">📁</div>
    <div class="hint" data-i18n="dropHint">Перетащи файл сюда или нажми</div>
    <div class="formats" data-i18n="dropFormats">MP3 · WAV · OGG · M4A · FLAC · AAC · OPUS</div>
    <input type="file" id="fileInput" accept="audio/*" style="display:none">
  </div>
</div>

<div class="file-info" id="fileInfo">
  <span class="fname" id="fname">—</span>
  <span class="fdur" id="fdur">—</span>
</div>

<div class="trim-section" id="trimSection">
  <div class="trim-header">
    <label class="trim-toggle">
      <input type="checkbox" id="trimToggle">
      <span data-i18n="trimToggle">Обработать фрагмент (а не весь файл)</span>
    </label>
    <span id="trimInfo" style="font-size:10px;color:rgba(150,200,255,0.5)">—</span>
  </div>
  <div class="trim-range">
    <span data-i18n="trimFrom">от</span>
    <input type="range" id="trimStart" min="0" max="100" value="0" step="0.1" disabled>
    <span class="trim-time" id="trimStartTime">0:00</span>
  </div>
  <div class="trim-range">
    <span data-i18n="trimTo">до</span>
    <input type="range" id="trimEnd" min="0" max="100" value="100" step="0.1" disabled>
    <span class="trim-time" id="trimEndTime">0:00</span>
  </div>
</div>

<canvas id="visualizer"></canvas>

<div class="effects" id="effects"></div>

<div class="btn-row">
  <button class="action-btn stop" id="stopBtn" data-i18n="stopBtn">⏹ Стоп</button>
  <button class="action-btn download" id="downloadBtn" data-i18n="downloadBtn">⬇ Скачать MP3</button>
</div>

<div class="render-bar" id="renderBar"><div class="render-fill" id="renderFill"></div></div>
<div class="render-text" id="renderText">0%</div>

<div class="preview-audio" id="previewAudio">
  <audio controls id="audioPlayer" playsinline></audio>
</div>

<div class="status" id="status">Запиши 🎤 или загрузи 📁 файл</div>

<script>
// ============================================================
//  I18N
// ============================================================
const I18N = {
  ru: {
    title: 'Voice Lab',
    subtitle: 'полный файл · без обрезки · скачивание MP3',
    tabRecord: '🎤 Запись',
    tabUpload: '📁 Файл',
    warnNote: 'Запись ограничена 15с — для длинного аудио используй вкладку «Файл»',
    dropHint: 'Перетащи файл сюда или нажми',
    dropFormats: 'MP3 · WAV · OGG · M4A · FLAC · AAC · OPUS',
    trimToggle: 'Обработать фрагмент (а не весь файл)',
    trimFrom: 'от',
    trimTo: 'до',
    stopBtn: '⏹ Стоп',
    downloadBtn: '⬇ Скачать MP3',
    statusIdle: 'Запиши 🎤 или загрузи 📁 файл',
    recBtnTitle: 'Запись',
    secShort: 'с',
    wholeFile: 'весь файл',
    fragment: 'фрагмент',
    from: 'из',
    recording: '🔴 Запись...',
    micDenied: '❌ Нет доступа к микрофону',
    decodeError: '❌ Ошибка декодирования',
    notAudio: '❌ Это не аудиофайл',
    uploading: '⏳ Загружаем',
    loaded: '✅ Загружено',
    wholeFileWillProcess: 'весь файл будет обработан',
    recorded: '✅ Записано',
    chooseEffect: 'выбери эффект',
    readyChooseEffect: 'Готово — выбери эффект',
    playFirst: '❌ Сначала проиграй эффект',
    rendering: '⏳ Рендерим',
    render: 'Рендер',
    encodingMp3: 'кодируем MP3...',
    doneDownloading: 'Готово! Скачивание...',
    downloaded: '✅ Скачано',
    renderError: '❌ Ошибка рендера',
    effectNames: {
      demon: ['Демон', 'глубокий голос из ада'],
      chipmunk: ['Чипманд', 'писклявый бурундук'],
      robot: ['Робот', 'механический голос'],
      ghost: ['Призрак', 'шёпот из другого мира'],
      alien: ['Инопланетянин', 'модуляция + вибрато'],
      choir: ['Хор', 'голос + 3 клона'],
      metal: ['Металл', 'крик из динамиков'],
      stutter: ['Заикание', 'голос зацикливается'],
      echo: ['Эхо', 'повтор с задержкой'],
      reverse: ['Реверс', 'задом наперёд'],
      telephone: ['Телефон', 'узкая полоса частот'],
      underwater: ['Подводный', 'глубоко и волнисто'],
      stadium: ['Стадион', 'большой реверб + эхо'],
      chipmunkPlus: ['Бурундук+', 'экстремально высокий'],
      bass: ['Бас', 'очень низкий голос'],
      rasp: ['Хрип', 'овердрайв-дисторшн'],
    },
  },
  en: {
    title: 'Voice Lab',
    subtitle: 'full file · no trim · MP3 download',
    tabRecord: '🎤 Record',
    tabUpload: '📁 File',
    warnNote: 'Recording limited to 15s — use the "File" tab for longer audio',
    dropHint: 'Drop a file here or tap',
    dropFormats: 'MP3 · WAV · OGG · M4A · FLAC · AAC · OPUS',
    trimToggle: 'Process a fragment (not the whole file)',
    trimFrom: 'from',
    trimTo: 'to',
    stopBtn: '⏹ Stop',
    downloadBtn: '⬇ Download MP3',
    statusIdle: 'Record 🎤 or upload 📁 a file',
    recBtnTitle: 'Record',
    secShort: 's',
    wholeFile: 'whole file',
    fragment: 'fragment',
    from: 'of',
    recording: '🔴 Recording...',
    micDenied: '❌ Microphone access denied',
    decodeError: '❌ Decoding error',
    notAudio: '❌ Not an audio file',
    uploading: '⏳ Uploading',
    loaded: '✅ Loaded',
    wholeFileWillProcess: 'whole file will be processed',
    recorded: '✅ Recorded',
    chooseEffect: 'choose an effect',
    readyChooseEffect: 'Ready — choose an effect',
    playFirst: '❌ Play an effect first',
    rendering: '⏳ Rendering',
    render: 'Render',
    encodingMp3: 'encoding MP3...',
    doneDownloading: 'Done! Downloading...',
    downloaded: '✅ Downloaded',
    renderError: '❌ Render error',
    effectNames: {
      demon: ['Demon', 'deep voice from hell'],
      chipmunk: ['Chipmunk', 'squeaky rodent'],
      robot: ['Robot', 'mechanical voice'],
      ghost: ['Ghost', 'whisper from beyond'],
      alien: ['Alien', 'modulation + vibrato'],
      choir: ['Choir', 'voice + 3 clones'],
      metal: ['Metal', 'screaming speakers'],
      stutter: ['Stutter', 'voice loops'],
      echo: ['Echo', 'delayed repeat'],
      reverse: ['Reverse', 'played backwards'],
      telephone: ['Telephone', 'narrow frequency band'],
      underwater: ['Underwater', 'deep and wavy'],
      stadium: ['Stadium', 'big reverb + echo'],
      chipmunkPlus: ['Chipmunk+', 'extremely high'],
      bass: ['Bass', 'very low voice'],
      rasp: ['Rasp', 'overdrive distortion'],
    },
  },
};

const SUPPORTED = Object.keys(I18N);

function detectLang() {
  const saved = localStorage.getItem('voiceLabLang');
  if (saved && I18N[saved]) return saved;
  const prefs = navigator.languages || [navigator.language || 'en'];
  for (const l of prefs) {
    const code = (l || '').slice(0, 2).toLowerCase();
    if (I18N[code]) return code;
  }
  return 'en';
}

let LANG = detectLang();
let t = I18N[LANG];

function applyI18n() {
  t = I18N[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] != null) el.textContent = t[key];
  });
  const $recBtnEl = document.getElementById('recBtn');
  if ($recBtnEl) $recBtnEl.setAttribute('aria-label', t.recBtnTitle);
  const $langSwitch = document.getElementById('langSwitch');
  if ($langSwitch) $langSwitch.textContent = LANG === 'ru' ? '🌐 EN' : '🌐 RU';
  // перерисовать кнопки эффектов, если они уже созданы
  if (typeof EFFECTS !== 'undefined' && $effects && $effects.children.length) {
    rebuildEffectButtons();
  }
  // обновить статус, если он в «idle»
  if ($status && !processedBuffer) $status.textContent = t.statusIdle;
}

const $langSwitch = document.getElementById('langSwitch');
$langSwitch.addEventListener('click', () => {
  LANG = LANG === 'ru' ? 'en' : 'ru';
  localStorage.setItem('voiceLabLang', LANG);
  applyI18n();
  // после смены языка обновим динамические тексты
  if (processedBuffer) {
    if (isPlaying && lastEffectIdx >= 0) {
      const eff = EFFECTS[lastEffectIdx];
      const [nm] = t.effectNames[eff.key];
      $status.textContent = `▶ ${eff.emoji} ${nm} (${formatDur(processedBuffer.duration)})`;
    } else {
      $status.textContent = `${t.readyChooseEffect} (${formatDur(processedBuffer.duration)})`;
    }
    updateFileInfoLabels();
    updateTrimInfoLabels();
  } else {
    $status.textContent = t.statusIdle;
  }
});

// ============================================================
//  СОСТОЯНИЕ
// ============================================================
let audioCtx = null;
let analyser = null;
let recordedBuffer = null;
let processedBuffer = null;
let mediaRecorder = null;
let mediaStream = null;
let recordedChunks = [];
let isRecording = false;
let isPlaying = false;
let recStartTime = 0;
let recTimerInterval = null;
let lastEffectIdx = -1;
let lastRenderedBuffer = null;
let fullFileDuration = 0;
let isFileMode = false;
let currentFileName = '';
const MAX_RECORD_SECONDS = 15;

const $recBtn    = document.getElementById('recBtn');
const $timer     = document.getElementById('timer');
const $status    = document.getElementById('status');
const $effects   = document.getElementById('effects');
const $stopBtn   = document.getElementById('stopBtn');
const $dlBtn     = document.getElementById('downloadBtn');

const visCtx     = $vis.getContext('2d');

function resizeVis() {
  const dpr = window.devicePixelRatio || 1;
  $vis.width  = Math.max(1, Math.floor($vis.clientWidth * dpr));
  $vis.height = Math.max(1, Math.floor($vis.clientHeight * dpr));
}
resizeVis();
window.addEventListener('resize', resizeVis);

function drawVisualizer() {
  requestAnimationFrame(drawVisualizer);
  visCtx.clearRect(0, 0, $vis.width, $vis.height);

  if (!analyser) {
    visCtx.strokeStyle = 'rgba(150,200,255,0.15)';
    visCtx.lineWidth = 2;
    visCtx.beginPath();
    visCtx.moveTo(0, $vis.height / 2);
    visCtx.lineTo($vis.width, $vis.height / 2);
    visCtx.stroke();
    return;
  }

  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);

  const grad = visCtx.createLinearGradient(0, 0, $vis.width, 0);
  grad.addColorStop(0, isRecording ? '#f6a' : '#6cf');
  grad.addColorStop(0.5, '#c9f');
  grad.addColorStop(1, isRecording ? '#f6a' : '#6cf');

  visCtx.strokeStyle = grad;
  visCtx.lineWidth = 2 * (window.devicePixelRatio || 1);
  visCtx.beginPath();
  const sliceWidth = $vis.width / data.length;
  let x = 0;
  for (let i = 0; i < data.length; i++) {
    const v = data[i] / 128.0;
    const y = (v * $vis.height) / 2;
    if (i === 0) visCtx.moveTo(x, y);
    else visCtx.lineTo(x, y);
    x += sliceWidth;
  }
  visCtx.stroke();
}
drawVisualizer();

// ============================================================
//  ХЕЛПЕРЫ
// ============================================================
function makeDistortionCurve(amount) {
  const n = 44100;
  const curve = new Float32Array(n);
  const deg = Math.PI / 180;
  for (let i = 0; i < n; i++) {
    const x = (i * 2) / n - 1;
    curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
  }
  return curve;
}

function reverseBuffer(ctx, buffer) {
  const rev = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    const src = buffer.getChannelData(ch);
    const dst = rev.getChannelData(ch);
    for (let i = 0; i < src.length; i++) dst[i] = src[src.length - 1 - i];
  }
  return rev;
}

function makeReverbIR(ctx, duration, decay) {
  const rate = ctx.sampleRate;
  const length = rate * duration;
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
  }
  return impulse;
}

function sliceBuffer(ctx, buffer, start, end) {
  const sr = buffer.sampleRate;
  const startSample = Math.max(0, Math.floor(start * sr));
  const endSample = Math.min(Math.floor(end * sr), buffer.length);
  const len = Math.max(0, endSample - startSample);
  const out = ctx.createBuffer(buffer.numberOfChannels, len, sr);
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    out.copyToChannel(buffer.getChannelData(ch).slice(startSample, endSample), ch);
  }
  return out;
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function formatDur(sec) {
  if (sec >= 60) return formatTime(sec);
  return sec.toFixed(1) + t.secShort;
}

function rebuildEffectButtons() {
  $effects.innerHTML = '';
  EFFECTS.forEach((eff, idx) => {
    const [nm, desc] = t.effectNames[eff.key];
    const btn = document.createElement('button');
    btn.className = 'effect-btn';
    btn.disabled = !processedBuffer;
    btn.dataset.effectIdx = idx;
    btn.innerHTML = `
      <span class="emoji">${eff.emoji}</span>
      <span class="name">${nm}</span>
      <span class="desc">${desc}</span>
    `;
    btn.addEventListener('click', () => playEffect(idx, btn));
    $effects.appendChild(btn);
  });
}
rebuildEffectButtons();

$recBtn.addEventListener('click', async () => {
  if (isRecording) { stopRecording(); return; }
  stopAllPlayback();

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    $status.textContent = t.micDenied + ': ' + e.message;
    return;
  }

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  const micSrc = audioCtx.createMediaStreamSource(mediaStream);
  micSrc.connect(analyser);

  recordedChunks = [];
  mediaRecorder = new MediaRecorder(mediaStream);
  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = async () => {
    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
    const arrayBuf = await blob.arrayBuffer();
    try {
      recordedBuffer = await audioCtx.decodeAudioData(arrayBuf);
      if (recordedBuffer.duration > MAX_RECORD_SECONDS) {
        recordedBuffer = sliceBuffer(audioCtx, recordedBuffer, 0, MAX_RECORD_SECONDS);
      }
      processedBuffer = recordedBuffer;
      isFileMode = false;
      currentFileName = t.tabRecord;
      enableEffects(true);
      $trimSection.classList.remove('visible');
      updateFileInfoLabels();
      $fileInfo.classList.add('visible');
      $status.textContent = `${t.recorded} ${processedBuffer.duration.toFixed(1)}${t.secShort} — ${t.chooseEffect}`;
    } catch (e) {
      $status.textContent = t.decodeError + ': ' + e.message;
    }
  };

  mediaRecorder.start();
  isRecording = true;
  $recBtn.classList.add('recording');
  $recBtn.textContent = '⏹';
  $status.textContent = t.recording;
  recStartTime = performance.now();

  recTimerInterval = setInterval(() => {
    const elapsed = (performance.now() - recStartTime) / 1000;
    updateTimer(elapsed);
    if (elapsed >= MAX_RECORD_SECONDS) stopRecording();
  }, 100);
});

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;
  clearInterval(recTimerInterval);
  $recBtn.classList.remove('recording');
  $recBtn.textContent = '🎤';
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  setTimeout(() => { if (!isRecording) analyser = null; }, 300);
  updateTimer(MAX_RECORD_SECONDS);
}

function updateTimer(sec) {
  const s = Math.floor(sec);
  const cs = Math.floor((sec - s) * 100);
  $timer.textContent =
    `00:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')} / 00:15`;
}

// ============================================================
//  ЗАГРУЗКА ФАЙЛА
// ============================================================
$dropZone.addEventListener('click', () => $fileInput.click());
$fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
  e.target.value = '';
});

$dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  $dropZone.classList.add('dragover');
});
$dropZone.addEventListener('dragleave', () => $dropZone.classList.remove('dragover'));
$dropZone.addEventListener('drop', e => {
  e.preventDefault();
  $dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

async function handleFile(file) {
  if (!file.type.startsWith('audio/') && !file.name.match(/\.(mp3|wav|ogg|m4a|flac|aac|opus|webm)$/i)) {
    $status.textContent = t.notAudio;
    return;
  }

  stopAllPlayback();
  $status.textContent = `${t.uploading} "${file.name}"...`;
  $dlBtn.classList.remove('visible');
  $previewAudio.classList.remove('visible');
  $renderBar.classList.remove('visible');
  $renderText.classList.remove('visible');

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  try {
    const arrayBuf = await file.arrayBuffer();
    recordedBuffer = await audioCtx.decodeAudioData(arrayBuf);
    processedBuffer = recordedBuffer;
    fullFileDuration = recordedBuffer.duration;
    isFileMode = true;
    currentFileName = file.name;

    updateFileInfoLabels();
    $fileInfo.classList.add('visible');
    enableEffects(true);

    if (fullFileDuration > 30) {
      setupTrimSection();
    } else {
      $trimSection.classList.remove('visible');
    }

    $status.textContent = `${t.loaded} ${formatDur(fullFileDuration)} — ${t.wholeFileWillProcess}`;
  } catch (e) {
    $status.textContent = t.decodeError + ': ' + e.message;
    console.error(e);
  }
}

function updateFileInfoLabels() {
  if (!processedBuffer) return;
  if (isFileMode) {
    $fname.textContent = currentFileName;
    if ($trimToggle.checked) {
      $fdur.textContent = `${formatDur(processedBuffer.duration)} (${t.from} ${formatDur(fullFileDuration)})`;
    } else {
      $fdur.textContent = formatDur(fullFileDuration);
    }
  } else {
    $fname.textContent = t.tabRecord;
    $fdur.textContent = formatDur(processedBuffer.duration);
  }
}

// ============================================================
//  ВЫБОР ФРАГМЕНТА
// ============================================================
function setupTrimSection() {
  $trimSection.classList.add('visible');
  $trimToggle.checked = false;
  $trimStart.disabled = true;
  $trimEnd.disabled = true;
  $trimStart.value = 0;
  $trimEnd.value = 100;
  $trimStartTime.textContent = formatTime(0);
  $trimEndTime.textContent = formatTime(fullFileDuration);
  updateTrimInfoLabels();
  updateProcessedBuffer();
}

function updateTrimInfoLabels() {
  if (!isFileMode || !fullFileDuration) return;
  if ($trimToggle.checked && processedBuffer) {
    $trimInfo.textContent = `${t.fragment}: ${formatDur(processedBuffer.duration)}`;
  } else {
    $trimInfo.textContent = `${t.wholeFile}: ${formatDur(fullFileDuration)}`;
  }
}

$trimToggle.addEventListener('change', () => {
  const enabled = $trimToggle.checked;
  $trimStart.disabled = !enabled;
  $trimEnd.disabled = !enabled;
  updateProcessedBuffer();
});

$trimStart.addEventListener('input', () => {
  const v = parseFloat($trimStart.value);
  const ev = parseFloat($trimEnd.value);
  if (v >= ev) {
    $trimStart.value = Math.max(0, ev - 1);
    return;
  }
  $trimStartTime.textContent = formatTime((v / 100) * fullFileDuration);
  updateProcessedBuffer();
});

$trimEnd.addEventListener('input', () => {
  const v = parseFloat($trimEnd.value);
  const sv = parseFloat($trimStart.value);
  if (v <= sv) {
    $trimEnd.value = Math.min(100, sv + 1);
    return;
  }
  $trimEndTime.textContent = formatTime((v / 100) * fullFileDuration);
  updateProcessedBuffer();
});

function updateProcessedBuffer() {
  if (!recordedBuffer || !isFileMode) return;

  if ($trimToggle.checked) {
    const startSec = (parseFloat($trimStart.value) / 100) * fullFileDuration;
    const endSec   = (parseFloat($trimEnd.value)   / 100) * fullFileDuration;
    processedBuffer = sliceBuffer(audioCtx, recordedBuffer, startSec, endSec);
  } else {
    processedBuffer = recordedBuffer;
  }

  updateTrimInfoLabels();
  updateFileInfoLabels();

  lastRenderedBuffer = null;
  $dlBtn.classList.remove('visible');
  $previewAudio.classList.remove('visible');
}

// ============================================================
//  ВОСПРОИЗВЕДЕНИЕ
// ============================================================
let currentEffectSource = null;
let currentExtraNodes = [];
let currentAnalyser = null;

function playEffect(idx, btn) {
  if (!processedBuffer) return;
  stopAllPlayback();

  const eff = EFFECTS[idx];
  const built = eff.build(audioCtx, processedBuffer);

  currentAnalyser = audioCtx.createAnalyser();
  currentAnalyser.fftSize = 2048;

  built.output.connect(currentAnalyser);
  currentAnalyser.connect(audioCtx.destination);

  currentEffectSource = built.source;
  currentExtraNodes = built.extra || [];
  if (built.sources) currentExtraNodes.push(...built.sources);

  document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  if (built.sources) built.sources.forEach(s => s.start());
  else built.source.start();

  analyser = currentAnalyser;
  isPlaying = true;
  lastEffectIdx = idx;
  $stopBtn.classList.add('visible');
  $dlBtn.classList.add('visible');
  const [nm] = t.effectNames[eff.key];
  $status.textContent = `▶ ${eff.emoji} ${nm} (${formatDur(processedBuffer.duration)})`;

  const done = () => { if (isPlaying) stopAllPlayback(); };
  if (!built.sources) built.source.onended = done;
  else built.sources[built.sources.length - 1].onended = done;
}

function stopAllPlayback() {
  isPlaying = false;
  analyser = null;
  $stopBtn.classList.remove('visible');
  document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));

  try { if (currentEffectSource) currentEffectSource.stop(); } catch(e) {}
  currentExtraNodes.forEach(n => {
    try { n.stop(); } catch(e) {}
    try { n.disconnect(); } catch(e) {}
  });
  currentEffectSource = null;
  currentExtraNodes = [];
  if (currentAnalyser) {
    try { currentAnalyser.disconnect(); } catch(e) {}
    currentAnalyser = null;
  }

  if (processedBuffer) {
    $status.textContent = `${t.readyChooseEffect} (${formatDur(processedBuffer.duration)})`;
  } else {
    $status.textContent = t.statusIdle;
  }
}

$stopBtn.addEventListener('click', stopAllPlayback);

// ============================================================
//  СКАЧИВАНИЕ В MP3
// ============================================================
$dlBtn.addEventListener('click', async () => {
  if (!processedBuffer) return;
  if (lastEffectIdx < 0) {
    $status.textContent = t.playFirst;
    return;
  }

  const eff = EFFECTS[lastEffectIdx];
  const [nm] = t.effectNames[eff.key];
  const duration = processedBuffer.duration;

  $dlBtn.disabled = true;
  $status.textContent = `${t.rendering} "${nm}" (${formatDur(duration)})...`;
  $renderBar.classList.add('visible');
  $renderText.classList.add('visible');
  $renderFill.style.width = '0%';
  $renderText.textContent = `${t.render}: 0%`;

  let fakeProgress = 0;
  const progressInterval = setInterval(() => {
    fakeProgress = Math.min(90, fakeProgress + (100 / Math.max(10, duration)));
    $renderFill.style.width = fakeProgress + '%';
    $renderText.textContent = `${t.render}: ${Math.round(fakeProgress)}%`;
  }, 100);

  try {
    const sampleRate = processedBuffer.sampleRate;
    const numSamples = Math.ceil(duration * sampleRate);

    const offline = new OfflineAudioContext(
      processedBuffer.numberOfChannels,
      numSamples,
      sampleRate
    );

    const built = eff.build(offline, processedBuffer);
    built.output.connect(offline.destination);

    if (built.sources) built.sources.forEach(s => s.start(0));
    else built.source.start(0);

    const rendered = await offline.startRendering();

    clearInterval(progressInterval);
    $renderFill.style.width = '100%';
    $renderText.textContent = `${t.render}: 100% — ${t.encodingMp3}`;

    await new Promise(r => setTimeout(r, 50));

    let blob, ext;
    if (typeof lamejs !== 'undefined') {
      try {
        blob = await audioBufferToMp3(rendered, 128);
        ext = 'mp3';
      } catch (e) {
        console.warn('MP3 encode failed, fallback to WAV', e);
        blob = audioBufferToWav(rendered);
        ext = 'wav';
      }
    } else {
      console.warn('lamejs not loaded, fallback to WAV');
      blob = audioBufferToWav(rendered);
      ext = 'wav';
    }

    $renderText.textContent = t.doneDownloading;
    setTimeout(() => {
      $renderBar.classList.remove('visible');
      $renderText.classList.remove('visible');
    }, 1200);

    const url = URL.createObjectURL(blob);
    $audioPlayer.src = url;
    $previewAudio.classList.add('visible');

    const a = document.createElement('a');
    a.href = url;
    const safeName = eff.key.replace(/[^a-z0-9]+/gi, '_');
    a.download = `voice_lab_${safeName}_${Date.now()}.${ext}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    lastRenderedBuffer = rendered;
    $status.textContent = `${t.downloaded} (${ext.toUpperCase()}): ${eff.emoji} ${nm} (${formatDur(duration)})`;
  } catch (e) {
    clearInterval(progressInterval);
    $status.textContent = t.renderError + ': ' + e.message;
    console.error(e);
    $renderBar.classList.remove('visible');
    $renderText.classList.remove('visible');
  } finally {
    $dlBtn.disabled = false;
  }
});

// ============================================================
//  MP3 ENCODER (lamejs)
// ============================================================
function audioBufferToMp3(buffer, kbps = 128) {
  return new Promise((resolve, reject) => {
    try {
      if (typeof lamejs === 'undefined') {
        reject(new Error('lamejs not loaded'));
        return;
      }
      const numChannels = Math.min(2, buffer.numberOfChannels);
      const sampleRate  = buffer.sampleRate;
      const numSamples  = buffer.length;

      const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, kbps);

      const left  = floatTo16(buffer.getChannelData(0));
      const right = numChannels > 1 ? floatTo16(buffer.getChannelData(1)) : null;

      const blockSize = 1152;
      const mp3Data = [];

      for (let i = 0; i < numSamples; i += blockSize) {
        const leftChunk = left.subarray(i, i + blockSize);
        let mp3buf;
        if (numChannels > 1 && right) {
          const rightChunk = right.subarray(i, i + blockSize);
          mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
        } else {
          mp3buf = mp3encoder.encodeBuffer(leftChunk);
        }
        if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
      }
      const end = mp3encoder.flush();
      if (end.length > 0) mp3Data.push(new Int8Array(end));

      const blob = new Blob(mp3Data, { type: 'audio/mp3' });
      resolve(blob);
    } catch (e) {
      reject(e);
    }
  });
}

function floatTo16(float32) {
  const len = float32.length;
  const out = new Int16Array(len);
  for (let i = 0; i < len; i++) {
    let s = Math.max(-1, Math.min(1, float32[i]));
    s = s < 0 ? s * 0x8000 : s * 0x7FFF;
    out[i] = s;
  }
  return out;
}

// ============================================================
//  WAV ENCODER (fallback)
// ============================================================
function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate  = buffer.sampleRate;
  const numSamples  = buffer.length;
  const bytesPerSample = 2;
  const blockAlign = numChannels * bytesPerSample;
  const byteRate   = sampleRate * blockAlign;
  const dataSize   = numSamples * blockAlign;
  const bufferSize = 44 + dataSize;

  const ab = new ArrayBuffer(bufferSize);
  const view = new DataView(ab);

  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeString(0, 'RIFF');
  view.setUint32(4, bufferSize - 8, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  const channels = [];
  for (let ch = 0; ch < numChannels; ch++) channels.push(buffer.getChannelData(ch));

  let offset = 44;
  for (let i = 0; i < numSamples; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      let s = Math.max(-1, Math.min(1, channels[ch][i]));
      s = s < 0 ? s * 0x8000 : s * 0x7FFF;
      view.setInt16(offset, s, true);
      offset += 2;
    }
  }

  return new Blob([ab], { type: 'audio/wav' });
}

// ============================================================
//  УТИЛИТЫ
// ============================================================
function enableEffects(on) {
  document.querySelectorAll('.effect-btn').forEach(b => b.disabled = !on);
}

document.body.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { passive: true });

enableEffects(false);

// ============================================================
//  СТАРТ I18N
// ============================================================
applyI18n();
$status.textContent = t.statusIdle;
</script>
<script>
(function() {
    "use strict";

    function openGame(url, title) {
        const oldOverlay = document.querySelector('.transition-overlay');
        if (oldOverlay) oldOverlay.remove();

        const overlay = document.createElement('div');
        overlay.className = 'transition-overlay';

        const topBar = document.createElement('div');
        topBar.className = 'transition-topbar';

        const backBtn = document.createElement('button');
        backBtn.className = 'transition-back';
        backBtn.textContent = '← Назад';
        backBtn.onclick = function() { overlay.remove(); };

        const titleEl = document.createElement('span');
        titleEl.className = 'transition-title';
        titleEl.textContent = title || '🌐 Загрузка...';

        topBar.appendChild(backBtn);
        topBar.appendChild(titleEl);
        overlay.appendChild(topBar);

        const iframe = document.createElement('iframe');
        iframe.className = 'transition-iframe';
        iframe.src = url;
        iframe.allow = 'camera; microphone; payment; fullscreen; geolocation; downloads';
        iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-presentation allow-downloads';

        overlay.appendChild(iframe);
        document.body.appendChild(overlay);

        const escapeHandler = function(e) {
            if (e.key === 'Escape') {
                overlay.remove();
                document.removeEventListener('keydown', escapeHandler);
            }
        };
        document.addEventListener('keydown', escapeHandler);

        iframe.onload = function() {
            try {
                const frameTitle = iframe.contentDocument?.title;
                if (frameTitle && frameTitle !== '' && frameTitle !== 'Загрузка...') {
                    titleEl.textContent = frameTitle;
                }
            } catch (e) {}
        };

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.remove();
        });

        window.addEventListener('message', function(event) {
            if (event.source !== iframe.contentWindow) return;
            const data = event.data;
            if (data && data.type === 'download') {
                handleDownload(data.content, data.filename, data.mimeType);
            }
        });

        return overlay;
    }

    function handleDownload(content, filename, mimeType) {
        try {
            if (typeof content === 'string' && content.startsWith('http')) {
                const a = document.createElement('a');
                a.href = content;
                a.download = filename || 'download';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showNotification('✅ Скачивание началось!', 'success');
                return;
            }

            let blob;
            if (typeof content === 'string') {
                blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
            } else if (content instanceof Blob) {
                blob = content;
            } else {
                throw new Error('Неподдерживаемый формат данных');
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
            showNotification('✅ Файл "' + (filename || 'download') + '" сохранён!', 'success');
        } catch (error) {
            console.error('Ошибка скачивания:', error);
            showNotification('❌ Ошибка скачивания: ' + error.message, 'error');
        }
    }

    function showNotification(message, type) {
        const old = document.querySelector('.download-notification');
        if (old) old.remove();

        const notification = document.createElement('div');
        notification.className = 'download-notification ' + (type || '');
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(function() {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s';
            setTimeout(function() { notification.remove(); }, 500);
        }, 3000);
    }

    window.openGame = openGame;
    window.handleDownload = handleDownload;
    window.showNotification = showNotification;

    function registerSW() {
        if (!('serviceWorker' in navigator)) {
            console.warn('[SW] ❌ Service Worker не поддерживается');
            return;
        }
        navigator.serviceWorker.getRegistration()
            .then(function(registration) {
                if (registration) return;
                navigator.serviceWorker.register('sw.js')
                    .then(function(reg) { console.log('[SW] ✅ Зарегистрирован:', reg); })
                    .catch(function(err) { console.error('[SW] ❌ Ошибка:', err); });
            })
            .catch(function(err) { console.error('[SW] ❌ Ошибка проверки:', err); });
    }

    function checkNetwork() {
        const status = navigator.onLine ? 'Онлайн' : 'Офлайн (из кэша)';
        console.log('📡 ' + status);
    }

    function setupNetworkListeners() {
        window.addEventListener('online', function() {
            console.log('📡 Сеть восстановлена');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready
                    .then(function(registration) {
                        registration.update();
                        console.log('[SW] 🔄 Проверка обновлений...');
                    })
                    .catch(function() {});
            }
        });
        window.addEventListener('offline', function() {
            console.log('📡 Сеть отключена (работаем из кэша)');
        });
    }

    function init() {
        registerSW();
        checkNetwork();
        setupNetworkListeners();
        console.log('[APP] ✅ Офлайн-функционал активирован');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
