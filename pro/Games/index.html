<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">

    <link rel="manifest" href="manifest.json">
    
    <!-- Ваши иконки -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

    <!-- Мета-теги для PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>🌈 Детский мир творчества</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background: linear-gradient(145deg, #f9f3e6 0%, #ffe9d6 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .page-wrapper {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 248, 235, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 72px 72px 48px 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 6px 12px rgba(0, 0, 0, 0.05);
            padding: 30px 25px 40px;
            border: 3px solid #ffffff88;
            transition: all 0.2s ease;
        }

        /* заголовок с облачками */
        .header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 700;
            color: #4a2c1b;
            text-shadow: 6px 6px 0 #fbd26a, 0 8px 16px rgba(251, 210, 106, 0.3);
            letter-spacing: 2px;
            word-break: break-word;
            display: inline-block;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><text x="0" y="15" fill="%23f9a825" opacity="0.2" font-size="16">✦ ✦ ✦</text></svg>') repeat-x bottom;
            padding-bottom: 12px;
        }

        .subhead {
            font-size: 1.2rem;
            color: #6b4a2e;
            background: #ffedd5cc;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 60px;
            margin-top: 4px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 1px 6px #fff6e5;
            border: 2px solid #ffdbb5;
            font-weight: 600;
        }

        .hero-emoji {
            font-size: 3.8rem;
            line-height: 1.2;
            margin-bottom: 6px;
            filter: drop-shadow(0 8px 12px #fbc48a88);
        }

        /* карточки-ссылки */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: 30px 0 20px;
        }

        .card-link {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            padding: 18px 26px;
            border-radius: 80px;
            border: 3px solid #ffffff;
            box-shadow: 0 12px 18px -8px rgba(0, 0, 0, 0.12), 0 0 0 2px #ffe1b3 inset;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            color: #2d1e12;
            font-weight: 600;
            font-size: 1.4rem;
            cursor: pointer;
            position: relative;
        }

        .card-link:hover {
            transform: scale(1.02) translateY(-4px);
            background: #fffbf2;
            box-shadow: 0 20px 28px -10px #dba57a, 0 0 0 4px #ffc489 inset;
            border-color: #ffbc7a;
        }

        .card-link:active {
            transform: scale(0.97);
            transition-duration: 0.08s;
        }

        .card-icon {
            font-size: 3.2rem;
            line-height: 1;
            flex-shrink: 0;
            width: 70px;
            text-align: center;
            filter: drop-shadow(0 4px 6px #d9a77e66);
        }

        .card-text {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
            flex: 1;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #3d281b;
            letter-spacing: 0.5px;
        }

        .card-desc {
            font-size: 1rem;
            font-weight: 400;
            color: #6b4f38;
            opacity: 0.9;
            margin-top: 2px;
        }

        .badge-new {
            background: #ffb882;
            color: #2f1b0d;
            padding: 0 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 2px solid #fce3c6;
            display: inline-block;
            line-height: 1.8;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            align-self: center;
            margin-left: auto;
        }

        /* декоративные кнопки / призыв */
        .fun-zone {
            margin: 32px 0 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px 20px;
        }

        .fun-tag {
            background: #fce2c1;
            padding: 12px 28px;
            border-radius: 60px;
            border: 3px dashed #cf9f78;
            color: #4b2e1a;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 2px 6px #fff1dd;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 1.1rem;
            text-align: center;
            color: #634b33;
            background: #f6dfca;
            padding: 12px 22px;
            border-radius: 60px;
            border: 2px solid #fae6d2;
            display: inline-block;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 12px #dbbd9e55;
        }

        .footer-note span {
            font-size: 1.6rem;
            vertical-align: middle;
            margin: 0 6px;
        }

        /* адаптив */
        @media (max-width: 550px) {
            .page-wrapper {
                padding: 20px 15px 28px;
                border-radius: 48px 48px 32px 32px;
            }

            .header h1 {
                font-size: 2.6rem;
            }

            .card-link {
                padding: 14px 18px;
                gap: 12px;
                border-radius: 50px;
                font-size: 1.2rem;
            }

            .card-icon {
                font-size: 2.8rem;
                width: 56px;
            }

            .card-title {
                font-size: 1.3rem;
            }

            .card-desc {
                font-size: 0.9rem;
            }

            .badge-new {
                font-size: 0.75rem;
                padding: 0 12px;
                line-height: 1.6;
            }

            .fun-tag {
                font-size: 0.95rem;
                padding: 8px 18px;
            }

            .footer-note {
                font-size: 0.95rem;
                padding: 10px 16px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 2.2rem;
            }

            .card-icon {
                font-size: 2.4rem;
                width: 44px;
            }
        }

        /* бонус — радужные полоски */
        .rainbow-line {
            width: 80%;
            height: 6px;
            margin: 12px auto 10px;
            background: linear-gradient(90deg, #f9d976, #f39c6d, #e8736b, #b78bcf, #7ec8e0, #6fc1b0, #f9d976);
            background-size: 200% 100%;
            border-radius: 20px;
            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        /* Стили для оверлея перехода */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a12;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        .transition-topbar {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(16, 16, 30, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            gap: 12px;
            flex-shrink: 0;
            min-height: 56px;
        }

        .transition-back {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #e2e8f0;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 500;
            white-space: nowrap;
        }

        .transition-back:hover {
            background: rgba(255,255,255,0.16);
            transform: scale(1.02);
        }

        .transition-title {
            color: #94a3b8;
            font-size: 14px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .transition-iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #ffffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Стили для сообщения о скачивании */
        .download-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 16, 30, 0.95);
            backdrop-filter: blur(12px);
            color: white;
            padding: 16px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 9999999;
            font-size: 16px;
            font-family: inherit;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .download-notification.success {
            border-color: #00b894;
            background: rgba(0, 184, 148, 0.2);
        }

        .download-notification.error {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.2);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="header">
            <div class="hero-emoji">🎨🧸✨</div>
            <h1>Детская площадка</h1>
            <div class="subhead">Рисуй, твори, веселись!</div>
            <div class="rainbow-line"></div>
        </div>

        <!-- Ссылки на игры / развлечения -->
        <div class="card-grid">
            <!-- Суперрисовалка -->
            <div class="card-link" onclick="openGame('https://2d3t.github.io/2d3t/pro/Games/SuperPaint/index.html', '🖌️ Суперрисовалка')">
                <div class="card-icon">🖌️</div>
                <div class="card-text">
                    <span class="card-title">Супер Рисовалка</span>
                    <span class="card-desc">🎉 кисти, краски, волшебство</span>
                </div>
                <span class="badge-new">рисовать</span>
            </div>

            <!-- Раскраска -->
            <div class="card-link" onclick="openGame('https://2d3t.github.io/2d3t/pro/Games/PaintPro/index.html', '🖍️ Раскраска')">
                <div class="card-icon">🖍️</div>

        <!-- Бонус: весёлые теги / атмосфера -->

            <span class="fun-tag">🧩 креатив</span>

        <!-- подвал с пожеланием -->
        <div style="text-align: center; margin-top: 6px;">
            <div class="footer-note">
                <span>👧👦</span>  Нажми на карточку — и начнётся приключение!  <span>🚀</span>
            </div>
            <div style="margin-top: 16px; font-size: 0.9rem; color: #9a7b61; letter-spacing: 0.3px; background: #ffebd6aa; display: inline-block; padding: 6px 28px; border-radius: 60px; backdrop-filter: blur(2px);">
                ⭐  сделано с любовью к детям  ⭐
            </div>

<script>
(function() {
    "use strict";

    // ============================================================
    // УНИВЕРСАЛЬНАЯ ФУНКЦИЯ ОТКРЫТИЯ ИГР (БЕЗ АДРЕСНОЙ СТРОКИ)
    // ============================================================
    function openGame(url, title) {
        // Удаляем старый оверлей, если есть
        const oldOverlay = document.querySelector('.transition-overlay');
        if (oldOverlay) {
            oldOverlay.remove();
        }

        // Создаём оверлей
        const overlay = document.createElement('div');
        overlay.className = 'transition-overlay';

        // Верхняя панель
        const topBar = document.createElement('div');
        topBar.className = 'transition-topbar';

        // Кнопка "Назад"
        const backBtn = document.createElement('button');
        backBtn.className = 'transition-back';
        backBtn.textContent = '← Назад';
        backBtn.onclick = function() {
            overlay.remove();
        };

        // Заголовок
        const titleEl = document.createElement('span');
        titleEl.className = 'transition-title';
        titleEl.textContent = title || '🌐 Загрузка...';

        topBar.appendChild(backBtn);
        topBar.appendChild(titleEl);
        overlay.appendChild(topBar);

        // Iframe
        const iframe = document.createElement('iframe');
        iframe.className = 'transition-iframe';
        iframe.src = url;
        iframe.allow = 'camera; microphone; payment; fullscreen; geolocation; downloads';
        iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-presentation allow-downloads';

        overlay.appendChild(iframe);
        document.body.appendChild(overlay);

        // Обработка Escape
        const escapeHandler = function(e) {
            if (e.key === 'Escape') {
                overlay.remove();
                document.removeEventListener('keydown', escapeHandler);
            }
        };
        document.addEventListener('keydown', escapeHandler);

        // Обновляем заголовок при загрузке iframe
        iframe.onload = function() {
            try {
                const frameTitle = iframe.contentDocument?.title;
                if (frameTitle && frameTitle !== '' && frameTitle !== 'Загрузка...') {
                    titleEl.textContent = frameTitle;
                }
            } catch (e) {
                // Игнорируем CORS ошибки
            }
        };

        // Добавляем обработчик клика на оверлей (закрытие по клику вне iframe)
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                overlay.remove();
            }
        });

        // ============================================================
        // ПЕРЕХВАТ СООБЩЕНИЙ ОТ IFRAME ДЛЯ СКАЧИВАНИЯ
        // ============================================================
        window.addEventListener('message', function(event) {
            // Проверяем, что сообщение от нашего iframe
            if (event.source !== iframe.contentWindow) return;

            const data = event.data;
            
            // Обработка команды скачивания
            if (data && data.type === 'download') {
                handleDownload(data.content, data.filename, data.mimeType);
            }
        });

        return overlay;
    }

    // ============================================================
    // ФУНКЦИЯ ДЛЯ СКАЧИВАНИЯ ФАЙЛОВ
    // ============================================================
    function handleDownload(content, filename, mimeType) {
        try {
            // Если content - это URL (для скачивания по ссылке)
            if (typeof content === 'string' && content.startsWith('http')) {
                // Открываем в новой вкладке (для скачивания)
                const a = document.createElement('a');
                a.href = content;
                a.download = filename || 'download';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showNotification('✅ Скачивание началось!', 'success');
                return;
            }

            // Если content - это данные для Blob
            let blob;
            if (typeof content === 'string') {
                blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
            } else if (content instanceof Blob) {
                blob = content;
            } else {
                throw new Error('Неподдерживаемый формат данных');
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            setTimeout(function() {
                URL.revokeObjectURL(url);
            }, 5000);

            showNotification('✅ Файл "' + (filename || 'download') + '" сохранён!', 'success');
        } catch (error) {
            console.error('Ошибка скачивания:', error);
            showNotification('❌ Ошибка скачивания: ' + error.message, 'error');
        }
    }

    // ============================================================
    // УВЕДОМЛЕНИЕ О СКАЧИВАНИИ
    // ============================================================
    function showNotification(message, type) {
        const old = document.querySelector('.download-notification');
        if (old) old.remove();

        const notification = document.createElement('div');
        notification.className = 'download-notification ' + (type || '');
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(function() {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s';
            setTimeout(function() {
                notification.remove();
            }, 500);
        }, 3000);
    }

    // Делаем функции глобальными
    window.openGame = openGame;
    window.handleDownload = handleDownload;
    window.showNotification = showNotification;

    // ============================================================
    // ОФЛАЙН-ФУНКЦИОНАЛ
    // ============================================================

    function registerSW() {
        if (!('serviceWorker' in navigator)) {
            console.warn('[SW] ❌ Service Worker не поддерживается');
            return;
        }

        navigator.serviceWorker.getRegistration()
            .then(function(registration) {
                if (registration) {
                    console.log('[SW] ✅ Уже зарегистрирован:', registration);
                    return;
                }

                navigator.serviceWorker.register('sw.js')
                    .then(function(reg) {
                        console.log('[SW] ✅ Зарегистрирован:', reg);
                    })
                    .catch(function(err) {
                        console.error('[SW] ❌ Ошибка:', err);
                    });
            })
            .catch(function(err) {
                console.error('[SW] ❌ Ошибка проверки:', err);
            });
    }

    function checkNetwork() {
        const status = navigator.onLine ? 'Онлайн' : 'Офлайн (из кэша)';
        console.log('📡 ' + status);
    }

    function setupNetworkListeners() {
        window.addEventListener('online', function() {
            console.log('📡 Сеть восстановлена');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready
                    .then(function(registration) {
                        registration.update();
                        console.log('[SW] 🔄 Проверка обновлений...');
                    })
                    .catch(function() {});
            }
        });

        window.addEventListener('offline', function() {
            console.log('📡 Сеть отключена (работаем из кэша)');
        });
    }

    function init() {
        registerSW();
        checkNetwork();
        setupNetworkListeners();
        console.log('[APP] ✅ Офлайн-функционал активирован');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>




<script>
// ============================================================
// АВТОМАТИЧЕСКОЕ КЕШИРОВАНИЕ + ПРЕДЗАГРУЗКА ИГР
// ============================================================
(function() {
    "use strict";

    console.log('[APP] 🔄 Запуск AutoCache...');

    // ============================================================
    // 1. РЕГИСТРАЦИЯ SERVICE WORKER
    // ============================================================
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistration()
            .then(registration => {
                if (registration) {
                    console.log('[APP] ✅ SW уже зарегистрирован');
                    return registration;
                }
                return navigator.serviceWorker.register('/2d3t/pro/Games/sw.js', {
                    scope: '/2d3t/pro/Games/'
                });
            })
            .then(reg => {
                console.log('[APP] ✅ SW зарегистрирован:', reg);
            })
            .catch(err => {
                console.warn('[APP] ❌ Ошибка регистрации SW:', err);
            });
    }

    // ============================================================
    // 2. СПИСОК ИГР ДЛЯ ПРЕДЗАГРУЗКИ
    // ============================================================
    const GAMES_TO_PRECACHE = [
        'https://2d3t.github.io/2d3t/pro/Games/SuperPaint/index.html',


'https://2d3t.github.io/2d3t/pro/Games/SuperPaint/gif.js',

'https://2d3t.github.io/2d3t/pro/Games/SuperPaint/gif.worker.js',
        'https://2d3t.github.io/2d3t/pro/Games/PaintPro/index.html'
        // Добавьте сюда другие игры, если есть
    ];

    const CACHE_NAME = 'games-pwa-v2';

    // ============================================================
    // 3. ФУНКЦИЯ КЕШИРОВАНИЯ С ОЖИДАНИЕМ
    // ============================================================
    async function cacheUrl(url, retries = 3) {
        if (!('caches' in window)) return false;
        
        for (let attempt = 1; attempt <= retries; attempt++) {
            try {
                console.log(`[APP] 📥 Попытка ${attempt}/${retries}: ${url}`);
                
                const response = await fetch(url, {
                    mode: 'cors',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                
                if (response && response.ok) {
                    const cache = await caches.open(CACHE_NAME);
                    await cache.put(url, response);
                    console.log(`[APP] ✅ Закешировано: ${url}`);
                    return true;
                }
            } catch (error) {
                console.warn(`[APP] ⚠️ Ошибка (${attempt}/${retries}):`, error.message);
                if (attempt < retries) {
                    await new Promise(r => setTimeout(r, 2000 * attempt));
                }
            }
        }
        return false;
    }

    // ============================================================
    // 4. ПРЕДЗАГРУЗКА ВСЕХ ИГР
    // ============================================================
    async function precacheAllGames() {
        console.log('[APP] 🚀 Начинаем предзагрузку игр...');
        
        if (!navigator.onLine) {
            console.warn('[APP] ⚠️ Нет интернета, предзагрузка невозможна');
            return;
        }

        let successCount = 0;
        for (const gameUrl of GAMES_TO_PRECACHE) {
            if (await cacheUrl(gameUrl, 3)) {
                successCount++;
            }
            await new Promise(r => setTimeout(r, 1000));
        }
        
        console.log(`[APP] ✅ Предзагружено ${successCount}/${GAMES_TO_PRECACHE.length} игр`);
        
        if (successCount === GAMES_TO_PRECACHE.length) {
            console.log('[APP] 🎉 Все игры готовы к офлайн-работе!');
        } else {
            console.warn('[APP] ⚠️ Некоторые игры не загрузились, попробуйте обновить страницу');
        }
    }

    // ============================================================
    // 5. ФУНКЦИЯ УВЕДОМЛЕНИЙ УДАЛЕНА - только логи в консоль
    // ============================================================

    // ============================================================
    // 6. АВТОМАТИЧЕСКОЕ КЕШИРОВАНИЕ ВСЕХ ССЫЛОК
    // ============================================================
    async function cacheAllLinks() {
        if (!('caches' in window)) return;
        
        const links = document.querySelectorAll('a[href]');
        const urls = new Set();
        
        links.forEach(link => {
            const href = link.href;
            if (href && href.startsWith(window.location.origin)) {
                if (!href.includes('#') && 
                    !href.includes('mailto:') && 
                    !href.includes('tel:') &&
                    !href.includes('javascript:')) {
                    urls.add(href);
                }
            }
        });

        let count = 0;
        for (const url of urls) {
            if (await cacheUrl(url, 2)) {
                count++;
                await new Promise(r => setTimeout(r, 200));
            }
        }
        
        if (count > 0) {
            console.log(`[APP] ✅ Закешировано ${count} страниц со ссылок`);
        }
    }

    // ============================================================
    // 7. ЗАПУСК - ПРИОРИТЕТ: СНАЧАЛА ИГРЫ, ПОТОМ ВСЁ ОСТАЛЬНОЕ
    // ============================================================
    
    window.addEventListener('load', () => {
        console.log('[APP] 📄 Страница загружена');
        
        setTimeout(precacheAllGames, 1000);
        
        setTimeout(() => {
            cacheUrl(window.location.href, 2);
        }, 3000);
        
        setTimeout(cacheAllLinks, 5000);
    });

    // ============================================================
    // 8. МОНИТОРИНГ НОВЫХ ССЫЛОК
    // ============================================================
    if (window.MutationObserver) {
        let observerTimeout;
        const observer = new MutationObserver(() => {
            clearTimeout(observerTimeout);
            observerTimeout = setTimeout(() => {
                console.log('[APP] 🔄 Обнаружены изменения, проверяем новые ссылки...');
                cacheAllLinks();
            }, 2000);
        });
        
        setTimeout(() => {
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        }, 5000);
    }

    // ============================================================
    // 9. ПРЕДЗАГРУЗКА ПРИ НАВЕДЕНИИ
    // ============================================================
    let hoverTimeout;
    document.addEventListener('mouseover', (event) => {
        const link = event.target.closest('a[href]');
        if (link && link.href && link.href.startsWith(window.location.origin)) {
            if (!link.href.includes('#') && 
                !link.href.includes('mailto:') && 
                !link.href.includes('tel:')) {
                clearTimeout(hoverTimeout);
                hoverTimeout = setTimeout(() => {
                    cacheUrl(link.href, 2);
                }, 500);
            }
        }
    });

    // ============================================================
    // 10. ДОСТУП В КОНСОЛИ
    // ============================================================
    window.precacheAllGames = precacheAllGames;
    window.cacheAll = cacheAllLinks;
    window.cacheUrl = cacheUrl;
    window.cacheStatus = async function() {
        const cache = await caches.open(CACHE_NAME);
        const keys = await cache.keys();
        console.log(`📦 В кеше ${keys.length} файлов:`);
        keys.forEach(req => console.log(`  - ${req.url}`));
        
        const gameUrls = GAMES_TO_PRECACHE;
        let found = 0;
        for (const url of gameUrls) {
            const response = await cache.match(url);
            if (response) {
                console.log(`  ✅ Игра в кеше: ${url}`);
                found++;
            } else {
                console.log(`  ❌ Игра НЕ в кеше: ${url}`);
            }
        }
        console.log(`📊 Игр в кеше: ${found}/${gameUrls.length}`);
    };

    console.log('[APP] ✅ AutoCache инициализирован');
    console.log('[APP] 💡 Доступные команды:');
    console.log('  precacheAllGames() - предзагрузить ВСЕ игры');
    console.log('  cacheAll() - кешировать все ссылки');
    console.log('  cacheStatus() - проверить кеш');
    console.log('  cacheUrl("url") - кешировать конкретный URL');

})();
</script>
</body>
</html>
