<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">

<link rel="manifest" href="manifest.json">
    
    <!-- Ваши иконки -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

    <title>🌈 Детский мир творчества</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background: linear-gradient(145deg, #f9f3e6 0%, #ffe9d6 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .page-wrapper {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 248, 235, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 72px 72px 48px 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 6px 12px rgba(0, 0, 0, 0.05);
            padding: 30px 25px 40px;
            border: 3px solid #ffffff88;
            transition: all 0.2s ease;
        }

        /* заголовок с облачками */
        .header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .header h1 {
            font-size: 3.2rem;
            font-weight: 700;
            color: #4a2c1b;
            text-shadow: 6px 6px 0 #fbd26a, 0 8px 16px rgba(251, 210, 106, 0.3);
            letter-spacing: 2px;
            word-break: break-word;
            display: inline-block;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><text x="0" y="15" fill="%23f9a825" opacity="0.2" font-size="16">✦ ✦ ✦</text></svg>') repeat-x bottom;
            padding-bottom: 12px;
        }

        .subhead {
            font-size: 1.2rem;
            color: #6b4a2e;
            background: #ffedd5cc;
            display: inline-block;
            padding: 8px 28px;
            border-radius: 60px;
            margin-top: 4px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 1px 6px #fff6e5;
            border: 2px solid #ffdbb5;
            font-weight: 600;
        }

        .hero-emoji {
            font-size: 3.8rem;
            line-height: 1.2;
            margin-bottom: 6px;
            filter: drop-shadow(0 8px 12px #fbc48a88);
        }

        /* карточки-ссылки */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: 30px 0 20px;
        }

        .card-link {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            padding: 18px 26px;
            border-radius: 80px;
            border: 3px solid #ffffff;
            box-shadow: 0 12px 18px -8px rgba(0, 0, 0, 0.12), 0 0 0 2px #ffe1b3 inset;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            color: #2d1e12;
            font-weight: 600;
            font-size: 1.4rem;
            cursor: pointer;
        }

        .card-link:hover {
            transform: scale(1.02) translateY(-4px);
            background: #fffbf2;
            box-shadow: 0 20px 28px -10px #dba57a, 0 0 0 4px #ffc489 inset;
            border-color: #ffbc7a;
        }

        .card-link:active {
            transform: scale(0.97);
            transition-duration: 0.08s;
        }

        .card-icon {
            font-size: 3.2rem;
            line-height: 1;
            flex-shrink: 0;
            width: 70px;
            text-align: center;
            filter: drop-shadow(0 4px 6px #d9a77e66);
        }

        .card-text {
            display: flex;
            flex-direction: column;
            line-height: 1.3;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #3d281b;
            letter-spacing: 0.5px;
        }

        .card-desc {
            font-size: 1rem;
            font-weight: 400;
            color: #6b4f38;
            opacity: 0.9;
            margin-top: 2px;
        }

        .badge-new {
            background: #ffb882;
            color: #2f1b0d;
            padding: 0 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-left: 10px;
            border: 2px solid #fce3c6;
            display: inline-block;
            line-height: 1.8;
            letter-spacing: 0.3px;
        }

        /* декоративные кнопки / призыв */
        .fun-zone {
            margin: 32px 0 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px 20px;
        }

        .fun-tag {
            background: #fce2c1;
            padding: 12px 28px;
            border-radius: 60px;
            border: 3px dashed #cf9f78;
            color: #4b2e1a;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 2px 6px #fff1dd;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 1.1rem;
            text-align: center;
            color: #634b33;
            background: #f6dfca;
            padding: 12px 22px;
            border-radius: 60px;
            border: 2px solid #fae6d2;
            display: inline-block;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 12px #dbbd9e55;
        }

        .footer-note span {
            font-size: 1.6rem;
            vertical-align: middle;
            margin: 0 6px;
        }

        /* адаптив */
        @media (max-width: 550px) {
            .page-wrapper {
                padding: 20px 15px 28px;
                border-radius: 48px 48px 32px 32px;
            }

            .header h1 {
                font-size: 2.6rem;
            }

            .card-link {
                padding: 14px 18px;
                gap: 12px;
                border-radius: 50px;
                font-size: 1.2rem;
            }

            .card-icon {
                font-size: 2.8rem;
                width: 56px;
            }

            .card-title {
                font-size: 1.3rem;
            }

            .card-desc {
                font-size: 0.9rem;
            }

            .fun-tag {
                font-size: 0.95rem;
                padding: 8px 18px;
            }

            .footer-note {
                font-size: 0.95rem;
                padding: 10px 16px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 2.2rem;
            }

            .card-icon {
                font-size: 2.4rem;
                width: 44px;
            }
        }

        /* бонус — радужные полоски */
        .rainbow-line {
            width: 80%;
            height: 6px;
            margin: 12px auto 10px;
            background: linear-gradient(90deg, #f9d976, #f39c6d, #e8736b, #b78bcf, #7ec8e0, #6fc1b0, #f9d976);
            background-size: 200% 100%;
            border-radius: 20px;
            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="header">
            <div class="hero-emoji">🎨🧸✨</div>
            <h1>Детская площадка</h1>
            <div class="subhead">Рисуй, твори, веселись!</div>
            <div class="rainbow-line"></div>
        </div>

        <!-- Ссылки на игры / развлечения -->
        <div class="card-grid">
            <!-- Суперрисовалка -->
            <a href="https://2d3t.github.io/2d3t/pro/Games/SuperPaint/index.html" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="card-link" 
               aria-label="Суперрисовалка – рисуй как художник">
                <div class="card-icon">🖌️</div>
                <div class="card-text">
                    <span class="card-title">Суперрисовалка</span>
                    <span class="card-desc">🎉 кисти, краски, волшебство</span>
                </div>
                <span class="badge-new">рисовать</span>
            </a>

            <!-- Раскраска -->
            <a href="https://2d3t.github.io/2d3t/pro/Games/PaintPro/index.html" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="card-link" 
               aria-label="Раскраска – оживи картинки цветом">
                <div class="card-icon">🖍️</div>
                <div class="card-text">
                    <span class="card-title">Раскраска</span>
                    <span class="card-desc">🌈 раскрась свой мир</span>
                </div>
                <span class="badge-new">раскрасить</span>
            </a>
        </div>

        <!-- Бонус: весёлые теги / атмосфера -->
        <div class="fun-zone">
            <span class="fun-tag">🧩 креатив</span>
            <span class="fun-tag">🎈 для детей</span>
            <span class="fun-tag">🌟 без рекламы</span>
        </div>

        <!-- подвал с пожеланием -->
        <div style="text-align: center; margin-top: 6px;">
            <div class="footer-note">
                <span>👧👦</span>  Нажми на карточку — и начнётся приключение!  <span>🚀</span>
            </div>
            <div style="margin-top: 16px; font-size: 0.9rem; color: #9a7b61; letter-spacing: 0.3px; background: #ffebd6aa; display: inline-block; padding: 6px 28px; border-radius: 60px; backdrop-filter: blur(2px);">
                ⭐  сделано с любовью к детям  ⭐
            </div>
        </div>
    </div>



<script>
(function() {
    "use strict";

    // ============================================================
    // УНИВЕРСАЛЬНЫЙ ОФЛАЙН-БЛОК
    // - Работает с любым существующим manifest.json
    // - Работает с любым существующим sw.js
    // - Не создаёт конфликтов
    // - Просто дублирует регистрацию SW (безопасно)
    // ============================================================

    // ---------- 1. Регистрация Service Worker (если ещё не зарегистрирован) ----------
    function registerSW() {
        if (!('serviceWorker' in navigator)) {
            console.warn('[SW] ❌ Service Worker не поддерживается');
            return;
        }

        // Проверяем, не зарегистрирован ли уже SW
        navigator.serviceWorker.getRegistration()
            .then((registration) => {
                if (registration) {
                    console.log('[SW] ✅ Уже зарегистрирован:', registration);
                    return;
                }

                // Если не зарегистрирован — регистрируем
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => {
                        console.log('[SW] ✅ Зарегистрирован:', reg);
                    })
                    .catch((err) => {
                        console.error('[SW] ❌ Ошибка:', err);
                    });
            })
            .catch((err) => {
                console.error('[SW] ❌ Ошибка проверки:', err);
            });
    }

    // ---------- 2. Проверка сети (без индикаторов) ----------
    function checkNetwork() {
        const status = navigator.onLine ? 'Онлайн' : 'Офлайн (из кэша)';
        console.log(`📡 ${status}`);
    }

    // ---------- 3. Обработка событий сети ----------
    function setupNetworkListeners() {
        window.addEventListener('online', () => {
            console.log('📡 Сеть восстановлена');
            
            // Обновляем SW при появлении сети
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready
                    .then((registration) => {
                        registration.update();
                        console.log('[SW] 🔄 Проверка обновлений...');
                    })
                    .catch(() => {});
            }
        });

        window.addEventListener('offline', () => {
            console.log('📡 Сеть отключена (работаем из кэша)');
        });
    }

    // ---------- 4. Инициализация ----------
    function init() {
        registerSW();
        checkNetwork();
        setupNetworkListeners();
        console.log('[APP] ✅ Офлайн-функционал активирован');
    }

    // Запускаем
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

})();
</script>

</body>
</html>
