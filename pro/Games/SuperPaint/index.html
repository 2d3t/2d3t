<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <title>🌈 Радужный рисователь → GIF | Живая анимация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #f7efe4 0%, #fae6d8 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-container {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            background: rgba(255, 248, 240, 0.8);
            backdrop-filter: blur(6px);
            border-radius: 72px 72px 48px 48px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2), inset 0 0 0 2px #fff6e5;
            overflow: hidden;
            padding: 12px 12px 16px;
        }

        .header {
            padding: 12px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 3px dashed #fad6b3;
            margin-bottom: 8px;
        }

        .title h1 {
            font-size: 2.0rem;
            font-weight: 700;
            color: #3d281b;
            text-shadow: 4px 4px 0 #fbd26a, 0 8px 16px rgba(251, 210, 106, 0.2);
            letter-spacing: 1px;
        }

        .title p {
            color: #7a5f48;
            font-size: 0.9rem;
            font-weight: 600;
            background: #ffedd5cc;
            padding: 2px 18px;
            border-radius: 40px;
            display: inline-block;
            backdrop-filter: blur(2px);
            border: 2px solid #ffdbb5;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: #ffffffdd;
            backdrop-filter: blur(4px);
            border: 3px solid #ffffff;
            color: #2d1e12;
            font-size: 1.0rem;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.08), inset 0 1px 6px #fff6e5;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.94);
        }

        .btn-reset {
            background: #ffded6;
            border-color: #ffb7a5;
            color: #5a2c1f;
        }

        .btn-reset:hover {
            background: #ffcbbc;
            transform: scale(1.02);
        }

        .btn-gif {
            background: linear-gradient(145deg, #b8e0d6, #8fcbc0);
            border-color: #9ed9cd;
            color: #1a3d35;
        }

        .btn-gif:hover {
            background: linear-gradient(145deg, #c5efe3, #9ed9cd);
            transform: scale(1.02);
        }

        .brush-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f6ede3cc;
            backdrop-filter: blur(4px);
            padding: 4px 18px 4px 22px;
            border-radius: 60px;
            border: 3px solid #ffddc0;
            box-shadow: inset 0 1px 6px #fff6e5;
        }

        .brush-control label {
            font-weight: 700;
            color: #4d3422;
            font-size: 1.0rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brush-control input[type="range"] {
            width: 120px;
            height: 6px;
            -webkit-appearance: none;
            background: #dcc4b0;
            border-radius: 20px;
            outline: none;
        }

        .brush-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #ffb27f;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.1s;
        }

        .brush-control input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #ff9f64;
        }

        #brushSizeValue {
            min-width: 32px;
            font-weight: 700;
            color: #3d281b;
            background: #fae2cd;
            padding: 2px 10px;
            border-radius: 40px;
            text-align: center;
            border: 2px solid #fccfaf;
        }

        .canvas-area {
            flex: 1;
            background: #121212;
            margin: 6px 8px 8px 8px;
            border-radius: 48px;
            overflow: hidden;
            position: relative;
            min-height: 0;
            border: 6px solid #fae2cd;
            box-shadow: inset 0 0 0 3px #ffffff, 0 12px 24px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0f0f12;
            cursor: crosshair;
            touch-action: none;
        }

        .status-msg {
            font-size: 1.0rem;
            background: #ffedd5cc;
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 12px 22px;
            text-align: center;
            color: #4a3424;
            margin: 8px 12px 4px 12px;
            font-weight: 600;
            border: 3px solid #ffdbb5;
            box-shadow: inset 0 1px 6px #fff6e5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 20, 15, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fffaf2;
            backdrop-filter: blur(8px);
            border-radius: 72px 72px 48px 48px;
            max-width: 520px;
            width: 92%;
            padding: 28px 30px 32px;
            border: 4px solid #ffffffdd;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            color: #3d281b;
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 2px 2px 0 #fbd26a;
            letter-spacing: 0.5px;
        }

        .close-modal {
            background: #ffd6c7;
            border: 3px solid #ffffff;
            font-size: 1.4rem;
            padding: 4px 16px;
            border-radius: 60px;
            color: #4a2c1b;
            font-weight: 700;
            line-height: 1.4;
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: flex;
            justify-content: space-between;
            font-size: 1.0rem;
            font-weight: 600;
            color: #4d3422;
            margin-bottom: 6px;
        }

        .setting-item label span:last-child {
            background: #fae2cd;
            padding: 0 16px;
            border-radius: 40px;
            border: 2px solid #fccfaf;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #dcc4b0;
            border-radius: 20px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #ffb27f;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        .modal-buttons {
            display: flex;
            gap: 14px;
            margin-top: 28px;
        }

        .modal-buttons button {
            flex: 1;
            justify-content: center;
        }

        .btn-generate {
            background: linear-gradient(145deg, #b8e0d6, #8fcbc0);
            border-color: #9ed9cd;
            color: #1a3d35;
        }

        .btn-generate:hover {
            background: linear-gradient(145deg, #c5efe3, #9ed9cd);
            transform: scale(1.02);
        }

        .progress-area {
            background: #f6ede3cc;
            border-radius: 48px;
            padding: 16px;
            margin-top: 16px;
            backdrop-filter: blur(4px);
            border: 3px solid #ffddc0;
        }

        .progress-bar-container {
            background: #dcc4b0;
            border-radius: 40px;
            height: 28px;
            overflow: hidden;
            margin: 8px 0;
            border: 2px solid #fff6e5;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f9b27a, #e8736b);
            border-radius: 40px;
            transition: width 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .progress-text {
            font-size: 0.95rem;
            color: #4d3422;
            text-align: center;
            font-weight: 600;
        }

        .gif-result {
            background: #f6ede3cc;
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
            border: 3px solid #ffddc0;
        }

        .gif-result img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 32px;
            background: #0f0f12;
            border: 4px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .recording-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a2e;
            backdrop-filter: blur(12px);
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            display: none;
            align-items: center;
            gap: 14px;
            z-index: 100;
            white-space: nowrap;
            border: 3px solid #fad6b3;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }

        .recording-dot {
            width: 16px;
            height: 16px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: pulse 1s infinite;
            border: 2px solid white;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 700px) {
            body { padding: 8px; }
            .app-container { height: calc(100vh - 16px); padding: 8px; }
            .header { padding: 8px 12px; }
            button { padding: 8px 16px; font-size: 0.9rem; }
            .title h1 { font-size: 1.6rem; }
            .title p { font-size: 0.7rem; padding: 0 12px; }
            .brush-control { padding: 2px 12px 2px 16px; gap: 6px; flex-wrap: wrap; }
            .brush-control input[type="range"] { width: 90px; }
            .modal-content { padding: 20px; }
        }

        @media (max-width: 480px) {
            .brush-control input[type="range"] { width: 70px; }
            .toolbar { gap: 6px; }
            button { font-size: 0.8rem; padding: 6px 14px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="title">
            <h1>🌈 Радужный рисователь</h1>
            <p>рисуй пальцем — создавай живые анимации</p>
        </div>
        <div class="toolbar">
            <div class="brush-control">
                <label>🖌️ <span id="brushSizeValue">16</span></label>
                <input type="range" id="brushSizeSlider" min="4" max="40" step="1" value="16">
            </div>
            <button class="btn-reset" id="resetBtn">🗑️ Очистить</button>
            <button class="btn-gif" id="openModalBtn">🎬 GIF</button>
        </div>
    </div>

    <div class="canvas-area">
        <canvas id="rainbowCanvas"></canvas>
    </div>

    <div class="status-msg" id="statusMsg">
        <span>🎨</span> Рисуй! Цвета переливаются в движении <span>✨</span>
    </div>
</div>

<!-- Модальное окно с настройками GIF -->
<div id="gifModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🎬 Создать GIF</h2>
            <button class="close-modal" id="closeModalBtn">✖️</button>
        </div>

        <div class="setting-item">
            <label><span>🎞️ Частота (FPS)</span><span id="fpsValue">10</span></label>
            <input type="range" id="fpsSlider" min="5" max="20" step="1" value="10">
        </div>

        <div class="setting-item">
            <label><span>📏 Ширина (px)</span><span id="widthValue">480</span></label>
            <input type="range" id="widthSlider" min="320" max="640" step="16" value="480">
        </div>

        <div class="setting-item">
            <label><span>🎨 Качество</span><span id="qualityValue">80</span></label>
            <input type="range" id="qualitySlider" min="40" max="100" step="5" value="80">
        </div>

        <div class="setting-item">
            <label><span>⏱️ Длительность (сек)</span><span id="durationValue">3</span></label>
            <input type="range" id="durationSlider" min="2" max="5" step="0.5" value="3">
        </div>

        <div id="modalProgressArea" class="progress-area" style="display: none;">
            <div class="progress-bar-container">
                <div id="modalProgressFill" class="progress-fill" style="width:0%">0%</div>
            </div>
            <div id="modalProgressText" class="progress-text">⚙️ Подготовка...</div>
            <button id="modalCancelBtn" style="margin-top:10px; background:#f5cdc0; border-color:#ffb7a5; color:#4a2c1b;">✖️ Отменить</button>
        </div>

        <div id="modalGifResult" class="gif-result" style="display: none;">
            <img id="modalGifPreview" alt="GIF preview">
            <button id="modalDownloadBtn" class="btn-generate" style="margin-top:14px;">⬇️ Скачать GIF</button>
        </div>

        <div class="modal-buttons">
            <button id="generateGifBtn" class="btn-generate">🎬 Создать</button>
            <button id="cancelModalBtn" style="background:#f5e3d6;">Отмена</button>
        </div>
    </div>
</div>

<div id="recordingIndicator" class="recording-indicator">
    <span class="recording-dot"></span>
    <span>СОЗДАНИЕ GIF...</span>
</div>

<!-- Загружаем библиотеку локально из той же папки -->
<script src="gif.js"></script>
<!-- Если локальная библиотека не загрузилась, пробуем загрузить из CDN -->
<script>
    if (typeof GIF === 'undefined') {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js';
        document.head.appendChild(script);
    }
</script>

<script>
    (function() {
        // -------- КАНВАС И РИСОВАНИЕ --------
        const canvas = document.getElementById('rainbowCanvas');
        let ctx = canvas.getContext('2d');
        let canvasWidth = 800, canvasHeight = 500;
        
        let strokes = [];
        let currentStroke = null;
        let isDrawing = false;
        let lineWidth = 16;
        const RAINBOW_SPEED = 1.5;
        
        // DOM элементы
        const resetBtn = document.getElementById('resetBtn');
        const openModalBtn = document.getElementById('openModalBtn');
        const gifModal = document.getElementById('gifModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const generateGifBtn = document.getElementById('generateGifBtn');
        const statusMsg = document.getElementById('statusMsg');
        const recordingIndicator = document.getElementById('recordingIndicator');
        const brushSizeSlider = document.getElementById('brushSizeSlider');
        const brushSizeValue = document.getElementById('brushSizeValue');
        
        // Элементы внутри модалки
        const fpsSlider = document.getElementById('fpsSlider');
        const fpsValue = document.getElementById('fpsValue');
        const widthSlider = document.getElementById('widthSlider');
        const widthValue = document.getElementById('widthValue');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const durationSlider = document.getElementById('durationSlider');
        const durationValue = document.getElementById('durationValue');
        const modalProgressArea = document.getElementById('modalProgressArea');
        const modalProgressFill = document.getElementById('modalProgressFill');
        const modalProgressText = document.getElementById('modalProgressText');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalGifResult = document.getElementById('modalGifResult');
        const modalGifPreview = document.getElementById('modalGifPreview');
        const modalDownloadBtn = document.getElementById('modalDownloadBtn');
        
        // ----- РЕГУЛЯТОР РАЗМЕРА КИСТИ -----
        brushSizeSlider.addEventListener('input', () => {
            lineWidth = parseInt(brushSizeSlider.value);
            brushSizeValue.textContent = lineWidth;
        });

        // Обновление отображения слайдеров
        fpsSlider.addEventListener('input', () => fpsValue.textContent = fpsSlider.value);
        widthSlider.addEventListener('input', () => widthValue.textContent = widthSlider.value);
        qualitySlider.addEventListener('input', () => qualityValue.textContent = qualitySlider.value);
        durationSlider.addEventListener('input', () => durationValue.textContent = durationSlider.value);
        
        // Открыть/закрыть модалку
        openModalBtn.addEventListener('click', () => {
            gifModal.classList.add('active');
            modalProgressArea.style.display = 'none';
            modalGifResult.style.display = 'none';
        });
        
        function closeModal() {
            gifModal.classList.remove('active');
        }
        
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        gifModal.addEventListener('click', (e) => {
            if (e.target === gifModal) closeModal();
        });
        
        // ---------- ФУНКЦИИ РИСОВАНИЯ ----------
        function getCurrentHueForStroke(stroke, nowSec) {
            const elapsed = nowSec - stroke.startTimeSec;
            let hue = (elapsed * RAINBOW_SPEED * 60) % 360;
            if (hue < 0) hue += 360;
            return hue;
        }
        
        function getRainbowColor(hue) {
            return `hsl(${hue}, 100%, 65%)`;
        }
        
        function redrawAllStrokes() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);
            ctx.fillStyle = '#0f0f12';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            const nowSec = performance.now() / 1000;
            
            for (let s of strokes) {
                drawStroke(ctx, s, nowSec);
            }
            
            if (currentStroke && currentStroke.points && currentStroke.points.length >= 2) {
                drawStroke(ctx, currentStroke, nowSec);
            } else if (currentStroke && currentStroke.points && currentStroke.points.length === 1) {
                const hue = getCurrentHueForStroke(currentStroke, nowSec);
                ctx.beginPath();
                ctx.fillStyle = getRainbowColor(hue);
                const radius = (currentStroke.lineWidth || lineWidth) * 0.5;
                const p = currentStroke.points[0];
                ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
                ctx.fill();
            }
        }
        
        function drawStroke(context, stroke, nowSec) {
            if (!stroke.points || stroke.points.length === 0) return;
            
            const hue = getCurrentHueForStroke(stroke, nowSec);
            context.beginPath();
            context.strokeStyle = getRainbowColor(hue);
            context.lineWidth = stroke.lineWidth || lineWidth;
            context.lineCap = 'round';
            context.lineJoin = 'round';
            
            if (stroke.points.length === 1) {
                context.fillStyle = getRainbowColor(hue);
                const radius = (stroke.lineWidth || lineWidth) * 0.5;
                const p = stroke.points[0];
                context.arc(p.x, p.y, radius, 0, Math.PI*2);
                context.fill();
                return;
            }
            
            context.moveTo(stroke.points[0].x, stroke.points[0].y);
            for (let i = 1; i < stroke.points.length; i++) {
                context.lineTo(stroke.points[i].x, stroke.points[i].y);
            }
            context.stroke();
        }
        
        function finishCurrentStroke() {
            if (currentStroke && currentStroke.points && currentStroke.points.length >= 1) {
                strokes.push(currentStroke);
            }
            currentStroke = null;
            isDrawing = false;
        }
        
        function startStroke(x, y, timestampMs) {
            if (currentStroke) finishCurrentStroke();
            const nowSec = timestampMs / 1000;
            currentStroke = {
                points: [{ x: x, y: y }],
                startTimeSec: nowSec,
                lineWidth: lineWidth
            };
            isDrawing = true;
            redrawAllStrokes();
        }
        
        function addPointToStroke(x, y) {
            if (!isDrawing || !currentStroke) return;
            const lastPoint = currentStroke.points[currentStroke.points.length - 1];
            const distance = Math.hypot(lastPoint.x - x, lastPoint.y - y);
            if (distance > 2.0) {
                currentStroke.points.push({ x: x, y: y });
            } else if (distance > 0.5) {
                currentStroke.points.push({ x: x, y: y });
            }
        }
        
        function resetCanvas() {
            strokes = [];
            if (currentStroke) currentStroke = null;
            isDrawing = false;
            ctx.fillStyle = '#0f0f12';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            statusMsg.innerHTML = '🎨 Холст очищен! Рисуй что-нибудь новое ✨';
            modalGifResult.style.display = 'none';
        }
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            canvasWidth = rect.width;
            canvasHeight = rect.height;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f0f12';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            redrawAllStrokes();
        }
        
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX, clientY;
            
            if (e.touches) {
                if (e.touches.length === 0) return null;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            canvasX = Math.min(Math.max(0, canvasX), canvas.width);
            canvasY = Math.min(Math.max(0, canvasY), canvas.height);
            return { x: canvasX, y: canvasY };
        }
        
        // ---------- СОЗДАНИЕ GIF ----------
        let isRecordingGif = false;
        let cancelRequested = false;
        let recordingTimer = null;
        let gifEncoder = null;
        
        // Проверяем доступность библиотеки
        function isGifLibraryAvailable() {
            return typeof GIF !== 'undefined';
        }
        
        async function startGifRecording() {
            if (isRecordingGif) {
                statusMsg.innerHTML = '⏳ Уже идёт создание GIF, подождите...';
                return;
            }
            
            if (strokes.length === 0 && (!currentStroke || currentStroke.points.length === 0)) {
                statusMsg.innerHTML = '🎨 Сначала нарисуйте что-нибудь!';
                return;
            }
            
            if (!isGifLibraryAvailable()) {
                statusMsg.innerHTML = '❌ Библиотека GIF не загружена. Проверьте интернет-соединение.';
                return;
            }
            
            isRecordingGif = true;
            cancelRequested = false;
            modalProgressArea.style.display = 'block';
            modalGifResult.style.display = 'none';
            recordingIndicator.style.display = 'flex';
            statusMsg.innerHTML = '🎬 Создание GIF... Рисунок оживёт!';
            
            const fps = parseInt(fpsSlider.value);
            const targetWidth = parseInt(widthSlider.value);
            const quality = parseInt(qualitySlider.value);
            const durationSec = parseFloat(durationSlider.value);
            
            const originalWidth = canvas.width;
            const originalHeight = canvas.height;
            const targetHeight = Math.floor(targetWidth * (originalHeight / originalWidth));
            
            const totalFrames = Math.floor(durationSec * fps);
            const frameDelay = 1000 / fps;
            
            modalProgressFill.style.width = '0%';
            modalProgressFill.textContent = '0%';
            modalProgressText.textContent = `📸 Съёмка кадров: 0/${totalFrames}`;
            
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = targetWidth;
            captureCanvas.height = targetHeight;
            const captureCtx = captureCanvas.getContext('2d');
            
            const frames = [];
            
            function captureCurrentFrame(timestamp) {
                captureCtx.clearRect(0, 0, targetWidth, targetHeight);
                captureCtx.drawImage(canvas, 0, 0, originalWidth, originalHeight, 0, 0, targetWidth, targetHeight);
                
                if (currentStroke && currentStroke.points && currentStroke.points.length > 0) {
                    const nowSec = timestamp / 1000;
                    captureCtx.save();
                    const hue = getCurrentHueForStroke(currentStroke, nowSec);
                    captureCtx.strokeStyle = getRainbowColor(hue);
                    captureCtx.lineWidth = (currentStroke.lineWidth || lineWidth) * (targetWidth / originalWidth);
                    captureCtx.lineCap = 'round';
                    captureCtx.lineJoin = 'round';
                    
                    if (currentStroke.points.length >= 2) {
                        const scale = targetWidth / originalWidth;
                        captureCtx.beginPath();
                        const first = currentStroke.points[0];
                        captureCtx.moveTo(first.x * scale, first.y * scale);
                        for (let i = 1; i < currentStroke.points.length; i++) {
                            captureCtx.lineTo(currentStroke.points[i].x * scale, currentStroke.points[i].y * scale);
                        }
                        captureCtx.stroke();
                    } else if (currentStroke.points.length === 1) {
                        const scale = targetWidth / originalWidth;
                        captureCtx.beginPath();
                        captureCtx.fillStyle = getRainbowColor(hue);
                        const radius = (currentStroke.lineWidth || lineWidth) * 0.5 * scale;
                        const p = currentStroke.points[0];
                        captureCtx.arc(p.x * scale, p.y * scale, radius, 0, Math.PI*2);
                        captureCtx.fill();
                    }
                    captureCtx.restore();
                }
                
                return captureCtx.getImageData(0, 0, targetWidth, targetHeight);
            }
            
            const startTime = performance.now();
            let frameIndex = 0;
            
            const captureInterval = setInterval(() => {
                if (cancelRequested || frameIndex >= totalFrames) {
                    clearInterval(captureInterval);
                    return;
                }
                
                const now = performance.now();
                const frameData = captureCurrentFrame(now);
                frames.push(frameData);
                frameIndex++;
                
                const percent = Math.floor((frameIndex / totalFrames) * 50);
                modalProgressFill.style.width = percent + '%';
                modalProgressFill.textContent = percent + '%';
                modalProgressText.textContent = `📸 Съёмка кадров: ${frameIndex}/${totalFrames}`;
                
                if (frameIndex >= totalFrames) {
                    clearInterval(captureInterval);
                    renderGifFromFrames(frames, fps, quality, targetWidth, targetHeight);
                }
            }, frameDelay);
            
            recordingTimer = setTimeout(() => {
                if (frameIndex < totalFrames && !cancelRequested) {
                    clearInterval(captureInterval);
                    renderGifFromFrames(frames, fps, quality, targetWidth, targetHeight);
                }
            }, durationSec * 1000 + 500);
        }
        
        function renderGifFromFrames(frames, fps, quality, targetWidth, targetHeight) {
            if (cancelRequested || frames.length === 0) {
                finishRecording(false);
                return;
            }
            
            if (!isGifLibraryAvailable()) {
                statusMsg.innerHTML = '❌ Ошибка: библиотека GIF не загружена';
                finishRecording(false);
                return;
            }
            
            modalProgressText.textContent = `🎨 Создание GIF из ${frames.length} кадров...`;
            
            // Используем локальную версию worker
            const gif = new GIF({
                workers: 2,
                quality: Math.floor(quality / 10),
                width: targetWidth,
                height: targetHeight,
                workerScript: 'gif.worker.js'  // локальный файл
            });
            
            gif.on('progress', (progress) => {
                if (!cancelRequested) {
                    const percent = 50 + Math.floor(progress * 50);
                    modalProgressFill.style.width = percent + '%';
                    modalProgressFill.textContent = percent + '%';
                    modalProgressText.textContent = `🎨 Сборка GIF: ${Math.floor(progress * 100)}%`;
                }
            });
            
            gif.on('finished', (blob) => {
                if (cancelRequested) {
                    finishRecording(false);
                    return;
                }
                
                const gifUrl = URL.createObjectURL(blob);
                modalGifPreview.src = gifUrl;
                modalGifResult.style.display = 'block';
                modalProgressArea.style.display = 'none';
                modalProgressFill.style.width = '100%';
                statusMsg.innerHTML = `✨ GIF создан! Размер: ${(blob.size / 1024).toFixed(1)} KB`;
                
                modalDownloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = gifUrl;
                    a.download = `rainbow_animation_${Date.now()}.gif`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    statusMsg.innerHTML = '📁 GIF сохранён на устройство';
                };
                
                finishRecording(true);
            });
            
            for (let frameData of frames) {
                gif.addFrame(frameData, { delay: 1000 / fps });
            }
            
            gif.render();
        }
        
        function finishRecording(success) {
            if (recordingTimer) clearTimeout(recordingTimer);
            isRecordingGif = false;
            recordingIndicator.style.display = 'none';
            
            if (!success || cancelRequested) {
                modalProgressArea.style.display = 'none';
                statusMsg.innerHTML = cancelRequested ? '❌ Создание GIF отменено' : '⚠️ Ошибка при создании GIF';
                cancelRequested = false;
            }
        }
        
        modalCancelBtn.addEventListener('click', () => {
            if (isRecordingGif) {
                cancelRequested = true;
                if (gifEncoder) {
                    try { gifEncoder = null; } catch(e) {}
                }
                statusMsg.innerHTML = '⏹️ Отмена создания GIF...';
                modalProgressText.textContent = '❌ Отменено';
                finishRecording(false);
            }
        });
        
        generateGifBtn.addEventListener('click', () => {
            if (!isRecordingGif) {
                startGifRecording();
            }
        });
        
        // ---------- ОБРАБОТЧИКИ СОБЫТИЙ РИСОВАНИЯ ----------
        function onPointerStart(e) {
            e.preventDefault();
            const coords = getCanvasCoords(e);
            if (!coords) return;
            startStroke(coords.x, coords.y, performance.now());
        }
        
        function onPointerMove(e) {
            e.preventDefault();
            if (!isDrawing || !currentStroke) return;
            const coords = getCanvasCoords(e);
            if (!coords) return;
            addPointToStroke(coords.x, coords.y);
            redrawAllStrokes();
        }
        
        function onPointerEnd(e) {
            e.preventDefault();
            if (currentStroke) finishCurrentStroke();
            isDrawing = false;
            redrawAllStrokes();
        }
        
        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            canvas.addEventListener('touchstart', onPointerStart, { passive: false });
            canvas.addEventListener('touchmove', onPointerMove, { passive: false });
            canvas.addEventListener('touchend', onPointerEnd);
            canvas.addEventListener('touchcancel', onPointerEnd);
            canvas.addEventListener('mousedown', onPointerStart);
            window.addEventListener('mousemove', (e) => {
                if (isDrawing && (e.buttons === 1)) {
                    e.preventDefault();
                    const coords = getCanvasCoords(e);
                    if (coords) addPointToStroke(coords.x, coords.y);
                    redrawAllStrokes();
                } else if (isDrawing && e.buttons !== 1) {
                    if (currentStroke) finishCurrentStroke();
                    isDrawing = false;
                    redrawAllStrokes();
                }
            });
            window.addEventListener('mouseup', onPointerEnd);
            
            resetBtn.addEventListener('click', resetCanvas);
            
            // Проверяем наличие библиотеки при старте
            if (!isGifLibraryAvailable()) {
                statusMsg.innerHTML = '⚠️ Библиотека GIF не загружена. Функция GIF будет недоступна.';
            }
            
            function animate() {
                redrawAllStrokes();
                requestAnimationFrame(animate);
            }
            animate();
        }
        
        init();
    })();
</script>

<!-- Встроенный офлайн-блок (безопасно) -->
<script>
(function() {
    "use strict";
    function registerSW() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.getRegistration()
            .then(reg => { if (!reg) navigator.serviceWorker.register('sw.js').catch(()=>{}); })
            .catch(()=>{});
    }
    function checkNetwork() { console.log('📡 ' + (navigator.onLine ? 'Онлайн' : 'Офлайн (кэш)')); }
    function setupNetworkListeners() {
        window.addEventListener('online', () => { if ('serviceWorker' in navigator) navigator.serviceWorker.ready.then(r => r.update()).catch(()=>{}); });
        window.addEventListener('offline', () => {});
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { registerSW(); checkNetwork(); setupNetworkListeners(); });
    else { registerSW(); checkNetwork(); setupNetworkListeners(); }
})();
</script>
