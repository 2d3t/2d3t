<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #authScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
        }
        #authScreen h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        #authScreen .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
        .auth-form {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 28px 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .auth-form label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; font-weight: 500; }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            margin-bottom: 16px;
            outline: none;
        }
        .auth-form input:focus { border-color: #6c5ce7; background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(108,92,231,0.15); }
        .auth-form input::placeholder { color: #666; }
        .auth-form .help-text { font-size: 12px; color: #666; margin-bottom: 18px; line-height: 1.5; }
        .auth-form .help-text a { color: #6c5ce7; text-decoration: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: #fff;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #aaa; margin-top: 10px; }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: -10px; margin-bottom: 12px; display: none; }

        #chatScreen {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: #0a0a0f;
            position: relative;
        }
        .chat-header {
            padding: 14px 20px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .chat-header .left { display: flex; align-items: center; gap: 12px; }
        .chat-header .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #fff;
        }
        .chat-header .info h2 { font-size: 17px; font-weight: 600; }
        .chat-header .info .status { font-size: 12px; color: #00b894; display: flex; align-items: center; gap: 5px; }
        .chat-header .info .status .dot {
            width: 7px; height: 7px; border-radius: 50%; background: #00b894;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .chat-header .exit-btn {
            background: rgba(255,255,255,0.06); border: none; color: #888;
            width: 38px; height: 38px; border-radius: 50%; font-size: 20px;
            cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-header .exit-btn:active { background: rgba(255,255,255,0.12); transform: scale(0.9); }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            min-height: 0; /* Важно для корректной работы flex */
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .message-wrapper.own { align-self: flex-end; }
        .message-wrapper.other { align-self: flex-start; }
        
        .message {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }
        .message-wrapper.own .message { background: linear-gradient(135deg, #6c5ce7, #4a3f8f); border-bottom-right-radius: 4px; }
        .message-wrapper.other .message { background: rgba(255,255,255,0.07); border-bottom-left-radius: 4px; }
        
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .message .sender { font-size: 12px; font-weight: 600; color: #6c5ce7; margin-bottom: 3px; display: block; }
        .message-wrapper.own .sender { color: #a78bfa; }
        .message .text { font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
        .message .time { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 4px; display: block; text-align: right; }
        .message.system { align-self: center; background: rgba(255,255,255,0.04); border-radius: 30px; padding: 6px 18px; font-size: 12px; color: #666; max-width: 90%; }
        
        .message .image-container {
            margin: 6px 0 4px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: rgba(0,0,0,0.2);
            max-width: 100%;
        }
        .message .image-container img {
            display: block;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .message .image-container img:active { transform: scale(0.98); }
        
        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: rgba(255,0,0,0.8);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
            padding: 0;
        }
        .delete-btn:active { transform: scale(0.8); }
        .message-wrapper:hover .delete-btn,
        .message-wrapper:active .delete-btn,
        .message-wrapper .delete-btn.show { display: flex; }
        .message-wrapper.own .delete-btn { display: flex; }

        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal { from { opacity:0; } to { opacity:1; } }
        .image-modal.active { display: flex; }
        .image-modal img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity:0; } to { transform: scale(1); opacity:1; } }
        .image-modal .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-modal .close-modal:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        /* Исправленная панель ввода — всегда видима */
        .input-bar {
            padding: 10px 14px 14px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
            min-height: 70px;
            flex: 0 0 auto;
            position: relative;
            z-index: 5;
        }
        .input-bar textarea {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            color: #fff;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.4;
            transition: border 0.3s;
        }
        .input-bar textarea:focus { border-color: #6c5ce7; }
        .input-bar textarea::placeholder { color: #555; }
        .input-bar .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-bar .file-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.06);
            color: #888;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .input-bar .file-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.12); }
        .input-bar .send-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-bar .send-btn:active { transform: scale(0.9); }

        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            padding: 10px 22px; border-radius: 30px; font-size: 14px; color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 999; display: none;
            animation: slideUp 0.3s ease; white-space: nowrap;
        }
        @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

        .skeleton {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            height: 50px;
            width: 60%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 6px;
        }
        @keyframes shimmer { 0%{opacity:0.4} 50%{opacity:0.8} 100%{opacity:0.4} }
        .skeleton.own { align-self: flex-end; }
        .skeleton.other { align-self: flex-start; }

        @media (max-width: 480px) {
            .auth-form { padding: 20px 16px; }
            #authScreen h1 { font-size: 32px; }
            .message-wrapper { max-width: 88%; }
            .message { font-size: 15px; }
            .chat-header { padding: 10px 14px; }
            .input-bar { padding: 8px 10px 12px; gap: 8px; min-height: 60px; }
            .input-bar textarea { font-size: 15px; padding: 10px 14px; min-height: 38px; }
            .input-bar .send-btn { width: 42px; height: 42px; font-size: 18px; }
            .input-bar .file-btn { width: 42px; height: 42px; font-size: 18px; }
            .image-modal img { max-height: 80vh; }
            .delete-btn { width: 20px; height: 20px; font-size: 10px; top: -6px; right: -6px; }
        }
        ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
</head>
<body>

<div id="authScreen">
    <h1>💬 ChatHub</h1>
    <p class="subtitle">Мессенджер на GitHub</p>
    <div class="auth-form">
        <label>👤 Ваш логин</label>
        <input type="text" id="usernameInput" placeholder="Введите ник" maxlength="20">
        <label>🔑 GitHub Token</label>
        <input type="password" id="tokenInput" placeholder="Вставьте токен доступа">
        <div class="help-text"><a href="https://github.com/settings/tokens/new" target="_blank">Создать токен</a> (права <strong>repo</strong>)</div>
        <div class="error-msg" id="authError">❌ Неверный токен или нет доступа</div>
        <button class="btn" id="loginBtn">🚀 Войти</button>
        <button class="btn btn-secondary" id="clearDataBtn">🗑️ Очистить данные</button>
    </div>
</div>

<div id="chatScreen">
    <div class="chat-header">
        <div class="left">
            <div class="avatar" id="userAvatar">?</div>
            <div class="info">
                <h2 id="chatTitle">Общий чат</h2>
                <div class="status"><span class="dot"></span><span id="onlineStatus">онлайн</span></div>
            </div>
        </div>
        <button class="exit-btn" id="exitBtn" title="Выйти">✕</button>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="skeleton other"></div>
        <div class="skeleton own"></div>
        <div class="skeleton other"></div>
    </div>

    <!-- Панель ввода с гарантированным отображением -->
    <div class="input-bar" id="inputBar">
        <textarea id="messageInput" rows="1" placeholder="Напишите сообщение..." maxlength="5000"></textarea>
        <div class="action-buttons">
            <button class="file-btn" id="fileBtn" title="Прикрепить изображение">📎</button>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<div class="image-modal" id="imageModal">
    <button class="close-modal" id="closeModalBtn">✕</button>
    <img id="modalImage" src="" alt="Увеличенное изображение">
</div>

<div class="toast" id="toast"></div>

<script>
// ===================================================================
//  КОНФИГУРАЦИЯ
// ===================================================================
const CONFIG = {
    repoOwner: '2d3t',
    repoName: '2d3t',
    filePath: 'chat.json',
    pollInterval: 5000,
    maxMessages: 1000,
    maxImageSize: 5 * 1024 * 1024, // 5MB
};

// ===================================================================
//  ЗВУКИ
// ===================================================================
class SoundManager {
    constructor() {
        this.enabled = true;
        this.sounds = {};
        this.initSounds();
    }

    initSounds() {
        this.sounds.send = this.createBeep(600, 0.1);
        this.sounds.receive = this.createBeep(800, 0.15);
        this.sounds.error = this.createBeep(300, 0.3);
        this.sounds.delete = this.createBeep(400, 0.1);
    }

    createBeep(freq, duration) {
        return {
            play: () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) { /* игнорируем ошибки аудио */ }
            }
        };
    }

    play(type) {
        if (!this.enabled) return;
        if (this.sounds[type]) {
            this.sounds[type].play();
        }
    }

    toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
    }
}

const soundManager = new SoundManager();

// ===================================================================
//  СОСТОЯНИЕ
// ===================================================================
let state = {
    username: '',
    token: '',
    messages: [],
    sha: null,
    isPolling: false,
    isSending: false,
    lastMessageCount: 0,
};

// ===================================================================
//  DOM
// ===================================================================
const $ = id => document.getElementById(id);
const authScreen = $('authScreen');
const chatScreen = $('chatScreen');
const usernameInput = $('usernameInput');
const tokenInput = $('tokenInput');
const loginBtn = $('loginBtn');
const authError = $('authError');
const clearDataBtn = $('clearDataBtn');
const messagesContainer = $('messagesContainer');
const messageInput = $('messageInput');
const sendBtn = $('sendBtn');
const fileBtn = $('fileBtn');
const exitBtn = $('exitBtn');
const userAvatar = $('userAvatar');
const chatTitle = $('chatTitle');
const toast = $('toast');
const inputBar = $('inputBar');
const imageModal = $('imageModal');
const modalImage = $('modalImage');
const closeModalBtn = $('closeModalBtn');

// ===================================================================
//  ВСПОМОГАТЕЛЬНЫЕ
// ===================================================================
function getInitials(name) { return name.charAt(0).toUpperCase(); }
function formatTime(iso) { return new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
function formatDate(iso) { return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); }

function formatFullTime(iso) {
    const date = new Date(iso);
    const time = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const day = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    return `${day} ${time}`;
}

function showToast(text, duration = 2000) {
    toast.textContent = text;
    toast.style.display = 'block';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, duration);
}

// ИСПРАВЛЕННАЯ ФУНКЦИЯ СКРОЛЛА - теперь она не заставляет панель ввода исчезать
function scrollToBottom() {
    setTimeout(() => {
        const container = messagesContainer;
        // Скроллим только если есть переполнение
        if (container.scrollHeight > container.clientHeight) {
            container.scrollTop = container.scrollHeight;
        }
        // Гарантируем, что панель ввода видна
        ensureInputBarVisible();
    }, 50);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ===================================================================
//  РАБОТА С ИЗОБРАЖЕНИЯМИ
// ===================================================================
function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.8) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }
                
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}

function openImageModal(imageUrl) {
    modalImage.src = imageUrl;
    imageModal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeImageModal() {
    imageModal.classList.remove('active');
    document.body.style.overflow = '';
}

// ===================================================================
//  КОРРЕКТНАЯ РАБОТА С UTF-8 В GITHUB
// ===================================================================
function utf8ToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    let binary = '';
    utf8Bytes.forEach(byte => binary += String.fromCharCode(byte));
    return btoa(binary);
}

function base64ToUtf8(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder('utf-8').decode(bytes);
}

// ===================================================================
//  GITHUB API
// ===================================================================
function getHeaders(token) {
    return { 
        'Authorization': `token ${token}`, 
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
    };
}

async function fetchFile(token, owner, repo, path) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const response = await fetch(url, { headers: getHeaders(token) });
    if (response.status === 404) return { exists: false };
    if (!response.ok) throw new Error(`GitHub API: ${response.status}`);
    const data = await response.json();
    const content = JSON.parse(base64ToUtf8(data.content));
    return { exists: true, sha: data.sha, content: content };
}

async function saveFile(token, owner, repo, path, content, sha) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const jsonString = JSON.stringify(content, null, 2);
    const encoded = utf8ToBase64(jsonString);
    
    const body = { 
        message: `💬 Обновление чата`,
        content: encoded
    };
    if (sha) body.sha = sha;
    
    const response = await fetch(url, { 
        method: 'PUT', 
        headers: getHeaders(token), 
        body: JSON.stringify(body) 
    });
    if (!response.ok) { 
        const error = await response.json(); 
        throw new Error(error.message || `HTTP ${response.status}`); 
    }
    const data = await response.json();
    return data.content.sha;
}

// ===================================================================
//  ЗАГРУЗКА / ОТПРАВКА / УДАЛЕНИЕ
// ===================================================================
async function loadMessages(showLoading = true) {
    try {
        if (showLoading) {
            messagesContainer.innerHTML = `
                <div class="skeleton other"></div>
                <div class="skeleton own"></div>
                <div class="skeleton other"></div>
                <div class="skeleton own"></div>
            `;
        }
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        if (!result.exists) {
            state.messages = [];
            state.sha = null;
            state.lastMessageCount = 0;
            renderMessages([]);
            return;
        }
        state.messages = result.content || [];
        state.sha = result.sha;
        state.lastMessageCount = state.messages.length;
        renderMessages(state.messages);
        scrollToBottom();
    } catch (error) {
        console.error('Ошибка загрузки:', error);
        messagesContainer.innerHTML = `
            <div class="message system">⚠️ Не удалось загрузить сообщения</div>
            <div class="message system" style="font-size:12px;color:#555;">${error.message}</div>
        `;
    }
}

async function sendMessage(text, imageData = null) {
    const hasText = text && text.trim();
    const hasImage = imageData !== null;
    
    if ((!hasText && !hasImage) || state.isSending) return;
    
    state.isSending = true;
    sendBtn.disabled = true;
    
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        let messages = result.exists ? (result.content || []) : [];
        let sha = result.exists ? result.sha : null;
        
        const newMessage = { 
            id: Date.now(), 
            username: state.username, 
            text: hasText ? text.trim() : '', 
            time: new Date().toISOString()
        };
        
        if (hasImage) {
            newMessage.image = imageData;
        }
        
        messages.push(newMessage);
        if (messages.length > CONFIG.maxMessages) messages = messages.slice(-CONFIG.maxMessages);
        
        const newSha = await saveFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath, messages, sha);
        state.messages = messages;
        state.sha = newSha;
        state.lastMessageCount = messages.length;
        
        messageInput.value = '';
        messageInput.style.height = 'auto';
        
        renderMessages(messages);
        scrollToBottom();
        
        soundManager.play('send');
        showToast('✅ Отправлено!', 1000);
    } catch (error) {
        console.error('Ошибка:', error);
        soundManager.play('error');
        showToast('❌ Ошибка: ' + error.message, 3000);
    } finally {
        state.isSending = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
}

async function deleteMessage(messageId) {
    if (!confirm('Удалить это сообщение?')) return;
    
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        if (!result.exists) return;
        
        let messages = result.content || [];
        const messageIndex = messages.findIndex(msg => msg.id === messageId);
        
        if (messageIndex === -1) {
            showToast('❌ Сообщение не найдено', 1500);
            return;
        }
        
        if (messages[messageIndex].username !== state.username) {
            showToast('❌ Можно удалять только свои сообщения', 1500);
            return;
        }
        
        messages.splice(messageIndex, 1);
        
        const newSha = await saveFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath, messages, result.sha);
        state.messages = messages;
        state.sha = newSha;
        state.lastMessageCount = messages.length;
        
        const cacheUrl = `https://api.github.com/repos/${CONFIG.repoOwner}/${CONFIG.repoName}/contents/${CONFIG.filePath}`;
        if ('caches' in window) {
            try {
                const cache = await caches.open('github-api-cache');
                await cache.delete(cacheUrl);
            } catch (e) {}
        }
        
        renderMessages(messages);
        soundManager.play('delete');
        showToast('🗑️ Сообщение удалено', 1000);
    } catch (error) {
        console.error('Ошибка удаления:', error);
        soundManager.play('error');
        showToast('❌ Ошибка: ' + error.message, 3000);
    }
}

async function handleFileUpload(file) {
    if (!file) return;
    
    if (!file.type.startsWith('image/')) {
        showToast('❌ Пожалуйста, выберите изображение', 2000);
        return;
    }
    
    if (file.size > CONFIG.maxImageSize) {
        showToast(`❌ Изображение слишком большое (макс. ${CONFIG.maxImageSize / 1024 / 1024}MB)`, 3000);
        return;
    }
    
    try {
        showToast('⏳ Обработка изображения...', 1500);
        const compressedImage = await compressImage(file, 800, 800, 0.8);
        await sendMessage('', compressedImage);
    } catch (error) {
        console.error('Ошибка загрузки изображения:', error);
        showToast('❌ Ошибка при обработке изображения', 3000);
    }
}

// ===================================================================
//  РЕНДЕРИНГ
// ===================================================================
function renderMessages(messages) {
    if (!messages || messages.length === 0) {
        messagesContainer.innerHTML = `
            <div class="message system">💬 История пуста</div>
            <div class="message system" style="font-size:12px;color:#555;">Напишите первое сообщение!</div>
        `;
        return;
    }
    let html = '', lastDate = '';
    messages.forEach((msg) => {
        const msgDate = formatDate(msg.time);
        if (msgDate !== lastDate) { html += `<div class="message system">${msgDate}</div>`; lastDate = msgDate; }
        const isOwn = msg.username === state.username;
        const senderName = msg.username || 'Аноним';
        const fullTime = formatFullTime(msg.time);
        
        let content = '';
        if (msg.text) {
            content += `<span class="text">${escapeHtml(msg.text)}</span>`;
        }
        if (msg.image) {
            content += `
                <div class="image-container" onclick="openImageModal('${msg.image}')">
                    <img src="${msg.image}" alt="Изображение" loading="lazy">
                </div>
            `;
        }
        
        html += `
            <div class="message-wrapper ${isOwn ? 'own' : 'other'}">
                <div class="message">
                    <span class="sender">${isOwn ? 'Вы' : senderName}</span>
                    ${content}
                    <span class="time">${fullTime}</span>
                </div>
                ${isOwn ? `<button class="delete-btn" onclick="deleteMessage(${msg.id})" title="Удалить">✕</button>` : ''}
            </div>
        `;
    });
    messagesContainer.innerHTML = html;
    scrollToBottom();
}

// ===================================================================
//  ПОЛЛИНГ
// ===================================================================
async function pollUpdates() {
    if (state.isPolling || !state.token) return;
    state.isPolling = true;
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        if (!result.exists) return;
        if (result.sha !== state.sha) {
            const newMessages = result.content || [];
            if (newMessages.length > state.lastMessageCount) {
                state.messages = newMessages;
                state.sha = result.sha;
                state.lastMessageCount = newMessages.length;
                renderMessages(newMessages);
                scrollToBottom();
                soundManager.play('receive');
                showToast('📩 Новые сообщения!', 1000);
            } else {
                state.sha = result.sha;
                state.messages = newMessages;
                state.lastMessageCount = newMessages.length;
            }
        }
    } catch (error) { console.error('Polling error:', error); }
    finally { state.isPolling = false; }
}

function startPolling() {
    if (window._pollInterval) clearInterval(window._pollInterval);
    window._pollInterval = setInterval(pollUpdates, CONFIG.pollInterval);
}

// ===================================================================
//  АВТОРИЗАЦИЯ
// ===================================================================
function login() {
    const username = usernameInput.value.trim();
    const token = tokenInput.value.trim();
    if (!username) { authError.textContent = '❌ Введите имя'; authError.style.display = 'block'; return; }
    if (!token) { authError.textContent = '❌ Введите GitHub токен'; authError.style.display = 'block'; return; }
    authError.style.display = 'none';
    state.username = username;
    state.token = token;
    localStorage.setItem('chathub_username', username);
    localStorage.setItem('chathub_token', token);
    
    authScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    
    // Панель ввода всегда видима
    ensureInputBarVisible();
    
    userAvatar.textContent = getInitials(username);
    chatTitle.textContent = `Чат (${username})`;
    loadMessages(true);
    startPolling();
}

function logout() {
    if (window._pollInterval) clearInterval(window._pollInterval);
    state.isPolling = false;
    authScreen.style.display = 'flex';
    chatScreen.style.display = 'none';
    usernameInput.value = '';
    tokenInput.value = '';
    authError.style.display = 'none';
    state.messages = [];
    state.sha = null;
    state.lastMessageCount = 0;
    closeImageModal();
}

// ===================================================================
//  ГАРАНТИЯ ВИДИМОСТИ ПАНЕЛИ ВВОДА (исправлено)
// ===================================================================
function ensureInputBarVisible() {
    if (chatScreen.style.display === 'flex') {
        inputBar.style.display = 'flex';
        inputBar.style.flex = '0 0 auto';
        inputBar.style.visibility = 'visible';
        inputBar.style.opacity = '1';
        // Принудительно сбрасываем любые трансформации
        inputBar.style.transform = 'none';
    }
}

// ===================================================================
//  ОБРАБОТЧИКИ
// ===================================================================
loginBtn.addEventListener('click', login);
usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tokenInput.focus(); });
tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

sendBtn.addEventListener('click', () => {
    const text = messageInput.value;
    if (text.trim()) {
        sendMessage(text);
    }
});

messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { 
        e.preventDefault(); 
        const text = messageInput.value;
        if (text.trim()) {
            sendMessage(text);
        }
    }
});

messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
});

fileBtn.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
        if (e.target.files.length > 0) {
            handleFileUpload(e.target.files[0]);
        }
        input.remove();
    };
    input.click();
});

exitBtn.addEventListener('click', logout);

clearDataBtn.addEventListener('click', () => {
    if (confirm('Очистить сохранённые данные?')) {
        localStorage.removeItem('chathub_username');
        localStorage.removeItem('chathub_token');
        usernameInput.value = '';
        tokenInput.value = '';
        showToast('🗑️ Данные очищены', 1500);
    }
});

closeModalBtn.addEventListener('click', closeImageModal);
imageModal.addEventListener('click', (e) => {
    if (e.target === imageModal) closeImageModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeImageModal();
    if (e.ctrlKey && e.key === 'm') {
        e.preventDefault();
        const enabled = soundManager.toggle();
        showToast(`🔊 Звук ${enabled ? 'включён' : 'выключен'}`, 1000);
    }
});

// ===================================================================
//  ВОССТАНОВЛЕНИЕ СЕССИИ
// ===================================================================
function restoreSession() {
    const savedUsername = localStorage.getItem('chathub_username');
    const savedToken = localStorage.getItem('chathub_token');
    if (savedUsername) usernameInput.value = savedUsername;
    if (savedToken) tokenInput.value = savedToken;
    if (savedUsername && savedToken) {
        setTimeout(() => {
            login();
            setTimeout(() => {
                ensureInputBarVisible();
            }, 100);
        }, 500);
    }
}

// Обработчик события scroll для защиты панели ввода
messagesContainer.addEventListener('scroll', function() {
    ensureInputBarVisible();
});

// Наблюдатель за изменением стиля chatScreen
const observer = new MutationObserver(() => {
    if (chatScreen.style.display === 'flex') {
        setTimeout(ensureInputBarVisible, 50);
    }
});
observer.observe(chatScreen, { attributes: true, attributeFilter: ['style'] });

// Запуск
restoreSession();
messageInput.addEventListener('focus', scrollToBottom);

// Усиленная защита - проверка каждую секунду
setInterval(ensureInputBarVisible, 1000);

console.log('✅ Чат загружен! Панель ввода всегда видима.');
console.log('📁 Репозиторий:', CONFIG.repoOwner + '/' + CONFIG.repoName);
console.log('🔊 Звуки: Ctrl+M - вкл/выкл');
console.log('🖼️ Для отправки фото нажмите кнопку 📎');
</script>
</body>
</html>
