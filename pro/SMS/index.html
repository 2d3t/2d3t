<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SMS Чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        #authScreen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
        }
        .auth-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .auth-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-header .brand-icon { font-size: 28px; -webkit-text-fill-color: initial; }
        .auth-header .exit-from-auth-btn {
            background: rgba(255,107,107,0.15);
            border: 1px solid rgba(255,107,107,0.2);
            color: #ff6b6b;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            display: none;
        }
        .auth-header .exit-from-auth-btn:hover { background: rgba(255,107,107,0.25); }
        .auth-header .exit-from-auth-btn.show { display: flex; }

        .auth-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-content h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .auth-content .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }
        .auth-form {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 28px 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .auth-form label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; font-weight: 500; }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            margin-bottom: 16px;
            outline: none;
        }
        .auth-form input:focus { border-color: #6c5ce7; background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(108,92,231,0.15); }
        .auth-form input::placeholder { color: #666; }
        .auth-form .help-text { font-size: 12px; color: #666; margin-bottom: 18px; line-height: 1.5; }
        .auth-form .help-text a { color: #6c5ce7; text-decoration: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: #fff;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #aaa; margin-top: 10px; }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: -10px; margin-bottom: 12px; display: none; }

        /* ===== ЧАТ ===== */
        #chatScreen {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: #0a0a0f;
            position: relative;
        }
        .chat-header {
            padding: 14px 20px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            position: sticky;
            top: 0;
        }
        .chat-header .left { display: flex; align-items: center; gap: 12px; }
        .chat-header .avatar-wrapper {
            position: relative;
            cursor: pointer;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .chat-header .avatar-wrapper:hover {
            transform: scale(1.05);
            border-color: rgba(255,255,255,0.2);
        }
        .chat-header .avatar-wrapper:active {
            transform: scale(0.95);
        }
        .chat-header .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .chat-header .avatar-wrapper .initials {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .chat-header .avatar-wrapper .change-avatar-hint {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 8px;
            text-align: center;
            padding: 2px 0;
            opacity: 0;
            transition: opacity 0.2s;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .chat-header .avatar-wrapper:hover .change-avatar-hint {
            opacity: 1;
        }
        .chat-header .info h2 { font-size: 17px; font-weight: 600; }
        .chat-header .info .status { font-size: 12px; color: #00b894; display: flex; align-items: center; gap: 5px; }
        .chat-header .info .status .dot {
            width: 7px; height: 7px; border-radius: 50%; background: #00b894;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        
        .chat-header .right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .user-counter {
            background: rgba(108,92,231,0.2);
            border: 1px solid rgba(108,92,231,0.3);
            color: #c4b5fd;
            padding: 4px 10px 4px 8px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            min-width: 32px;
            justify-content: center;
            position: relative;
        }
        .chat-header .user-counter:hover {
            background: rgba(108,92,231,0.3);
            transform: scale(1.05);
        }
        .chat-header .user-counter .count-number {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 0 6px;
            min-width: 18px;
            text-align: center;
            line-height: 18px;
            font-size: 12px;
        }
        .chat-header .user-counter .users-tooltip {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: rgba(20,20,30,0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 14px;
            min-width: 150px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 20;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .chat-header .user-counter:hover .users-tooltip,
        .chat-header .user-counter:active .users-tooltip {
            display: block;
        }
        .chat-header .user-counter .users-tooltip .user-item {
            padding: 4px 0;
            font-size: 13px;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .chat-header .user-counter .users-tooltip .user-item:last-child { border-bottom: none; }
        .chat-header .user-counter .users-tooltip .dot-online {
            width: 6px; height: 6px; border-radius: 50%; background: #00b894; display: inline-block;
        }
        .chat-header .user-counter .users-tooltip .dot-offline {
            width: 6px; height: 6px; border-radius: 50%; background: #555; display: inline-block;
        }
        .chat-header .archive-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .chat-header .archive-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .chat-header .archive-btn.active { background: rgba(108,92,231,0.2); border-color: #6c5ce7; color: #c4b5fd; }
        .chat-header .exit-btn {
            background: rgba(255,255,255,0.06); border: none; color: #888;
            width: 38px; height: 38px; border-radius: 50%; font-size: 20px;
            cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-header .exit-btn:active { background: rgba(255,255,255,0.12); transform: scale(0.9); }

        /* ===== СООБЩЕНИЯ ===== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
            position: relative;
        }
        .message-wrapper.own { align-self: flex-end; }
        .message-wrapper.other { align-self: flex-start; }
        
        .message {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }
        .message-wrapper.own .message { background: linear-gradient(135deg, #6c5ce7, #4a3f8f); border-bottom-right-radius: 4px; }
        .message-wrapper.other .message { background: rgba(255,255,255,0.07); border-bottom-left-radius: 4px; }
        
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .message .sender { font-size: 12px; font-weight: 600; color: #6c5ce7; margin-bottom: 3px; display: block; }
        .message-wrapper.own .sender { color: #a78bfa; }
        .message .text { font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
        .message .time { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 4px; display: block; text-align: right; }
        .message.system {
            align-self: center;
            background: rgba(255,255,255,0.04);
            border-radius: 30px;
            padding: 6px 18px;
            font-size: 12px;
            color: #666;
            max-width: 90%;
        }
        .message .archive-label {
            font-size: 10px;
            color: #666;
            display: block;
            margin-top: 2px;
        }
        .message .image-container {
            margin: 6px 0 4px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: rgba(0,0,0,0.2);
            max-width: 100%;
        }
        .message .image-container img {
            display: block;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .message .image-container img:active { transform: scale(0.98); }
        
        .delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.85);
            color: #1a1a2e;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 10;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            line-height: 1;
        }
        .delete-btn:hover { background: #ffffff; transform: scale(1.05); }
        .delete-btn:active { transform: scale(0.85); }
        .message-wrapper.own .delete-btn { display: flex; }
        .message-wrapper:hover .delete-btn,
        .message-wrapper:active .delete-btn {
            display: flex;
        }

        /* ===== АУДИО ===== */
        .audio-message {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            min-width: 180px;
            max-width: 280px;
            margin: 4px 0;
        }
        .audio-play-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .audio-play-btn:active { transform: scale(0.9); }
        .audio-play-btn.playing { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .audio-timeline {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            min-width: 60px;
        }
        .audio-timeline .progress {
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #00b894);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }
        .audio-duration {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            font-variant-numeric: tabular-nums;
            min-width: 35px;
            text-align: center;
        }

        /* ===== ВВОД ===== */
        .input-bar {
            padding: 10px 14px 14px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
            min-height: 70px;
            flex: 0 0 auto;
            position: relative;
            z-index: 5;
            transition: all 0.3s ease;
            flex-wrap: wrap;
        }
        .input-bar .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: flex-end;
            min-width: 0;
        }
        .input-bar textarea {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            color: #fff;
            font-size: 15px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 40px;
            max-height: 100px;
            line-height: 1.4;
            transition: border 0.3s;
            min-width: 0;
        }
        .input-bar textarea:focus { border-color: #6c5ce7; }
        .input-bar textarea::placeholder { color: #555; }
        .input-bar textarea:disabled { opacity: 0.5; }
        
        .input-bar .action-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .input-bar .icon-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.06);
            color: #888;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .input-bar .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.12); }
        .input-bar .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .input-bar .icon-btn.recording {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            animation: pulse-btn 1s infinite;
        }
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .input-bar .send-btn {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .input-bar .send-btn:active { transform: scale(0.85); }
        .input-bar .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-bar .send-btn.clicked {
            animation: clickFeedback 0.15s ease;
        }
        @keyframes clickFeedback {
            0% { transform: scale(1); }
            50% { transform: scale(0.85); background: linear-gradient(135deg, #5a4ad7, #00a87a); }
            100% { transform: scale(1); }
        }

        /* ===== АУДИО ЗАПИСЬ ===== */
        .audio-recording-ui {
            display: none;
            width: 100%;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
            background: rgba(255,107,107,0.05);
            border-radius: 30px;
            padding: 6px 14px;
        }
        .audio-recording-ui.active { display: flex; }
        .audio-recording-ui .recording-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ff6b6b;
            font-size: 13px;
            font-weight: 500;
        }
        .audio-recording-ui .recording-indicator .pulse {
            width: 10px; height: 10px; border-radius: 50%;
            background: #ff6b6b;
            animation: pulse-recording 1s infinite;
        }
        @keyframes pulse-recording {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        .audio-recording-ui .recording-timer {
            font-size: 14px;
            color: #ff6b6b;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
        }
        .audio-recording-ui .recording-progress {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            min-width: 40px;
        }
        .audio-recording-ui .recording-progress .fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ee5a24);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s;
        }
        .audio-recording-ui .cancel-recording {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }
        .audio-recording-ui .cancel-recording:active { transform: scale(0.9); }

        /* ===== МОДАЛКА ===== */
        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal { from { opacity:0; } to { opacity:1; } }
        .image-modal.active { display: flex; }
        .image-modal img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity:0; } to { transform: scale(1); opacity:1; } }
        .image-modal .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-modal .close-modal:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        /* ===== СКЕЛЕТОН ===== */
        .skeleton {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            height: 50px;
            width: 60%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 6px;
        }
        @keyframes shimmer { 0%{opacity:0.4} 50%{opacity:0.8} 100%{opacity:0.4} }
        .skeleton.own { align-self: flex-end; }
        .skeleton.other { align-self: flex-start; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            padding: 10px 22px; border-radius: 30px; font-size: 14px; color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 999; display: none;
            animation: slideUp 0.3s ease; white-space: nowrap;
            max-width: 90%;
        }

function formatDuration(seconds) {

// ===================================================================
//  GITHUB API
// ===================================================================
function getHeaders(token) {
    return { 
        'Authorization': `token ${token}`, 
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
    };
}
function utf8ToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    let binary = '';
    utf8Bytes.forEach(byte => binary += String.fromCharCode(byte));
    return btoa(binary);
}
function base64ToUtf8(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder('utf-8').decode(bytes);
}

async function fetchFile(token, owner, repo, path) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const response = await fetch(url, { headers: getHeaders(token) });
    if (response.status === 404) return { exists: false };
    if (!response.ok) throw new Error(`GitHub API: ${response.status}`);
    const data = await response.json();
    const content = JSON.parse(base64ToUtf8(data.content));
    return { exists: true, sha: data.sha, content: content };
}

async function saveFile(token, owner, repo, path, content, sha) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const jsonString = JSON.stringify(content, null, 2);
    const encoded = utf8ToBase64(jsonString);
    const body = { 
        message: `💬 Обновление ${path}`,
        content: encoded
    };
    if (sha) body.sha = sha;
    const response = await fetch(url, { 
        method: 'PUT', 
        headers: getHeaders(token), 
        body: JSON.stringify(body) 
    });
    if (!response.ok) { 
        const error = await response.json(); 
        throw new Error(error.message || `HTTP ${response.status}`); 
    }
    const data = await response.json();
    return data.content.sha;
}

async function loadUsers() {
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.usersFilePath);
        if (!result.exists) {
            state.users = [];
            state.usersSha = null;
            updateUsersUI();
            return;
        }
        state.users = result.content || [];
        state.usersSha = result.sha;
        updateUsersUI();
        updateAvatarFromUsers();
    } catch (error) {
        console.error('Ошибка загрузки пользователей:', error);
    }
}

async function registerUser(username) {
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.usersFilePath);
        let users = result.exists ? (result.content || []) : [];
        let sha = result.exists ? result.sha : null;
        
        const existingUser = users.find(u => u.username === username);
        if (existingUser) {
            existingUser.lastSeen = new Date().toISOString();
        } else {
            users.push({
                username: username,
                registeredAt: new Date().toISOString(),
                lastSeen: new Date().toISOString()
            });
        }
        
        const newSha = await saveFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.usersFilePath, users, sha);
        state.users = users;
        state.usersSha = newSha;
        updateUsersUI();
        updateAvatarFromUsers();
        return true;
    } catch (error) {
        console.error('Ошибка регистрации:', error);
        return false;
    }
}

async function updateUserAvatar(username, avatarData) {
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.usersFilePath);
        if (!result.exists) return false;
        let users = result.content || [];
        const userIndex = users.findIndex(u => u.username === username);
        if (userIndex === -1) return false;
        
        users[userIndex].avatar = avatarData;
        const newSha = await saveFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.usersFilePath, users, result.sha);
        state.users = users;
        state.usersSha = newSha;
        updateAvatarFromUsers();
        return true;
    } catch (error) {
        console.error('Ошибка обновления аватара:', error);
        return false;
    }
}

function updateAvatarFromUsers() {
    if (!state.isAuthorized) return;
    const currentUser = state.users.find(u => u.username === state.username);
    if (currentUser && currentUser.avatar) {
        avatarImage.src = currentUser.avatar;

        avatarImage.style.display = 'none';

        avatarInitials.textContent = getInitials(state.username);
    }
}

function updateUsersUI() {
    const count = state.users.length;
    userCountValue.textContent = count;
    
    if (count === 0) {
        usersTooltip.innerHTML = `<div class="empty-users">Нет зарегистрированных пользователей</div>`;
        return;
    }
    
    let html = '';
    state.users.forEach(user => {

        html += `

}

// ===================================================================

// ===================================================================
class SoundManager {
    constructor() {
        this.enabled = true;
        this.sounds = {};
        this.initSounds();
    }
    initSounds() {
        this.sounds.send = this.createBeep(600, 0.1);
        this.sounds.receive = this.createBeep(800, 0.15);
        this.sounds.error = this.createBeep(300, 0.3);
        this.sounds.delete = this.createBeep(400, 0.1);
        this.sounds.click = this.createBeep(1000, 0.03);
    }
    createBeep(freq, duration) {
        return {
            play: () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) { }
            }
        };
    }
    play(type) {
        if (!this.enabled) return;
        if (this.sounds[type]) this.sounds[type].play();
    }
    toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
    }
}
const soundManager = new SoundManager();

// ===================================================================
//  РАБОТА С ИЗОБРАЖЕНИЯМИ
// ===================================================================
function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.8) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}
function openImageModal(imageUrl) {
    modalImage.src = imageUrl;
    imageModal.classList.add('active');
    document.body.style.overflow = 'hidden';

}

// ===================================================================
//  АУДИО РЕКОРДЕР
// ===================================================================
class AudioRecorder {
    constructor() {
        this.mediaRecorder = null;
        this.audioChunks = [];
        this.isRecording = false;
        this.startTime = 0;
        this.duration = 0;
        this.stream = null;
        this.timerInterval = null;
        this.onDurationUpdate = null;
        this.onRecordingComplete = null;
    }

    async startRecording() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                    sampleRate: 16000,
                } 
            });

            const options = {
                mimeType: 'audio/webm;codecs=opus',
                audioBitsPerSecond: CONFIG.audioBitrate
            };

            this.mediaRecorder = new MediaRecorder(this.stream, options);
            this.audioChunks = [];
            this.isRecording = true;
            this.startTime = Date.now();
            this.duration = 0;

            this.mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    this.audioChunks.push(event.data);
                }
            };

            this.mediaRecorder.onstop = () => {
                this.processRecording();
            };

            this.mediaRecorder.start(1000);
            this.timerInterval = setInterval(() => {
                this.duration = (Date.now() - this.startTime) / 1000;
                if (this.onDurationUpdate) {
                    this.onDurationUpdate(this.duration);
                }
                if (this.duration >= CONFIG.maxAudioDuration) {
                    this.stopRecording();
                }
            }, 100);

            return true;
        } catch (error) {
            console.error('Ошибка доступа к микрофону:', error);
            showToast('❌ Нет доступа к микрофону', 3000);
            return false;
        }
    }

    stopRecording() {
        if (this.mediaRecorder && this.isRecording) {
            this.isRecording = false;
            this.mediaRecorder.stop();
            if (this.timerInterval) {
                clearInterval(this.timerInterval);
                this.timerInterval = null;
            }
            if (this.stream) {
                this.stream.getTracks().forEach(track => track.stop());
                this.stream = null;
            }
        }
    }

    processRecording() {
        if (this.audioChunks.length === 0) {
            showToast('⚠️ Аудио не записано', 1500);
            return;
        }

        const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm;codecs=opus' });
        
        if (audioBlob.size > CONFIG.maxAudioSize) {
            showToast(`❌ Аудио слишком большое (${(audioBlob.size / 1024 / 1024).toFixed(2)}MB)`, 3000);
            return;
        }

        const reader = new FileReader();
        reader.onload = () => {
            if (this.onRecordingComplete) {
                this.onRecordingComplete({
                    data: reader.result,
                    duration: this.duration,
                    size: audioBlob.size
                });
            }
        };
        reader.readAsDataURL(audioBlob);
    }
}

// ===================================================================
//  АУДИО ПЛЕЕР
// ===================================================================
class AudioPlayer {
    constructor() {
        this.currentAudio = null;
        this.currentElement = null;
        this.isPlaying = false;
    }

    play(audioData, element) {
        this.stop();
        
        try {
            const audio = new Audio(audioData);
            this.currentAudio = audio;
            this.currentElement = element;
            
            this.updatePlayButton(element, true);
            
            audio.onended = () => { this.stop(); };
            audio.onerror = () => {
                console.error('Ошибка воспроизведения аудио');
                this.stop();
                showToast('❌ Ошибка воспроизведения', 1500);
            };
            
            audio.ontimeupdate = () => {
                const progress = (audio.currentTime / audio.duration) * 100;
                const progressBar = element.querySelector('.progress');
                if (progressBar) {
                    progressBar.style.width = `${progress}%`;
                }
            };
            
            audio.play();
            this.isPlaying = true;
        } catch (error) {
            console.error('Ошибка воспроизведения:', error);
            showToast('❌ Не удалось воспроизвести аудио', 2000);
        }
    }

    stop() {
        if (this.currentAudio) {
            this.currentAudio.pause();
            this.currentAudio.currentTime = 0;
            if (this.currentElement) {
                this.updatePlayButton(this.currentElement, false);
            }
            this.currentAudio = null;
            this.currentElement = null;
            this.isPlaying = false;
        }
    }

    updatePlayButton(element, isPlaying) {
        const button = element.querySelector('.audio-play-btn');
        if (button) {
            button.textContent = isPlaying ? '⏹️' : '▶️';
            button.classList.toggle('playing', isPlaying);
        }
        if (!isPlaying) {
            const progressBar = element.querySelector('.progress');
            if (progressBar) progressBar.style.width = '0%';
        }
    }
}

const audioPlayer = new AudioPlayer();

let isAudioRecording = false;

            <div class="message system" style="font-size:12px;color:#555;">Неверный токен или недостаточно прав</div>
        `;
        return;
    }
    try {
        if (showLoading) {
            messagesContainer.innerHTML = `
                <div class="skeleton other"></div>
                <div class="skeleton own"></div>
                <div class="skeleton other"></div>
                <div class="skeleton own"></div>
            `;
        }
        
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath);
        if (!result.exists) {
            state.messages = [];
            state.chatSha = null;
            state.lastMessageCount = 0;
            renderMessages([]);
            return;
        }
        state.messages = result.content || [];
        state.chatSha = result.sha;
        state.lastMessageCount = state.messages.length;
        
        if (state.messages.length > CONFIG.maxMessages) {
            await archiveOldMessages();
            const newResult = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath);
            if (newResult.exists) {
                state.messages = newResult.content || [];
                state.chatSha = newResult.sha;
                state.lastMessageCount = state.messages.length;
            }
        }
        
        renderMessages(state.messages);
        scrollToBottom();
    } catch (error) {
        console.error('Ошибка загрузки:', error);
        state.isAuthorized = false;
        messagesContainer.innerHTML = `
            <div class="message system">⚠️ Ошибка доступа</div>
            <div class="message system" style="font-size:12px;color:#555;">${error.message}</div>
        `;
        showToast('❌ Ошибка доступа к репозиторию', 3000);
    }
}

async function archiveOldMessages() {
    try {
        const archiveResult = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatArchivePath);
        let archiveMessages = archiveResult.exists ? (archiveResult.content || []) : [];
        let archiveSha = archiveResult.exists ? archiveResult.sha : null;
        
        const messagesToKeep = state.messages.slice(-CONFIG.maxMessages);
        const messagesToArchive = state.messages.slice(0, -CONFIG.maxMessages);
        
        if (messagesToArchive.length === 0) return;
        
        archiveMessages = [...archiveMessages, ...messagesToArchive];
        if (archiveMessages.length > CONFIG.maxArchiveMessages) {
            archiveMessages = archiveMessages.slice(-CONFIG.maxArchiveMessages);
        }
        
        const newChatSha = await saveFile(
            state.token, CONFIG.repoOwner, CONFIG.repoName, 
            CONFIG.chatFilePath, messagesToKeep, state.chatSha
        );
        const newArchiveSha = await saveFile(
            state.token, CONFIG.repoOwner, CONFIG.repoName, 
            CONFIG.chatArchivePath, archiveMessages, archiveSha
        );
        
        state.chatSha = newChatSha;
        state.archiveSha = newArchiveSha;
        state.messages = messagesToKeep;
        state.archiveMessages = archiveMessages;
        state.lastMessageCount = messagesToKeep.length;
    } catch (error) {
        console.error('Ошибка архивации:', error);
        showToast('❌ Ошибка при архивации', 3000);
    }
}

async function loadArchive() {
    if (!state.isAuthorized) {
        showToast('❌ Нет доступа', 1500);
        return;
    }
    
    state.showArchive = !state.showArchive;
    archiveToggleBtn.classList.toggle('active', state.showArchive);
    archiveToggleBtn.textContent = state.showArchive ? '📚 Скрыть' : '📚 Архив';
    
    if (state.showArchive) {
        try {
            showToast('📚 Загрузка архива...', 1500);
            const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatArchivePath);
            if (!result.exists) {
                state.archiveMessages = [];
                showToast('📭 Архив пуст', 1500);
                renderMessages(state.messages);
                return;
            }
            state.archiveMessages = result.content || [];
            state.archiveSha = result.sha;
            
            const allMessages = [...state.messages, ...state.archiveMessages];
            renderMessages(allMessages, true);
            showToast(`📚 Загружено ${state.archiveMessages.length} архивных сообщений`, 2000);
            scrollToBottom();
        } catch (error) {
            console.error('Ошибка загрузки архива:', error);
            showToast('❌ Ошибка загрузки архива', 3000);
        }
    } else {
        renderMessages(state.messages);
        scrollToBottom();
    }
}

// ===================================================================
//  ОТПРАВКА СООБЩЕНИЙ
// ===================================================================
async function sendMessage(text, audioData = null, imageData = null) {
    if (!state.isAuthorized) {
        showToast('❌ Нет доступа для отправки', 2000);
        return;
    }
    const hasText = text && text.trim();
    const hasImage = imageData !== null;
    const hasAudio = audioData !== null;
    if ((!hasText && !hasImage && !hasAudio) || state.isSending) return;
    
    soundManager.play('click');
    state.isSending = true;
    sendBtn.disabled = true;
    
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath);
        let messages = result.exists ? (result.content || []) : [];
        let sha = result.exists ? result.sha : null;
        
        const messageId = Date.now();
        const newMessage = { 
            id: messageId, 
            username: state.username, 
            text: hasText ? text.trim() : '', 
            time: new Date().toISOString()
        };
        if (hasImage) newMessage.image = imageData;
        if (hasAudio) newMessage.audio = audioData;
        
        state._lastSentMessageId = messageId;
        messages.push(newMessage);
        
        if (messages.length > CONFIG.maxMessages) {
            const messagesToKeep = messages.slice(-CONFIG.maxMessages);
            const messagesToArchive = messages.slice(0, -CONFIG.maxMessages);
            
            const archiveResult = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatArchivePath);
            let archiveMessages = archiveResult.exists ? (archiveResult.content || []) : [];
            let archiveSha = archiveResult.exists ? archiveResult.sha : null;
            
            archiveMessages = [...archiveMessages, ...messagesToArchive];
            if (archiveMessages.length > CONFIG.maxArchiveMessages) {
                archiveMessages = archiveMessages.slice(-CONFIG.maxArchiveMessages);
            }
            
            const newArchiveSha = await saveFile(
                state.token, CONFIG.repoOwner, CONFIG.repoName, 
                CONFIG.chatArchivePath, archiveMessages, archiveSha
            );
            const newChatSha = await saveFile(
                state.token, CONFIG.repoOwner, CONFIG.repoName, 
                CONFIG.chatFilePath, messagesToKeep, sha
            );
            
            state.messages = messagesToKeep;
            state.chatSha = newChatSha;
            state.archiveMessages = archiveMessages;
            state.archiveSha = newArchiveSha;
            state.lastMessageCount = messagesToKeep.length;
        } else {
            const newSha = await saveFile(
                state.token, CONFIG.repoOwner, CONFIG.repoName, 
                CONFIG.chatFilePath, messages, sha
            );
            state.messages = messages;
            state.chatSha = newSha;
            state.lastMessageCount = messages.length;
        }
        
        messageInput.value = '';
        messageInput.style.height = 'auto';
        renderMessages(state.messages);
        scrollToBottom();
        
        soundManager.play('send');
        if (hasAudio) showToast('🎙️ Аудио отправлено!', 1000);
        else showToast('✅ Отправлено!', 1000);
    } catch (error) {
        console.error('Ошибка:', error);
        soundManager.play('error');
        showToast('❌ Ошибка: ' + error.message, 3000);
        if (error.message.includes('403') || error.message.includes('401')) {
            state.isAuthorized = false;
            loadMessages(false);
        }
        state._lastSentMessageId = null;
    } finally {
        state.isSending = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
}

async function deleteMessage(messageId) {
    if (!state.isAuthorized) {
        showToast('❌ Нет доступа', 1500);
        return;
    }
    if (!confirm('Удалить это сообщение?')) return;
    
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath);
        if (!result.exists) return;
        let messages = result.content || [];
        const messageIndex = messages.findIndex(msg => msg.id === messageId);
        if (messageIndex === -1) { showToast('❌ Сообщение не найдено', 1500); return; }
        if (messages[messageIndex].username !== state.username) {
            showToast('❌ Можно удалять только свои сообщения', 1500);
            return;
        }
        messages.splice(messageIndex, 1);
        const newSha = await saveFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath, messages, result.sha);
        state.messages = messages;
        state.chatSha = newSha;
        state.lastMessageCount = messages.length;
        renderMessages(state.messages);
        soundManager.play('delete');
        showToast('🗑️ Сообщение удалено', 1000);
    } catch (error) {
        console.error('Ошибка удаления:', error);
        soundManager.play('error');
        showToast('❌ Ошибка: ' + error.message, 3000);
        if (error.message.includes('403') || error.message.includes('401')) {
            state.isAuthorized = false;
            loadMessages(false);
        }
    }
}

// ===================================================================
//  РЕНДЕРИНГ
// ===================================================================
function renderAudioMessage(audioData, isOwn) {
    return `
        <div class="audio-message" style="background: ${isOwn ? 'rgba(108,92,231,0.2)' : 'rgba(255,255,255,0.05)'};">
            <button class="audio-play-btn" onclick="window._toggleAudioPlay(this, '${audioData}')">
                ▶️
            </button>
            <div class="audio-timeline" onclick="window._seekAudio(event, this)">
                <div class="progress"></div>
            </div>
            <span class="audio-duration">0:00</span>
        </div>
    `;
}

window._toggleAudioPlay = function(button, audioData) {
    const container = button.closest('.audio-message');
    if (!container) return;
    if (audioPlayer.currentElement === container && audioPlayer.isPlaying) {
        audioPlayer.stop();
        return;
    }
    audioPlayer.play(audioData, container);
    const durationEl = container.querySelector('.audio-duration');
    if (durationEl) {
        const audio = new Audio(audioData);
        audio.onloadedmetadata = () => {
            durationEl.textContent = formatDuration(audio.duration);
        };
    }
};

window._seekAudio = function(event, timeline) {
    if (!audioPlayer.currentAudio || audioPlayer.currentElement !== timeline.closest('.audio-message')) return;
    const rect = timeline.getBoundingClientRect();
    const percent = (event.clientX - rect.left) / rect.width;
    audioPlayer.currentAudio.currentTime = percent * audioPlayer.currentAudio.duration;
};

function renderMessages(messages, isArchiveView = false) {
    if (!messages || messages.length === 0) {
        messagesContainer.innerHTML = `
            <div class="message system">💬 История пуста</div>
            <div class="message system" style="font-size:12px;color:#555;">Напишите первое сообщение!</div>
        `;
        return;
    }
    
    let html = '', lastDate = '';
    let showArchiveBtn = !isArchiveView && state.archiveMessages.length > 0;
    
    if (showArchiveBtn) {
        html += `
            <button class="btn" style="margin-bottom:12px;max-width:220px;align-self:center;font-size:12px;padding:6px 16px;background:rgba(255,255,255,0.06);color:#aaa;" onclick="loadArchive()">
                📚 Загрузить архив (${state.archiveMessages.length} сообщений)
            </button>
        `;
    }
    
    messages.forEach((msg) => {
        if (!isArchiveView && state.archiveMessages.some(a => a.id === msg.id)) return;
        
        const msgDate = formatDate(msg.time);
        if (msgDate !== lastDate) { 
            html += `<div class="message system">${msgDate}</div>`; 
            lastDate = msgDate; 
        }
        
        const isOwn = isOwnMessage(msg);
        const senderName = msg.username || 'Аноним';
        const fullTime = formatFullTime(msg.time);
        const isArchived = isArchiveView && !state.messages.some(m => m.id === msg.id);
        
        let content = '';
        if (msg.text) {
            content += `<span class="text">${escapeHtml(msg.text)}</span>`;
        }
        if (msg.image) {
            content += `
                <div class="image-container" onclick="openImageModal('${msg.image}')">
                    <img src="${msg.image}" alt="Изображение" loading="lazy">
                </div>
            `;
        }
        if (msg.audio) {
            content += renderAudioMessage(msg.audio, isOwn);
        }
        
        html += `
            <div class="message-wrapper ${isOwn ? 'own' : 'other'}">
                <div class="message">
                    <span class="sender">${isOwn ? 'Вы' : escapeHtml(senderName)}</span>
                    ${content}
                    <span class="time">${fullTime}</span>
                    ${isArchived ? '<span class="archive-label">📦 Архив</span>' : ''}
                </div>
                ${isOwn ? `<button class="delete-btn" onclick="deleteMessage(${msg.id})" title="Удалить">✕</button>` : ''}
            </div>
        `;
    });
    
    messagesContainer.innerHTML = html;
    scrollToBottom();
}

// ===================================================================
//  ПОЛЛИНГ
// ===================================================================
async function pollUpdates() {
    if (state.isPolling || !state.token || !state.isAuthorized) return;
    state.isPolling = true;
    try {
        const chatResult = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath);
        if (chatResult.exists && chatResult.sha !== state.chatSha) {
            const newMessages = chatResult.content || [];
            if (newMessages.length > state.lastMessageCount) {
                const newMessagesArray = newMessages.slice(state.lastMessageCount);
                const hasOwnMessage = newMessagesArray.some(msg => 
                    msg.username === state.username && 
                    msg.id === state._lastSentMessageId
                );
                
                state.messages = newMessages;
                state.chatSha = chatResult.sha;
                state.lastMessageCount = newMessages.length;
                
                if (!state.showArchive) {
                    renderMessages(newMessages);
                } else {
                    const allMessages = [...newMessages, ...state.archiveMessages];
                    renderMessages(allMessages, true);
                }
                scrollToBottom();
                
                if (!hasOwnMessage) {
                    soundManager.play('receive');
                } else {
                    state._lastSentMessageId = null;
                }
            } else {
                state.chatSha = chatResult.sha;
                state.messages = newMessages;
                state.lastMessageCount = newMessages.length;
            }
        }
        
        const usersResult = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.usersFilePath);
        if (usersResult.exists && usersResult.sha !== state.usersSha) {
            state.users = usersResult.content || [];
            state.usersSha = usersResult.sha;
            updateUsersUI();
            updateAvatarFromUsers();
        }
    } catch (error) {
        console.error('Polling error:', error);
        if (error.message.includes('403') || error.message.includes('401')) {
            state.isAuthorized = false;
            loadMessages(false);
        }
    } finally {
        state.isPolling = false;
    }
}

function startPolling() {
    if (window._pollInterval) clearInterval(window._pollInterval);
    window._pollInterval = setInterval(pollUpdates, CONFIG.pollInterval);
}

// ===================================================================
//  АУДИО ЗАПИСЬ UI
// ===================================================================
function initAudioRecorder() {
    audioRecorder = new AudioRecorder();
    
    audioRecorder.onDurationUpdate = (duration) => {
        recordingTimer.textContent = formatDuration(duration);
        const progress = (duration / CONFIG.maxAudioDuration) * 100;
        recordingProgress.style.width = `${Math.min(progress, 100)}%`;
    };
    
    audioRecorder.onRecordingComplete = (audioData) => {
        sendMessage('', audioData.data);
        resetAudioUI();
    };
}

function showAudioRecordingUI() {
    audioRecordingUI.classList.add('active');
    audioRecordBtn.classList.add('recording');
    audioRecordBtn.textContent = '⏹️';
    messageInput.disabled = true;
    sendBtn.disabled = true;
    fileBtn.disabled = true;
    recordingTimer.textContent = '0:00';
    recordingProgress.style.width = '0%';
}

function resetAudioUI() {
    audioRecordingUI.classList.remove('active');
    audioRecordBtn.classList.remove('recording');
    audioRecordBtn.textContent = '🎙️';
    messageInput.disabled = false;
    sendBtn.disabled = false;
    fileBtn.disabled = false;
    recordingTimer.textContent = '0:00';
    recordingProgress.style.width = '0%';
}

async function toggleAudioRecording() {
    if (!state.isAuthorized) {
        showToast('❌ Нет доступа для отправки', 2000);
        return;
    }
    
    if (isAudioRecording) {
        if (audioRecorder) audioRecorder.stopRecording();
        isAudioRecording = false;
        resetAudioUI();
        return;
    }
    
    const success = await audioRecorder.startRecording();
    if (success) {
        isAudioRecording = true;
        showAudioRecordingUI();
        showToast('🎙️ Запись начата...', 1000);
    }
}

// ===================================================================
//  ОБРАБОТКА ФАЙЛОВ
// ===================================================================
async function handleFileUpload(file) {
    if (!file) return;
    if (!state.isAuthorized) { showToast('❌ Нет доступа', 2000); return; }
    if (!file.type.startsWith('image/')) { showToast('❌ Пожалуйста, выберите изображение', 2000); return; }
    if (file.size > CONFIG.maxImageSize) {
        showToast(`❌ Изображение слишком большое (макс. ${CONFIG.maxImageSize / 1024 / 1024}MB)`, 3000);
        return;
    }
    try {
        showToast('⏳ Обработка изображения...', 1500);
        const compressedImage = await compressImage(file, 800, 800, 0.8);
        await sendMessage('', null, compressedImage);
    } catch (error) {
        console.error('Ошибка загрузки изображения:', error);
        showToast('❌ Ошибка при обработке изображения', 3000);
    }
}

// ===================================================================
//  АВТОРИЗАЦИЯ
// ===================================================================
async function login() {
    const username = usernameInput.value.trim();
    const token = tokenInput.value.trim();
    if (!username) { authError.textContent = '❌ Введите имя'; authError.style.display = 'block'; return; }
    if (!token) { authError.textContent = '❌ Введите GitHub токен'; authError.style.display = 'block'; return; }
    authError.style.display = 'none';
    
    try {
        await fetchFile(token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath);
        
        state.username = username;
        state.token = token;
        state.isAuthorized = true;
        localStorage.setItem('chathub_username', username);
        localStorage.setItem('chathub_token', token);
        
        await registerUser(username);
        await loadUsers();
        await loadMessages(true);
        
        authScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        exitFromAuthBtn.classList.remove('show');
        avatarInitials.textContent = getInitials(username);
        chatTitle.textContent = `Чат (${username})`;
        startPolling();
    } catch (error) {
        console.error('Ошибка доступа:', error);
        authError.textContent = '❌ Неверный токен или нет доступа к репозиторию';
        authError.style.display = 'block';
        state.isAuthorized = false;
    }
}

function logout() {
    if (window._pollInterval) clearInterval(window._pollInterval);
    state.isPolling = false;
    state.isAuthorized = false;
    state._lastSentMessageId = null;
    state.showArchive = false;
    archiveToggleBtn.classList.remove('active');
    archiveToggleBtn.textContent = '📚 Архив';
    
    authScreen.style.display = 'flex';
    chatScreen.style.display = 'none';
    exitFromAuthBtn.classList.add('show');
    authError.style.display = 'none';
    state.messages = [];
    state.chatSha = null;
    state.lastMessageCount = 0;
    state.users = [];
    state.usersSha = null;
    state.archiveMessages = [];
    state.archiveSha = null;
    closeImageModal();
    resetAudioUI();
    updateUsersUI();
    
    showToast('👋 Вы вышли из чата', 1500);
}

// ===================================================================
//  ВОССТАНОВЛЕНИЕ СЕССИИ
// ===================================================================
async function restoreSession() {
    const savedUsername = localStorage.getItem('chathub_username');
    const savedToken = localStorage.getItem('chathub_token');
    if (savedUsername) usernameInput.value = savedUsername;
    if (savedToken) tokenInput.value = savedToken;
    if (savedUsername && savedToken) {
        try {
            await fetchFile(savedToken, CONFIG.repoOwner, CONFIG.repoName, CONFIG.chatFilePath);
            state.username = savedUsername;
            state.token = savedToken;
            state.isAuthorized = true;
            
            await registerUser(savedUsername);
            await loadUsers();
            await loadMessages(true);
            
            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            exitFromAuthBtn.classList.remove('show');
            avatarInitials.textContent = getInitials(savedUsername);
            chatTitle.textContent = `Чат (${savedUsername})`;
            startPolling();
        } catch (error) {
            console.log('Автовход не удался, ждём ручного входа');
            state.isAuthorized = false;
            exitFromAuthBtn.classList.add('show');
        }
    }
}

usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tokenInput.focus(); });
tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

exitFromAuthBtn.addEventListener('click', () => {

});

});

messageInput.addEventListener('keydown', (e) => {

        e.preventDefault();

            sendBtn.classList.add('clicked');

});

});

avatarWrapper.addEventListener('click', () => {
    if (!state.isAuthorized) return;
    const input = document.createElement('input');
    input.type = 'file';

    input.onchange = (e) => {
        if (e.target.files.length > 0) handleAvatarUpload(e.target.files[0]);
        input.remove();
    };

});

audioRecordBtn.addEventListener('click', toggleAudioRecording);
cancelRecordingBtn.addEventListener('click', () => {

    showToast('⏹️ Запись отменена', 1000);
});

archiveToggleBtn.addEventListener('click', loadArchive);
exitBtn.addEventListener('click', logout);

clearDataBtn.addEventListener('click', () => {
    if (confirm('Очистить сохранённые данные?')) {
        localStorage.removeItem('chathub_username');
        localStorage.removeItem('chathub_token');
        usernameInput.value = '';
        tokenInput.value = '';
        exitFromAuthBtn.classList.remove('show');
        showToast('🗑️ Данные очищены', 1500);
    }
});

closeModalBtn.addEventListener('click', closeImageModal);
imageModal.addEventListener('click', (e) => {
    if (e.target === imageModal) closeImageModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeImageModal();
        if (audioPlayer.isPlaying) audioPlayer.stop();
    }
    if (e.altKey && e.code === 'Space') {
        e.preventDefault();
        toggleAudioRecording();
    }
    if (e.ctrlKey && e.key === 'm') {
        e.preventDefault();
        const enabled = soundManager.toggle();
        showToast(`🔊 Звук ${enabled ? 'включён' : 'выключен'}`, 1000);
    }
});
