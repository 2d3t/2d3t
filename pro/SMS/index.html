<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>SMS Чат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #authScreen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
        }
        .auth-header {
            padding: 16px 20px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .auth-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-header .brand-icon {
            font-size: 28px;
            -webkit-text-fill-color: initial;
        }

        .auth-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-content h1 {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .auth-content .subtitle { color: #888; margin-bottom: 30px; font-size: 14px; }

        .auth-form {
            width: 100%;
            max-width: 380px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 28px 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .auth-form label { display: block; font-size: 13px; color: #999; margin-bottom: 6px; font-weight: 500; }
        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s;
            margin-bottom: 16px;
            outline: none;
        }
        .auth-form input:focus { border-color: #6c5ce7; background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(108,92,231,0.15); }
        .auth-form input::placeholder { color: #666; }
        .auth-form .help-text { font-size: 12px; color: #666; margin-bottom: 18px; line-height: 1.5; }
        .auth-form .help-text a { color: #6c5ce7; text-decoration: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: #fff;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #aaa; margin-top: 10px; }
        .error-msg { color: #ff6b6b; font-size: 13px; margin-top: -10px; margin-bottom: 12px; display: none; }

        #chatScreen {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: #0a0a0f;
            position: relative;
        }
        .chat-header {
            padding: 14px 20px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            position: sticky;
            top: 0;
        }
        .chat-header .left { display: flex; align-items: center; gap: 12px; }
        .chat-header .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 18px; color: #fff;
        }
        .chat-header .info h2 { font-size: 17px; font-weight: 600; }

        .chat-header .exit-btn {
            background: rgba(255,255,255,0.06); border: none; color: #888;
            width: 38px; height: 38px; border-radius: 50%; font-size: 20px;
            cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-header .exit-btn:active { background: rgba(255,255,255,0.12); transform: scale(0.9); }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
            justify-content: flex-end;
        }
        .messages-container > .messages-inner {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: fadeIn 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }
        .message-wrapper.own { align-self: flex-end; }
        .message-wrapper.other { align-self: flex-start; }

        .message {
            padding: 10px 14px;
            border-radius: 18px;
            word-wrap: break-word;
            position: relative;
        }
        .message-wrapper.own .message { background: linear-gradient(135deg, #6c5ce7, #4a3f8f); border-bottom-right-radius: 4px; }
        .message-wrapper.other .message { background: rgba(255,255,255,0.07); border-bottom-left-radius: 4px; }

        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .message .sender { font-size: 12px; font-weight: 600; color: #6c5ce7; margin-bottom: 3px; display: block; }
        .message-wrapper.own .sender { color: #a78bfa; }
        .message .text { font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
        .message .time { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 4px; display: block; text-align: right; }
        .message.system { align-self: center; background: rgba(255,255,255,0.04); border-radius: 30px; padding: 6px 18px; font-size: 12px; color: #666; max-width: 90%; }

        .message .image-container {
            margin: 6px 0 4px;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background: rgba(0,0,0,0.2);
            max-width: 100%;
        }
        .message .image-container img {
            display: block;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            transition: transform 0.2s;
        }
        .message .image-container img:active { transform: scale(0.98); }

        .delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.85);
            color: #1a1a2e;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            z-index: 10;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            line-height: 1;
        }
        .delete-btn:hover { background: #ffffff; transform: scale(1.05); }
        .delete-btn:active { transform: scale(0.85); }
        .message-wrapper.own .delete-btn { display: flex; }
        .message-wrapper:hover .delete-btn,
        .message-wrapper:active .delete-btn {
            display: flex;
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease;
        }
        @keyframes fadeInModal { from { opacity:0; } to { opacity:1; } }
        .image-modal.active { display: flex; }
        .image-modal img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.8); opacity:0; } to { transform: scale(1); opacity:1; } }
        .image-modal .close-modal {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 44px; height: 44px;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-modal .close-modal:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        .input-bar {
            padding: 10px 14px 14px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
            min-height: 70px;
            flex: 0 0 auto;
            position: relative;
            z-index: 5;
            transition: all 0.3s ease;
        }
        .input-bar.hidden {
            display: none !important;
        }
        .input-bar textarea {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            color: #fff;
            font-size: 16px;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.4;
            transition: border 0.3s;
        }
        .input-bar textarea:focus { border-color: #6c5ce7; }
        .input-bar textarea::placeholder { color: #555; }
        .input-bar .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .input-bar .file-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.06);
            color: #888;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .input-bar .file-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.12); }
        .input-bar .send-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            position: relative;
        }
        .input-bar .send-btn:active { transform: scale(0.85); }
        .input-bar .send-btn.clicked {
            animation: clickFeedback 0.15s ease;
        }
        @keyframes clickFeedback {
            0% { transform: scale(1); }
            50% { transform: scale(0.85); background: linear-gradient(135deg, #5a4ad7, #00a87a); }
            100% { transform: scale(1); }
        }

        .floating-keyboard-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c5ce7, #00b894);
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            animation: pulseBtn 2s infinite;
        }
        .floating-keyboard-btn:active { transform: scale(0.85); }
        .floating-keyboard-btn.show { display: flex; }
        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .close-panel-btn {
            position: absolute;
            top: -12px;
            right: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            color: #888;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .close-panel-btn:hover { background: rgba(255,255,255,0.2); }
        .close-panel-btn:active { transform: scale(0.85); }
        .input-bar:hover .close-panel-btn,
        .input-bar:active .close-panel-btn {
            display: flex;
        }

        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            padding: 10px 22px; border-radius: 30px; font-size: 14px; color: #fff;
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 999; display: none;
            animation: slideUp 0.3s ease; white-space: nowrap;
        }
        @keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

        .skeleton {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            height: 50px;
            width: 60%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 6px;
        }
        @keyframes shimmer { 0%{opacity:0.4} 50%{opacity:0.8} 100%{opacity:0.4} }
        .skeleton.own { align-self: flex-end; }
        .skeleton.other { align-self: flex-start; }

        @media (max-width: 480px) {
            .auth-form { padding: 20px 16px; }
            .auth-content h1 { font-size: 28px; }
            .auth-header .brand { font-size: 17px; }
            .message-wrapper { max-width: 88%; }
            .message { font-size: 15px; }
            .chat-header { padding: 10px 14px; }
            .input-bar { padding: 8px 10px 12px; gap: 8px; min-height: 60px; }
            .input-bar textarea { font-size: 15px; padding: 10px 14px; min-height: 38px; }
            .input-bar .send-btn { width: 42px; height: 42px; font-size: 18px; }
            .input-bar .file-btn { width: 42px; height: 42px; font-size: 18px; }
            .image-modal img { max-height: 80vh; }
            .delete-btn { width: 20px; height: 20px; font-size: 10px; top: -5px; right: -5px; }
            .floating-keyboard-btn { width: 56px; height: 56px; font-size: 26px; bottom: 20px; right: 20px; }
        }
        ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
</head>
<body>

<div id="authScreen">
    <div class="auth-header">
        <div class="brand">
            <span class="brand-icon">📱</span>
            <span>SMS Чат</span>
        </div>
    </div>
    <div class="auth-content">
        <h1>💬 Добро пожаловать</h1>
        <p class="subtitle">Войдите в свой мессенджер</p>
        <div class="auth-form">
            <label>👤 Ваш логин</label>
            <input type="text" id="usernameInput" placeholder="Введите ник" maxlength="20">
            <label>🔑 GitHub Token</label>
            <input type="password" id="tokenInput" placeholder="Вставьте токен доступа">
            <div class="help-text"><a href="https://github.com/settings/tokens/new" target="_blank">Создать токен</a> (права <strong>repo</strong>)</div>
            <div class="error-msg" id="authError">❌ Неверный токен или нет доступа</div>
            <button class="btn" id="loginBtn">🚀 Войти</button>
            <button class="btn btn-secondary" id="clearDataBtn">🗑️ Очистить данные</button>
        </div>
    </div>
</div>

<div id="chatScreen">
    <div class="chat-header">
        <div class="left">
            <div class="avatar" id="userAvatar">?</div>
            <div class="info">
                <h2 id="chatTitle">Общий чат</h2>
            </div>
        </div>
        <button class="exit-btn" id="exitBtn" title="Выйти">✕</button>
    </div>

    <div class="messages-container" id="messagesContainer">
        <div class="messages-inner" id="messagesInner">
            <div class="skeleton other"></div>
            <div class="skeleton own"></div>
            <div class="skeleton other"></div>
        </div>
    </div>

    <div class="input-bar" id="inputBar">
        <button class="close-panel-btn" id="closePanelBtn" title="Скрыть панель">✕</button>
        <textarea id="messageInput" rows="1" placeholder="Напишите сообщение..." maxlength="5000"></textarea>
        <div class="action-buttons">
            <button class="file-btn" id="fileBtn" title="Прикрепить изображение">📎</button>
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<button class="floating-keyboard-btn" id="floatingKeyboardBtn" title="Показать панель ввода">⌨️</button>

<div class="image-modal" id="imageModal">
    <button class="close-modal" id="closeModalBtn">✕</button>
    <img id="modalImage" src="" alt="Увеличенное изображение">
</div>

<div class="toast" id="toast"></div>

<script>
// ===================================================================
//  КОНФИГУРАЦИЯ
// ===================================================================
const CONFIG = {
    repoOwner: '2d3t',
    repoName: '2d3t',
    filePath: 'pro/SMS/chat.json',
    pollInterval: 5000,
    maxMessages: 24,
    maxImageSize: 8 * 1024 * 1024,
};

// ===================================================================
//  ЗВУКИ
// ===================================================================
class SoundManager {
    constructor() {
        this.enabled = true;
        this.sounds = {};
        this.initSounds();
    }
    initSounds() {
        this.sounds.send = this.createBeep(600, 0.1);
        this.sounds.receive = this.createBeep(800, 0.15);
        this.sounds.error = this.createBeep(300, 0.3);
        this.sounds.delete = this.createBeep(400, 0.1);
        this.sounds.click = this.createBeep(500, 0.05);
    }
    createBeep(freq, duration) {
        return {
            play: () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + duration);
                } catch (e) { /* игнорируем */ }
            }
        };
    }
    play(type) {
        if (!this.enabled) return;
        if (this.sounds[type]) this.sounds[type].play();
    }
    toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
    }
}
const soundManager = new SoundManager();

// ===================================================================
//  СОСТОЯНИЕ
// ===================================================================
let state = {
    username: '',
    token: '',
    messages: [],
    sha: null,
    isPolling: false,
    isSending: false,
    lastMessageCount: 0,
    isAuthorized: false,
    _lastSentMessageId: null,
};

let networkState = {
    isOnline: navigator.onLine,
};

// ===================================================================
//  DOM
// ===================================================================
const $ = id => document.getElementById(id);
const authScreen = $('authScreen');
const chatScreen = $('chatScreen');
const usernameInput = $('usernameInput');
const tokenInput = $('tokenInput');
const loginBtn = $('loginBtn');
const authError = $('authError');
const clearDataBtn = $('clearDataBtn');
const messagesContainer = $('messagesContainer');
const messagesInner = $('messagesInner');
const messageInput = $('messageInput');
const sendBtn = $('sendBtn');
const fileBtn = $('fileBtn');
const exitBtn = $('exitBtn');
const userAvatar = $('userAvatar');
const chatTitle = $('chatTitle');
const toast = $('toast');
const inputBar = $('inputBar');
const closePanelBtn = $('closePanelBtn');
const floatingKeyboardBtn = $('floatingKeyboardBtn');
const imageModal = $('imageModal');
const modalImage = $('modalImage');
const closeModalBtn = $('closeModalBtn');

// ===================================================================
//  УПРАВЛЕНИЕ ПАНЕЛЬЮ ВВОДА
// ===================================================================
function showInputBar() {
    inputBar.classList.remove('hidden');
    floatingKeyboardBtn.classList.remove('show');
    setTimeout(() => {
        messageInput.focus();
        scrollToBottom();
    }, 100);
}
function hideInputBar() {
    inputBar.classList.add('hidden');
    floatingKeyboardBtn.classList.add('show');
    messageInput.blur();
}
function toggleInputBar() {
    if (inputBar.classList.contains('hidden')) showInputBar();
    else hideInputBar();
}

// ===================================================================
//  ВСПОМОГАТЕЛЬНЫЕ
// ===================================================================
function getInitials(name) { return name.charAt(0).toUpperCase(); }
function formatDate(iso) { return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); }
function formatFullTime(iso) {
    const date = new Date(iso);
    const time = date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const day = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    return `${day} ${time}`;
}
function showToast(text, duration = 2000) {
    toast.textContent = text;
    toast.style.display = 'block';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, duration);
}

function scrollToBottom() {
    requestAnimationFrame(() => {
        if (messagesContainer.scrollHeight > messagesContainer.clientHeight) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ===================================================================
//  ПРОВЕРКА СЕТИ
// ===================================================================
async function checkNetwork() {
    if (!navigator.onLine) {
        networkState.isOnline = false;
        return false;
    }
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const response = await fetch('https://api.github.com/rate_limit', {
            method: 'GET',
            signal: controller.signal,
            cache: 'no-store'
        });
        clearTimeout(timeoutId);
        if (response.ok || response.status === 403 || response.status === 401) {
            networkState.isOnline = true;
            return true;
        }
        networkState.isOnline = false;
        return false;
    } catch (error) {
        networkState.isOnline = false;
        return false;
    }
}

window.addEventListener('online', async () => {
    const ok = await checkNetwork();
    if (ok) {
        showToast('🌐 Соединение восстановлено', 2000);
        await pollUpdates();
    }
});

window.addEventListener('offline', () => {
    networkState.isOnline = false;
    showToast('📵 Нет подключения к интернету', 2500);
});

setInterval(() => {
    if (chatScreen.style.display === 'flex' && state.isAuthorized) {
        checkNetwork();
    }
}, 15000);

// ===================================================================
//  РАБОТА С ИЗОБРАЖЕНИЯМИ
// ===================================================================
function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.8) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > maxWidth || height > maxHeight) {
                    const ratio = Math.min(maxWidth / width, maxHeight / height);
                    width = Math.round(width * ratio);
                    height = Math.round(height * ratio);
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    });
}
function openImageModal(imageUrl) {
    modalImage.src = imageUrl;
    imageModal.classList.add('active');
    document.body.style.overflow = 'hidden';
}
function closeImageModal() {
    imageModal.classList.remove('active');
    document.body.style.overflow = '';
}

// ===================================================================
//  КОРРЕКТНАЯ РАБОТА С UTF-8 В GITHUB
// ===================================================================
function utf8ToBase64(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    let binary = '';
    utf8Bytes.forEach(byte => binary += String.fromCharCode(byte));
    return btoa(binary);
}
function base64ToUtf8(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder('utf-8').decode(bytes);
}

// ===================================================================
//  GITHUB API
// ===================================================================
function getHeaders(token) {
    return {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
    };
}

async function fetchFile(token, owner, repo, path) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    try {
        const response = await fetch(url, {
            headers: getHeaders(token),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (response.status === 404) return { exists: false };
        if (!response.ok) throw new Error(`GitHub API: ${response.status}`);
        const data = await response.json();
        const content = JSON.parse(base64ToUtf8(data.content));
        return { exists: true, sha: data.sha, content: content };
    } catch (error) {
        clearTimeout(timeoutId);
        throw error;
    }
}

async function saveFile(token, owner, repo, path, content, sha) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const jsonString = JSON.stringify(content, null, 2);
    const encoded = utf8ToBase64(jsonString);
    const body = {
        message: `💬 Обновление чата`,
        content: encoded
    };
    if (sha) body.sha = sha;
    const response = await fetch(url, {
        method: 'PUT',
        headers: getHeaders(token),
        body: JSON.stringify(body)
    });
    if (!response.ok) {
        const error = await response.json();
        throw new Error(error.message || `HTTP ${response.status}`);
    }
    const data = await response.json();
    return data.content.sha;
}

// ===================================================================
//  ЗАГРУЗКА / ОТПРАВКА / УДАЛЕНИЕ
// ===================================================================
async function loadMessages(showLoading = true) {
    if (!state.isAuthorized) {
        messagesInner.innerHTML = `
            <div class="message system">🔒 Доступ закрыт</div>
            <div class="message system" style="font-size:12px;color:#555;">Неверный токен или недостаточно прав</div>
        `;
        return;
    }
    try {
        if (showLoading) {
            messagesInner.innerHTML = `
                <div class="skeleton other"></div>
                <div class="skeleton own"></div>
                <div class="skeleton other"></div>
                <div class="skeleton own"></div>
            `;
        }
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        if (!result.exists) {
            state.messages = [];
            state.sha = null;
            state.lastMessageCount = 0;
            renderMessages([]);
            return;
        }
        state.messages = result.content || [];
        state.sha = result.sha;
        state.lastMessageCount = state.messages.length;
        renderMessages(state.messages);
        scrollToBottom();
    } catch (error) {
        console.error('Ошибка загрузки:', error);
        state.isAuthorized = false;
        messagesInner.innerHTML = `
            <div class="message system">⚠️ Ошибка доступа</div>
            <div class="message system" style="font-size:12px;color:#555;">${error.message}</div>
        `;
        showToast('❌ Ошибка доступа к репозиторию', 3000);
    }
}

async function sendMessage(text, imageData = null) {
    if (!state.isAuthorized) {
        showToast('❌ Нет доступа для отправки', 2000);
        return;
    }
    if (!navigator.onLine || !networkState.isOnline) {
        showToast('📵 Нет подключения к интернету', 2500);
        soundManager.play('error');
        return;
    }
    const hasText = text && text.trim();
    const hasImage = imageData !== null;
    if ((!hasText && !hasImage) || state.isSending) return;

    state.isSending = true;
    sendBtn.disabled = true;

    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        let messages = result.exists ? (result.content || []) : [];
        let sha = result.exists ? result.sha : null;

        const messageId = Date.now();
        const newMessage = {
            id: messageId,
            username: state.username,
            text: hasText ? text.trim() : '',
            time: new Date().toISOString()
        };
        if (hasImage) newMessage.image = imageData;

        state._lastSentMessageId = messageId;

        messages.push(newMessage);
        if (messages.length > CONFIG.maxMessages) messages = messages.slice(-CONFIG.maxMessages);

        const newSha = await saveFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath, messages, sha);
        state.messages = messages;
        state.sha = newSha;
        state.lastMessageCount = messages.length;

        messageInput.value = '';
        messageInput.style.height = 'auto';
        renderMessages(messages);
        scrollToBottom();

        soundManager.play('click');
        soundManager.play('send');
        showToast('✅ Отправлено!', 1000);
    } catch (error) {
        console.error('Ошибка:', error);
        soundManager.play('error');
        const isNetworkError =
            !navigator.onLine ||
            error.name === 'AbortError' ||
            error.name === 'TypeError' ||
            error.message.includes('Failed to fetch') ||
            error.message.includes('NetworkError');
        if (isNetworkError) {
            networkState.isOnline = false;
            showToast('📵 Соединение потеряно', 2500);
        } else {
            showToast('❌ Ошибка: ' + error.message, 3000);
        }
        if (error.message.includes('403') || error.message.includes('401')) {
            state.isAuthorized = false;
            loadMessages(false);
        }
        state._lastSentMessageId = null;
    } finally {
        state.isSending = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
}

async function deleteMessage(messageId) {
    if (!state.isAuthorized) {
        showToast('❌ Нет доступа', 1500);
        return;
    }
    if (!navigator.onLine || !networkState.isOnline) {
        showToast('📵 Нет подключения к интернету', 2500);
        return;
    }
    if (!confirm('Удалить это сообщение?')) return;
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        if (!result.exists) return;
        let messages = result.content || [];
        const messageIndex = messages.findIndex(msg => msg.id === messageId);
        if (messageIndex === -1) { showToast('❌ Сообщение не найдено', 1500); return; }
        if (messages[messageIndex].username !== state.username) {
            showToast('❌ Можно удалять только свои сообщения', 1500);
            return;
        }
        messages.splice(messageIndex, 1);
        const newSha = await saveFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath, messages, result.sha);
        state.messages = messages;
        state.sha = newSha;
        state.lastMessageCount = messages.length;
        renderMessages(messages);
        soundManager.play('delete');
        showToast('🗑️ Сообщение удалено', 1000);
    } catch (error) {
        console.error('Ошибка удаления:', error);
        soundManager.play('error');
        const isNetworkError =
            !navigator.onLine ||
            error.name === 'AbortError' ||
            error.name === 'TypeError' ||
            error.message.includes('Failed to fetch');
        if (isNetworkError) {
            networkState.isOnline = false;
            showToast('📵 Соединение потеряно', 2500);
        } else {
            showToast('❌ Ошибка: ' + error.message, 3000);
        }
        if (error.message.includes('403') || error.message.includes('401')) {
            state.isAuthorized = false;
            loadMessages(false);
        }
    }
}

async function handleFileUpload(file) {
    if (!file) return;
    if (!state.isAuthorized) { showToast('❌ Нет доступа', 2000); return; }
    if (!navigator.onLine || !networkState.isOnline) {
        showToast('📵 Нет подключения к интернету', 2500);
        return;
    }
    if (!file.type.startsWith('image/')) { showToast('❌ Пожалуйста, выберите изображение', 2000); return; }
    if (file.size > CONFIG.maxImageSize) {
        showToast(`❌ Изображение слишком большое (макс. ${CONFIG.maxImageSize / 1024 / 1024}MB)`, 3000);
        return;
    }
    try {
        showToast('⏳ Обработка изображения...', 1500);
        const compressedImage = await compressImage(file, 800, 800, 0.8);
        await sendMessage('', compressedImage);
    } catch (error) {
        console.error('Ошибка загрузки изображения:', error);
        showToast('❌ Ошибка при обработке изображения', 3000);
    }
}

// ===================================================================
//  РЕНДЕРИНГ
// ===================================================================
function renderMessages(messages) {
    if (!messages || messages.length === 0) {
        messagesInner.innerHTML = `
            <div class="message system">💬 История пуста</div>
            <div class="message system" style="font-size:12px;color:#555;">Напишите первое сообщение!</div>
        `;
        return;
    }
    let html = '', lastDate = '';
    messages.forEach((msg) => {
        const msgDate = formatDate(msg.time);
        if (msgDate !== lastDate) { html += `<div class="message system">${msgDate}</div>`; lastDate = msgDate; }
        const isOwn = msg.username === state.username && state.isAuthorized;
        const senderName = msg.username || 'Аноним';
        const fullTime = formatFullTime(msg.time);

        let content = '';
        if (msg.text) {
            content += `<span class="text">${escapeHtml(msg.text)}</span>`;
        }
        if (msg.image) {
            content += `
                <div class="image-container" onclick="openImageModal('${msg.image}')">
                    <img src="${msg.image}" alt="Изображение" loading="lazy">
                </div>
            `;
        }

        html += `
            <div class="message-wrapper ${isOwn ? 'own' : 'other'}">
                <div class="message">
                    <span class="sender">${isOwn ? 'Вы' : senderName}</span>
                    ${content}
                    <span class="time">${fullTime}</span>
                </div>
                ${isOwn ? `<button class="delete-btn" onclick="deleteMessage(${msg.id})" title="Удалить">✕</button>` : ''}
            </div>
        `;
    });
    messagesInner.innerHTML = html;
    scrollToBottom();
}

// ===================================================================
//  ПОЛЛИНГ
// ===================================================================
async function pollUpdates() {
    if (state.isPolling || !state.token || !state.isAuthorized) return;
    state.isPolling = true;
    try {
        const result = await fetchFile(state.token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        if (!networkState.isOnline) {
            networkState.isOnline = true;
            showToast('🌐 Соединение восстановлено', 2000);
        }
        if (!result.exists) return;
        if (result.sha !== state.sha) {
            const newMessages = result.content || [];
            if (newMessages.length > state.lastMessageCount) {
                const newMessagesArray = newMessages.slice(state.lastMessageCount);
                const hasOwnMessage = newMessagesArray.some(msg =>
                    msg.username === state.username &&
                    msg.id === state._lastSentMessageId
                );
                state.messages = newMessages;
                state.sha = result.sha;
                state.lastMessageCount = newMessages.length;
                renderMessages(newMessages);
                scrollToBottom();
                if (!hasOwnMessage) {
                    soundManager.play('receive');
                } else {
                    state._lastSentMessageId = null;
                }
            } else {
                state.sha = result.sha;
                state.messages = newMessages;
                state.lastMessageCount = newMessages.length;
            }
        }
    } catch (error) {
        console.error('Polling error:', error);
        const isNetworkError =
            !navigator.onLine ||
            error.name === 'AbortError' ||
            error.name === 'TypeError' ||
            error.message.includes('Failed to fetch') ||
            error.message.includes('NetworkError');
        if (isNetworkError) {
            if (networkState.isOnline) {
                networkState.isOnline = false;
                showToast('📵 Соединение потеряно', 2500);
            }
            state.isPolling = false;
            return;
        }
        if (error.message.includes('403') || error.message.includes('401')) {
            state.isAuthorized = false;
            loadMessages(false);
        }
    } finally {
        state.isPolling = false;
    }
}

function startPolling() {
    if (window._pollInterval) clearInterval(window._pollInterval);
    window._pollInterval = setInterval(pollUpdates, CONFIG.pollInterval);
}

// ===================================================================
//  АВТОРИЗАЦИЯ И ВЫХОД
// ===================================================================
async function login() {
    const username = usernameInput.value.trim();
    const token = tokenInput.value.trim();
    if (!username) { authError.textContent = '❌ Введите имя'; authError.style.display = 'block'; return; }
    if (!token) { authError.textContent = '❌ Введите GitHub токен'; authError.style.display = 'block'; return; }
    authError.style.display = 'none';

    try {
        const test = await fetchFile(token, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
        state.username = username;
        state.token = token;
        state.isAuthorized = true;
        localStorage.setItem('chathub_username', username);
        localStorage.setItem('chathub_token', token);

        authScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        userAvatar.textContent = getInitials(username);
        chatTitle.textContent = `Чат (${username})`;
        showInputBar();
        await loadMessages(true);
        startPolling();
        await checkNetwork();
    } catch (error) {
        console.error('Ошибка доступа:', error);
        authError.textContent = '❌ Неверный токен или нет доступа к репозиторию';
        authError.style.display = 'block';
        state.isAuthorized = false;
    }
}

function logout() {
    if (window._pollInterval) clearInterval(window._pollInterval);
    state.isPolling = false;
    state.isAuthorized = false;
    state._lastSentMessageId = null;

    authScreen.style.display = 'flex';
    chatScreen.style.display = 'none';
    authError.style.display = 'none';
    state.messages = [];
    state.sha = null;
    state.lastMessageCount = 0;
    closeImageModal();
    hideInputBar();
    showToast('👋 Вы вышли из чата', 1500);
}

// ===================================================================
loginBtn.addEventListener('click', login);
usernameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tokenInput.focus(); });
tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

sendBtn.addEventListener('click', () => {
    const text = messageInput.value;
    if (text.trim()) {
        sendBtn.classList.add('clicked');
        setTimeout(() => sendBtn.classList.remove('clicked'), 200);
        sendMessage(text);
    }
});

messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = messageInput.value;
        if (text.trim()) {
            sendBtn.classList.add('clicked');
            setTimeout(() => sendBtn.classList.remove('clicked'), 200);
            sendMessage(text);
        }
    }
});

messageInput.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
});

fileBtn.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
        if (e.target.files.length > 0) handleFileUpload(e.target.files[0]);
        input.remove();
    };
    input.click();
});

exitBtn.addEventListener('click', logout);

clearDataBtn.addEventListener('click', () => {
    if (confirm('Очистить сохранённые данные?')) {
        localStorage.removeItem('chathub_username');
        localStorage.removeItem('chathub_token');
        usernameInput.value = '';
        tokenInput.value = '';
        showToast('🗑️ Данные очищены', 1500);
    }
});

floatingKeyboardBtn.addEventListener('click', showInputBar);
closePanelBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    hideInputBar();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        closeImageModal();
        if (!inputBar.classList.contains('hidden')) hideInputBar();
    }
});

closeModalBtn.addEventListener('click', closeImageModal);
imageModal.addEventListener('click', (e) => {
    if (e.target === imageModal) closeImageModal();

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'm') {
        e.preventDefault();
        const enabled = soundManager.toggle();
        showToast(`🔊 Звук ${enabled ? 'включён' : 'выключен'}`, 1000);
    }
});

// ===================================================================
//  ВОССТАНОВЛЕНИЕ СЕССИИ
// ===================================================================
async function restoreSession() {
    const savedUsername = localStorage.getItem('chathub_username');
    const savedToken = localStorage.getItem('chathub_token');
    if (savedUsername) usernameInput.value = savedUsername;
    if (savedToken) tokenInput.value = savedToken;
    if (savedUsername && savedToken) {
        try {
            const test = await fetchFile(savedToken, CONFIG.repoOwner, CONFIG.repoName, CONFIG.filePath);
            state.username = savedUsername;
            state.token = savedToken;
            state.isAuthorized = true;
            authScreen.style.display = 'none';
            chatScreen.style.display = 'flex';
            userAvatar.textContent = getInitials(savedUsername);
            chatTitle.textContent = `Чат (${savedUsername})`;
            showInputBar();
            await loadMessages(true);
            startPolling();
            await checkNetwork();
        } catch (error) {
            console.log('Автовход не удался, ждём ручного входа');
            state.isAuthorized = false;
        }
    }
}
