<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шумомер + Люксметр 2 в 1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            max-width: 1020px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 24px 28px 32px;
            box-shadow: 0 20px 40px rgba(0, 20, 50, 0.12);
        }
        h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            margin: 0 0 4px 0;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .mode-tabs {
            display: flex;
            gap: 8px;
            background: #eef3fa;
            padding: 6px;
            border-radius: 60px;
            margin: 0 0 14px 0;
            flex-wrap: wrap;
        }
        .mode-tab {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            color: #2c4b6b;
            flex: 1 0 auto;
        }
        .mode-tab.active {
            background: #1a5cff;
            color: white;
            box-shadow: 0 4px 12px rgba(26, 92, 255, 0.3);
        }
        .mode-tab.active-lux {
            background: #f5a623;
            color: white;
            box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3);
        }
        .mode-tab:hover:not(.active):not(.active-lux) {
            background: #d9e3ef;
        }
        .sub {
            color: #2c4b6b;
            opacity: 0.7;
            font-weight: 400;
            font-size: 0.95rem;
            margin-top: -4px;
            margin-bottom: 20px;
            padding-left: 16px;
            border-left: 4px solid #3b7cff;
            transition: 0.3s;
        }
        .sub.lux-mode {
            border-left-color: #f5a623;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 680px) {
            .grid-2col {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
        .meter-panel {
            border-radius: 28px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: 0.3s;
        }
        .meter-panel.noise-mode {
            background: #eef3fa;
        }
        .meter-panel.lux-mode {
            background: #f5f0e8;
        }
        .db-big {
            font-size: 4.2rem;
            font-weight: 700;
            color: #0b1e33;
            line-height: 1;
            letter-spacing: -2px;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .db-big small {
            font-size: 1.8rem;
            font-weight: 400;
            color: #3b5d7c;
            margin-left: 6px;
        }
        .lx-big {
            font-size: 4.2rem;
            font-weight: 700;
            color: #1a2a0b;
            line-height: 1;
            letter-spacing: -2px;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .lx-big small {
            font-size: 1.8rem;
            font-weight: 400;
            color: #5c7c3b;
            margin-left: 6px;
        }
        .max-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-top: 12px;
            padding: 8px 16px 8px 18px;
            border-radius: 40px;
        }
        .max-row.noise-mode {
            background: #d9e3ef;
        }
        .max-row.lux-mode {
            background: #e8e0d5;
        }
        .max-label {
            font-weight: 500;
        }
        .max-label.noise-mode {
            color: #12344d;
        }
        .max-label.lux-mode {
            color: #3d4d2a;
        }
        .max-value {
            font-weight: 700;
            font-size: 1.7rem;
        }
        .max-value.noise-mode {
            color: #00337a;
        }
        .max-value.lux-mode {
            color: #7a5a00;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }
        .btn {
            border: none;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            transition: 0.15s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #cddcee;
            color: #102a40;
            flex: 1 0 auto;
            justify-content: center;
        }
        .btn-primary {
            background: #1a5cff;
            border: 1px solid #1a5cff;
            color: white;
            box-shadow: 0 8px 14px -6px #1a5cff60;
        }
        .btn-primary:hover {
            background: #0a4ad0;
            transform: scale(0.97);
        }
        .btn-primary-lux {
            background: #f5a623;
            border: 1px solid #f5a623;
            color: white;
            box-shadow: 0 8px 14px -6px #f5a62360;
        }
        .btn-primary-lux:hover {
            background: #d98e1f;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b8cee8;
        }
        .btn-outline:hover {
            background: #e3edf7;
        }
        .btn-danger {
            background: #ff4d6d;
            border: 1px solid #ff4d6d;
            color: white;
        }
        .btn-danger:hover {
            background: #e63456;
        }
        .btn-success {
            background: #2b8c5e;
            border: 1px solid #2b8c5e;
            color: white;
        }
        .btn-success:hover {
            background: #1f704b;
        }
        .btn-warning {
            background: #f5a623;
            border: 1px solid #f5a623;
            color: white;
        }
        .btn-warning:hover {
            background: #d98e1f;
        }
        .save-area {
            border-radius: 40px;
            padding: 12px 18px 16px;
            margin-top: 12px;
        }
        .save-area.noise-mode {
            background: #e6edf6;
        }
        .save-area.lux-mode {
            background: #ede6dc;
        }
        .save-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .save-row input {
            flex: 2 1 160px;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid #c2d6ea;
            background: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
            color: #0b1e33;
            font-weight: 500;
        }
        .save-row input:focus {
            border-color: #1a5cff;
            box-shadow: 0 0 0 3px #1a5cff30;
        }
        .save-row input.lux-mode:focus {
            border-color: #f5a623;
            box-shadow: 0 0 0 3px #f5a62330;
        }
        .save-row .btn {
            flex: 1 0 auto;
        }
        .saved-list {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
        }
        .saved-badge {
            background: white;
            border-radius: 40px;
            padding: 6px 16px 6px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #b0c8e0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #0b1a2b;
        }
        .saved-badge strong {
            color: #001f4a;
            font-weight: 800;
            font-size: 1.05rem;
        }
        .saved-badge .place-name {
            color: #0b1e33;
            font-weight: 700;
            background: #eef3fa;
            padding: 0 8px 0 4px;
            border-radius: 30px;
        }
        .saved-badge .del {
            cursor: pointer;
            opacity: 0.6;
            font-weight: 700;
            font-size: 1.3rem;
            line-height: 1;
            transition: 0.1s;
            color: #a0002a;
            margin-left: 2px;
        }
        .saved-badge .del:hover {
            opacity: 1;
            color: #d1002b;
        }
        .chart-wrapper {
            background: #f8fafd;
            border-radius: 28px;
            padding: 16px 12px 8px;
            border: 1px solid #dae6f2;
            position: relative;
        }
        .status-led {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 12px;
            margin-right: 6px;
            background: #34c759;
        }
        .footer-note {
            font-size: 0.8rem;
            margin-top: 18px;
            text-align: center;
            opacity: 0.7;
        }
        .footer-note.noise-mode {
            color: #4c6e8a;
        }
        .footer-note.lux-mode {
            color: #5c6e4a;
        }
        .sensitivity-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding: 8px 16px 8px 20px;
            border-radius: 60px;
            flex-wrap: wrap;
        }
        .sensitivity-wrap.noise-mode {
            background: #dce6f2;
        }
        .sensitivity-wrap.lux-mode {
            background: #e8e0d5;
        }
        .sensitivity-wrap label {
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sensitivity-wrap label.noise-mode {
            color: #143450;
        }
        .sensitivity-wrap label.lux-mode {
            color: #3d4d2a;
        }
        .sensitivity-wrap input[type="range"] {
            flex: 2 1 140px;
            height: 5px;
            border-radius: 10px;
        }
        .sensitivity-wrap input[type="range"].noise-mode {
            accent-color: #1a5cff;
            background: #b3c9e2;
        }
        .sensitivity-wrap input[type="range"].lux-mode {
            accent-color: #f5a623;
            background: #d5c8b8;
        }
        .sens-value {
            font-weight: 700;
            min-width: 40px;
        }
        .sens-value.noise-mode {
            color: #00337a;
        }
        .sens-value.lux-mode {
            color: #7a5a00;
        }
        .jpeg-btn-wrap {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .calib-indicator {
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        .calib-indicator.noise-mode {
            background: #d4e2f5;
            color: #00337a;
        }
        .calib-indicator.lux-mode {
            background: #e8e0d5;
            color: #5c4a2a;
        }
        .auto-sens-badge {
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .auto-sens-badge.noise-mode {
            background: #c8ddf5;
            color: #00337a;
        }
        .auto-sens-badge.lux-mode {
            background: #e8e0d5;
            color: #5c4a2a;
        }
        .video-preview {
            width: 100%;
            max-height: 120px;
            border-radius: 16px;
            margin-top: 10px;
            border: 2px solid #d5c8b8;
            background: #1a1a1a;
            object-fit: cover;
            display: none;
        }
        .camera-status {
            font-size: 0.8rem;
            color: #5c6e4a;
            margin-top: 6px;
            text-align: center;
        }
        .unit-toggle {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-left: auto;
            background: #eef3fa;
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #0b1e33;
        }
        .unit-toggle select {
            border: none;
            background: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="card" id="appCard">
        <h1>
            <span id="mainIcon">🎙️</span>
            <span id="mainTitle">Шумомер</span>
            <span style="font-size: 1rem; font-weight: 400; background: #eaf1fa; padding: 4px 18px; border-radius: 40px; margin-left: auto;">
                <span class="status-led"></span> реальное время
            </span>
        </h1>

        <!-- Вкладки переключения режимов -->
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="noise" id="tabNoise">🎙️ Шумомер</button>
            <button class="mode-tab" data-mode="lux" id="tabLux">☀️ Люксметр</button>
        </div>

        <div class="sub" id="subText">Микрофон · график · максимум · калибровка · авточувствительность</div>

        <div class="grid-2col">
            <!-- левая панель -->
            <div class="meter-panel noise-mode" id="meterPanel">
                <!-- Шумомер (noise) -->
                <div id="noiseDisplay">
                    <div class="db-big">
                        <span id="currentDb">0.0</span>
                        <small>dB</small>
                    </div>
                    <div class="max-row noise-mode">
                        <span class="max-label noise-mode">📈 максимум</span>
                        <span class="max-value noise-mode" id="maxDb">0.0</span>
                    </div>
                </div>
                <!-- Люксметр (lux) -->
                <div id="luxDisplay" class="hidden">
                    <div class="lx-big">
                        <span id="currentLx">0</span>
                        <small>lx</small>
                    </div>
                    <div class="max-row lux-mode">
                        <span class="max-label lux-mode">📈 максимум</span>
                        <span class="max-value lux-mode" id="maxLx">0</span>
                    </div>
                </div>

                <!-- чувствительность + авто -->
                <div class="sensitivity-wrap noise-mode" id="sensWrap">
                    <label id="sensLabel" class="noise-mode">🔊 чувствит.</label>
                    <input type="range" id="sensSlider" min="0.2" max="6.0" step="0.05" value="2.0" class="noise-mode">
                    <span class="sens-value noise-mode" id="sensValue">2.00</span>
                    <button class="btn btn-warning" id="autoSensBtn" style="flex:0 1 auto; padding: 6px 16px; font-size:0.8rem;">🤖 Авто</button>
                    <span class="auto-sens-badge noise-mode" id="autoSensStatus">выкл</span>
                </div>

                <!-- калибровка -->
                <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                    <button class="btn btn-outline" id="calibrateBtn" style="flex:0 1 auto;" id="calibrateBtn">📐 Калибровать</button>
                    <span class="calib-indicator noise-mode" id="calibStatus">не калиброван</span>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="resetMaxBtn">🔄 Сброс макс.</button>
                    <button class="btn btn-outline" id="clearHistoryBtn">🧹 Очистить график</button>
                </div>

                <div class="save-area noise-mode" id="saveArea">
                    <div class="save-row">
                        <input type="text" id="placeNameInput" placeholder="Название места" value="Комната">
                        <button class="btn btn-primary" id="saveMaxBtn">💾 Сохранить</button>
                    </div>
                    <div id="savedContainer" class="saved-list"></div>
                    <div class="jpeg-btn-wrap">
                        <button class="btn btn-success" id="saveJpegBtn">🖼️ Сохранить список как JPEG</button>
                    </div>
                </div>
            </div>

            <!-- правая панель: график -->
            <div style="display: flex; flex-direction: column; justify-content: center;">
                <div class="chart-wrapper" id="chartWrapper">
                    <canvas id="realtimeChart" width="400" height="220" style="width:100%; height:auto; max-height:220px;"></canvas>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.75rem; color: #386282; padding: 0 6px;">
                    <span id="updateInfo">⏱️ обновление ~200 мс</span>
                    <span id="pointsCount">0 точек</span>
                </div>
                <!-- Видео превью для люксметра -->
                <video id="videoPreview" class="video-preview" autoplay playsinline></video>
                <div class="camera-status" id="cameraStatus">📷 Камера не активна</div>
            </div>
        </div>
        <div class="footer-note noise-mode" id="footerNote">Максимальная шкала — 120 дБ. Калибровка вычитает фоновый шум.</div>
    </div>

    <script>
        (function() {
            // ---- DOM ----
            const tabNoise = document.getElementById('tabNoise');
            const tabLux = document.getElementById('tabLux');
            const subText = document.getElementById('subText');
            const meterPanel = document.getElementById('meterPanel');
            const noiseDisplay = document.getElementById('noiseDisplay');
            const luxDisplay = document.getElementById('luxDisplay');
            const sensWrap = document.getElementById('sensWrap');
            const sensLabel = document.getElementById('sensLabel');
            const sensSlider = document.getElementById('sensSlider');
            const sensValueEl = document.getElementById('sensValue');
            const calibStatus = document.getElementById('calibStatus');
            const autoSensStatus = document.getElementById('autoSensStatus');
            const saveArea = document.getElementById('saveArea');
            const footerNote = document.getElementById('footerNote');
            const mainIcon = document.getElementById('mainIcon');
            const mainTitle = document.getElementById('mainTitle');
            const updateInfo = document.getElementById('updateInfo');
            const videoPreview = document.getElementById('videoPreview');
            const cameraStatus = document.getElementById('cameraStatus');

            const currentDbEl = document.getElementById('currentDb');
            const maxDbEl = document.getElementById('maxDb');
            const currentLxEl = document.getElementById('currentLx');
            const maxLxEl = document.getElementById('maxLx');
            const resetMaxBtn = document.getElementById('resetMaxBtn');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const saveMaxBtn = document.getElementById('saveMaxBtn');
            const placeNameInput = document.getElementById('placeNameInput');
            const savedContainer = document.getElementById('savedContainer');
            const pointsCountEl = document.getElementById('pointsCount');
            const calibrateBtn = document.getElementById('calibrateBtn');
            const autoSensBtn = document.getElementById('autoSensBtn');
            const saveJpegBtn = document.getElementById('saveJpegBtn');

            // ---- Состояние ----
            let currentMode = 'noise'; // 'noise' или 'lux'
            let currentMaxNoise = 0;
            let currentMaxLux = 0;
            let historyData = [];
            const MAX_POINTS = 120;
            let sensitivity = 2.0;
            let calibrationOffset = 0;
            let isAutoSens = false;
            let autoSensTimer = null;
            let rawBuffer = [];

            // Сохранённые записи
            let savedRecords = [];
            try {
                const stored = localStorage.getItem('combined_saved_records');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) savedRecords = parsed;
                }
            } catch (e) {}

            // ---- Chart.js ----
            const ctx = document.getElementById('realtimeChart').getContext('2d');
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Уровень',
                        data: [],
                        borderColor: '#1a5cff',
                        backgroundColor: 'rgba(26, 92, 255, 0.08)',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        tension: 0.2,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: true } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 10, font: { size: 9 } } },
                        y: {
                            min: 0,
                            max: 120,
                            grid: { color: '#dde6f0' },
                            ticks: { stepSize: 20, font: { size: 9 } }
                        }
                    },
                    elements: { line: { borderJoinStyle: 'round' } }
                }
            });

            // ---- Микрофон ----
            let audioContext = null;
            let analyser = null;
            let dataArray = null;
            let audioRunning = false;

            // ---- Камера ----
            let stream = null;
            let cameraRunning = false;
            let cameraFrameTimer = null;

            // ---- UI обновление ----
            function setMode(mode) {
                currentMode = mode;
                const isNoise = mode === 'noise';
                const isLux = mode === 'lux';

                // Вкладки
                tabNoise.classList.toggle('active', isNoise);
                tabNoise.classList.toggle('active-lux', false);
                tabLux.classList.toggle('active', false);
                tabLux.classList.toggle('active-lux', isLux);

                // Заголовок
                mainIcon.textContent = isNoise ? '🎙️' : '☀️';
                mainTitle.textContent = isNoise ? 'Шумомер' : 'Люксметр';

                // Подзаголовок
                subText.textContent = isNoise ?
                    'Микрофон · график · максимум · калибровка · авточувствительность' :
                    'Фронтальная камера · график · максимум · калибровка · авторегулировка';
                subText.className = 'sub' + (isLux ? ' lux-mode' : '');

                // Панель
                meterPanel.className = 'meter-panel' + (isNoise ? ' noise-mode' : ' lux-mode');

                // Отображение значений
                noiseDisplay.classList.toggle('hidden', !isNoise);
                luxDisplay.classList.toggle('hidden', !isLux);

                // Чувствительность
                sensWrap.className = 'sensitivity-wrap' + (isNoise ? ' noise-mode' : ' lux-mode');
                sensLabel.className = isNoise ? 'noise-mode' : 'lux-mode';
                sensLabel.textContent = isNoise ? '🔊 чувствит.' : '🔆 чувствит.';
                sensSlider.className = isNoise ? 'noise-mode' : 'lux-mode';
                sensValueEl.className = 'sens-value' + (isNoise ? ' noise-mode' : ' lux-mode');
                if (isNoise) {
                    sensSlider.min = '0.2';
                    sensSlider.max = '6.0';
                    sensSlider.step = '0.05';
                } else {
                    sensSlider.min = '0.5';
                    sensSlider.max = '10.0';
                    sensSlider.step = '0.1';
                }
                // Сохраняем значение при переключении
                sensitivity = parseFloat(sensSlider.value);
                sensValueEl.textContent = sensitivity.toFixed(isNoise ? 2 : 1);

                // Калибровка
                calibStatus.className = 'calib-indicator' + (isNoise ? ' noise-mode' : ' lux-mode');
                calibrateBtn.textContent = isNoise ? '📐 Калибровать (тишина)' : '📐 Калибровать (темнота)';

                // Авто
                autoSensStatus.className = 'auto-sens-badge' + (isNoise ? ' noise-mode' : ' lux-mode');

                // Save area
                saveArea.className = 'save-area' + (isNoise ? ' noise-mode' : ' lux-mode');

                // Footer
                footerNote.className = 'footer-note' + (isNoise ? ' noise-mode' : ' lux-mode');
                footerNote.textContent = isNoise ?
                    'Максимальная шкала — 120 дБ. Калибровка вычитает фоновый шум.' :
                    'Измеряет яркость по среднему значению пикселей. Диапазон: 0-10000 люкс.';

                // Update info
                updateInfo.textContent = isNoise ? '⏱️ обновление ~200 мс' : '⏱️ обновление ~300 мс';

                // Кнопка сохранения
                const saveBtn = document.getElementById('saveMaxBtn');
                saveBtn.className = 'btn' + (isNoise ? ' btn-primary' : ' btn-primary-lux');

                // Обновляем график
                updateChartColors(isNoise);
                updateChart();

                // Показываем/скрываем статус камеры
                if (isLux) {
                    cameraStatus.style.display = 'block';
                } else {
                    cameraStatus.style.display = 'none';
                }

                // Переключаем источники данных
                if (isNoise) {
                    stopCamera();
                    if (!audioRunning) startAudio();
                } else {
                    stopAudio();
                    if (!cameraRunning) startCamera();
                }
            }

            function updateChartColors(isNoise) {
                const color = isNoise ? '#1a5cff' : '#f5a623';
                const bg = isNoise ? 'rgba(26, 92, 255, 0.08)' : 'rgba(245, 166, 35, 0.08)';
                chart.data.datasets[0].borderColor = color;
                chart.data.datasets[0].backgroundColor = bg;

                // Настройка шкалы Y
                chart.options.scales.y.max = isNoise ? 120 : 10000;
                chart.options.scales.y.ticks.stepSize = isNoise ? 20 : 1000;
                chart.options.scales.y.ticks.callback = isNoise ?
                    undefined :
                    function(value) { if (value >= 1000) return (value / 1000) + 'k'; return value; };
                chart.options.scales.y.grid.color = isNoise ? '#dde6f0' : '#e8e0d5';
            }

            // ---- Функции данных ----
            function addDataPoint(value) {
                if (currentMode === 'noise') {
                    // Для шумомера
                    if (value > currentMaxNoise) {
                        currentMaxNoise = value;
                        maxDbEl.textContent = currentMaxNoise.toFixed(1);
                    }
                    currentDbEl.textContent = value.toFixed(1);
                } else {
                    // Для люксметра
                    if (value > currentMaxLux) {
                        currentMaxLux = value;
                        maxLxEl.textContent = Math.round(currentMaxLux);
                    }
                    currentLxEl.textContent = Math.round(value);
                }

                historyData.push(value);
                if (historyData.length > MAX_POINTS) historyData.shift();
                updateChart();
                pointsCountEl.textContent = historyData.length + ' точек';
            }

            function updateChart() {
                const labels = historyData.map((_, i) => {
                    const step = currentMode === 'noise' ? 0.2 : 0.3;
                    return (i * step).toFixed(1) + 's';
                });
                chart.data.labels = labels;
                chart.data.datasets[0].data = historyData.slice();
                chart.update('none');
            }

            // ---- Обработка шума ----
            function processNoise(rawDb) {
                let calibrated = rawDb - calibrationOffset;
                if (calibrated < 0) calibrated = 0;
                let value = calibrated * sensitivity;
                if (value < 0) value = 0;
                if (value > 120) value = 120;
                value = Math.round(value * 10) / 10;

                addDataPoint(value);

                if (isAutoSens) {
                    rawBuffer.push(rawDb);
                    if (rawBuffer.length > 30) rawBuffer.shift();
                }
            }

            // ---- Обработка освещённости ----
            function processLux(normalized) {
                let calibrated = normalized - calibrationOffset;
                if (calibrated < 0) calibrated = 0;
                let value = calibrated * sensitivity * 100;
                if (value < 0) value = 0;
                if (value > 10000) value = 10000;
                value = Math.round(value);

                addDataPoint(value);

                if (isAutoSens) {
                    rawBuffer.push(normalized);
                    if (rawBuffer.length > 30) rawBuffer.shift();
                }
            }

            // ---- Авто-чувствительность ----
            function updateAutoSensitivity() {
                if (!isAutoSens || rawBuffer.length < 10) return;

                const sorted = [...rawBuffer].sort((a, b) => a - b);
                const median = sorted[Math.floor(sorted.length / 2)];

                let newSens;
                if (currentMode === 'noise') {
                    const target = 45;
                    if (median > 0.5) {
                        newSens = target / (median * 0.8);
                    } else {
                        newSens = 1.0;
                    }
                    newSens = Math.max(0.2, Math.min(6.0, newSens));
                } else {
                    const target = 0.5;
                    if (median > 0.01) {
                        newSens = target / (median * 100);
                    } else {
                        newSens = 2.0;
                    }
                    newSens = Math.max(0.5, Math.min(10.0, newSens));
                }

                const diff = newSens - sensitivity;
                if (Math.abs(diff) > 0.05) {
                    sensitivity += diff * 0.15;
                    if (currentMode === 'noise') {
                        sensitivity = Math.max(0.2, Math.min(6.0, sensitivity));
                    } else {
                        sensitivity = Math.max(0.5, Math.min(10.0, sensitivity));
                    }
                    sensSlider.value = sensitivity;
                    sensValueEl.textContent = sensitivity.toFixed(currentMode === 'noise' ? 2 : 1);
                }
            }

            // ---- Калибровка ----
            function calibrate() {
                if (currentMode === 'noise') {
                    if (!analyser) {
                        alert('Микрофон не инициализирован. Подождите...');
                        return;
                    }
                    const samples = [];
                    const startTime = Date.now();

                    function collectNoiseSamples() {
                        if (!analyser) return;
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for (let i = 0; i < dataArray.length; i++) {
                            sum += dataArray[i];
                        }
                        let avg = sum / dataArray.length;
                        let db = 0;
                        if (avg > 0) {
                            const normalized = avg / 255;
                            db = Math.min(120, Math.max(0, normalized * 120));
                            if (db < 1) db = 0;
                        }
                        samples.push(db);

                        if (Date.now() - startTime < 1000) {
                            requestAnimationFrame(collectNoiseSamples);
                        } else {
                            const avgDb = samples.reduce((s, v) => s + v, 0) / samples.length;
                            calibrationOffset = Math.round(avgDb * 10) / 10;
                            calibStatus.textContent = `калибр. ${calibrationOffset.toFixed(1)} dB`;
                            calibStatus.style.background = '#b8d9a0';
                            calibStatus.style.color = '#1a4a1a';
                        }
                    }
                    collectNoiseSamples();
                } else {
                    if (!stream) {
                        alert('Камера не инициализирована. Подождите...');
                        return;
                    }
                    const samples = [];
                    const startTime = Date.now();

                    function collectLuxSamples() {
                        if (!videoPreview.videoWidth) {
                            if (Date.now() - startTime < 3000) {
                                requestAnimationFrame(collectLuxSamples);
                            }
                            return;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = videoPreview.videoWidth;
                        canvas.height = videoPreview.videoHeight;
                        const ctx2 = canvas.getContext('2d');
                        ctx2.drawImage(videoPreview, 0, 0);
                        const imageData = ctx2.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;

                        let sum = 0;
                        for (let i = 0; i < data.length; i += 16) {
                            sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
                        }
                        const avg = sum / (data.length / 16);
                        const normalized = avg / 255;
                        samples.push(normalized);

                        if (Date.now() - startTime < 1000) {
                            requestAnimationFrame(collectLuxSamples);
                        } else {
                            const avgBrightness = samples.reduce((s, v) => s + v, 0) / samples.length;
                            calibrationOffset = avgBrightness;
                            calibStatus.textContent = `калибр. ${(avgBrightness * 100).toFixed(1)}%`;
                            calibStatus.style.background = '#c8d8b8';
                            calibStatus.style.color = '#2a4a1a';
                        }
                    }
                    collectLuxSamples();
                }
            }

            // ---- Аудио ----
            async function startAudio() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;
                    analyser.smoothingTimeConstant = 0.8;
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    audioRunning = true;
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }
                    readAudio();
                    return true;
                } catch (err) {
                    console.error('Audio init error:', err);
                    return false;
                }
            }

            function readAudio() {
                if (!audioRunning || !analyser || currentMode !== 'noise') return;
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let avg = sum / dataArray.length;
                let db = 0;
                if (avg > 0) {
                    const normalized = avg / 255;
                    db = Math.min(120, Math.max(0, normalized * 120));
                    if (db < 1) db = 0;
                    db = Math.round(db * 10) / 10;
                }

                processNoise(db);

                if (isAutoSens) {
                    if (!autoSensTimer) {
                        autoSensTimer = setInterval(updateAutoSensitivity, 500);
                    }
                } else {
                    if (autoSensTimer) {
                        clearInterval(autoSensTimer);
                        autoSensTimer = null;
                    }
                }

                requestAnimationFrame(readAudio);
            }

            function stopAudio() {
                audioRunning = false;
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close().catch(() => {});
                }
                audioContext = null;
                analyser = null;
            }

            // ---- Камера ----
            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 320 },
                            height: { ideal: 240 }
                        },
                        audio: false
                    });

                    videoPreview.srcObject = stream;
                    await videoPreview.play();
                    cameraStatus.textContent = '✅ Камера запущена';
                    cameraStatus.style.color = '#2a6a2a';
                    cameraRunning = true;
                    readCamera();
                    return true;
                } catch (err) {
                    cameraStatus.textContent = '❌ Ошибка доступа к камере';
                    cameraStatus.style.color = '#aa3333';
                    console.error('Camera init error:', err);
                    return false;
                }
            }

            function readCamera() {
                if (!cameraRunning || !stream || currentMode !== 'lux') {
                    if (cameraFrameTimer) {
                        clearTimeout(cameraFrameTimer);
                        cameraFrameTimer = null;
                    }
                    return;
                }

                try {
                    const canvas = document.createElement('canvas');
                    const video = videoPreview;

                    if (video.videoWidth > 0 && video.videoHeight > 0) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx2 = canvas.getContext('2d');
                        ctx2.drawImage(video, 0, 0);
                        const imageData = ctx2.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;

                        let sum = 0;
                        for (let i = 0; i < data.length; i += 16) {
                            sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
                        }
                        const avg = sum / (data.length / 16);
                        const normalized = avg / 255;

                        processLux(normalized);

                        if (isAutoSens) {
                            if (!autoSensTimer) {
                                autoSensTimer = setInterval(updateAutoSensitivity, 1000);
                            }
                        } else {
                            if (autoSensTimer) {
                                clearInterval(autoSensTimer);
                                autoSensTimer = null;
                            }
                        }
                    }
                } catch (e) {
                    // игнорируем
                }

                cameraFrameTimer = setTimeout(() => {
                    if (cameraRunning) readCamera();
                }, 300);
            }

            function stopCamera() {
                cameraRunning = false;
                if (cameraFrameTimer) {
                    clearTimeout(cameraFrameTimer);
                    cameraFrameTimer = null;
                }
                if (autoSensTimer) {
                    clearInterval(autoSensTimer);
                    autoSensTimer = null;
                }
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                videoPreview.srcObject = null;
                cameraStatus.textContent = '📷 Камера не активна';
                cameraStatus.style.color = '#5c6e4a';
            }

            // ---- Сохранение ----
            function saveCurrentMax() {
                const place = placeNameInput.value.trim() || 'Без названия';
                const value = currentMode === 'noise' ? currentMaxNoise : currentMaxLux;
                const unit = currentMode === 'noise' ? 'dB' : 'lx';
                if (value === 0) {
                    alert('Максимум 0. Подождите данных.');
                    return;
                }
                savedRecords.push({
                    place,
                    value: currentMode === 'noise' ? parseFloat(value.toFixed(1)) : Math.round(value),
                    unit,
                    mode: currentMode
                });
                savedRecords.sort((a, b) => b.value - a.value);
                localStorage.setItem('combined_saved_records', JSON.stringify(savedRecords));
                renderSavedRecords();
                saveMaxBtn.style.transform = 'scale(0.95)';
                setTimeout(() => saveMaxBtn.style.transform = '', 150);
            }

            function deleteSavedRecord(index) {
                savedRecords.splice(index, 1);
                localStorage.setItem('combined_saved_records', JSON.stringify(savedRecords));
                renderSavedRecords();
            }

            function renderSavedRecords() {
                if (savedRecords.length === 0) {
                    savedContainer.innerHTML =
                        `<span style="opacity:0.6; font-size:0.85rem; color:#1a2f44;">Нет сохранённых максимумов</span>`;
                    return;
                }
                let html = '';
                savedRecords.forEach((rec, idx) => {
                    const icon = rec.mode === 'noise' ? '🎙️' : '☀️';
                    html += `
                        <div class="saved-badge">
                            <strong>${rec.value} ${rec.unit}</strong>
                            <span class="place-name">${icon} ${rec.place}</span>
                            <span class="del" data-index="${idx}">✕</span>
                        </div>
                    `;
                });
                savedContainer.innerHTML = html;
                document.querySelectorAll('.saved-badge .del').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const index = parseInt(el.dataset.index, 10);
                        if (!isNaN(index)) deleteSavedRecord(index);
                    });
                });
            }

            // ---- JPEG ----
            async function saveListAsJpeg() {
                const container = document.createElement('div');
                container.style.cssText = `
                        background: #ffffff;
                        padding: 32px 40px;
                        border-radius: 32px;
                        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                        max-width: 600px;
                        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
                        position: fixed;
                        left: -9999px;
                        top: 0;
                        z-index: 9999;
                        color: #0b1a2b;
                    `;

                const title = document.createElement('h2');
                title.textContent = currentMode === 'noise' ? '📊 Сохранённые максимумы шума' :
                    '☀️ Сохранённые максимумы освещённости';
                title.style.cssText = 'margin: 0 0 8px 0; color: #0b1a2b; font-weight: 700; font-size: 1.8rem;';
                container.appendChild(title);

                const date = new Date().toLocaleString();
                const dateP = document.createElement('p');
                dateP.textContent = `Дата: ${date}`;
                dateP.style.cssText = 'margin: 0 0 20px 0; color: #1f3a55; font-size: 1rem; font-weight: 500;';
                container.appendChild(dateP);

                if (savedRecords.length === 0) {
                    const empty = document.createElement('p');
                    empty.textContent = 'Нет сохранённых записей.';
                    empty.style.cssText = 'color: #1f3a55; font-style: italic; font-size: 1.1rem;';
                    container.appendChild(empty);
                } else {
                    const list = document.createElement('ul');
                    list.style.cssText = 'list-style: none; padding: 0; margin: 0;';
                    savedRecords.forEach((rec, idx) => {
                        const li = document.createElement('li');
                        const bg = idx % 2 === 0 ? '#f5f9ff' : '#ffffff';
                        const icon = rec.mode === 'noise' ? '🎙️' : '☀️';
                        li.style.cssText = `
                                display: flex;
                                justify-content: space-between;
                                padding: 12px 16px;
                                border-bottom: 2px solid #d0dcec;
                                font-size: 1.2rem;
                                font-weight: 500;
                                color: #0b1a2b;
                                background: ${bg};
                            `;
                        if (idx === 0) {
                            li.style.background = '#e3edfb';
                            li.style.borderRadius = '12px 12px 0 0';
                            li.style.fontWeight = '600';
                        }
                        const placeSpan = document.createElement('span');
                        placeSpan.textContent = `${icon} ${rec.place}`;
                        placeSpan.style.color = '#001a33';
                        placeSpan.style.fontWeight = '700';
                        const valSpan = document.createElement('span');
                        valSpan.textContent = `${rec.value} ${rec.unit}`;
                        valSpan.style.fontWeight = '800';
                        valSpan.style.color = '#002b5e';
                        valSpan.style.fontSize = '1.3rem';
                        li.appendChild(placeSpan);
                        li.appendChild(valSpan);
                        list.appendChild(li);
                    });
                    container.appendChild(list);
                }

                const footer = document.createElement('div');
                footer.style.cssText =
                    'margin-top: 24px; font-size: 0.9rem; color: #1f3a55; border-top: 2px solid #cfdcec; padding-top: 16px; text-align: center; font-weight: 500;';
                footer.textContent = 'Сгенерировано измерителем';
                container.appendChild(footer);

                document.body.appendChild(container);

                try {
                    await new Promise(r => requestAnimationFrame(r));
                    const canvas = await html2canvas(container, {
                        scale: 2,
                        backgroundColor: '#ffffff',
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                    });
                    const link = document.createElement('a');
                    const prefix = currentMode === 'noise' ? 'шумомер' : 'люксметр';
                    link.download = `${prefix}_максимумы_${new Date().toISOString().slice(0,10)}.jpeg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                } catch (err) {
                    alert('Ошибка при создании JPEG: ' + err.message);
                } finally {
                    document.body.removeChild(container);
                }
            }

            // ---- Обработчики ----
            tabNoise.addEventListener('click', () => setMode('noise'));
            tabLux.addEventListener('click', () => setMode('lux'));

            resetMaxBtn.addEventListener('click', () => {
                if (currentMode === 'noise') {
                    currentMaxNoise = 0;
                    maxDbEl.textContent = '0.0';
                } else {
                    currentMaxLux = 0;
                    maxLxEl.textContent = '0';
                }
            });

            clearHistoryBtn.addEventListener('click', () => {
                historyData = [];
                if (currentMode === 'noise') {
                    currentMaxNoise = 0;
                    maxDbEl.textContent = '0.0';
                    currentDbEl.textContent = '0.0';
                } else {
                    currentMaxLux = 0;
                    maxLxEl.textContent = '0';
                    currentLxEl.textContent = '0';
                }
                updateChart();
                calibrationOffset = 0;
                calibStatus.textContent = 'не калиброван';
                calibStatus.style.background = currentMode === 'noise' ? '#d4e2f5' : '#e8e0d5';
                calibStatus.style.color = currentMode === 'noise' ? '#00337a' : '#5c4a2a';
            });

            saveMaxBtn.addEventListener('click', saveCurrentMax);
            saveJpegBtn.addEventListener('click', saveListAsJpeg);

            sensSlider.addEventListener('input', () => {
                sensitivity = parseFloat(sensSlider.value);
                sensValueEl.textContent = sensitivity.toFixed(currentMode === 'noise' ? 2 : 1);
                if (isAutoSens) {
                    isAutoSens = false;
                    autoSensStatus.textContent = 'выкл';
                    autoSensStatus.style.background = currentMode === 'noise' ? '#c8ddf5' : '#e8e0d5';
                    autoSensStatus.style.color = currentMode === 'noise' ? '#00337a' : '#5c4a2a';
                    if (autoSensTimer) {
                        clearInterval(autoSensTimer);
                        autoSensTimer = null;
                    }
                }
            });

            calibrateBtn.addEventListener('click', calibrate);

            autoSensBtn.addEventListener('click', () => {
                isAutoSens = !isAutoSens;
                if (isAutoSens) {
                    autoSensStatus.textContent = 'вкл';
                    autoSensStatus.style.background = '#b8d9a0';
                    autoSensStatus.style.color = '#1a4a1a';
                    rawBuffer = [];
                    sensitivity = currentMode === 'noise' ? 1.0 : 2.0;
                    sensSlider.value = sensitivity;
                    sensValueEl.textContent = sensitivity.toFixed(currentMode === 'noise' ? 2 : 1);
                } else {
                    autoSensStatus.textContent = 'выкл';
                    autoSensStatus.style.background = currentMode === 'noise' ? '#c8ddf5' : '#e8e0d5';
                    autoSensStatus.style.color = currentMode === 'noise' ? '#00337a' : '#5c4a2a';
                    if (autoSensTimer) {
                        clearInterval(autoSensTimer);
                        autoSensTimer = null;
                    }
                }
            });

            // ---- Старт ----
            async function init() {
                renderSavedRecords();
                updateChart();
                await startAudio();
                setMode('noise');
            }

            init();

            window.addEventListener('beforeunload', () => {
                stopAudio();
                stopCamera();
            });

        })();
    </script>
</body>
</html>
