<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Люксметр + график + калибровка + авто</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            max-width: 980px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 24px 28px 32px;
            box-shadow: 0 20px 40px rgba(0, 20, 50, 0.12);
        }
        h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            margin: 0 0 6px 0;
            color: #0b1e33;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .sub {
            color: #2c4b6b;
            opacity: 0.7;
            font-weight: 400;
            font-size: 0.95rem;
            margin-top: -4px;
            margin-bottom: 20px;
            border-left: 4px solid #ffb347;
            padding-left: 16px;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 680px) {
            .grid-2col {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }
        .meter-panel {
            background: #f5f0e8;
            border-radius: 28px;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lx-big {
            font-size: 4.2rem;
            font-weight: 700;
            color: #1a2a0b;
            line-height: 1;
            letter-spacing: -2px;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .lx-big small {
            font-size: 1.8rem;
            font-weight: 400;
            color: #5c7c3b;
            margin-left: 6px;
        }
        .max-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-top: 12px;
            background: #e8e0d5;
            padding: 8px 16px 8px 18px;
            border-radius: 40px;
        }
        .max-label {
            font-weight: 500;
            color: #3d4d2a;
        }
        .max-value {
            font-weight: 700;
            font-size: 1.7rem;
            color: #7a5a00;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }
        .btn {
            border: none;
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
            transition: 0.15s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #cddcee;
            color: #102a40;
            flex: 1 0 auto;
            justify-content: center;
        }
        .btn-primary {
            background: #f5a623;
            border: 1px solid #f5a623;
            color: white;
            box-shadow: 0 8px 14px -6px #f5a62360;
        }
        .btn-primary:hover {
            background: #d98e1f;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #d5c8b8;
        }
        .btn-outline:hover {
            background: #eee5da;
        }
        .btn-danger {
            background: #ff6b4d;
            border: 1px solid #ff6b4d;
            color: white;
        }
        .btn-danger:hover {
            background: #e65534;
        }
        .btn-success {
            background: #6b8c2b;
            border: 1px solid #6b8c2b;
            color: white;
        }
        .btn-success:hover {
            background: #4f6e1f;
        }
        .btn-warning {
            background: #ff9800;
            border: 1px solid #ff9800;
            color: white;
        }
        .btn-warning:hover {
            background: #e68900;
        }
        .save-area {
            background: #ede6dc;
            border-radius: 40px;
            padding: 12px 18px 16px;
            margin-top: 12px;
        }
        .save-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .save-row input {
            flex: 2 1 160px;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid #c2b8a8;
            background: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
            color: #0b1e33;
            font-weight: 500;
        }
        .save-row input:focus {
            border-color: #f5a623;
            box-shadow: 0 0 0 3px #f5a62330;
        }
        .save-row .btn {
            flex: 1 0 auto;
        }
        .saved-list {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            align-items: center;
        }
        .saved-badge {
            background: white;
            border-radius: 40px;
            padding: 6px 16px 6px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #c8b8a8;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1a2a0b;
        }
        .saved-badge strong {
            color: #7a5a00;
            font-weight: 800;
            font-size: 1.05rem;
        }
        .saved-badge .place-name {
            color: #0b1e33;
            font-weight: 700;
            background: #f5f0e8;
            padding: 0 8px 0 4px;
            border-radius: 30px;
        }
        .saved-badge .del {
            cursor: pointer;
            opacity: 0.6;
            font-weight: 700;
            font-size: 1.3rem;
            line-height: 1;
            transition: 0.1s;
            color: #a0002a;
            margin-left: 2px;
        }
        .saved-badge .del:hover {
            opacity: 1;
            color: #d1002b;
        }
        .chart-wrapper {
            background: #faf8f5;
            border-radius: 28px;
            padding: 16px 12px 8px;
            border: 1px solid #d5c8b8;
            position: relative;
        }
        .status-led {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 12px;
            margin-right: 6px;
            background: #34c759;
        }
        .footer-note {
            font-size: 0.8rem;
            color: #5c6e4a;
            margin-top: 18px;
            text-align: center;
            opacity: 0.7;
        }
        .sensitivity-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            background: #e8e0d5;
            padding: 8px 16px 8px 20px;
            border-radius: 60px;
            flex-wrap: wrap;
        }
        .sensitivity-wrap label {
            font-weight: 500;
            color: #3d4d2a;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sensitivity-wrap input[type="range"] {
            flex: 2 1 140px;
            accent-color: #f5a623;
            height: 5px;
            border-radius: 10px;
            background: #d5c8b8;
        }
        .sens-value {
            font-weight: 700;
            color: #7a5a00;
            min-width: 40px;
        }
        .jpeg-btn-wrap {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .calib-indicator {
            background: #e8e0d5;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #5c4a2a;
            display: inline-block;
        }
        .auto-sens-badge {
            background: #e8e0d5;
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #5c4a2a;
            display: inline-block;
        }
        .video-preview {
            width: 100%;
            max-height: 120px;
            border-radius: 16px;
            margin-top: 10px;
            border: 2px solid #d5c8b8;
            background: #1a1a1a;
            object-fit: cover;
            display: none;
        }
        .camera-status {
            font-size: 0.8rem;
            color: #5c6e4a;
            margin-top: 6px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card" id="appCard">
        <h1>
            <span>☀️ Люксметр</span>
            <span style="font-size: 1rem; font-weight: 400; margin-left: auto; background: #f5f0e8; padding: 4px 18px; border-radius: 40px;">
                <span class="status-led"></span> реальное время
            </span>
        </h1>
        <div class="sub">Фронтальная камера · график · максимум · калибровка · авторегулировка</div>

        <div class="grid-2col">
            <!-- левая панель -->
            <div class="meter-panel">
                <div class="lx-big">
                    <span id="currentLx">0</span>
                    <small>lx</small>
                </div>
                <div class="max-row">
                    <span class="max-label">📈 максимум</span>
                    <span class="max-value" id="maxLx">0</span>
                </div>

                <!-- чувствительность + авто -->
                <div class="sensitivity-wrap">
                    <label>🔆 чувствит.</label>
                    <input type="range" id="sensSlider" min="0.5" max="10.0" step="0.1" value="2.0">
                    <span class="sens-value" id="sensValue">2.0</span>
                    <button class="btn btn-warning" id="autoSensBtn" style="flex:0 1 auto; padding: 6px 16px; font-size:0.8rem;">🤖 Авто</button>
                    <span class="auto-sens-badge" id="autoSensStatus">выкл</span>
                </div>

                <!-- калибровка -->
                <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                    <button class="btn btn-outline" id="calibrateBtn" style="flex:0 1 auto;">📐 Калибровать (темнота)</button>
                    <span class="calib-indicator" id="calibStatus">не калиброван</span>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="resetMaxBtn">🔄 Сброс макс.</button>
                    <button class="btn btn-outline" id="clearHistoryBtn">🧹 Очистить график</button>
                </div>

                <div class="save-area">
                    <div class="save-row">
                        <input type="text" id="placeNameInput" placeholder="Название места" value="Комната">
                        <button class="btn btn-primary" id="saveMaxBtn">💾 Сохранить</button>
                    </div>
                    <div id="savedContainer" class="saved-list"></div>
                    <div class="jpeg-btn-wrap">
                        <button class="btn btn-success" id="saveJpegBtn">🖼️ Сохранить список как JPEG</button>
                    </div>
                </div>
            </div>

            <!-- правая панель: график -->
            <div style="display: flex; flex-direction: column; justify-content: center;">
                <div class="chart-wrapper" id="chartWrapper">
                    <canvas id="realtimeChart" width="400" height="220" style="width:100%; height:auto; max-height:220px;"></canvas>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.75rem; color: #5c6e4a; padding: 0 6px;">
                    <span>⏱️ обновление ~500 мс</span>
                    <span id="pointsCount">0 точек</span>
                </div>
                <!-- Видео превью (скрыто, но используется для захвата) -->
                <video id="videoPreview" class="video-preview" autoplay playsinline></video>
                <div class="camera-status" id="cameraStatus">📷 Запуск камеры...</div>
            </div>
        </div>
        <div class="footer-note">Измеряет яркость по среднему значению пикселей. Диапазон: 0-10000 люкс. Калибровка вычитает фоновую темноту.</div>
    </div>

    <script>
        (function() {
            // ---- DOM ----
            const currentLxEl = document.getElementById('currentLx');
            const maxLxEl = document.getElementById('maxLx');
            const resetMaxBtn = document.getElementById('resetMaxBtn');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const saveMaxBtn = document.getElementById('saveMaxBtn');
            const placeNameInput = document.getElementById('placeNameInput');
            const savedContainer = document.getElementById('savedContainer');
            const pointsCountEl = document.getElementById('pointsCount');
            const sensSlider = document.getElementById('sensSlider');
            const sensValueEl = document.getElementById('sensValue');
            const calibrateBtn = document.getElementById('calibrateBtn');
            const calibStatus = document.getElementById('calibStatus');
            const autoSensBtn = document.getElementById('autoSensBtn');
            const autoSensStatus = document.getElementById('autoSensStatus');
            const videoPreview = document.getElementById('videoPreview');
            const cameraStatus = document.getElementById('cameraStatus');

            // ---- Chart.js ----
            const ctx = document.getElementById('realtimeChart').getContext('2d');
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Освещённость (lx)',
                        data: [],
                        borderColor: '#f5a623',
                        backgroundColor: 'rgba(245, 166, 35, 0.08)',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        tension: 0.2,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: true } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 10, font: { size: 9 } } },
                        y: {
                            min: 0,
                            max: 10000,
                            grid: { color: '#e8e0d5' },
                            ticks: { 
                                stepSize: 1000,
                                font: { size: 9 },
                                callback: function(value) {
                                    if (value >= 1000) return (value/1000) + 'k';
                                    return value;
                                }
                            }
                        }
                    },
                    elements: { line: { borderJoinStyle: 'round' } }
                }
            });

            // ---- состояние ----
            let currentMax = 0;
            let historyData = [];
            const MAX_POINTS = 120;
            let sensitivity = 2.0;
            let calibrationOffset = 0;
            let isAutoSens = false;
            let autoSensTimer = null;
            let brightnessBuffer = [];

            // сохранённые записи
            let savedRecords = [];
            try {
                const stored = localStorage.getItem('lux_saved_records');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) savedRecords = parsed;
                }
            } catch (e) {}

            // ---- камера ----
            let stream = null;
            let animationFrame = null;
            let isRunning = false;

            // ---- функции UI ----
            function updateDisplay(currentLx, maxLx) {
                currentLxEl.textContent = Math.round(currentLx);
                maxLxEl.textContent = Math.round(maxLx);
            }

            function updateChart() {
                const labels = historyData.map((_, i) => (i * 0.5).toFixed(1) + 's');
                chart.data.labels = labels;
                chart.data.datasets[0].data = historyData.slice();
                chart.update('none');
                pointsCountEl.textContent = historyData.length + ' точек';
            }

            // ---- ОСНОВНАЯ ФУНКЦИЯ: добавить точку ----
            function addDataPoint(rawValue) {
                // Применяем калибровку
                let calibrated = rawValue - calibrationOffset;
                if (calibrated < 0) calibrated = 0;

                // Применяем чувствительность и масштабируем
                let value = calibrated * sensitivity * 100;
                if (value < 0) value = 0;
                if (value > 10000) value = 10000;
                value = Math.round(value);

                // Обновляем максимум
                if (value > currentMax) {
                    currentMax = value;
                    maxLxEl.textContent = Math.round(currentMax);
                }

                // Сохраняем в историю
                historyData.push(value);
                if (historyData.length > MAX_POINTS) historyData.shift();

                updateChart();
                currentLxEl.textContent = Math.round(value);

                if (isAutoSens) {
                    brightnessBuffer.push(rawValue);
                    if (brightnessBuffer.length > 30) brightnessBuffer.shift();
                }
            }

            // ---- Автоматическая подстройка чувствительности ----
            function updateAutoSensitivity() {
                if (!isAutoSens || brightnessBuffer.length < 10) return;

                const sorted = [...brightnessBuffer].sort((a, b) => a - b);
                const median = sorted[Math.floor(sorted.length / 2)];

                // Целевой уровень: хотим получить ~5000 люкс при средней яркости
                const target = 0.5;
                let newSens;
                if (median > 0.01) {
                    newSens = target / (median * 100);
                } else {
                    newSens = 2.0;
                }

                newSens = Math.max(0.5, Math.min(10.0, newSens));

                const diff = newSens - sensitivity;
                if (Math.abs(diff) > 0.05) {
                    sensitivity += diff * 0.15;
                    sensitivity = Math.max(0.5, Math.min(10.0, sensitivity));
                    sensSlider.value = sensitivity;
                    sensValueEl.textContent = sensitivity.toFixed(1);
                }
            }

            // ---- Калибровка (измерение темноты) ----
            function calibrate() {
                if (!stream) {
                    alert('Камера не инициализирована. Подождите...');
                    return;
                }

                const samples = [];
                const startTime = Date.now();

                function collectSamples() {
                    if (!videoPreview.videoWidth) {
                        if (Date.now() - startTime < 3000) {
                            requestAnimationFrame(collectSamples);
                        }
                        return;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = videoPreview.videoWidth;
                    canvas.height = videoPreview.videoHeight;
                    const ctx2 = canvas.getContext('2d');
                    ctx2.drawImage(videoPreview, 0, 0);
                    const imageData = ctx2.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;

                    let sum = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
                    }
                    const avg = sum / (data.length / 4);
                    const normalized = avg / 255;
                    samples.push(normalized);

                    if (Date.now() - startTime < 1000) {
                        requestAnimationFrame(collectSamples);
                    } else {
                        const avgBrightness = samples.reduce((s, v) => s + v, 0) / samples.length;
                        calibrationOffset = avgBrightness;
                        calibStatus.textContent = `калибр. ${(avgBrightness * 100).toFixed(1)}%`;
                        calibStatus.style.background = '#c8d8b8';
                        calibStatus.style.color = '#2a4a1a';

                        calibrateBtn.style.transform = 'scale(0.95)';
                        setTimeout(() => calibrateBtn.style.transform = '', 200);
                    }
                }

                collectSamples();
            }

            // ---- Сброс калибровки ----
            function resetCalibration() {
                calibrationOffset = 0;
                calibStatus.textContent = 'не калиброван';
                calibStatus.style.background = '#e8e0d5';
                calibStatus.style.color = '#5c4a2a';
            }

            // ---- сохранение максимума ----
            function saveCurrentMax() {
                const place = placeNameInput.value.trim() || 'Без названия';
                const value = currentMax;
                if (value === 0) {
                    alert('Максимум 0 lx. Подождите данных или проверьте камеру.');
                    return;
                }
                savedRecords.push({ place, value: Math.round(value) });
                savedRecords.sort((a, b) => b.value - a.value);
                localStorage.setItem('lux_saved_records', JSON.stringify(savedRecords));
                renderSavedRecords();
                saveMaxBtn.style.transform = 'scale(0.95)';
                setTimeout(() => saveMaxBtn.style.transform = '', 150);
            }

            function deleteSavedRecord(index) {
                savedRecords.splice(index, 1);
                localStorage.setItem('lux_saved_records', JSON.stringify(savedRecords));
                renderSavedRecords();
            }

            function renderSavedRecords() {
                if (savedRecords.length === 0) {
                    savedContainer.innerHTML =
                        `<span style="opacity:0.6; font-size:0.85rem; color:#3d4d2a;">Нет сохранённых максимумов</span>`;
                    return;
                }
                let html = '';
                savedRecords.forEach((rec, idx) => {
                    html += `
                        <div class="saved-badge">
                            <strong>${rec.value} lx</strong>
                            <span class="place-name">${rec.place}</span>
                            <span class="del" data-index="${idx}">✕</span>
                        </div>
                    `;
                });
                savedContainer.innerHTML = html;
                document.querySelectorAll('.saved-badge .del').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const index = parseInt(el.dataset.index, 10);
                        if (!isNaN(index)) deleteSavedRecord(index);
                    });
                });
            }

            // ---- СОХРАНЕНИЕ JPEG ----
            async function saveListAsJpeg() {
                const container = document.createElement('div');
                container.style.cssText = `
                        background: #ffffff;
                        padding: 32px 40px;
                        border-radius: 32px;
                        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                        max-width: 600px;
                        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
                        position: fixed;
                        left: -9999px;
                        top: 0;
                        z-index: 9999;
                        color: #0b1a2b;
                    `;

                const title = document.createElement('h2');
                title.textContent = '☀️ Сохранённые максимумы освещённости';
                title.style.cssText = 'margin: 0 0 8px 0; color: #0b1a2b; font-weight: 700; font-size: 1.8rem;';
                container.appendChild(title);

                const date = new Date().toLocaleString();
                const dateP = document.createElement('p');
                dateP.textContent = `Дата: ${date}`;
                dateP.style.cssText = 'margin: 0 0 20px 0; color: #3d4d2a; font-size: 1rem; font-weight: 500;';
                container.appendChild(dateP);

                if (savedRecords.length === 0) {
                    const empty = document.createElement('p');
                    empty.textContent = 'Нет сохранённых записей.';
                    empty.style.cssText = 'color: #3d4d2a; font-style: italic; font-size: 1.1rem;';
                    container.appendChild(empty);
                } else {
                    const list = document.createElement('ul');
                    list.style.cssText = 'list-style: none; padding: 0; margin: 0;';
                    savedRecords.forEach((rec, idx) => {
                        const li = document.createElement('li');
                        li.style.cssText = `
                                display: flex;
                                justify-content: space-between;
                                padding: 12px 16px;
                                border-bottom: 2px solid #d5c8b8;
                                font-size: 1.2rem;
                                font-weight: 500;
                                color: #1a2a0b;
                                background: ${idx % 2 === 0 ? '#faf8f5' : '#ffffff'};
                            `;
                        if (idx === 0) {
                            li.style.background = '#f5f0e8';
                            li.style.borderRadius = '12px 12px 0 0';
                            li.style.fontWeight = '600';
                        }
                        const placeSpan = document.createElement('span');
                        placeSpan.textContent = rec.place;
                        placeSpan.style.color = '#001a33';
                        placeSpan.style.fontWeight = '700';
                        const valSpan = document.createElement('span');
                        valSpan.textContent = `${rec.value} lx`;
                        valSpan.style.fontWeight = '800';
                        valSpan.style.color = '#7a5a00';
                        valSpan.style.fontSize = '1.3rem';
                        li.appendChild(placeSpan);
                        li.appendChild(valSpan);
                        list.appendChild(li);
                    });
                    container.appendChild(list);
                }

                const footer = document.createElement('div');
                footer.style.cssText =
                    'margin-top: 24px; font-size: 0.9rem; color: #3d4d2a; border-top: 2px solid #d5c8b8; padding-top: 16px; text-align: center; font-weight: 500;';
                footer.textContent = 'Сгенерировано люксметром';
                container.appendChild(footer);

                document.body.appendChild(container);

                try {
                    await new Promise(r => requestAnimationFrame(r));
                    const canvas = await html2canvas(container, {
                        scale: 2,
                        backgroundColor: '#ffffff',
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                    });
                    const link = document.createElement('a');
                    link.download = `люксметр_максимумы_${new Date().toISOString().slice(0,10)}.jpeg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                } catch (err) {
                    alert('Ошибка при создании JPEG: ' + err.message);
                } finally {
                    document.body.removeChild(container);
                }
            }

            // ---- инициализация камеры ----
            async function initCamera() {
                try {
                    // Используем фронтальную камеру (environment: true для тыловой, user для фронтальной)
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'user',
                            width: { ideal: 320 },
                            height: { ideal: 240 }
                        },
                        audio: false
                    });

                    videoPreview.srcObject = stream;
                    await videoPreview.play();
                    cameraStatus.textContent = '✅ Камера запущена';
                    cameraStatus.style.color = '#2a6a2a';
                    isRunning = true;
                    readFrame();
                    return true;
                } catch (err) {
                    cameraStatus.textContent = '❌ Ошибка доступа к камере: ' + err.message;
                    cameraStatus.style.color = '#aa3333';
                    alert('Не удалось получить доступ к камере. Разрешите доступ и перезагрузите страницу.\n' + err.message);
                    return false;
                }
            }

            function readFrame() {
                if (!isRunning || !stream) return;

                try {
                    const canvas = document.createElement('canvas');
                    const video = videoPreview;

                    if (video.videoWidth > 0 && video.videoHeight > 0) {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const ctx2 = canvas.getContext('2d');
                        ctx2.drawImage(video, 0, 0);
                        const imageData = ctx2.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imageData.data;

                        let sum = 0;
                        // Сэмплируем каждый 4-й пиксель для производительности
                        for (let i = 0; i < data.length; i += 16) {
                            sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
                        }
                        const avg = sum / (data.length / 16);
                        const normalized = avg / 255;

                        addDataPoint(normalized);

                        if (isAutoSens) {
                            if (!autoSensTimer) {
                                autoSensTimer = setInterval(() => {
                                    updateAutoSensitivity();
                                }, 1000);
                            }
                        } else {
                            if (autoSensTimer) {
                                clearInterval(autoSensTimer);
                                autoSensTimer = null;
                            }
                        }
                    }
                } catch (e) {
                    // игнорируем ошибки кадра
                }

                animationFrame = setTimeout(() => {
                    if (isRunning) readFrame();
                }, 300);
            }

            function stopCamera() {
                isRunning = false;
                if (animationFrame) {
                    clearTimeout(animationFrame);
                    animationFrame = null;
                }
                if (autoSensTimer) {
                    clearInterval(autoSensTimer);
                    autoSensTimer = null;
                }
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    stream = null;
                }
                videoPreview.srcObject = null;
            }

            // ---- обработчики ----
            resetMaxBtn.addEventListener('click', () => {
                currentMax = 0;
                maxLxEl.textContent = '0';
            });

            clearHistoryBtn.addEventListener('click', () => {
                historyData = [];
                currentMax = 0;
                maxLxEl.textContent = '0';
                currentLxEl.textContent = '0';
                updateChart();
                resetCalibration();
            });

            saveMaxBtn.addEventListener('click', saveCurrentMax);
            document.getElementById('saveJpegBtn').addEventListener('click', saveListAsJpeg);

            sensSlider.addEventListener('input', () => {
                sensitivity = parseFloat(sensSlider.value);
                sensValueEl.textContent = sensitivity.toFixed(1);
                if (isAutoSens) {
                    isAutoSens = false;
                    autoSensStatus.textContent = 'выкл';
                    autoSensStatus.style.background = '#e8e0d5';
                    if (autoSensTimer) {
                        clearInterval(autoSensTimer);
                        autoSensTimer = null;
                    }
                }
            });

            calibrateBtn.addEventListener('click', calibrate);

            autoSensBtn.addEventListener('click', () => {
                isAutoSens = !isAutoSens;
                if (isAutoSens) {
                    autoSensStatus.textContent = 'вкл';
                    autoSensStatus.style.background = '#c8d8b8';
                    autoSensStatus.style.color = '#2a4a1a';
                    brightnessBuffer = [];
                    sensitivity = 2.0;
                    sensSlider.value = 2.0;
                    sensValueEl.textContent = '2.0';
                } else {
                    autoSensStatus.textContent = 'выкл';
                    autoSensStatus.style.background = '#e8e0d5';
                    autoSensStatus.style.color = '#5c4a2a';
                    if (autoSensTimer) {
                        clearInterval(autoSensTimer);
                        autoSensTimer = null;
                    }
                }
            });

            // ---- старт ----
            async function start() {
                await initCamera();
                renderSavedRecords();
                updateChart();
                currentLxEl.textContent = '0';
                maxLxEl.textContent = '0';
            }

            start();

            window.addEventListener('beforeunload', () => {
                stopCamera();
            });

        })();
    </script>
</body>
</html>
