<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebM → MP3 конвертер</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1a1e2b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .card {
      background: #252b3d;
      border-radius: 32px;
      padding: 32px 28px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.06);
      color: #e8ecf5;
      transition: 0.2s;
    }
    h1 {
      font-weight: 500;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid #3c445a;
      padding-bottom: 18px;
    }
    h1 small {
      font-size: 1rem;
      font-weight: 400;
      color: #8e96b0;
      margin-left: auto;
    }
    .drop-zone {
      background: #1f2537;
      border: 2px dashed #404a62;
      border-radius: 24px;
      padding: 38px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }
    .drop-zone:hover {
      border-color: #6a7a9f;
      background: #232b3f;
    }
    .drop-zone.dragover {
      border-color: #a6b9e6;
      background: #2a334a;
      box-shadow: 0 0 0 4px rgba(90, 130, 220, 0.25);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .drop-icon {
      font-size: 3.4rem;
      line-height: 1;
      margin-bottom: 6px;
      color: #6d7ba0;
    }
    .drop-text {
      font-size: 1.1rem;
      font-weight: 400;
      color: #bcc3db;
    }
    .drop-hint {
      font-size: 0.85rem;
      color: #6e7a9a;
      margin-top: 8px;
    }
    .file-info {
      margin: 22px 0 18px;
      background: #1b2132;
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .file-name {
      flex: 1;
      font-weight: 450;
      word-break: break-all;
      color: #d3d9ee;
    }
    .file-size {
      background: #2f384f;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      color: #b9c2dd;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px 18px;
      margin: 22px 0 28px;
      background: #1f263a;
      padding: 14px 18px;
      border-radius: 30px;
    }
    .bitrate-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bitrate-group label {
      font-size: 0.95rem;
      color: #b3bddb;
    }
    .bitrate-group select {
      background: #2f384f;
      border: 1px solid #3e4864;
      color: #f0f3fc;
      padding: 8px 14px 8px 12px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
      transition: 0.15s;
    }
    .bitrate-group select:hover {
      border-color: #617197;
    }
    .bitrate-group select:focus {
      border-color: #7b8fc7;
      box-shadow: 0 0 0 2px #3a4a70;
    }
    .action-btn {
      background: #4c6b9e;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 10px 28px;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.15s;
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 12px rgba(0, 20, 40, 0.4);
      border: 1px solid #5f7bb3;
    }
    .action-btn:hover:not(:disabled) {
      background: #5c7db8;
      transform: scale(1.01);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    }
    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .status {
      margin: 12px 0 8px;
      min-height: 28px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #bcc6e3;
    }
    .status.success {
      color: #a1d6a8;
    }
    .status.error {
      color: #f7a9a9;
    }
    .progress-wrap {
      background: #1a1f2e;
      border-radius: 30px;
      height: 6px;
      margin: 10px 0 16px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .progress-wrap.active {
      opacity: 1;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7b9bd6, #b8cbf5);
      border-radius: 30px;
      transition: width 0.1s linear;
    }
    .footer-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .download-btn {
      background: #2b3650;
      border: 1px solid #47587a;
      color: #d3def5;
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
      flex: 1;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .download-btn:hover:not(:disabled) {
      background: #36466b;
      border-color: #6078a8;
      color: white;
    }
    .download-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #495478;
      color: #a8b4d4;
      padding: 12px 20px;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.1s;
      font-weight: 450;
    }
    .reset-btn:hover {
      background: #2d3650;
      border-color: #6b7da3;
      color: #d6def5;
    }
    .footnote {
      font-size: 0.75rem;
      color: #5a6785;
      text-align: center;
      margin-top: 28px;
      border-top: 1px solid #2e364b;
      padding-top: 18px;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>
    🎧 WebM → MP3
    <small>конвертер</small>
  </h1>

  <!-- Зона загрузки -->
  <div class="drop-zone" id="dropZone">
    <input type="file" accept=".webm,video/webm" id="fileInput">
    <div class="drop-icon">📂</div>
    <div class="drop-text">Перетащите WebM файл или нажмите для выбора</div>
    <div class="drop-hint">Поддерживаются .webm с аудиодорожкой</div>
  </div>

  <!-- Информация о файле -->
  <div class="file-info" id="fileInfo">
    <span class="file-name" id="fileName">Файл не выбран</span>
    <span class="file-size" id="fileSize">—</span>
  </div>

  <!-- Битрейт + кнопка конвертации -->
  <div class="controls">
    <div class="bitrate-group">
      <label for="bitrateSelect">📊 Битрейт</label>
      <select id="bitrateSelect">
        <option value="64">64 kbps</option>
        <option value="96">96 kbps</option>
        <option value="128" selected>128 kbps</option>
        <option value="192">192 kbps</option>
        <option value="256">256 kbps</option>
        <option value="320">320 kbps</option>
      </select>
    </div>
    <button class="action-btn" id="convertBtn" disabled>🔄 Конвертировать</button>
  </div>

  <!-- Статус и прогресс -->
  <div class="status" id="statusMessage">⏳ Готов к работе</div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>

  <!-- Кнопки скачать / сброс -->
  <div class="footer-actions">
    <a class="download-btn" id="downloadBtn" disabled>⬇ Скачать MP3</a>
    <button class="reset-btn" id="resetBtn">⟳ Сброс</button>
  </div>
  <div class="footnote">Конвертация выполняется локально в браузере. Файлы не загружаются на сервер.</div>
</div>

<script>
  (function() {
    // DOM элементы
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusMessage = document.getElementById('statusMessage');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const bitrateSelect = document.getElementById('bitrateSelect');

    // Состояние
    let currentFile = null;           // File объект
    let convertedBlob = null;         // готовый MP3 Blob
    let convertedFileName = '';

    // ---------- Вспомогательные функции ----------
    function setStatus(text, type = '') {
      statusMessage.textContent = text;
      statusMessage.className = 'status' + (type ? ' ' + type : '');
    }

    function setProgress(value) {
      if (value >= 0 && value <= 100) {
        progressWrap.classList.add('active');
        progressBar.style.width = value + '%';
      } else {
        progressWrap.classList.remove('active');
        progressBar.style.width = '0%';
      }
    }

    function resetUI(keepFileInfo = false) {
      convertedBlob = null;
      downloadBtn.disabled = true;
      downloadBtn.href = '#';
      downloadBtn.download = '';
      setProgress(-1);
      if (!keepFileInfo) {
        currentFile = null;
        fileName.textContent = 'Файл не выбран';
        fileSize.textContent = '—';
        convertBtn.disabled = true;
        setStatus('⏳ Готов к работе');
        // сброс поля ввода, чтобы можно было выбрать тот же файл повторно
        fileInput.value = '';
        // также сбросить стили drop зоны
        dropZone.classList.remove('dragover');
      } else {
        // если файл остался, но нужно сбросить результат конвертации
        if (currentFile) {
          convertBtn.disabled = false;
          setStatus('⏳ Файл загружен, нажмите "Конвертировать"');
        } else {
          convertBtn.disabled = true;
          setStatus('⏳ Готов к работе');
        }
      }
    }

    // обновить информацию о файле
    function updateFileInfo(file) {
      if (!file) {
        fileName.textContent = 'Файл не выбран';
        fileSize.textContent = '—';
        convertBtn.disabled = true;
        return;
      }
      fileName.textContent = file.name || 'webm-файл';
      const sizeKB = (file.size / 1024).toFixed(1);
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
      fileSize.textContent = sizeMB >= 1 ? sizeMB + ' MB' : sizeKB + ' KB';
      convertBtn.disabled = false;
      setStatus('📁 Файл загружен. Выберите битрейт и нажмите "Конвертировать"');
    }

    // ---------- Обработка файла ----------
    function handleFile(file) {
      if (!file) return;
      // Проверка типа (начинается с video/webm или .webm)
      const validType = file.type === 'video/webm' || file.type === 'audio/webm' || 
                        file.name.toLowerCase().endsWith('.webm');
      if (!validType) {
        setStatus('❌ Пожалуйста, выберите файл в формате WebM', 'error');
        resetUI(false);
        return;
      }
      // Проверка размера (максимум 500 МБ)
      if (file.size > 500 * 1024 * 1024) {
        setStatus('❌ Файл слишком большой (макс. 500 МБ)', 'error');
        resetUI(false);
        return;
      }

      currentFile = file;
      updateFileInfo(file);
      // сброс предыдущего результата
      convertedBlob = null;
      downloadBtn.disabled = true;
      downloadBtn.href = '#';
      downloadBtn.download = '';
      setProgress(-1);
      setStatus('📁 Файл загружен. Выберите битрейт и нажмите "Конвертировать"');
    }

    // ---------- Конвертация ----------
    async function convertToMp3() {
      if (!currentFile) {
        setStatus('❌ Нет файла для конвертации', 'error');
        return;
      }

      // Блокируем кнопку
      convertBtn.disabled = true;
      convertBtn.textContent = '⏳ Конвертация...';
      setStatus('⏳ Декодирование аудио...');
      setProgress(10);

      try {
        // 1. Читаем файл как ArrayBuffer
        const arrayBuffer = await currentFile.arrayBuffer();
        setProgress(25);

        // 2. Декодируем аудио через AudioContext
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer;
        try {
          audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        } catch (decodeError) {
          setStatus('❌ Ошибка декодирования: возможно, файл не содержит аудиодорожку', 'error');
          convertBtn.disabled = false;
          convertBtn.textContent = '🔄 Конвертировать';
          setProgress(-1);
          audioCtx.close();
          return;
        }
        setProgress(45);

        // 3. Получаем битрейт из select
        const bitrate = parseInt(bitrateSelect.value, 10);
        if (isNaN(bitrate) || bitrate < 8) {
          setStatus('❌ Некорректный битрейт', 'error');
          convertBtn.disabled = false;
          convertBtn.textContent = '🔄 Конвертировать';
          setProgress(-1);
          audioCtx.close();
          return;
        }

        // 4. Экспорт в MP3 с помощью lamejs (используем CDN)
        // Загружаем библиотеку динамически, если её нет
        if (typeof lamejs === 'undefined') {
          setStatus('⏳ Загрузка аудиокодека...');
          await loadLameJs();
        }

        setStatus('⏳ Кодирование MP3 (битрейт ' + bitrate + ' kbps)...');
        setProgress(60);

        // Конвертируем AudioBuffer в MP3
        const mp3Blob = await encodeAudioBufferToMp3(audioBuffer, bitrate);
        setProgress(90);

        // Сохраняем результат
        convertedBlob = mp3Blob;
        const baseName = currentFile.name.replace(/\.[^.]+$/, '') || 'audio';
        convertedFileName = baseName + '.mp3';

        // Активируем кнопку скачивания
        const url = URL.createObjectURL(mp3Blob);
        downloadBtn.href = url;
        downloadBtn.download = convertedFileName;
        downloadBtn.disabled = false;

        setProgress(100);
        setStatus('✅ Готово! MP3 с битрейтом ' + bitrate + ' kbps', 'success');
        convertBtn.textContent = '✅ Конвертировано';

        // Закрыть аудиоконтекст
        await audioCtx.close();

      } catch (err) {
        console.error(err);
        setStatus('❌ Ошибка: ' + (err.message || 'неизвестная ошибка'), 'error');
        setProgress(-1);
        convertBtn.textContent = '🔄 Конвертировать';
        convertBtn.disabled = false;
      } finally {
        // если кнопка не была разблокирована в catch
        if (convertBtn.disabled && convertBtn.textContent !== '✅ Конвертировано') {
          convertBtn.disabled = false;
          convertBtn.textContent = '🔄 Конвертировать';
        }
        // если всё прошло успешно, но кнопка осталась disabled — поправим
        if (convertedBlob) {
          convertBtn.disabled = false; // разрешаем повторную конвертацию
          convertBtn.textContent = '🔄 Конвертировать';
        }
      }
    }

    // Функция загрузки lamejs с CDN
    function loadLameJs() {
      return new Promise((resolve, reject) => {
        if (typeof lamejs !== 'undefined') {
          resolve();
          return;
        }
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
        script.onload = () => resolve();
        script.onerror = () => reject(new Error('Не удалось загрузить lamejs'));
        document.head.appendChild(script);
      });
    }

    // Кодирование AudioBuffer в MP3 с помощью lamejs
    function encodeAudioBufferToMp3(audioBuffer, bitrate) {
      return new Promise((resolve, reject) => {
        try {
          const channels = audioBuffer.numberOfChannels;
          const sampleRate = audioBuffer.sampleRate;
          const samples = audioBuffer.length;

          // Получаем данные каналов (интерливинг)
          const left = audioBuffer.getChannelData(0);
          const right = channels > 1 ? audioBuffer.getChannelData(1) : null;

          // Преобразуем float в 16-bit PCM (Int16Array)
          const pcmData = new Int16Array(samples * channels);
          for (let i = 0; i < samples; i++) {
            const l = Math.max(-1, Math.min(1, left[i]));
            pcmData[i * channels] = l < 0 ? l * 0x8000 : l * 0x7FFF;
            if (channels > 1 && right) {
              const r = Math.max(-1, Math.min(1, right[i]));
              pcmData[i * channels + 1] = r < 0 ? r * 0x8000 : r * 0x7FFF;
            }
          }

          // Инициализируем lamejs
          const encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
          const mp3Data = [];

          // Размер блока (совместимо с lamejs)
          const blockSize = 1152;
          let sampleIndex = 0;

          while (sampleIndex < samples) {
            const chunkSize = Math.min(blockSize, samples - sampleIndex);
            const leftChunk = new Int16Array(chunkSize);
            const rightChunk = channels > 1 ? new Int16Array(chunkSize) : null;

            for (let i = 0; i < chunkSize; i++) {
              const idx = (sampleIndex + i) * channels;
              leftChunk[i] = pcmData[idx];
              if (channels > 1 && rightChunk) {
                rightChunk[i] = pcmData[idx + 1];
              }
            }

            let mp3buf;
            if (channels > 1 && rightChunk) {
              mp3buf = encoder.encodeBuffer(leftChunk, rightChunk);
            } else {
              mp3buf = encoder.encodeBuffer(leftChunk);
            }
            if (mp3buf.length > 0) {
              mp3Data.push(new Uint8Array(mp3buf));
            }
            sampleIndex += chunkSize;
          }

          // Финализируем
          const tail = encoder.flush();
          if (tail.length > 0) {
            mp3Data.push(new Uint8Array(tail));
          }

          // Собираем Blob
          const totalLen = mp3Data.reduce((acc, arr) => acc + arr.length, 0);
          const result = new Uint8Array(totalLen);
          let offset = 0;
          for (const part of mp3Data) {
            result.set(part, offset);
            offset += part.length;
          }

          const blob = new Blob([result], { type: 'audio/mpeg' });
          resolve(blob);
        } catch (err) {
          reject(err);
        }
      });
    }

    // ---------- События ----------
    // Клик по зоне -> вызов fileInput
    dropZone.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT') {
        fileInput.click();
      }
    });

    // Drag & Drop
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      } else {
        setStatus('❌ Не удалось прочитать файл', 'error');
      }
    });

    // Выбор файла через input
    fileInput.addEventListener('change', (e) => {
      if (fileInput.files.length > 0) {
        handleFile(fileInput.files[0]);
      } else {
        resetUI(false);
      }
    });

    // Кнопка конвертации
    convertBtn.addEventListener('click', convertToMp3);

    // Кнопка сброса
    resetBtn.addEventListener('click', () => {
      resetUI(false);
      // если был создан URL, отзываем
      if (downloadBtn.href && downloadBtn.href.startsWith('blob:')) {
        URL.revokeObjectURL(downloadBtn.href);
      }
      downloadBtn.href = '#';
      downloadBtn.download = '';
      convertedBlob = null;
      setProgress(-1);
      setStatus('⏳ Готов к работе');
      convertBtn.textContent = '🔄 Конвертировать';
      convertBtn.disabled = true;
      fileInput.value = '';
    });

    // Скачивание — ничего особенного, просто ссылка

    // инициализация
    resetUI(false);
  })();
</script>
</body>
</html>
