<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎶 Цветомузыка · 6 режимов + Fullscreen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
            transition: background 0.3s;
        }

        body.fullscreen-mode {
            padding: 0;
            background: #05080f;
        }

        .container {
            background: #141a2b;
            padding: 1.8rem 1.8rem 1.5rem;
            border-radius: 2.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid #2f3b5a;
            width: 820px;
            max-width: 98vw;
            transition: all 0.3s ease;
            position: relative;
        }

        body.fullscreen-mode .container {
            border-radius: 0;
            border: none;
            box-shadow: none;
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            padding: 12px;
            background: #0a0f1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 260px;
            border-radius: 24px;
            background: #0b101f;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.6), 0 0 0 1px #2a3452;
            margin-bottom: 1.4rem;
            image-rendering: crisp-edges;
            transition: all 0.3s ease;
        }

        body.fullscreen-mode canvas {
            height: calc(100vh - 140px);
            border-radius: 16px;
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.8), 0 0 0 1px #2f3b5a;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 6px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .btn {
            background: #1f2842;
            border: none;
            border-radius: 60px;
            padding: 9px 16px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #b7c9f0;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 #0d1322, 0 4px 12px rgba(0,0,0,0.5);
            transition: all 0.08s ease;
            border: 1px solid #3d4b70;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: inset 0 -2px 0 #0d1322;
        }

        .btn-primary {
            background: #4a5f9e;
            color: white;
            border-color: #7b92d4;
            box-shadow: inset 0 -4px 0 #25345a, 0 4px 16px #1a264a;
        }

        .btn-primary:active {
            background: #3d5090;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: scale(0.97);
            pointer-events: none;
        }

        .btn-secondary {
            background: #2d385a;
            border-color: #4b5a82;
        }

        .btn-mode {
            background: #1a2340;
            border-color: #384674;
            color: #8da0d4;
            padding: 7px 12px;
            font-size: 0.72rem;
        }
        .btn-mode.active-mode {
            background: #4f6bb0;
            color: white;
            border-color: #8aa4ef;
            box-shadow: 0 0 16px #3f5ca0;
        }

        .btn-fullscreen {
            background: #2a3a5a;
            border-color: #4a6a8a;
            color: #b0ccff;
            padding: 7px 14px;
            font-size: 0.75rem;
            margin-left: auto;
        }
        .btn-fullscreen:hover {
            background: #3a4a7a;
        }

        .status {
            color: #95a9d9;
            background: #10172b;
            padding: 5px 14px;
            border-radius: 60px;
            font-size: 0.72rem;
            border: 1px solid #2b3857;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a4a6a;
            transition: 0.15s;
        }
        .indicator.active {
            background: #7effb7;
            box-shadow: 0 0 16px #6effa0;
        }

        .credit {
            text-align: right;
            font-size: 0.65rem;
            color: #3f507a;
            margin-top: 8px;
            opacity: 0.6;
            letter-spacing: 0.3px;
        }

        body.fullscreen-mode .credit {
            display: none;
        }

        @media (max-width: 700px) {
            .container { padding: 0.8rem; }
            .btn { padding: 6px 10px; font-size: 0.65rem; }
            .status { font-size: 0.6rem; padding: 3px 8px; }
            .btn-mode { padding: 5px 8px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>
<div class="container" id="appContainer">
    <canvas id="visualizer" width="780" height="260"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn">▶ Включить</button>
            <button class="btn btn-secondary" id="stopBtn">⏹ Стоп</button>
        </div>

        <div class="btn-group" id="modeGroup">
            <button class="btn btn-mode active-mode" data-mode="bars">📊 Полосы</button>
            <button class="btn btn-mode" data-mode="wave">〰️ Волна</button>
            <button class="btn btn-mode" data-mode="circles">⭕ Круги</button>
            <button class="btn btn-mode" data-mode="fire">🔥 Огонь</button>
            <button class="btn btn-mode" data-mode="stars">✨ Звездопад</button>
            <button class="btn btn-mode" data-mode="spiral">🌀 Спираль</button>
        </div>

        <button class="btn btn-fullscreen" id="fullscreenBtn">⛶ Fullscreen</button>

        <div class="status">
            <span class="indicator" id="liveIndicator"></span>
            <span id="statusText">Ожидание</span>
        </div>
    </div>
    <div class="credit">🎛️ системный звук · 6 режимов · fullscreen</div>
</div>

<script>
    (function() {
        "use strict";

        // ----- элементы -----
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('appContainer');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const indicator = document.getElementById('liveIndicator');
        const modeBtns = document.querySelectorAll('.btn-mode');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // ----- настройки -----
        const BARS_COUNT = 48;
        const SMOOTHING = 0.6;
        const MIN_BAR_HEIGHT = 4;

        let audioContext = null;
        let analyser = null;
        let source = null;
        let stream = null;
        let animationFrame = null;
        let isActive = false;

        let smoothedValues = new Float32Array(BARS_COUNT).fill(0.15);
        let currentMode = 'bars';
        let time = 0;

        // ----- получение звука -----
        async function getSystemAudioStream() {
            try {
                const mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        suppressLocalAudioPlayback: false,
                    }
                });
                const audioTracks = mediaStream.getAudioTracks();
                if (audioTracks.length === 0) throw new Error('Нет аудио');
                return new MediaStream(audioTracks);
            } catch (err) {
                console.warn('getDisplayMedia fallback → микрофон', err);
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                    });
                    return micStream;
                } catch (micErr) {
                    throw new Error('Нет доступа к звуку');
                }
            }
        }

        // ----- инициализация аудио -----
        async function initAudio() {
            try {
                stream = await getSystemAudioStream();
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.75;
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                return true;
            } catch (error) {
                console.error('Audio init error:', error);
                statusText.innerText = '❌ Ошибка звука';
                indicator.className = 'indicator';
                return false;
            }
        }

        // ----- получение данных -----
        function getAudioData() {
            if (!analyser) return null;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            const count = Math.min(BARS_COUNT, bufferLength);
            const step = Math.floor(bufferLength / count);
            const values = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                let sum = 0;
                for (let j = 0; j < step; j++) {
                    const idx = i * step + j;
                    if (idx < bufferLength) sum += dataArray[idx];
                }
                let avg = sum / step / 255.0;
                avg = Math.pow(avg, 0.7);
                avg = Math.min(1, avg);
                const prev = smoothedValues[i] || 0.15;
                const smoothed = prev * SMOOTHING + avg * (1 - SMOOTHING);
                smoothedValues[i] = Math.max(0.06, smoothed);
                values[i] = smoothedValues[i];
            }
            let overall = 0;
            for (let i = 0; i < count; i++) overall += values[i];
            overall /= count;
            return { values, overall, count };
        }

        // ----- отрисовка -----
        function drawVisualization() {
            const data = getAudioData();
            if (!data) return;
            const { values, overall, count } = data;
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            if (overall > 0.08) {
                indicator.className = 'indicator active';
            } else {
                indicator.className = 'indicator';
            }

            time += 0.01;

            switch (currentMode) {
                case 'bars': drawBars(w, h, values, count); break;
                case 'wave': drawWave(w, h, values, count); break;
                case 'circles': drawCircles(w, h, values, count, overall); break;
                case 'fire': drawFire(w, h, values, count, overall); break;
                case 'stars': drawStars(w, h, values, count, overall); break;
                case 'spiral': drawSpiral(w, h, values, count, overall); break;
                default: drawBars(w, h, values, count);
            }
        }

        // ----- 1. Полосы -----
        function drawBars(w, h, values, count) {
            const gap = 3;
            const barWidth = (w - gap * (count + 1)) / count * 0.7 + 2;
            for (let i = 0; i < count; i++) {
                const val = values[i];
                const maxH = h * 0.85;
                const height = Math.max(MIN_BAR_HEIGHT, val * maxH);
                const x = gap + i * (barWidth + gap);
                const hue = 220 - val * 140;
                const color = `hsl(${hue}, 85%, ${35 + val * 45}%)`;
                ctx.fillStyle = color;
                ctx.shadowColor = `hsla(${hue}, 90%, 60%, 0.4)`;
                ctx.shadowBlur = 10;
                const y = h - height;
                ctx.beginPath();
                const r = 4;
                ctx.moveTo(x + r, y);
                ctx.quadraticCurveTo(x, y, x, y + r);
                ctx.lineTo(x, h);
                ctx.lineTo(x + barWidth, h);
                ctx.lineTo(x + barWidth, y + r);
                ctx.quadraticCurveTo(x + barWidth, y, x + barWidth - r, y);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                if (height > 8) {
                    const grad = ctx.createLinearGradient(x, y, x, y + 8);
                    grad.addColorStop(0, 'rgba(255,255,255,0.25)');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y, barWidth, 6);
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 2. Волна -----
        function drawWave(w, h, values, count) {
            ctx.strokeStyle = '#8ab4ff';
            ctx.shadowColor = '#4a7fd4';
            ctx.shadowBlur = 20;
            ctx.lineWidth = 3;
            ctx.beginPath();
            const amp = 70;
            const baseY = h / 2;
            for (let i = 0; i < count; i++) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y = baseY + Math.sin(i * 0.3 + time * 2) * 20 * val + (val - 0.5) * amp * 0.8;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.strokeStyle = '#ff7b9c';
            ctx.shadowColor = '#d44a6a';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y = h/2 + Math.cos(i * 0.25 + time * 1.5) * 18 * val + (val - 0.5) * amp * 0.7;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
            for (let i = 0; i < count; i+=3) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y1 = h/2 + Math.sin(i * 0.3 + time * 2) * 20 * val + (val - 0.5) * amp * 0.8;
                const y2 = h/2 + Math.cos(i * 0.25 + time * 1.5) * 18 * val + (val - 0.5) * amp * 0.7;
                ctx.fillStyle = `hsl(${200 + val*80}, 90%, 70%)`;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(x, y1, 2 + val*4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = `hsl(${320 + val*60}, 90%, 70%)`;
                ctx.beginPath();
                ctx.arc(x, y2, 2 + val*3, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // ----- 3. Круги -----
        function drawCircles(w, h, values, count, overall) {
            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.42;
            const layers = 8;
            for (let layer = 0; layer < layers; layer++) {
                const idx = Math.floor((layer / layers) * count);
                const val = values[idx] || 0.1;
                const r = maxR * (0.2 + 0.8 * (layer / layers)) * (0.7 + val * 0.5);
                const hue = (layer * 35 + time * 20) % 360;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${0.2 + val * 0.5})`;
                ctx.lineWidth = 2 + val * 6;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.6)`;
                ctx.shadowBlur = 25;
                ctx.stroke();
                if (val > 0.3) {
                    for (let k = 0; k < 6; k++) {
                        const angle = k * 1.0 + time;
                        const dx = Math.cos(angle) * r * 0.7;
                        const dy = Math.sin(angle) * r * 0.7;
                        ctx.beginPath();
                        ctx.arc(cx + dx, cy + dy, 2 + val*6, 0, Math.PI*2);
                        ctx.fillStyle = `hsla(${hue+40}, 90%, 70%, ${0.3+val*0.5})`;
                        ctx.fill();
                    }
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 4. Огонь (новый режим) -----
        function drawFire(w, h, values, count, overall) {
            const cx = w/2, cy = h/2;
            const radius = Math.min(w, h) * 0.35;
            const particles = 60;

            for (let i = 0; i < particles; i++) {
                const angle = (i / particles) * Math.PI * 2 + time * 0.5;
                const dist = radius * (0.3 + 0.7 * (values[i % count] || 0.1));
                const x = cx + Math.cos(angle) * dist;
                const y = cy + Math.sin(angle) * dist - (1 - values[i % count]) * 30;
                const size = 3 + values[i % count] * 12;
                const hue = 20 + values[i % count] * 40;
                const alpha = 0.4 + values[i % count] * 0.6;

                ctx.shadowBlur = 30;
                ctx.shadowColor = `hsla(${hue}, 100%, 60%, ${alpha * 0.5})`;
                ctx.fillStyle = `hsla(${hue}, 100%, ${50 + values[i % count] * 30}%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI*2);
                ctx.fill();

                // языки пламени
                if (values[i % count] > 0.4) {
                    const fx = x + (Math.random() - 0.5) * 20 * values[i % count];
                    const fy = y - 10 - Math.random() * 30 * values[i % count];
                    ctx.fillStyle = `hsla(${hue + 20}, 100%, 70%, ${alpha * 0.3})`;
                    ctx.beginPath();
                    ctx.arc(fx, fy, size * 0.6, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 5. Звездопад (новый) -----
        function drawStars(w, h, values, count, overall) {
            const starCount = 80;
            const cx = w/2, cy = h/2;

            for (let i = 0; i < starCount; i++) {
                const idx = i % count;
                const val = values[idx] || 0.1;
                const angle = (i / starCount) * Math.PI * 2 + time * (0.1 + val * 0.3);
                const dist = (50 + (i % 100) * 2) * (0.3 + val * 0.7);
                const x = cx + Math.cos(angle + time * 0.2) * dist;
                const y = cy + Math.sin(angle + time * 0.15) * dist * 0.6;

                const size = 1 + val * 4;
                const brightness = 60 + val * 40;
                const hue = (200 + val * 80 + i * 3) % 360;

                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsla(${hue}, 90%, 80%, ${0.3 + val * 0.5})`;
                ctx.fillStyle = `hsl(${hue}, 90%, ${brightness}%)`;

                // рисуем звезду (4-конечную)
                ctx.beginPath();
                for (let j = 0; j < 8; j++) {
                    const r = j % 2 === 0 ? size : size * 0.4;
                    const a = (j / 8) * Math.PI * 2 - Math.PI/2 + time * 0.1;
                    const px = x + Math.cos(a) * r;
                    const py = y + Math.sin(a) * r;
                    if (j === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();

                // хвост (линия)
                if (val > 0.2) {
                    ctx.strokeStyle = `hsla(${hue}, 90%, 70%, ${val * 0.3})`;
                    ctx.lineWidth = 1;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    const tailLen = 20 + val * 40;
                    ctx.moveTo(x, y);
                    ctx.lineTo(x - Math.cos(angle) * tailLen, y - Math.sin(angle) * tailLen);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 6. Спираль (новый) -----
        function drawSpiral(w, h, values, count, overall) {
            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.4;
            const points = 120;

            ctx.shadowBlur = 0;

            for (let i = 0; i < points; i++) {
                const t = i / points;
                const idx = Math.floor(t * count) % count;
                const val = values[idx] || 0.1;
                const angle = t * Math.PI * 6 + time * 0.5;
                const r = maxR * t * (0.5 + val * 0.5);
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r * 0.7;

                const size = 1.5 + val * 5;
                const hue = (t * 360 + time * 20) % 360;
                const alpha = 0.3 + val * 0.7;

                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, ${alpha * 0.4})`;
                ctx.fillStyle = `hsla(${hue}, 90%, ${50 + val * 40}%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI*2);
                ctx.fill();

                // соединительные линии
                if (i > 0 && val > 0.2) {
                    const prevIdx = (i - 1) % points;
                    const prevT = prevIdx / points;
                    const prevAngle = prevT * Math.PI * 6 + time * 0.5;
                    const prevR = maxR * prevT * (0.5 + (values[prevIdx % count] || 0.1) * 0.5);
                    const px = cx + Math.cos(prevAngle) * prevR;
                    const py = cy + Math.sin(prevAngle) * prevR * 0.7;

                    ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${val * 0.2})`;
                    ctx.lineWidth = 1 + val * 1.5;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.moveTo(px, py);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- анимация -----
        function animate() {
            if (!isActive) return;
            drawVisualization();
            animationFrame = requestAnimationFrame(animate);
        }

        // ----- старт -----
        async function startVisualizer() {
            if (isActive) return;
            statusText.innerText = 'Запуск...';
            indicator.className = 'indicator';
            const ok = await initAudio();
            if (!ok) {
                statusText.innerText = '❌ Ошибка';
                return;
            }
            isActive = true;
            statusText.innerText = '▶ Активен';
            indicator.className = 'indicator active';
            smoothedValues.fill(0.15);
            time = 0;
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animate();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            stopBtn.style.opacity = '1';
        }

        // ----- стоп -----
        function stopVisualizer() {
            if (!isActive) return;
            isActive = false;
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0b101f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            indicator.className = 'indicator';
            statusText.innerText = '⏹ Остановлен';

            if (source) { try { source.disconnect(); } catch(e) {} source = null; }
            if (analyser) { try { analyser.disconnect(); } catch(e) {} analyser = null; }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(() => {});
            }
            audioContext = null;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.style.opacity = '0.6';
        }

        // ----- полноэкранный режим -----
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.() ||
                document.documentElement.webkitRequestFullscreen?.();
                document.body.classList.add('fullscreen-mode');
                fullscreenBtn.textContent = '⛶ Выйти';
            } else {
                document.exitFullscreen?.() ||
                document.webkitExitFullscreen?.();
                document.body.classList.remove('fullscreen-mode');
                fullscreenBtn.textContent = '⛶ Fullscreen';
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
                fullscreenBtn.textContent = '⛶ Fullscreen';
            }
        });

        // ----- обработчики -----
        startBtn.addEventListener('click', startVisualizer);
        stopBtn.addEventListener('click', stopVisualizer);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        stopBtn.disabled = true;
        stopBtn.style.opacity = '0.6';

        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active-mode'));
                this.classList.add('active-mode');
                currentMode = this.dataset.mode;
            });
        });

        // заглушка
        (function drawIdle() {
            ctx.fillStyle = '#0b101f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 40; i++) {
                const x = 4 + i * 18;
                ctx.fillStyle = '#1b2642';
                ctx.fillRect(x, canvas.height - 8, 10, 8);
            }
        })();

        console.log('🎵 Цветомузыка 6 режимов + fullscreen');
    })();
</script>
</body>
</html>
