<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎶 Цветомузыка · 4 режима + абстракция</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }

        .container {
            background: #141a2b;
            padding: 1.8rem 1.8rem 1.5rem;
            border-radius: 2.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid #2f3b5a;
            width: 780px;
            max-width: 98vw;
            transition: box-shadow 0.2s;
        }

        canvas {
            display: block;
            width: 100%;
            height: 240px;
            border-radius: 24px;
            background: #0b101f;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.6), 0 0 0 1px #2a3452;
            margin-bottom: 1.4rem;
            image-rendering: crisp-edges;
            transition: filter 0.2s;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 10px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            background: #1f2842;
            border: none;
            border-radius: 60px;
            padding: 10px 22px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #b7c9f0;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 #0d1322, 0 4px 12px rgba(0,0,0,0.5);
            transition: all 0.08s ease;
            border: 1px solid #3d4b70;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: inset 0 -2px 0 #0d1322;
        }

        .btn-primary {
            background: #4a5f9e;
            color: white;
            border-color: #7b92d4;
            box-shadow: inset 0 -4px 0 #25345a, 0 4px 16px #1a264a;
        }

        .btn-primary:active {
            background: #3d5090;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: scale(0.97);
            pointer-events: none;
        }

        .btn-secondary {
            background: #2d385a;
            border-color: #4b5a82;
        }

        .btn-mode {
            background: #1a2340;
            border-color: #384674;
            color: #8da0d4;
            padding: 8px 16px;
            font-size: 0.8rem;
        }
        .btn-mode.active-mode {
            background: #4f6bb0;
            color: white;
            border-color: #8aa4ef;
            box-shadow: 0 0 16px #3f5ca0;
        }

        .status {
            color: #95a9d9;
            background: #10172b;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            border: 1px solid #2b3857;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            white-space: nowrap;
        }

        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3a4a6a;
            transition: 0.15s;
        }
        .indicator.active {
            background: #7effb7;
            box-shadow: 0 0 16px #6effa0;
        }

        .credit {
            text-align: right;
            font-size: 0.7rem;
            color: #3f507a;
            margin-top: 12px;
            opacity: 0.6;
            letter-spacing: 0.3px;
        }

        @media (max-width: 700px) {
            .container { padding: 1rem; }
            .btn { padding: 8px 14px; font-size: 0.75rem; }
            .status { font-size: 0.7rem; padding: 4px 12px; }
            .btn-mode { padding: 6px 12px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <canvas id="visualizer" width="720" height="240"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn">▶ Включить</button>
            <button class="btn btn-secondary" id="stopBtn">⏹ Стоп</button>
        </div>

        <div class="btn-group" id="modeGroup">
            <button class="btn btn-mode active-mode" data-mode="bars">📊 Полосы</button>
            <button class="btn btn-mode" data-mode="wave">〰️ Волна</button>
            <button class="btn btn-mode" data-mode="circles">⭕ Абстракция</button>
            <button class="btn btn-mode" data-mode="particles">✨ Рисовалка</button>
        </div>

        <div class="status">
            <span class="indicator" id="liveIndicator"></span>
            <span id="statusText">Ожидание</span>
        </div>
    </div>
    <div class="credit">🎛️ системный звук · 4 режима визуализации</div>
</div>

<script>
    (function() {
        "use strict";

        // ----- элементы -----
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const indicator = document.getElementById('liveIndicator');
        const modeBtns = document.querySelectorAll('.btn-mode');

        // ----- настройки -----
        const BARS_COUNT = 48;
        const SMOOTHING = 0.6;
        const MIN_BAR_HEIGHT = 4;

        let audioContext = null;
        let analyser = null;
        let source = null;
        let stream = null;
        let animationFrame = null;
        let isActive = false;

        let smoothedValues = new Float32Array(BARS_COUNT).fill(0.15);
        let currentMode = 'bars'; // bars, wave, circles, particles

        // для частиц
        let particles = [];
        const PARTICLE_COUNT = 120;

        // ----- resize canvas -----
        function resizeCanvas() {
            // сохраняем пропорции
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ----- переключение режимов -----
        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active-mode'));
                this.classList.add('active-mode');
                currentMode = this.dataset.mode;
                // если активно — сразу меняем визуал
                if (isActive) {
                    // небольшая встряска для частиц
                    if (currentMode === 'particles' && particles.length === 0) {
                        initParticles();
                    }
                }
            });
        });

        // ----- частицы (рисовалка) -----
        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    size: 2 + Math.random() * 4,
                    hue: Math.random() * 360,
                    life: 0.5 + Math.random() * 0.5,
                });
            }
        }
        initParticles();

        // ----- получение звука с динамиков (системный) -----
        async function getSystemAudioStream() {
            try {
                const mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        suppressLocalAudioPlayback: false,
                    }
                });
                const audioTracks = mediaStream.getAudioTracks();
                if (audioTracks.length === 0) throw new Error('Нет аудио');
                return new MediaStream(audioTracks);
            } catch (err) {
                console.warn('getDisplayMedia fallback → микрофон', err);
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                    });
                    return micStream;
                } catch (micErr) {
                    throw new Error('Нет доступа к звуку');
                }
            }
        }

        // ----- инициализация аудио -----
        async function initAudio() {
            try {
                stream = await getSystemAudioStream();
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.75;
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                return true;
            } catch (error) {
                console.error('Audio init error:', error);
                statusText.innerText = '❌ Ошибка звука';
                indicator.className = 'indicator';
                return false;
            }
        }

        // ----- визуализация (4 режима) -----
        function drawVisualization() {
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const w = canvas.width;
            const h = canvas.height;

            // очистка (для режимов где фон не перекрывается полностью)
            ctx.clearRect(0, 0, w, h);

            // ---- подготовка данных ----
            const count = Math.min(BARS_COUNT, bufferLength);
            const step = Math.floor(bufferLength / count);
            const rawValues = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                let sum = 0;
                for (let j = 0; j < step; j++) {
                    const idx = i * step + j;
                    if (idx < bufferLength) sum += dataArray[idx];
                }
                let avg = sum / step / 255.0;
                avg = Math.pow(avg, 0.7);
                avg = Math.min(1, avg);
                const prev = smoothedValues[i] || 0.15;
                const smoothed = prev * SMOOTHING + avg * (1 - SMOOTHING);
                smoothedValues[i] = Math.max(0.06, smoothed);
                rawValues[i] = smoothedValues[i];
            }

            // общий уровень (для абстракции)
            let overall = 0;
            for (let i = 0; i < count; i++) overall += rawValues[i];
            overall /= count;

            // индикатор
            if (overall > 0.08) {
                indicator.className = 'indicator active';
            } else {
                indicator.className = 'indicator';
            }

            // ----- РЕЖИМЫ -----
            switch (currentMode) {
                case 'bars': drawBars(w, h, rawValues, count); break;
                case 'wave': drawWave(w, h, rawValues, count); break;
                case 'circles': drawCircles(w, h, rawValues, count, overall); break;
                case 'particles': drawParticles(w, h, rawValues, count, overall); break;
                default: drawBars(w, h, rawValues, count);
            }
        }

        // ----- 1. Полосы (классика) -----
        function drawBars(w, h, values, count) {
            const gap = 3;
            const barWidth = (w - gap * (count + 1)) / count * 0.7 + 2;
            for (let i = 0; i < count; i++) {
                const val = values[i];
                const maxH = h * 0.85;
                const height = Math.max(MIN_BAR_HEIGHT, val * maxH);
                const x = gap + i * (barWidth + gap);
                const hue = 220 - val * 140;
                const color = `hsl(${hue}, 85%, ${35 + val * 45}%)`;
                ctx.fillStyle = color;
                ctx.shadowColor = `hsla(${hue}, 90%, 60%, 0.4)`;
                ctx.shadowBlur = 10;
                const y = h - height;
                ctx.beginPath();
                const r = 4;
                ctx.moveTo(x + r, y);
                ctx.quadraticCurveTo(x, y, x, y + r);
                ctx.lineTo(x, h);
                ctx.lineTo(x + barWidth, h);
                ctx.lineTo(x + barWidth, y + r);
                ctx.quadraticCurveTo(x + barWidth, y, x + barWidth - r, y);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                // блик
                if (height > 8) {
                    const grad = ctx.createLinearGradient(x, y, x, y + 8);
                    grad.addColorStop(0, 'rgba(255,255,255,0.25)');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y, barWidth, 6);
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 2. Волна -----
        function drawWave(w, h, values, count) {
            ctx.strokeStyle = '#8ab4ff';
            ctx.shadowColor = '#4a7fd4';
            ctx.shadowBlur = 20;
            ctx.lineWidth = 3;
            ctx.beginPath();
            const amp = 70;
            const baseY = h / 2;
            for (let i = 0; i < count; i++) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y = baseY + Math.sin(i * 0.3 + Date.now() * 0.002) * 20 * val + (val - 0.5) * amp * 0.8;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            // вторая волна (зеркальная)
            ctx.strokeStyle = '#ff7b9c';
            ctx.shadowColor = '#d44a6a';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y = h/2 + Math.cos(i * 0.25 + Date.now() * 0.0015) * 18 * val + (val - 0.5) * amp * 0.7;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // точки на волнах
            for (let i = 0; i < count; i+=3) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y1 = h/2 + Math.sin(i * 0.3 + Date.now() * 0.002) * 20 * val + (val - 0.5) * amp * 0.8;
                const y2 = h/2 + Math.cos(i * 0.25 + Date.now() * 0.0015) * 18 * val + (val - 0.5) * amp * 0.7;
                ctx.fillStyle = `hsl(${200 + val*80}, 90%, 70%)`;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(x, y1, 2 + val*4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = `hsl(${320 + val*60}, 90%, 70%)`;
                ctx.beginPath();
                ctx.arc(x, y2, 2 + val*3, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // ----- 3. Абстрактные круги -----
        function drawCircles(w, h, values, count, overall) {
            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.42;
            const layers = 8;
            for (let layer = 0; layer < layers; layer++) {
                const idx = Math.floor((layer / layers) * count);
                const val = values[idx] || 0.1;
                const r = maxR * (0.2 + 0.8 * (layer / layers)) * (0.7 + val * 0.5);
                const hue = (layer * 35 + Date.now() * 0.02) % 360;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${0.2 + val * 0.5})`;
                ctx.lineWidth = 2 + val * 6;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.6)`;
                ctx.shadowBlur = 25;
                ctx.stroke();
                // внутренние точки
                if (val > 0.3) {
                    for (let k = 0; k < 6; k++) {
                        const angle = k * 1.0 + Date.now() * 0.001;
                        const dx = Math.cos(angle) * r * 0.7;
                        const dy = Math.sin(angle) * r * 0.7;
                        ctx.beginPath();
                        ctx.arc(cx + dx, cy + dy, 2 + val*6, 0, Math.PI*2);
                        ctx.fillStyle = `hsla(${hue+40}, 90%, 70%, ${0.3+val*0.5})`;
                        ctx.fill();
                    }
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 4. Рисовалка (частицы) -----
        function drawParticles(w, h, values, count, overall) {
            // фон с "туманом"
            ctx.fillStyle = 'rgba(11, 16, 31, 0.2)';
            ctx.fillRect(0, 0, w, h);

            const speedFactor = 0.3 + overall * 0.7;
            // обновляем частицы
            for (let p of particles) {
                // влияние музыки: скорость и направление
                const idx = Math.floor(Math.random() * count);
                const val = values[idx] || 0.1;
                const angle = Math.atan2(p.y - h/2, p.x - w/2) + (val - 0.5) * 0.8;
                const force = 0.4 + val * 1.2;
                p.vx += Math.cos(angle) * force * 0.08;
                p.vy += Math.sin(angle) * force * 0.08;
                // трение
                p.vx *= 0.98;
                p.vy *= 0.98;

                p.x += p.vx * speedFactor * 1.2;
                p.y += p.vy * speedFactor * 1.2;

                // отскок от краёв
                if (p.x < 0) { p.x = 0; p.vx *= -0.5; }
                if (p.x > w) { p.x = w; p.vx *= -0.5; }
                if (p.y < 0) { p.y = 0; p.vy *= -0.5; }
                if (p.y > h) { p.y = h; p.vy *= -0.5; }

                // размер и цвет под музыку
                const size = 1.5 + val * 5 + p.size * 0.5;
                const hue = (p.hue + val * 30 + Date.now() * 0.02) % 360;
                const lightness = 50 + val * 40;

                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.6)`;
                ctx.fillStyle = `hsl(${hue}, 90%, ${lightness}%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(1, size), 0, Math.PI*2);
                ctx.fill();

                // связь между частицами (линии)
                if (overall > 0.2) {
                    for (let other of particles) {
                        const dx = p.x - other.x;
                        const dy = p.y - other.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 50 && dist > 2) {
                            const alpha = (1 - dist/50) * 0.25 * overall;
                            ctx.strokeStyle = `rgba(180, 200, 255, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.shadowBlur = 4;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(other.x, other.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- цикл анимации -----
        function animate() {
            if (!isActive) return;
            drawVisualization();
            animationFrame = requestAnimationFrame(animate);
        }

        // ----- старт -----
        async function startVisualizer() {
            if (isActive) return;
            statusText.innerText = 'Запуск...';
            indicator.className = 'indicator';
            const ok = await initAudio();
            if (!ok) {
                statusText.innerText = '❌ Ошибка';
                return;
            }
            isActive = true;
            statusText.innerText = '▶ Активен';
            indicator.className = 'indicator active';
            smoothedValues.fill(0.15);
            if (currentMode === 'particles') initParticles();
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animate();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            stopBtn.style.opacity = '1';
        }

        // ----- стоп -----
        function stopVisualizer() {
            if (!isActive) return;
            isActive = false;
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0b101f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            indicator.className = 'indicator';
            statusText.innerText = '⏹ Остановлен';

            if (source) { try { source.disconnect(); } catch(e) {} source = null; }
            if (analyser) { try { analyser.disconnect(); } catch(e) {} analyser = null; }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(() => {});
            }
            audioContext = null;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.style.opacity = '0.6';
        }

        // ----- обработчики -----
        startBtn.addEventListener('click', startVisualizer);
        stopBtn.addEventListener('click', stopVisualizer);
        stopBtn.disabled = true;
        stopBtn.style.opacity = '0.6';

        // заглушка
        (function drawIdle() {
            ctx.fillStyle = '#0b101f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 40; i++) {
                const x = 4 + i * 17;
                ctx.fillStyle = '#1b2642';
                ctx.fillRect(x, canvas.height - 8, 10, 8);
            }
        })();

        console.log('🎵 Цветомузыка 4в1. Нажмите "Включить" и разрешите захват.');
    })();
</script>
</body>
</html>
