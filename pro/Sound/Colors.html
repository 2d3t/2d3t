<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎶 Цветомузыка · Fullscreen + центробежная рисовалка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
            transition: background 0.3s;
        }

        body.fullscreen-mode {
            padding: 0;
            background: #05080f;
        }

        .container {
            background: #141a2b;
            padding: 1.8rem 1.8rem 1.5rem;
            border-radius: 2.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid #2f3b5a;
            width: 820px;
            max-width: 98vw;
            transition: all 0.3s ease;
            position: relative;
        }

        body.fullscreen-mode .container {
            border-radius: 0;
            border: none;
            box-shadow: none;
            max-width: 100vw;
            width: 100vw;
            height: 100vh;
            padding: 12px;
            background: #0a0f1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 260px;
            border-radius: 24px;
            background: #0b101f;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.6), 0 0 0 1px #2a3452;
            margin-bottom: 1.4rem;
            image-rendering: crisp-edges;
            transition: all 0.3s ease;
        }

        body.fullscreen-mode canvas {
            height: calc(100vh - 140px);
            border-radius: 16px;
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.8), 0 0 0 1px #2f3b5a;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 8px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn {
            background: #1f2842;
            border: none;
            border-radius: 60px;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #b7c9f0;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 #0d1322, 0 4px 12px rgba(0,0,0,0.5);
            transition: all 0.08s ease;
            border: 1px solid #3d4b70;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: inset 0 -2px 0 #0d1322;
        }

        .btn-primary {
            background: #4a5f9e;
            color: white;
            border-color: #7b92d4;
            box-shadow: inset 0 -4px 0 #25345a, 0 4px 16px #1a264a;
        }

        .btn-primary:active {
            background: #3d5090;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: scale(0.97);
            pointer-events: none;
        }

        .btn-secondary {
            background: #2d385a;
            border-color: #4b5a82;
        }

        .btn-mode {
            background: #1a2340;
            border-color: #384674;
            color: #8da0d4;
            padding: 8px 14px;
            font-size: 0.78rem;
        }
        .btn-mode.active-mode {
            background: #4f6bb0;
            color: white;
            border-color: #8aa4ef;
            box-shadow: 0 0 16px #3f5ca0;
        }

        .btn-fullscreen {
            background: #2a3a5a;
            border-color: #4a6a8a;
            color: #b0ccff;
            padding: 8px 16px;
            font-size: 0.8rem;
            margin-left: auto;
        }
        .btn-fullscreen:hover {
            background: #3a4a7a;
        }

        .status {
            color: #95a9d9;
            background: #10172b;
            padding: 6px 16px;
            border-radius: 60px;
            font-size: 0.78rem;
            border: 1px solid #2b3857;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3a4a6a;
            transition: 0.15s;
        }
        .indicator.active {
            background: #7effb7;
            box-shadow: 0 0 16px #6effa0;
        }

        .credit {
            text-align: right;
            font-size: 0.7rem;
            color: #3f507a;
            margin-top: 10px;
            opacity: 0.6;
            letter-spacing: 0.3px;
        }

        body.fullscreen-mode .credit {
            display: none;
        }

        @media (max-width: 700px) {
            .container { padding: 1rem; }
            .btn { padding: 8px 12px; font-size: 0.7rem; }
            .status { font-size: 0.65rem; padding: 4px 10px; }
            .btn-mode { padding: 6px 10px; font-size: 0.65rem; }
        }
    </style>
</head>
<body>
<div class="container" id="appContainer">
    <canvas id="visualizer" width="780" height="260"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn">▶ Включить</button>
            <button class="btn btn-secondary" id="stopBtn">⏹ Стоп</button>
        </div>

        <div class="btn-group" id="modeGroup">
            <button class="btn btn-mode active-mode" data-mode="bars">📊 Полосы</button>
            <button class="btn btn-mode" data-mode="wave">〰️ Волна</button>
            <button class="btn btn-mode" data-mode="circles">⭕ Абстракция</button>
            <button class="btn btn-mode" data-mode="particles">✨ Рисовалка</button>
        </div>

        <button class="btn btn-fullscreen" id="fullscreenBtn">⛶ На весь экран</button>

        <div class="status">
            <span class="indicator" id="liveIndicator"></span>
            <span id="statusText">Ожидание</span>
        </div>
    </div>
    <div class="credit">🎛️ системный звук · центробежная рисовалка · fullscreen</div>
</div>

<script>
    (function() {
        "use strict";

        // ----- элементы -----
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('appContainer');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const indicator = document.getElementById('liveIndicator');
        const modeBtns = document.querySelectorAll('.btn-mode');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // ----- настройки -----
        const BARS_COUNT = 48;
        const SMOOTHING = 0.6;
        const MIN_BAR_HEIGHT = 4;

        let audioContext = null;
        let analyser = null;
        let source = null;
        let stream = null;
        let animationFrame = null;
        let isActive = false;

        let smoothedValues = new Float32Array(BARS_COUNT).fill(0.15);
        let currentMode = 'bars';

        // ----- частицы (центробежная рисовалка) -----
        let particles = [];
        const PARTICLE_COUNT = 180;
        let particleTime = 0;

        function initParticles() {
            particles = [];
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 10 + Math.random() * 30;
                particles.push({
                    x: cx + Math.cos(angle) * dist,
                    y: cy + Math.sin(angle) * dist,
                    vx: Math.cos(angle) * (0.5 + Math.random() * 1.5),
                    vy: Math.sin(angle) * (0.5 + Math.random() * 1.5),
                    size: 1.5 + Math.random() * 3.5,
                    hue: Math.random() * 360,
                    life: 0.6 + Math.random() * 0.4,
                    angle: angle,
                    dist: dist,
                });
            }
        }
        initParticles();

        // ----- получение звука с динамиков -----
        async function getSystemAudioStream() {
            try {
                const mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        suppressLocalAudioPlayback: false,
                    }
                });
                const audioTracks = mediaStream.getAudioTracks();
                if (audioTracks.length === 0) throw new Error('Нет аудио');
                return new MediaStream(audioTracks);
            } catch (err) {
                console.warn('getDisplayMedia fallback → микрофон', err);
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                    });
                    return micStream;
                } catch (micErr) {
                    throw new Error('Нет доступа к звуку');
                }
            }
        }

        // ----- инициализация аудио -----
        async function initAudio() {
            try {
                stream = await getSystemAudioStream();
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.75;
                source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                return true;
            } catch (error) {
                console.error('Audio init error:', error);
                statusText.innerText = '❌ Ошибка звука';
                indicator.className = 'indicator';
                return false;
            }
        }

        // ----- визуализация -----
        function drawVisualization() {
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            const count = Math.min(BARS_COUNT, bufferLength);
            const step = Math.floor(bufferLength / count);
            const rawValues = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                let sum = 0;
                for (let j = 0; j < step; j++) {
                    const idx = i * step + j;
                    if (idx < bufferLength) sum += dataArray[idx];
                }
                let avg = sum / step / 255.0;
                avg = Math.pow(avg, 0.7);
                avg = Math.min(1, avg);
                const prev = smoothedValues[i] || 0.15;
                const smoothed = prev * SMOOTHING + avg * (1 - SMOOTHING);
                smoothedValues[i] = Math.max(0.06, smoothed);
                rawValues[i] = smoothedValues[i];
            }

            let overall = 0;
            for (let i = 0; i < count; i++) overall += rawValues[i];
            overall /= count;

            if (overall > 0.08) {
                indicator.className = 'indicator active';
            } else {
                indicator.className = 'indicator';
            }

            switch (currentMode) {
                case 'bars': drawBars(w, h, rawValues, count); break;
                case 'wave': drawWave(w, h, rawValues, count); break;
                case 'circles': drawCircles(w, h, rawValues, count, overall); break;
                case 'particles': drawParticles(w, h, rawValues, count, overall); break;
                default: drawBars(w, h, rawValues, count);
            }
        }

        // ----- 1. Полосы -----
        function drawBars(w, h, values, count) {
            const gap = 3;
            const barWidth = (w - gap * (count + 1)) / count * 0.7 + 2;
            for (let i = 0; i < count; i++) {
                const val = values[i];
                const maxH = h * 0.85;
                const height = Math.max(MIN_BAR_HEIGHT, val * maxH);
                const x = gap + i * (barWidth + gap);
                const hue = 220 - val * 140;
                const color = `hsl(${hue}, 85%, ${35 + val * 45}%)`;
                ctx.fillStyle = color;
                ctx.shadowColor = `hsla(${hue}, 90%, 60%, 0.4)`;
                ctx.shadowBlur = 10;
                const y = h - height;
                ctx.beginPath();
                const r = 4;
                ctx.moveTo(x + r, y);
                ctx.quadraticCurveTo(x, y, x, y + r);
                ctx.lineTo(x, h);
                ctx.lineTo(x + barWidth, h);
                ctx.lineTo(x + barWidth, y + r);
                ctx.quadraticCurveTo(x + barWidth, y, x + barWidth - r, y);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                if (height > 8) {
                    const grad = ctx.createLinearGradient(x, y, x, y + 8);
                    grad.addColorStop(0, 'rgba(255,255,255,0.25)');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y, barWidth, 6);
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 2. Волна -----
        function drawWave(w, h, values, count) {
            ctx.strokeStyle = '#8ab4ff';
            ctx.shadowColor = '#4a7fd4';
            ctx.shadowBlur = 20;
            ctx.lineWidth = 3;
            ctx.beginPath();
            const amp = 70;
            const baseY = h / 2;
            for (let i = 0; i < count; i++) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y = baseY + Math.sin(i * 0.3 + Date.now() * 0.002) * 20 * val + (val - 0.5) * amp * 0.8;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.strokeStyle = '#ff7b9c';
            ctx.shadowColor = '#d44a6a';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            for (let i = 0; i < count; i++) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y = h/2 + Math.cos(i * 0.25 + Date.now() * 0.0015) * 18 * val + (val - 0.5) * amp * 0.7;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
            for (let i = 0; i < count; i+=3) {
                const x = (i / count) * w;
                const val = values[i] || 0.1;
                const y1 = h/2 + Math.sin(i * 0.3 + Date.now() * 0.002) * 20 * val + (val - 0.5) * amp * 0.8;
                const y2 = h/2 + Math.cos(i * 0.25 + Date.now() * 0.0015) * 18 * val + (val - 0.5) * amp * 0.7;
                ctx.fillStyle = `hsl(${200 + val*80}, 90%, 70%)`;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(x, y1, 2 + val*4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = `hsl(${320 + val*60}, 90%, 70%)`;
                ctx.beginPath();
                ctx.arc(x, y2, 2 + val*3, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // ----- 3. Абстракция (круги) -----
        function drawCircles(w, h, values, count, overall) {
            const cx = w/2, cy = h/2;
            const maxR = Math.min(w, h) * 0.42;
            const layers = 8;
            for (let layer = 0; layer < layers; layer++) {
                const idx = Math.floor((layer / layers) * count);
                const val = values[idx] || 0.1;
                const r = maxR * (0.2 + 0.8 * (layer / layers)) * (0.7 + val * 0.5);
                const hue = (layer * 35 + Date.now() * 0.02) % 360;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${0.2 + val * 0.5})`;
                ctx.lineWidth = 2 + val * 6;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.6)`;
                ctx.shadowBlur = 25;
                ctx.stroke();
                if (val > 0.3) {
                    for (let k = 0; k < 6; k++) {
                        const angle = k * 1.0 + Date.now() * 0.001;
                        const dx = Math.cos(angle) * r * 0.7;
                        const dy = Math.sin(angle) * r * 0.7;
                        ctx.beginPath();
                        ctx.arc(cx + dx, cy + dy, 2 + val*6, 0, Math.PI*2);
                        ctx.fillStyle = `hsla(${hue+40}, 90%, 70%, ${0.3+val*0.5})`;
                        ctx.fill();
                    }
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- 4. Рисовалка (центробежная) -----
        function drawParticles(w, h, values, count, overall) {
            // прозрачный фон для эффекта шлейфа
            ctx.fillStyle = 'rgba(10, 15, 30, 0.25)';
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const time = Date.now() * 0.001;

            // обновляем частицы
            for (let p of particles) {
                // музыкальное воздействие
                const idx = Math.floor(Math.random() * count);
                const val = values[idx] || 0.1;
                const force = 0.3 + val * 1.8;

                // центробежная сила + случайное отклонение
                const dx = p.x - cx;
                const dy = p.y - cy;
                const dist = Math.sqrt(dx*dx + dy*dy) || 1;
                const normX = dx / dist;
                const normY = dy / dist;

                // добавляем ускорение от центра
                p.vx += normX * force * 0.12;
                p.vy += normY * force * 0.12;

                // небольшое случайное блуждание (зависит от музыки)
                p.vx += (Math.random() - 0.5) * 0.15 * (0.5 + val);
                p.vy += (Math.random() - 0.5) * 0.15 * (0.5 + val);

                // трение
                p.vx *= 0.985;
                p.vy *= 0.985;

                // ограничение скорости
                const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
                const maxSpeed = 3 + val * 4;
                if (speed > maxSpeed) {
                    p.vx = (p.vx / speed) * maxSpeed;
                    p.vy = (p.vy / speed) * maxSpeed;
                }

                p.x += p.vx;
                p.y += p.vy;

                // если улетели слишком далеко — ресет в центр
                const newDist = Math.sqrt((p.x-cx)*(p.x-cx) + (p.y-cy)*(p.y-cy));
                if (newDist > Math.max(w, h) * 0.7 || newDist < 5) {
                    const angle = Math.random() * Math.PI * 2;
                    const r = 10 + Math.random() * 40;
                    p.x = cx + Math.cos(angle) * r;
                    p.y = cy + Math.sin(angle) * r;
                    p.vx = Math.cos(angle) * (0.5 + Math.random() * 1.2);
                    p.vy = Math.sin(angle) * (0.5 + Math.random() * 1.2);
                    p.hue = Math.random() * 360;
                    p.size = 1.5 + Math.random() * 3.5;
                }

                // отрисовка
                const size = p.size * (0.6 + val * 0.8);
                const hue = (p.hue + val * 40 + time * 10) % 360;
                const lightness = 50 + val * 40;

                ctx.shadowBlur = 18;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.5)`;
                ctx.fillStyle = `hsl(${hue}, 90%, ${lightness}%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.8, size), 0, Math.PI*2);
                ctx.fill();

                // линии между близкими частицами (только при громкой музыке)
                if (overall > 0.25) {
                    for (let other of particles) {
                        const dx2 = p.x - other.x;
                        const dy2 = p.y - other.y;
                        const dist2 = Math.sqrt(dx2*dx2 + dy2*dy2);
                        if (dist2 < 45 && dist2 > 2) {
                            const alpha = (1 - dist2/45) * 0.3 * overall;
                            ctx.strokeStyle = `rgba(160, 190, 255, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.shadowBlur = 4;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(other.x, other.y);
                            ctx.stroke();
                        }
                    }
                }
            }
            ctx.shadowBlur = 0;
        }

        // ----- анимация -----
        function animate() {
            if (!isActive) return;
            drawVisualization();
            animationFrame = requestAnimationFrame(animate);
        }

        // ----- старт -----
        async function startVisualizer() {
            if (isActive) return;
            statusText.innerText = 'Запуск...';
            indicator.className = 'indicator';
            const ok = await initAudio();
            if (!ok) {
                statusText.innerText = '❌ Ошибка';
                return;
            }
            isActive = true;
            statusText.innerText = '▶ Активен';
            indicator.className = 'indicator active';
            smoothedValues.fill(0.15);
            if (currentMode === 'particles') initParticles();
            if (animationFrame) cancelAnimationFrame(animationFrame);
            animate();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            stopBtn.style.opacity = '1';
        }

        // ----- стоп -----
        function stopVisualizer() {
            if (!isActive) return;
            isActive = false;
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0b101f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            indicator.className = 'indicator';
            statusText.innerText = '⏹ Остановлен';

            if (source) { try { source.disconnect(); } catch(e) {} source = null; }
            if (analyser) { try { analyser.disconnect(); } catch(e) {} analyser = null; }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(() => {});
            }
            audioContext = null;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.style.opacity = '0.6';
        }

        // ----- полноэкранный режим -----
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.() || 
                document.documentElement.webkitRequestFullscreen?.();
                document.body.classList.add('fullscreen-mode');
                fullscreenBtn.textContent = '⛶ Выйти';
            } else {
                document.exitFullscreen?.() || 
                document.webkitExitFullscreen?.();
                document.body.classList.remove('fullscreen-mode');
                fullscreenBtn.textContent = '⛶ На весь экран';
            }
        }

        // следим за выходом из fullscreen через Escape
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('fullscreen-mode');
                fullscreenBtn.textContent = '⛶ На весь экран';
            }
        });

        // ----- обработчики -----
        startBtn.addEventListener('click', startVisualizer);
        stopBtn.addEventListener('click', stopVisualizer);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        stopBtn.disabled = true;
        stopBtn.style.opacity = '0.6';

        // переключение режимов
        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active-mode'));
                this.classList.add('active-mode');
                currentMode = this.dataset.mode;
                if (currentMode === 'particles' && particles.length === 0) {
                    initParticles();
                }
            });
        });

        // заглушка
        (function drawIdle() {
            ctx.fillStyle = '#0b101f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 40; i++) {
                const x = 4 + i * 18;
                ctx.fillStyle = '#1b2642';
                ctx.fillRect(x, canvas.height - 8, 10, 8);
            }
        })();

        console.log('🎵 Цветомузыка с центробежной рисовалкой и fullscreen');
    })();
</script>
