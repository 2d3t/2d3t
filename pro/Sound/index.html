<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Захват звука → MP3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, system-ui, sans-serif;
            padding: 20px;
            color: #e8edff;
        }
        .app {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: #141c2b;
            padding: 28px 24px;
            border-radius: 40px;
            border: 1px solid #263040;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            text-align: center;
        }
        .card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c9aff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 0.85rem;
            opacity: 0.4;
            margin-bottom: 16px;
        }

        .warning {
            background: #1a1528;
            padding: 12px 16px;
            border-radius: 16px;
            margin: 0 0 14px 0;
            font-size: 0.85rem;
            border-left: 4px solid #fbbf24;
            color: #c8d0f0;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }
        .warning .icon { font-size: 1.6rem; flex-shrink: 0; }
        .warning strong { color: #fcd34d; }

        .status-row {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #0f1625;
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid #253040;
            margin-bottom: 12px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4a5568;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .dot.recording { background: #48bb78; box-shadow: 0 0 20px #48bb7855; animation: pulse 1s infinite; }
        .dot.error { background: #fc8181; box-shadow: 0 0 20px #fc818155; }
        .dot.processing { background: #f6ad55; box-shadow: 0 0 20px #f6ad5555; animation: pulse 0.6s infinite; }
        .dot.done { background: #a78bfa; box-shadow: 0 0 20px #a78bfa55; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }

        .status-text { font-size: 0.95rem; color: #bcc6e3; flex: 1; text-align: left; }
        .timer { font-family: 'SF Mono', monospace; font-size: 1.2rem; font-weight: 600; color: #7c9aff; }

        .meter-wrap {
            background: #0b111f;
            height: 6px;
            border-radius: 20px;
            margin: 0 0 16px 0;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }
        .meter-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4f7aff, #a78bfa, #f472b6);
            border-radius: 20px;
            transition: width 0.06s ease;
        }

        .btn-main {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.1s linear;
            position: relative;
            background: #3b5bdb;
            border: 1px solid #5f7dfa;
            box-shadow: 0 6px 0 #1f2e7a;
            letter-spacing: 0.5px;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f2e7a; }
        .btn-main:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1f2e7a;
            pointer-events: none;
        }
        .btn-main.recording {
            background: #b53b4a;
            border-color: #d95a6a;
            box-shadow: 0 6px 0 #6e1f2b;
        }
        .btn-main.recording:active { transform: translateY(4px); box-shadow: 0 2px 0 #6e1f2b; }
        .btn-main.processing {
            background: #4a5a7a;
            border-color: #5f7a9a;
            box-shadow: 0 6px 0 #2a3a5a;
        }
        .btn-main.done {
            background: #2d8f5c;
            border-color: #4aad7a;
            box-shadow: 0 6px 0 #1a5a3a;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            background: #0f1625;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid #1f2a4a;
            margin-top: 12px;
        }
        .settings-row label {
            font-size: 0.8rem;
            color: #8a9abb;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-row input[type="range"] {
            width: 80px;
            accent-color: #7c9aff;
            background: #1f2840;
            height: 4px;
            border-radius: 10px;
            outline: none;
        }
        .settings-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #7c9aff;
            cursor: pointer;
        }
        .settings-row .value {
            color: #7c9aff;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
            font-size: 0.8rem;
        }
        .settings-row .toggle-btn {
            background: #2a3550;
            border: 1px solid #4a5a7a;
            color: #b0c4f0;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 600;
            transition: 0.15s;
        }
        .settings-row .toggle-btn:hover { background: #36466b; }
        .settings-row .toggle-btn.active {
            background: #1f2a4a;
            border-color: #7c9aff;
            color: #7c9aff;
        }
        .settings-row .toggle-btn.inactive {
            background: #2a1a1a;
            border-color: #6a4a4a;
            color: #b08080;
        }

        .status-msg {
            font-size: 0.85rem;
            color: #8a9abb;
            margin-top: 10px;
            min-height: 24px;
        }
        .status-msg.success { color: #a1d6a8; }
        .status-msg.error { color: #f7a9a9; }

        .footer { font-size: 0.65rem; color: #4a5a7a; text-align: center; margin-top: 4px; border-top: 1px solid #1f2840; padding-top: 12px; }

        .save-area {
            margin-top: 12px;
            display: none;
            gap: 10px;
            flex-wrap: wrap;
        }
        .save-area.show { display: flex; }
        .save-area .btn-save {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            color: #fff;
            background: #2d8f5c;
            border: 1px solid #4aad7a;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a5a3a;
            transition: 0.06s linear;
            font-size: 0.9rem;
            min-width: 100px;
        }
        .save-area .btn-save:active { transform: translateY(4px); box-shadow: 0 0px 0 #1a5a3a; }
        .save-area .btn-save:disabled { opacity: 0.4; transform: translateY(2px); box-shadow: 0 2px 0 #1a5a3a; pointer-events: none; }
        .save-area .btn-reset {
            padding: 12px 18px;
            border: 1px solid #495478;
            background: transparent;
            color: #a8b4d4;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 450;
            font-size: 0.9rem;
        }
        .save-area .btn-reset:hover { background: #2d3650; border-color: #6b7da3; color: #d6def5; }
        
        .file-name-display {
            font-size: 0.75rem;
            color: #7a88b0;
            word-break: break-all;
            padding: 6px 12px;
            background: #0f1625;
            border-radius: 30px;
            border: 1px solid #1f2a4a;
            flex: 1;
            min-width: 100px;
        }
        .file-name-display .highlight { color: #7c9aff; font-weight: 600; }

        .trim-info {
            font-size: 0.7rem;
            color: #6a7a9a;
            margin-top: 6px;
            display: none;
        }
        .trim-info.show { display: block; }
        .trim-info .highlight { color: #48bb78; font-weight: 600; }
    </style>
</head>
<body>
<div class="app">

    <div class="card">
        <h1>🎧 Захват звука</h1>
        <div class="sub">запись → авто-обрезка → MP3</div>

        <div class="warning">
            <span class="icon">🔊</span>
            <div><strong>Важно!</strong> Установите громкость в захватываемой вкладке на <strong>максимум</strong></div>
        </div>

        <div class="status-row">
            <span class="dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Готов</span>
            <span class="timer" id="timerDisplay">00:00</span>
        </div>

        <div class="meter-wrap"><div class="meter-bar" id="meterBar"></div></div>

        <button class="btn-main" id="mainBtn">▶ Захват</button>

        <div class="status-msg" id="statusMsg">Нажмите «Захват» и выберите вкладку с звуком</div>
        <div class="trim-info" id="trimInfo">✂️ Обрезано в конце: <span class="highlight" id="trimEndInfo">0.0</span> сек</div>

        <div class="settings-row">
            <label>
                ⏹ Авто-стоп:
                <input type="range" id="silenceThreshold" min="0.5" max="3" step="0.1" value="0.5">
                <span class="value" id="thresholdValue">0.5</span>с
            </label>
            <button class="toggle-btn active" id="autoStopToggle">Вкл</button>
        </div>

        <div class="save-area" id="saveArea">
            <span class="file-name-display">📁 <span class="highlight" id="finalFileName">audio.mp3</span></span>
            <button class="btn-save" id="saveBtn">💾 Сохранить</button>
            <button class="btn-reset" id="resetBtn">⟳</button>
        </div>

        <div class="footer">Конвертация выполняется локально в браузере</div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        // ====== ЭЛЕМЕНТЫ ======
        const mainBtn = document.getElementById('mainBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusMsg = document.getElementById('statusMsg');
        const meterBar = document.getElementById('meterBar');
        const timerDisplay = document.getElementById('timerDisplay');
        const silenceThreshold = document.getElementById('silenceThreshold');
        const thresholdValue = document.getElementById('thresholdValue');
        const autoStopToggle = document.getElementById('autoStopToggle');
        const saveArea = document.getElementById('saveArea');
        const finalFileName = document.getElementById('finalFileName');
        const saveBtn = document.getElementById('saveBtn');
        const resetBtn = document.getElementById('resetBtn');
        const trimInfo = document.getElementById('trimInfo');
        const trimEndInfo = document.getElementById('trimEndInfo');

        // ====== СОСТОЯНИЕ ======
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;
        let mediaStream = null;
        let source = null;
        let recorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let startTime = 0;
        let timerInterval = null;
        let finalBlob = null;
        let finalFile = null;
        let audioBufferData = null;
        let isConverting = false;
        let convertedBlob = null;
        let convertedFileName = '';
        let autoStopEnabled = true;
        let silenceStartTime = null;
        let isAutoStopping = false;
        let isManualStop = false; // Флаг ручной остановки

        // ====== ВСПОМОГАТЕЛЬНЫЕ ======
        function setStatus(text, state, msg = '') {
            statusText.textContent = text;
            statusDot.className = 'dot';
            if (state === 'recording') statusDot.classList.add('recording');
            else if (state === 'error') statusDot.classList.add('error');
            else if (state === 'processing') statusDot.classList.add('processing');
            else if (state === 'done') statusDot.classList.add('done');
            
            if (msg) statusMsg.textContent = msg;
            statusMsg.className = 'status-msg';
            if (state === 'error') statusMsg.classList.add('error');
            else if (state === 'done') statusMsg.classList.add('success');
        }

        function formatTime(seconds) {
            if (!seconds || seconds < 0) return '0:00';
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(Math.floor(seconds % 60)).padStart(2, '0');
            return m + ':' + s;
        }

        function updateMainBtn(text, state) {
            mainBtn.textContent = text;
            mainBtn.className = 'btn-main';
            if (state === 'recording') mainBtn.classList.add('recording');
            else if (state === 'processing') mainBtn.classList.add('processing');
            else if (state === 'done') mainBtn.classList.add('done');
        }

        function loadLameJs() {
            return new Promise((resolve, reject) => {
                if (typeof lamejs !== 'undefined') { resolve(); return; }
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('Не удалось загрузить lamejs'));
                document.head.appendChild(script);
            });
        }

        // ====== НОВАЯ ЛОГИКА ОБРЕЗКИ КОНЦА ======
        // Для ручной остановки: анализируем последние 20 секунд
        function findEndForManualStop(buffer, threshold = 0.005, lookahead = 0.4) {
            const samples = buffer.length;
            const sampleRate = buffer.sampleRate;
            const data = buffer.getChannelData(0);
            
            // Анализируем последние 20 секунд (или меньше, если запись короче)
            const maxLookbackSamples = Math.min(samples, Math.floor(20 * sampleRate));
            const startSearch = samples - maxLookbackSamples;
            
            let lastSoundIndex = -1;
            // Идём с конца найденного диапазона
            for (let i = samples - 1; i >= startSearch; i--) {
                if (Math.abs(data[i]) > threshold) {
                    lastSoundIndex = i;
                    break;
                }
            }
            
            // Если звук не найден во всём диапазоне — ищем во всём файле
            if (lastSoundIndex === -1) {
                for (let i = samples - 1; i >= 0; i--) {
                    if (Math.abs(data[i]) > threshold) {
                        lastSoundIndex = i;
                        break;
                    }
                }
            }
            
            if (lastSoundIndex === -1) return buffer.duration;
            
            // Отступаем вперёд на lookahead (0.4 сек)
            const lookaheadSamples = Math.floor(lookahead * sampleRate);
            const endIndex = Math.min(samples - 1, lastSoundIndex + lookaheadSamples);
            
            // Ищем тишину после последнего звука
            let silenceIndex = endIndex;
            for (let i = endIndex; i > lastSoundIndex; i--) {
                if (Math.abs(data[i]) < threshold * 0.5) {
                    silenceIndex = i;
                } else {
                    break;
                }
            }
            
            return silenceIndex / sampleRate;
        }

        // Для авто-стопа: стандартная обрезка по всему файлу
        function findSoundEnd(buffer, threshold = 0.005, lookahead = 0.3) {
            const samples = buffer.length;
            const data = buffer.getChannelData(0);
            
            let lastSoundIndex = -1;
            for (let i = samples - 1; i >= 0; i--) {
                if (Math.abs(data[i]) > threshold) {
                    lastSoundIndex = i;
                    break;
                }
            }
            
            if (lastSoundIndex === -1) return buffer.duration;
            
            const sampleRate = buffer.sampleRate;
            const lookaheadSamples = Math.floor(lookahead * sampleRate);
            const endIndex = Math.min(samples - 1, lastSoundIndex + lookaheadSamples);
            
            let silenceIndex = endIndex;
            for (let i = endIndex; i > lastSoundIndex; i--) {
                if (Math.abs(data[i]) < threshold * 0.5) {
                    silenceIndex = i;
                } else {
                    break;
                }
            }
            
            return silenceIndex / sampleRate;
        }

        function findSoundStart(buffer, threshold = 0.005, lookback = 0.3) {
            const samples = buffer.length;
            const data = buffer.getChannelData(0);
            let firstSoundIndex = -1;
            for (let i = 0; i < samples; i++) {
                if (Math.abs(data[i]) > threshold) { firstSoundIndex = i; break; }
            }
            if (firstSoundIndex === -1) return 0;
            const sampleRate = buffer.sampleRate;
            const lookbackSamples = Math.floor(lookback * sampleRate);
            const startIndex = Math.max(0, firstSoundIndex - lookbackSamples);
            let silenceIndex = startIndex;
            for (let i = startIndex; i < firstSoundIndex; i++) {
                if (Math.abs(data[i]) < threshold * 0.5) silenceIndex = i;
                else break;
            }
            return silenceIndex / sampleRate;
        }

        function trimBuffer(buffer, startTime, endTime) {
            const dur = buffer.duration;
            const channels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const startSample = Math.floor(startTime * sampleRate);
            const endSample = Math.floor(endTime * sampleRate);
            const length = endSample - startSample;
            
            if (length <= 0) return buffer;
            
            const newBuffer = new AudioContext().createBuffer(channels, length, sampleRate);
            for (let ch = 0; ch < channels; ch++) {
                const src = buffer.getChannelData(ch);
                const dst = newBuffer.getChannelData(ch);
                for (let i = 0; i < length; i++) {
                    dst[i] = src[startSample + i];
                }
            }
            return newBuffer;
        }

        function trimBoth(buffer, isManual) {
            const startTime = findSoundStart(buffer, 0.005, 0.3);
            
            let endTime;
            if (isManual) {
                // Ручная остановка: анализируем последние 20 секунд
                endTime = findEndForManualStop(buffer, 0.005, 0.4);
            } else {
                // Авто-стоп: анализируем весь файл
                endTime = findSoundEnd(buffer, 0.005, 0.3);
            }
            
            // Если конец оказался раньше начала или слишком близко
            if (endTime <= startTime + 0.1) {
                endTime = buffer.duration;
            }
            
            const trimmed = trimBuffer(buffer, startTime, endTime);
            const startSaved = startTime;
            const endSaved = buffer.duration - endTime;
            
            return { trimmed, startSaved, endSaved };
        }

        // ====== ЗАХВАТ ======
        function resetCaptureUI() {
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            meterBar.style.width = '0%';
            timerDisplay.textContent = '00:00';
            silenceStartTime = null;
            isAutoStopping = false;
            isManualStop = false;
            trimInfo.classList.remove('show');

            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(() => {});
            }
            audioContext = null;
            analyser = null;
            dataArray = null;
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            source = null;
            isRecording = false;
            recordedChunks = [];
            updateMainBtn('▶ Захват', '');
            setStatus('Готов', '', 'Нажмите «Захват» и выберите вкладку с звуком');
            mainBtn.disabled = false;
        }

        function updateMeter() {
            if (!analyser || !isRecording) {
                if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
                return;
            }
            analyser.getByteTimeDomainData(dataArray);
            let max = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const val = (dataArray[i] - 128) / 128;
                const abs = Math.abs(val);
                if (abs > max) max = abs;
            }
            const percent = Math.min(max * 100, 100);
            meterBar.style.width = percent + '%';
            
            // Авто-стоп (только если не ручная остановка)
            if (isRecording && !isAutoStopping && autoStopEnabled && !isManualStop) {
                const threshold = parseFloat(silenceThreshold.value);
                const isSilent = percent < 1.5;
                
                if (isSilent) {
                    if (silenceStartTime === null) silenceStartTime = Date.now();
                    const silenceDuration = (Date.now() - silenceStartTime) / 1000;
                    if (silenceDuration >= threshold) {
                        isAutoStopping = true;
                        setStatus('Авто-стоп...', 'processing', '⏹ Запись остановлена (тишина ' + threshold + 'с)');
                        stopCapture(false); // false = не ручная остановка
                        return;
                    }
                } else {
                    silenceStartTime = null;
                }
            }
            
            animationId = requestAnimationFrame(updateMeter);
        }

        async function startCapture() {
            if (isRecording) return;
            try {
                mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        sampleRate: 48000,
                        channelCount: 2,
                    }
                });
                const audioTracks = mediaStream.getAudioTracks();
                if (audioTracks.length === 0) throw new Error('Нет аудио-дорожки');

                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
                if (audioContext.state === 'suspended') await audioContext.resume();
                source = audioContext.createMediaStreamSource(mediaStream);

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                source.connect(analyser);

                const dest = audioContext.createMediaStreamDestination();
                source.connect(dest);

                recorder = new MediaRecorder(dest.stream, {
                    mimeType: 'audio/webm;codecs=opus',
                    audioBitsPerSecond: 320000,
                });

                recordedChunks = [];
                recorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                recorder.onstop = () => {
                    if (recordedChunks.length > 0) {
                        finalBlob = new Blob(recordedChunks, { type: 'audio/webm' });
                        const name = 'audio_' + new Date().toISOString().slice(0,19).replace(/[:-]/g, '') + '.webm';
                        finalFile = new File([finalBlob], name, { type: 'audio/webm' });
                        processRecording(finalFile, isManualStop);
                    }
                    isAutoStopping = false;
                };
                recorder.start(1000);

                isRecording = true;
                isManualStop = false;
                silenceStartTime = null;
                isAutoStopping = false;
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    if (!isRecording) return;
                    timerDisplay.textContent = formatTime((Date.now() - startTime) / 1000);
                }, 500);

                updateMainBtn('⏹ Остановить', 'recording');
                setStatus('Запись...', 'recording', '⏺ Идёт запись звука');
                mainBtn.disabled = false;

                if (animationId) cancelAnimationFrame(animationId);
                updateMeter();

                mediaStream.getVideoTracks()[0]?.addEventListener('ended', () => {
                    if (isRecording) {
                        isManualStop = true;
                        stopCapture(true);
                    }
                });

            } catch (err) {
                console.error(err);
                let msg = err.message || 'Ошибка захвата';
                if (msg.includes('Permission') || msg.includes('denied')) msg = '❌ Разрешение отклонено';
                else if (msg.includes('not supported')) msg = '❌ Браузер не поддерживает захват';
                setStatus('Ошибка', 'error', msg);
                updateMainBtn('▶ Захват', '');
                mainBtn.disabled = false;
                if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            }
        }

        function stopCapture(isManual = true) {
            if (!isRecording) return;
            isRecording = false;
            isManualStop = isManual;
            
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }

            if (recorder && recorder.state === 'recording') recorder.stop();
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (source) { try { source.disconnect(); } catch (_) {} source = null; }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(() => {});
                audioContext = null;
            }
            analyser = null;
            dataArray = null;

            meterBar.style.width = '0%';
            updateMainBtn('⏳ Обработка...', 'processing');
            setStatus('Обработка...', 'processing', isManual ? '🔍 Анализ конца записи...' : '🔄 Конвертация в MP3');
            mainBtn.disabled = true;
        }

        // ====== ОБРАБОТКА ЗАПИСИ ======
        async function processRecording(file, isManual) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
                ctx.close();
                audioBufferData = audioBuffer;
                
                await convertToMp3(isManual);
            } catch (err) {
                console.error(err);
                setStatus('Ошибка', 'error', '❌ Не удалось обработать аудио');
                updateMainBtn('▶ Захват', '');
                mainBtn.disabled = false;
            }
        }

        function encodeAudioBufferToMp3(audioBuffer, bitrate, onProgress) {
            return new Promise((resolve, reject) => {
                try {
                    const channels = audioBuffer.numberOfChannels;
                    const sampleRate = audioBuffer.sampleRate;
                    const samples = audioBuffer.length;
                    const left = audioBuffer.getChannelData(0);
                    const right = channels > 1 ? audioBuffer.getChannelData(1) : null;

                    const pcmData = new Int16Array(samples * channels);
                    for (let i = 0; i < samples; i++) {
                        const l = Math.max(-1, Math.min(1, left[i]));
                        pcmData[i * channels] = l < 0 ? l * 0x8000 : l * 0x7FFF;
                        if (channels > 1 && right) {
                            const r = Math.max(-1, Math.min(1, right[i]));
                            pcmData[i * channels + 1] = r < 0 ? r * 0x8000 : r * 0x7FFF;
                        }
                    }

                    const encoder = new lamejs.Mp3Encoder(channels, sampleRate, bitrate);
                    const mp3Data = [];
                    const blockSize = 1152;
                    let sampleIndex = 0;
                    const totalSamples = samples;

                    while (sampleIndex < totalSamples) {
                        const chunkSize = Math.min(blockSize, totalSamples - sampleIndex);
                        const leftChunk = new Int16Array(chunkSize);
                        const rightChunk = channels > 1 ? new Int16Array(chunkSize) : null;
                        for (let i = 0; i < chunkSize; i++) {
                            const idx = (sampleIndex + i) * channels;
                            leftChunk[i] = pcmData[idx];
                            if (channels > 1 && rightChunk) rightChunk[i] = pcmData[idx + 1];
                        }
                        let mp3buf;
                        if (channels > 1 && rightChunk) mp3buf = encoder.encodeBuffer(leftChunk, rightChunk);
                        else mp3buf = encoder.encodeBuffer(leftChunk);
                        if (mp3buf.length > 0) mp3Data.push(new Uint8Array(mp3buf));
                        sampleIndex += chunkSize;
                        const progress = Math.min(40 + (sampleIndex / totalSamples) * 55, 95);
                        if (onProgress) onProgress(progress);
                    }

                    const tail = encoder.flush();
                    if (tail.length > 0) mp3Data.push(new Uint8Array(tail));

                    const totalLen = mp3Data.reduce((acc, arr) => acc + arr.length, 0);
                    const result = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const part of mp3Data) { result.set(part, offset); offset += part.length; }
                    resolve(new Blob([result], { type: 'audio/mpeg' }));
                } catch (err) { reject(err); }
            });
        }

        async function convertToMp3(isManual) {
            if (!audioBufferData) {
                setStatus('Ошибка', 'error', '❌ Нет аудиоданных');
                updateMainBtn('▶ Захват', '');
                mainBtn.disabled = false;
                return;
            }

            try {
                setStatus('Обработка...', 'processing', isManual ? '🔍 Анализ конца записи...' : '🔄 Обрезка тишины...');
                
                // Обрезаем с учётом типа остановки
                const result = trimBoth(audioBufferData, isManual);
                const trimmed = result.trimmed;
                const endSaved = result.endSaved;
                
                // Показываем информацию об обрезке
                if (endSaved > 0.1) {
                    trimInfo.classList.add('show');
                    trimEndInfo.textContent = endSaved.toFixed(2);
                }
                
                if (typeof lamejs === 'undefined') {
                    setStatus('Обработка...', 'processing', '⏳ Загрузка аудиокодека...');
                    await loadLameJs();
                }

                const bitrate = 320;
                setStatus('Обработка...', 'processing', '🎵 Кодирование MP3 (320 kbps)...');
                
                const mp3Blob = await encodeAudioBufferToMp3(trimmed, bitrate, (progress) => {});
                
                convertedBlob = mp3Blob;
                const baseName = 'audio_' + new Date().toISOString().slice(0,19).replace(/[:-]/g, '');
                convertedFileName = baseName + '.mp3';
                finalFileName.textContent = convertedFileName;
                
                saveArea.classList.add('show');
                updateMainBtn('✅ Готово!', 'done');
                setStatus('Готово!', 'done', '✅ MP3 готов к сохранению');
                mainBtn.disabled = false;
                mainBtn.textContent = '✅ Готово!';
                setTimeout(() => {
                    if (!isRecording && !isConverting) {
                        mainBtn.textContent = '▶ Захват';
                        mainBtn.className = 'btn-main';
                    }
                }, 3000);

            } catch (err) {
                console.error(err);
                setStatus('Ошибка', 'error', '❌ Ошибка конвертации: ' + err.message);
                updateMainBtn('▶ Захват', '');
                mainBtn.disabled = false;
            }
        }

        // ====== СОХРАНЕНИЕ ======
        function saveFile() {
            if (!convertedBlob) {
                setStatus('Ошибка', 'error', '❌ Нет файла для сохранения');
                return;
            }
            const defaultName = convertedFileName || 'audio.mp3';
            const userFileName = prompt('Введите имя для MP3 файла:', defaultName.replace(/\.mp3$/, ''));
            if (userFileName === null) return;
            let finalName = userFileName.trim() || defaultName;
            if (!finalName.toLowerCase().endsWith('.mp3')) finalName += '.mp3';

            const url = URL.createObjectURL(convertedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = finalName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // ====== СБРОС ======
        function resetAll() {
            resetCaptureUI();
            saveArea.classList.remove('show');
            trimInfo.classList.remove('show');
            convertedBlob = null;
            convertedFileName = '';
            audioBufferData = null;
            finalFile = null;
            finalBlob = null;
            if (audioPlayer) { audioPlayer.pause(); audioPlayer = null; }
            setStatus('Готов', '', 'Нажмите «Захват» и выберите вкладку с звуком');
            updateMainBtn('▶ Захват', '');
            mainBtn.disabled = false;
        }

        // ====== НАСТРОЙКИ ======
        silenceThreshold.addEventListener('input', () => {
            thresholdValue.textContent = parseFloat(silenceThreshold.value).toFixed(1);
        });

        autoStopToggle.addEventListener('click', () => {
            autoStopEnabled = !autoStopEnabled;
            autoStopToggle.textContent = autoStopEnabled ? 'Вкл' : 'Выкл';
            autoStopToggle.className = 'toggle-btn' + (autoStopEnabled ? ' active' : ' inactive');
        });

        // ====== СОБЫТИЯ ======
        mainBtn.addEventListener('click', () => {
            if (isRecording) {
                isManualStop = true;
                stopCapture(true);
            } else {
                startCapture();
            }
        });

        saveBtn.addEventListener('click', saveFile);
        resetBtn.addEventListener('click', resetAll);

        // ====== АУДИО ПЛЕЕР ======
        let audioPlayer = null;
        statusMsg.addEventListener('dblclick', () => {
            if (!convertedBlob) {
                if (finalBlob) {
                    const url = URL.createObjectURL(finalBlob);
                    audioPlayer = new Audio(url);
                    audioPlayer.controls = true;
                    audioPlayer.style.width = '100%';
                    audioPlayer.style.marginTop = '8px';
                    audioPlayer.play();
                    audioPlayer.onended = () => URL.revokeObjectURL(url);
                    document.querySelector('.card').appendChild(audioPlayer);
                }
                return;
            }
            if (audioPlayer) { audioPlayer.pause(); audioPlayer = null; }
            const url = URL.createObjectURL(convertedBlob);
            audioPlayer = new Audio(url);
            audioPlayer.controls = true;
            audioPlayer.style.width = '100%';
            audioPlayer.style.marginTop = '8px';
            audioPlayer.play();
            audioPlayer.onended = () => URL.revokeObjectURL(url);
            document.querySelector('.card').appendChild(audioPlayer);
        });

        resetAll();
    })();
</script>
