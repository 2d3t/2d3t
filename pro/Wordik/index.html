<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор документов Word</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #e8eaed;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  #toolbar {
    background: #2c3e50;
    color: #fff;
    padding: 8px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,.2);
    z-index: 10;
  }
  #toolbar button, #toolbar select, #toolbar input[type=number], #toolbar input[type=color] {
    background: #34495e;
    color: #fff;
    border: 1px solid #4a6278;
    border-radius: 4px;
    padding: 5px 8px;
    cursor: pointer;
    font-size: 13px;
  }
  #toolbar button:hover { background: #4a6278; }
  #toolbar button.active { background: #3498db; border-color: #3498db; }
  #toolbar .sep {
    width: 1px;
    height: 24px;
    background: #4a6278;
    margin: 0 4px;
  }
  #toolbar label { font-size: 12px; display:flex; align-items:center; gap:4px; }
  #toolbar input[type=number] { width: 55px; }
  #toolbar input[type=color] { padding: 0; width: 30px; height: 28px; border: none; }

  #workspace {
    flex: 1;
    overflow: auto;
    padding: 30px;
    display: flex;
    justify-content: center;
  }
  #page {
    background: #fff;
    width: 210mm;
    min-height: 297mm;
    padding: 20mm;
    box-shadow: 0 0 15px rgba(0,0,0,.3);
    outline: none;
    font-family: 'Times New Roman', serif;
    font-size: 14pt;
    line-height: 1.4;
    color: #000;
  }
  #page:focus { box-shadow: 0 0 15px rgba(52,152,219,.6); }

  #page p { margin: 0 0 8px 0; }
  #page h1 { font-size: 24pt; margin: 0 0 12px 0; }
  #page h2 { font-size: 20pt; margin: 0 0 10px 0; }
  #page h3 { font-size: 16pt; margin: 0 0 8px 0; }
  #page ul, #page ol { margin: 0 0 8px 0; padding-left: 30px; }

  @media print {
    body { background: #fff; height: auto; overflow: visible; }
    #toolbar { display: none; }
    #workspace { padding: 0; overflow: visible; display: block; }
    #page {
      box-shadow: none;
      width: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
    }
  }
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="cmd('undo')" title="Отменить">↶</button>
  <button onclick="cmd('redo')" title="Повторить">↷</button>
  <div class="sep"></div>

  <select onchange="cmd('fontName', this.value)" title="Шрифт">
    <option value="Times New Roman" selected>Times New Roman</option>
    <option value="Arial">Arial</option>
    <option value="Calibri">Calibri</option>
    <option value="Georgia">Georgia</option>
    <option value="Courier New">Courier New</option>
    <option value="Verdana">Verdana</option>
  </select>

  <select onchange="cmd('fontSize', this.value)" title="Размер">
    <option value="1">8</option>
    <option value="2">10</option>
    <option value="3" selected>12</option>
    <option value="4">14</option>
    <option value="5">18</option>
    <option value="6">24</option>
    <option value="7">36</option>
  </select>

  <input type="color" oninput="cmd('foreColor', this.value)" title="Цвет текста" value="#000000">
  <button onclick="cmd('hiliteColor','yellow')" title="Выделить жёлтым">🖍</button>
  <div class="sep"></div>

  <button onclick="cmd('bold')" title="Жирный"><b>Ж</b></button>
  <button onclick="cmd('italic')" title="Курсив"><i>К</i></button>
  <button onclick="cmd('underline')" title="Подчёркнутый"><u>П</u></button>
  <button onclick="cmd('strikeThrough')" title="Зачёркнутый"><s>З</s></button>
  <div class="sep"></div>

  <button onclick="cmd('justifyLeft')" title="По левому краю">⯇</button>
  <button onclick="cmd('justifyCenter')" title="По центру">≡</button>
  <button onclick="cmd('justifyRight')" title="По правому краю">⯈</button>
  <button onclick="cmd('justifyFull')" title="По ширине">☰</button>
  <div class="sep"></div>

  <button onclick="cmd('insertUnorderedList')" title="Маркированный список">•≡</button>
  <button onclick="cmd('insertOrderedList')" title="Нумерованный список">1≡</button>
  <button onclick="outdent()" title="Уменьшить отступ">⇤</button>
  <button onclick="indent()" title="Увеличить отступ">⇥</button>
  <div class="sep"></div>

  <label>Строки: <input type="number" id="lineHeight" min="1" max="3" step="0.1" value="1.4" onchange="applyLineHeight()"></label>
  <label>Абзац ↓: <input type="number" id="paraSpace" min="0" max="100" value="8" onchange="applyParaSpace()">пт</label>
  <div class="sep"></div>

  <label>Поля (мм):
    <input type="number" id="marginTop" value="20" min="0" max="100" style="width:45px">
    <input type="number" id="marginRight" value="20" min="0" max="100" style="width:45px">
    <input type="number" id="marginBottom" value="20" min="0" max="100" style="width:45px">
    <input type="number" id="marginLeft" value="20" min="0" max="100" style="width:45px">
  </label>
  <button onclick="applyMargins()">Применить</button>
  <div class="sep"></div>

  <button onclick="insertPageBreak()" title="Разрыв страницы">⎯ Разрыв</button>
  <button onclick="clearFormatting()" title="Очистить формат">Очистить</button>
  <div class="sep"></div>

  <button onclick="saveAsDoc()" style="background:#27ae60">💾 Сохранить .doc</button>
  <button onclick="window.print()" style="background:#2980b9">🖨 Печать</button>
  <button onclick="openDoc()" style="background:#8e44ad">📂 Открыть .doc</button>
  <input type="file" id="fileInput" accept=".doc,.html,.htm" style="display:none" onchange="loadFile(event)">
</div>

<div id="workspace">
  <div id="page" contenteditable="true">
    <p>Начните печатать здесь…</p>
  </div>
</div>

<script>
  const page = document.getElementById('page');

  function cmd(command, value = null) {
    document.execCommand(command, false, value);
    page.focus();
    updateActive();
  }

  function indent() { document.execCommand('indent', false, null); }
  function outdent() { document.execCommand('outdent', false, null); }

  // Применить поля страницы
  function applyMargins() {
    const t = document.getElementById('marginTop').value;
    const r = document.getElementById('marginRight').value;
    const b = document.getElementById('marginBottom').value;
    const l = document.getElementById('marginLeft').value;
    page.style.padding = `${t}mm ${r}mm ${b}mm ${l}mm`;
  }

  // Межстрочный интервал
  function applyLineHeight() {
    const v = document.getElementById('lineHeight').value;
    page.style.lineHeight = v;
  }

  // Отступ после абзацев
  function applyParaSpace() {
    const v = document.getElementById('paraSpace').value + 'pt';
    page.querySelectorAll('p, div').forEach(el => {
      el.style.marginBottom = v;
    });
  }

  // Разрыв страницы
  function insertPageBreak() {
    document.execCommand('insertHTML', false,
      '<div style="page-break-after: always; border-top: 1px dashed #ccc; margin: 10px 0;"></div>');
  }

  function clearFormatting() {
    document.execCommand('removeFormat', false, null);
    page.querySelectorAll('*').forEach(el => {
      el.style.background = '';
      el.style.color = '';
    });
  }

  // Индикация активных кнопок
  function updateActive() {
    document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active'));
    ['bold','italic','underline','strikeThrough','justifyLeft','justifyCenter','justifyRight','justifyFull',
     'insertUnorderedList','insertOrderedList'].forEach(c => {
      if (document.queryCommandState(c)) {
        const btn = [...document.querySelectorAll('#toolbar button')]
          .find(b => b.getAttribute('onclick')?.includes(c));
        if (btn) btn.classList.add('active');
      }
    });
  }
  document.addEventListener('selectionchange', updateActive);

  // Сохранение как .doc (Word откроет HTML-файл с расширением .doc)
  function saveAsDoc() {
    const content = page.innerHTML;

    const styles = `
      <style>
        @page { size: A4; margin: 20mm; }
        body {
          font-family: 'Times New Roman', serif;
          font-size: 12pt;
          line-height: 1.4;
        }
        p { margin: 0 0 8pt 0; }
        h1 { font-size: 24pt; }
        h2 { font-size: 20pt; }
        h3 { font-size: 16pt; }
        ul, ol { margin: 0 0 8pt 0; }
      </style>
    `;

    const html = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:w="urn:schemas-microsoft-com:office:word"
            xmlns="http://www.w3.org/TR/REC-html40">
      <head>
        <meta charset="utf-8">
        <title>Документ</title>
        ${styles}
      </head>
      <body>
        ${content}
      </body>
      </html>
    `;

    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'документ_' + new Date().toISOString().slice(0,10) + '.doc';
    a.click();
    URL.revokeObjectURL(url);
  }

  // Открытие .doc/.html
  function openDoc() {
    document.getElementById('fileInput').click();
  }

  function loadFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const text = ev.target.result;
      // Пытаемся вытащить только body, если это полный HTML
      const match = text.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
      page.innerHTML = match ? match[1] : text;
    };
    reader.readAsText(file, 'UTF-8');
    e.target.value = '';
  }

  // Горячие клавиши
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'b') { e.preventDefault(); cmd('bold'); }
      if (e.key === 'i') { e.preventDefault(); cmd('italic'); }
      if (e.key === 'u') { e.preventDefault(); cmd('underline'); }
      if (e.key === 's') { e.preventDefault(); saveAsDoc(); }
      if (e.key === 'p') { e.preventDefault(); window.print(); }
    }
  });

  page.focus();
</script>
</body>
</html>
