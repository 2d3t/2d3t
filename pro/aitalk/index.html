<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">

    <!-- Иконки PWA -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

    <!-- Мета-теги для PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

<title>Голосовой чат с Mistral</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0e1117;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    padding: 12px 14px;
    background: #161b22;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #30363d;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header button {
    background: #21262d;
    color: #e6e6e6;
    border: 1px solid #30363d;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #1f6feb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #21262d;
    border-bottom-left-radius: 4px;
  }
  .msg.sys {
    align-self: center;
    background: transparent;
    color: #8b949e;
    font-size: 12px;
    text-align: center;
    padding: 4px;
  }
  .typing {
    align-self: flex-start;
    color: #8b949e;
    font-size: 13px;
    padding: 6px 14px;
  }

  #controls {
    padding: 12px;
    background: #161b22;
    border-top: 1px solid #30363d;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  #micBtn {
    flex: 1;
    padding: 16px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    background: #238636;
    color: #fff;
    transition: background 0.2s;
  }
  #micBtn.recording {
    background: #da3633;
    animation: pulse 1.2s infinite;
  }
  #micBtn:disabled {
    background: #30363d;
    color: #8b949e;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* Модалка настроек */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal.hidden { display: none; }
  .modal-content {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-content h2 {
    margin: 0 0 16px;
    font-size: 18px;
  }
  .modal-content h3 {
    margin: 18px 0 10px;
    font-size: 14px;
    color: #8b949e;
    font-weight: 600;
    border-top: 1px solid #30363d;
    padding-top: 14px;
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 6px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    background: #0d1117;
    color: #e6e6e6;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
  }
  .field textarea { min-height: 80px; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: #1f6feb;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-row input[type="range"] {
    flex: 1;
    padding: 0;
    background: transparent;
    border: none;
  }
  .slider-row span {
    font-size: 13px;
    color: #8b949e;
    min-width: 40px;
    text-align: right;
  }
  .btn-small {
    background: #21262d;
    color: #e6e6e6;
    border: 1px solid #30363d;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    width: 100%;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .modal-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
  }
  .btn-primary {
    background: #1f6feb;
    color: #fff;
  }
  .btn-secondary {
    background: #21262d;
    color: #e6e6e6;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="chatTitle">Mistral</h1>
    <button id="settingsBtn">⚙️</button>
  </header>

  <div id="chat"></div>

  <div id="controls">
    <button id="micBtn" disabled>🎤 Удерживайте для речи</button>
  </div>
</div>

<!-- Модалка настроек -->
<div class="modal hidden" id="settingsModal">
  <div class="modal-content">
    <h2>Настройки</h2>

    <div class="field">
      <label>API ключ Mistral</label>
      <input type="password" id="apiKeyInput" placeholder="Введите API ключ">
    </div>

    <div class="field">
      <label>Имя персонажа</label>
      <input type="text" id="nameInput" placeholder="Например: Мира">
    </div>

    <div class="field">
      <label>Характер / личность</label>
      <textarea id="personaInput" placeholder="Например: Дружелюбная, остроумная, отвечает кратко и с юмором. Обращается по имени."></textarea>
    </div>

    <h3>Голос</h3>

    <div class="field">
      <label>Голос синтеза речи</label>
      <select id="voiceSelect"></select>
    </div>

    <div class="field">
      <label>Скорость <span id="rateVal" style="color:#e6e6e6"></span></label>
      <div class="slider-row">
        <input type="range" id="rateInput" min="0.5" max="1.5" step="0.05" value="0.95">
        <span id="rateDisplay">0.95</span>
      </div>
    </div>

    <div class="field">
      <label>Тональность <span id="pitchVal" style="color:#e6e6e6"></span></label>
      <div class="slider-row">
        <input type="range" id="pitchInput" min="0.7" max="1.3" step="0.05" value="1.0">
        <span id="pitchDisplay">1.00</span>
      </div>
    </div>

    <div class="field">
      <button class="btn-small" id="testVoiceBtn">🔊 Прослушать</button>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="cancelBtn">Отмена</button>
      <button class="btn-primary" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
(function() {
  const LS_API_KEY = 'mistral_api_key';
  const LS_PERSONA = 'mistral_persona';
  const LS_NAME = 'mistral_persona_name';
  const LS_VOICE = 'mistral_voice_uri';
  const LS_RATE = 'mistral_speech_rate';
  const LS_PITCH = 'mistral_speech_pitch';

  const chatEl = document.getElementById('chat');
  const micBtn = document.getElementById('micBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const modal = document.getElementById('settingsModal');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const nameInput = document.getElementById('nameInput');
  const personaInput = document.getElementById('personaInput');
  const voiceSelect = document.getElementById('voiceSelect');
  const rateInput = document.getElementById('rateInput');
  const pitchInput = document.getElementById('pitchInput');
  const rateDisplay = document.getElementById('rateDisplay');
  const pitchDisplay = document.getElementById('pitchDisplay');
  const testVoiceBtn = document.getElementById('testVoiceBtn');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const chatTitle = document.getElementById('chatTitle');

  let messages = [];
  let apiKey = localStorage.getItem(LS_API_KEY) || '';
  let personaName = localStorage.getItem(LS_NAME) || 'Mistral';
  let personaDesc = localStorage.getItem(LS_PERSONA) || 'Ты дружелюбный и полезный ассистент. Отвечай кратко и по делу, так как твой ответ будет озвучен голосом.';

  let savedVoiceURI = localStorage.getItem(LS_VOICE) || '';
  let speechRate = parseFloat(localStorage.getItem(LS_RATE)) || 0.95;
  let speechPitch = parseFloat(localStorage.getItem(LS_PITCH)) || 1.0;

  let selectedVoice = null;
  let recognition = null;
  let isRecording = false;
  let isProcessing = false;

  // ---------- Голоса ----------
  function getRuVoices() {
    if (!('speechSynthesis' in window)) return [];
    return window.speechSynthesis.getVoices()
      .filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  }

  function scoreVoice(v) {
    let s = 0;
    if (!v.localService) s += 10;                                    // сетевой
    if (/neural|natural|enhanced|premium|online/i.test(v.name)) s += 20;
    if (/google/i.test(v.name)) s += 5;
    // лёгкий бонус за женские/мужские «хорошие» имена, если есть
    if (/svetlana|dmitry|milena|alena|yuri|elena|anna/i.test(v.name)) s += 3;
    return s;
  }

  function pickBestVoice(voices) {
    if (!voices.length) return null;
    const sorted = [...voices].sort((a, b) => scoreVoice(b) - scoreVoice(a));
    return sorted[0];
  }

  function refreshVoiceList(keepSelection) {
    const voices = getRuVoices();
    voiceSelect.innerHTML = '';

    if (!voices.length) {
      const opt = document.createElement('option');
      opt.textContent = 'Русские голоса не найдены';
      opt.disabled = true;
      voiceSelect.appendChild(opt);
      selectedVoice = null;
      return;
    }

    voices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = `${v.name} — ${v.localService ? 'локальный' : 'сетевой'}`;
      voiceSelect.appendChild(opt);
    });

    // Определяем, какой выбрать
    let targetURI = keepSelection ? savedVoiceURI : (savedVoiceURI || '');
    let found = voices.find(v => v.voiceURI === targetURI);

    if (!found) {
      const best = pickBestVoice(voices);
      if (best) {
        targetURI = best.voiceURI;
        found = best;
      }
    }

    if (found) {
      selectedVoice = found;
      voiceSelect.value = found.voiceURI;
    } else {
      selectedVoice = voices[0];
      voiceSelect.value = voices[0].voiceURI;
    }
  }

  function populateVoices() {
    refreshVoiceList(true);
  }

  if ('speechSynthesis' in window) {
    // голоса могут грузиться асинхронно
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = populateVoices;
    // на случай, если голоса уже есть
    setTimeout(populateVoices, 100);
  }

  // ---------- UI ----------
  function updateTitle() {
    chatTitle.textContent = personaName || 'Mistral';
    document.title = 'Чат с ' + (personaName || 'Mistral');
  }

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.textContent = personaName + ' печатает...';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function buildSystemPrompt() {
    return `Ты — персонаж по имени ${personaName}. Твой характер: ${personaDesc}.
Отвечай на русском языке (если пользователь не попросил иначе).
Важно: твои ответы будут озвучены голосом, поэтому не используй эмодзи, markdown, списки, форматирование и специальные символы. Пиши обычным текстом, коротко и естественно, как в живой речи.`;
  }

  async function callMistral(userText) {
    const systemPrompt = buildSystemPrompt();
    const history = messages.slice(-20);
    const payload = {
      model: 'codestral-latest',
      messages: [
        { role: 'system', content: systemPrompt },
        ...history,
        { role: 'user', content: userText }
      ],
      temperature: 0.7,
      max_tokens: 300
    };

    const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      let errText = '';
      try {
        const err = await res.json();
        errText = err.error?.message || err.message || JSON.stringify(err);
      } catch (e) {
        errText = 'HTTP ' + res.status;
      }
      throw new Error('Ошибка API: ' + errText);
    }

    const data = await res.json();
    const content = data.choices?.[0]?.message?.content || '';
    return content.trim();
  }

  // ---------- Озвучка ----------
  function prepareText(text) {
    let t = text
      .replace(/[*_`#>]/g, '')            // markdown-символы
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1') // ссылки -> текст
      .replace(/\s+/g, ' ')
      .trim();

    // паузы после знаков препинания (некоторые движки реагируют)
    t = t.replace(/([.!?;:])\s+/g, '$1 ... ');

    // слишком длинные ответы робот читает монотонно
    if (t.length > 600) t = t.slice(0, 600).replace(/\s+\S*$/, '') + '.';
    return t;
  }

  function speak(text, override) {
    if (!('speechSynthesis' in window)) {
      console.warn('SpeechSynthesis не поддерживается');
      return;
    }
    window.speechSynthesis.cancel();

    const t = prepareText(text);
    if (!t) return;

    const utt = new SpeechSynthesisUtterance(t);
    utt.lang = 'ru-RU';
    if (selectedVoice) utt.voice = selectedVoice;
    utt.rate = override?.rate ?? speechRate;
    utt.pitch = override?.pitch ?? speechPitch;
    utt.volume = 1.0;
    window.speechSynthesis.speak(utt);
  }

  // ---------- Логика чата ----------
  async function handleUserText(text) {
    if (isProcessing) return;
    if (!text || !text.trim()) return;
    if (!apiKey) {
      addMessage('Сначала введите API ключ в настройках ⚙️', 'sys');
      return;
    }

    isProcessing = true;
    micBtn.disabled = true;
    addMessage(text, 'user');
    messages.push({ role: 'user', content: text });

    showTyping();
    try {
      const reply = await callMistral(text);
      hideTyping();
      if (reply) {
        addMessage(reply, 'bot');
        messages.push({ role: 'assistant', content: reply });
        speak(reply);
      } else {
        addMessage('(Пустой ответ)', 'sys');
      }
    } catch (e) {
      hideTyping();
      console.error(e);
      addMessage('Ошибка: ' + e.message, 'sys');
    } finally {
      isProcessing = false;
      micBtn.disabled = false;
    }
  }

  // ---------- Распознавание речи ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      if (transcript && transcript.trim()) {
        handleUserText(transcript.trim());
      }
    };

    recognition.onerror = (e) => {
      console.warn('Speech error:', e.error);
      if (e.error === 'not-allowed') {
        addMessage('Доступ к микрофону запрещён. Разрешите доступ в настройках браузера.', 'sys');
      } else if (e.error === 'no-speech') {
        addMessage('Речь не распознана, попробуйте ещё раз.', 'sys');
      }
    };

    recognition.onend = () => {
      if (isRecording) {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎤 Удерживайте для речи';
      }
    };
  }

  function startRecording() {
    if (!recognition) {
      addMessage('Ваш браузер не поддерживает распознавание речи. Используйте Chrome на Android или Safari на iOS.', 'sys');
      return;
    }
    if (isProcessing) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    try {
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '🔴 Говорите... (отпустите)';
      recognition.start();
    } catch (e) {
      console.warn(e);
    }
  }

  function stopRecording() {
    if (!recognition || !isRecording) return;
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤 Удерживайте для речи';
    try {
      recognition.stop();
    } catch (e) {}
  }

  micBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (micBtn.disabled) return;
    startRecording();
  }, { passive: false });
  micBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    stopRecording();
  }, { passive: false });
  micBtn.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    stopRecording();
  }, { passive: false });

  micBtn.addEventListener('mousedown', (e) => {
    e.preventDefault();
    if (micBtn.disabled) return;
    startRecording();
  });
  micBtn.addEventListener('mouseup', (e) => {
    e.preventDefault();
    stopRecording();
  });
  micBtn.addEventListener('mouseleave', () => {
    if (isRecording) stopRecording();
  });

  // ---------- Настройки ----------
  function syncSliders() {
    rateDisplay.textContent = Number(rateInput.value).toFixed(2);
    pitchDisplay.textContent = Number(pitchInput.value).toFixed(2);
  }

  function openSettings() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    apiKeyInput.value = apiKey;
    nameInput.value = personaName;
    personaInput.value = personaDesc;

    // обновим список голосов и выставим сохранённый
    refreshVoiceList(true);

    rateInput.value = speechRate;
    pitchInput.value = speechPitch;
    syncSliders();

    modal.classList.remove('hidden');
  }

  function closeSettings() {
    modal.classList.add('hidden');
  }

  settingsBtn.addEventListener('click', openSettings);
  cancelBtn.addEventListener('click', closeSettings);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeSettings();
  });

  rateInput.addEventListener('input', syncSliders);
  pitchInput.addEventListener('input', syncSliders);

  voiceSelect.addEventListener('change', () => {
    const uri = voiceSelect.value;
    const v = getRuVoices().find(x => x.voiceURI === uri);
    if (v) selectedVoice = v;
  });

  testVoiceBtn.addEventListener('click', () => {
    // временно применяем значения слайдеров для прослушивания
    const tmpVoice = selectedVoice;
    if (!tmpVoice) {
      addMessage('Русские голоса не найдены в системе.', 'sys');
      return;
    }
    speak(
      'Привет! Так будет звучать мой голос. Проверим скорость и тональность.',
      { rate: parseFloat(rateInput.value), pitch: parseFloat(pitchInput.value) }
    );
  });

  saveBtn.addEventListener('click', () => {
    const newKey = apiKeyInput.value.trim();
    const newName = nameInput.value.trim() || 'Mistral';
    const newPersona = personaInput.value.trim() || 'Ты дружелюбный и полезный ассистент.';

    apiKey = newKey;
    personaName = newName;
    personaDesc = newPersona;

    savedVoiceURI = voiceSelect.value || '';
    speechRate = parseFloat(rateInput.value) || 0.95;
    speechPitch = parseFloat(pitchInput.value) || 1.0;

    localStorage.setItem(LS_API_KEY, apiKey);
    localStorage.setItem(LS_NAME, personaName);
    localStorage.setItem(LS_PERSONA, personaDesc);
    localStorage.setItem(LS_VOICE, savedVoiceURI);
    localStorage.setItem(LS_RATE, speechRate);
    localStorage.setItem(LS_PITCH, speechPitch);

    updateTitle();
    micBtn.disabled = !apiKey;
    closeSettings();

    addMessage('Настройки сохранены. Персонаж: ' + personaName, 'sys');
  });

  // ---------- Инициализация ----------
  updateTitle();
  micBtn.disabled = !apiKey;

  if (!apiKey) {
    addMessage('Добро пожаловать! Нажмите ⚙️ вверху и введите API ключ Mistral.', 'sys');
    setTimeout(openSettings, 300);
  } else {
    addMessage('Привет! Я ' + personaName + '. Удерживайте кнопку внизу и говорите.', 'sys');
  }
})();
</script>
<script>
(function() {
    "use strict";

    function openGame(url, title) {
        const oldOverlay = document.querySelector('.transition-overlay');
        if (oldOverlay) oldOverlay.remove();

        const overlay = document.createElement('div');
        overlay.className = 'transition-overlay';

        const topBar = document.createElement('div');
        topBar.className = 'transition-topbar';

        const backBtn = document.createElement('button');
        backBtn.className = 'transition-back';
        backBtn.textContent = '← Назад';
        backBtn.onclick = function() { overlay.remove(); };

        const titleEl = document.createElement('span');
        titleEl.className = 'transition-title';
        titleEl.textContent = title || '🌐 Загрузка...';

        topBar.appendChild(backBtn);
        topBar.appendChild(titleEl);
        overlay.appendChild(topBar);

        const iframe = document.createElement('iframe');
        iframe.className = 'transition-iframe';
        iframe.src = url;
        iframe.allow = 'camera; microphone; payment; fullscreen; geolocation; downloads';
        iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-presentation allow-downloads';

        overlay.appendChild(iframe);
        document.body.appendChild(overlay);

        const escapeHandler = function(e) {
            if (e.key === 'Escape') {
                overlay.remove();
                document.removeEventListener('keydown', escapeHandler);
            }
        };
        document.addEventListener('keydown', escapeHandler);

        iframe.onload = function() {
            try {
                const frameTitle = iframe.contentDocument?.title;
                if (frameTitle && frameTitle !== '' && frameTitle !== 'Загрузка...') {
                    titleEl.textContent = frameTitle;
                }
            } catch (e) {}
        };

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.remove();
        });

        window.addEventListener('message', function(event) {
            if (event.source !== iframe.contentWindow) return;
            const data = event.data;
            if (data && data.type === 'download') {
                handleDownload(data.content, data.filename, data.mimeType);
            }
        });

        return overlay;
    }

    function handleDownload(content, filename, mimeType) {
        try {
            if (typeof content === 'string' && content.startsWith('http')) {
                const a = document.createElement('a');
                a.href = content;
                a.download = filename || 'download';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showNotification('✅ Скачивание началось!', 'success');
                return;
            }

            let blob;
            if (typeof content === 'string') {
                blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
            } else if (content instanceof Blob) {
                blob = content;
            } else {
                throw new Error('Неподдерживаемый формат данных');
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
            showNotification('✅ Файл "' + (filename || 'download') + '" сохранён!', 'success');
        } catch (error) {
            console.error('Ошибка скачивания:', error);
            showNotification('❌ Ошибка скачивания: ' + error.message, 'error');
        }
    }

    function showNotification(message, type) {
        const old = document.querySelector('.download-notification');
        if (old) old.remove();

        const notification = document.createElement('div');
        notification.className = 'download-notification ' + (type || '');
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(function() {
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.5s';
            setTimeout(function() { notification.remove(); }, 500);
        }, 3000);
    }

    window.openGame = openGame;
    window.handleDownload = handleDownload;
    window.showNotification = showNotification;

    function registerSW() {
        if (!('serviceWorker' in navigator)) {
            console.warn('[SW] ❌ Service Worker не поддерживается');
            return;
        }
        navigator.serviceWorker.getRegistration()
            .then(function(registration) {
                if (registration) return;
                navigator.serviceWorker.register('sw.js')
                    .then(function(reg) { console.log('[SW] ✅ Зарегистрирован:', reg); })
                    .catch(function(err) { console.error('[SW] ❌ Ошибка:', err); });
            })
            .catch(function(err) { console.error('[SW] ❌ Ошибка проверки:', err); });
    }

    function checkNetwork() {
        const status = navigator.onLine ? 'Онлайн' : 'Офлайн (из кэша)';
        console.log('📡 ' + status);
    }

    function setupNetworkListeners() {
        window.addEventListener('online', function() {
            console.log('📡 Сеть восстановлена');
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready
                    .then(function(registration) {
                        registration.update();
                        console.log('[SW] 🔄 Проверка обновлений...');
                    })
                    .catch(function() {});
            }
        });
        window.addEventListener('offline', function() {
            console.log('📡 Сеть отключена (работаем из кэша)');
        });
    }

    function init() {
        registerSW();
        checkNetwork();
        setupNetworkListeners();
        console.log('[APP] ✅ Офлайн-функционал активирован');
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
