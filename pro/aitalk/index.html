<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Голосовой чат с Mistral</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% -20%, #1a2333 0%, #0e1117 55%);
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header {
    padding: 10px 14px;
    background: rgba(22,27,34,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(48,54,61,0.7);
    flex-shrink: 0;
  }
  #headerAvatar {
    width: 38px; height: 38px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
    background: linear-gradient(135deg,#1f6feb,#238636);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(31,111,235,0.35);
  }
  #headerAvatar img { width: 100%; height: 100%; object-fit: cover; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1; }
  header button {
    background: #21262d; color: #e6e6e6;
    border: 1px solid #30363d; padding: 8px 12px;
    border-radius: 10px; font-size: 15px;
  }

  #chat {
    flex: 1; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 18px;
    font-size: 15px; line-height: 1.45;
    word-wrap: break-word; white-space: pre-wrap;
    animation: msgIn 0.22s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg,#1f6feb,#2563c9);
    color: #fff; border-bottom-right-radius: 5px;
    box-shadow: 0 2px 10px rgba(31,111,235,0.25);
  }
  .msg.bot {
    align-self: flex-start;
    background: #21262d; border-bottom-left-radius: 5px;
    border: 1px solid rgba(48,54,61,0.6);
  }
  .msg.sys {
    align-self: center; background: transparent; color: #8b949e;
    font-size: 12px; text-align: center; padding: 4px;
  }
  .typing {
    align-self: flex-start; color: #8b949e; font-size: 13px; padding: 6px 14px;
    display: flex; gap: 4px; align-items: center;
  }
  .typing .dot {
    width: 5px; height: 5px; border-radius: 50%; background: #8b949e;
    animation: blink 1.2s infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 1; } }

  #controls {
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(22,27,34,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(48,54,61,0.7);
    flex-shrink: 0;
  }
  #micBtn {
    width: 100%; padding: 16px; border-radius: 16px; border: none;
    font-size: 16px; font-weight: 600;
    background: linear-gradient(135deg,#238636,#2ea043);
    color: #fff; transition: transform 0.15s, background 0.2s;
    box-shadow: 0 4px 16px rgba(35,134,54,0.35);
  }
  #micBtn:active:not(:disabled) { transform: scale(0.985); }
  #micBtn.recording {
    background: linear-gradient(135deg,#da3633,#b62324);
    box-shadow: 0 4px 20px rgba(218,54,51,0.45);
    animation: pulse 1.2s infinite;
  }
  #micBtn:disabled { background: #30363d; color: #8b949e; box-shadow: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }

  /* Модалка */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 100;
  }
  .modal.hidden { display: none; }
  .modal-content {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 20px; padding: 20px; width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: modalIn 0.2s ease-out;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-content h2 { margin: 0 0 16px; font-size: 18px; }
  .modal-content h3 {
    margin: 18px 0 10px; font-size: 13px; color: #8b949e; font-weight: 600;
    border-top: 1px solid #30363d; padding-top: 14px; letter-spacing: 0.3px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px;
  }
  .field input, .field textarea, .field select {
    width: 100%; background: #0d1117; color: #e6e6e6;
    border: 1px solid #30363d; border-radius: 12px;
    padding: 12px; font-size: 15px; font-family: inherit; resize: vertical;
    transition: border-color 0.15s;
  }
  .field textarea { min-height: 80px; }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: #1f6feb;
    box-shadow: 0 0 0 3px rgba(31,111,235,0.15);
  }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-row input[type="range"] { flex: 1; padding: 0; background: transparent; border: none; accent-color: #1f6feb; }
  .slider-row span { font-size: 13px; color: #8b949e; min-width: 40px; text-align: right; }

  /* Аватар в настройках */
  .avatar-row { display: flex; align-items: center; gap: 14px; }
  #avatarPreview {
    width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
    object-fit: cover; background: #0d1117;
    border: 2px solid #30363d;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #8b949e; overflow: hidden;
  }
  #avatarPreview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-btns { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .btn-small {
    background: #21262d; color: #e6e6e6; border: 1px solid #30363d;
    padding: 9px 14px; border-radius: 10px; font-size: 13px; width: 100%;
  }
  .btn-danger { color: #f85149; border-color: rgba(248,81,73,0.3); }

  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions button {
    flex: 1; padding: 14px; border-radius: 14px; border: none;
    font-size: 15px; font-weight: 600;
  }
  .btn-primary { background: linear-gradient(135deg,#1f6feb,#2563c9); color: #fff; }
  .btn-secondary { background: #21262d; color: #e6e6e6; }

  .text-input-row {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  #textInput {
    flex: 1; background: #0d1117; color: #e6e6e6;
    border: 1px solid #30363d; border-radius: 14px;
    padding: 12px 14px; font-size: 15px; font-family: inherit;
    resize: none; min-height: 44px; max-height: 120px;
    line-height: 1.35;
  }
  #textInput:focus {
    outline: none; border-color: #1f6feb;
    box-shadow: 0 0 0 3px rgba(31,111,235,0.15);
  }
  #textInput:disabled { opacity: 0.55; }
  #sendBtn {
    background: linear-gradient(135deg,#1f6feb,#2563c9);
    color: #fff; border: none; border-radius: 14px;
    padding: 0 18px; font-size: 20px; font-weight: 700;
    flex-shrink: 0;
  }
  #sendBtn:disabled { background: #30363d; color: #8b949e; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="headerAvatar">M</div>
    <h1 id="chatTitle">Mistral</h1>
    <button id="settingsBtn">⚙️</button>
  </header>

  <div id="chat"></div>

  <div id="controls">
  <div class="text-input-row">
    <textarea id="textInput" rows="1" placeholder="Напишите сообщение..." disabled></textarea>
    <button id="sendBtn" disabled>➤</button>
  </div>
  <button id="micBtn" disabled>🎤 Удерживайте для речи</button>
</div>
</div>

<!-- Модалка настроек -->
<div class="modal hidden" id="settingsModal">
  <div class="modal-content">
    <h2>Настройки</h2>

    <h3 style="margin-top:0;border-top:none;padding-top:0;">Внешний вид</h3>

    <div class="field">
      <label>Фото персонажа</label>
      <div class="avatar-row">
        <div id="avatarPreview">👤</div>
        <div class="avatar-btns">
          <button class="btn-small" id="uploadAvatarBtn">📷 Загрузить фото</button>
          <button class="btn-small btn-danger" id="removeAvatarBtn">🗑 Убрать</button>
        </div>
      </div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none">
    </div>

    <div class="field">
      <label>API ключ Mistral</label>
      <input type="password" id="apiKeyInput" placeholder="Введите API ключ">
    </div>

    <div class="field">
      <label>Имя персонажа</label>
      <input type="text" id="nameInput" placeholder="Например: Мира">
    </div>

    <div class="field">
      <label>Характер / личность</label>
      <textarea id="personaInput" placeholder="Например: Дружелюбная, остроумная, отвечает кратко и с юмором."></textarea>
    </div>

    <h3>Голос</h3>

    <div class="field">
      <label>Голос синтеза речи</label>
      <select id="voiceSelect"></select>
    </div>

    <div class="field">
      <label>Скорость</label>
      <div class="slider-row">
        <input type="range" id="rateInput" min="0.5" max="1.5" step="0.05" value="0.95">
        <span id="rateDisplay">0.95</span>
      </div>
    </div>

    <div class="field">
      <label>Тональность</label>
      <div class="slider-row">
        <input type="range" id="pitchInput" min="0.7" max="1.3" step="0.05" value="1.0">
        <span id="pitchDisplay">1.00</span>
      </div>
    </div>

    <div class="field">
      <button class="btn-small" id="testVoiceBtn">🔊 Прослушать</button>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="cancelBtn">Отмена</button>
      <button class="btn-primary" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
(function() {
  const LS_API_KEY = 'mistral_api_key';
  const LS_PERSONA = 'mistral_persona';
  const LS_NAME = 'mistral_persona_name';
  const LS_VOICE = 'mistral_voice_uri';
  const LS_RATE = 'mistral_speech_rate';
  const LS_PITCH = 'mistral_speech_pitch';
  const LS_AVATAR = 'mistral_avatar_data';

  const chatEl = document.getElementById('chat');
  const micBtn = document.getElementById('micBtn');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const settingsBtn = document.getElementById('settingsBtn');
  const modal = document.getElementById('settingsModal');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const nameInput = document.getElementById('nameInput');
  const personaInput = document.getElementById('personaInput');
  const voiceSelect = document.getElementById('voiceSelect');
  const rateInput = document.getElementById('rateInput');
  const pitchInput = document.getElementById('pitchInput');
  const rateDisplay = document.getElementById('rateDisplay');
  const pitchDisplay = document.getElementById('pitchDisplay');
  const testVoiceBtn = document.getElementById('testVoiceBtn');
  const saveBtn = document.getElementById('saveBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const chatTitle = document.getElementById('chatTitle');
  const headerAvatar = document.getElementById('headerAvatar');
  const avatarPreview = document.getElementById('avatarPreview');
  const avatarFile = document.getElementById('avatarFile');
  const uploadAvatarBtn = document.getElementById('uploadAvatarBtn');
  const removeAvatarBtn = document.getElementById('removeAvatarBtn');

  let messages = [];
  let apiKey = localStorage.getItem(LS_API_KEY) || '';
  let personaName = localStorage.getItem(LS_NAME) || 'Mistral';
  let personaDesc = localStorage.getItem(LS_PERSONA) || 'Ты дружелюбный и полезный ассистент. Отвечай кратко и по делу, так как твой ответ будет озвучен голосом.';
  let avatarData = localStorage.getItem(LS_AVATAR) || '';

  let savedVoiceURI = localStorage.getItem(LS_VOICE) || '';
  let speechRate = parseFloat(localStorage.getItem(LS_RATE)) || 0.95;
  let speechPitch = parseFloat(localStorage.getItem(LS_PITCH)) || 1.0;

  let selectedVoice = null;
  let recognition = null;
  let isRecording = false;
  let isProcessing = false;
  let pendingAvatar = null; // null = без изменений, '' = удалить, dataURL = новое фото

  // ---------- Аватар ----------
  function renderAvatar(data) {
    const initial = (personaName || 'M').charAt(0).toUpperCase();
    if (data) {
      headerAvatar.innerHTML = '<img src="' + data + '" alt="">';
      avatarPreview.innerHTML = '<img src="' + data + '" alt="">';
    } else {
      headerAvatar.textContent = initial;
      avatarPreview.textContent = '👤';
    }
  }

  function updateAvatarPreview(data) {
    if (data) {
      avatarPreview.innerHTML = '<img src="' + data + '" alt="">';
    } else {
      avatarPreview.textContent = '👤';
    }
  }

  uploadAvatarBtn.addEventListener('click', () => avatarFile.click());

  avatarFile.addEventListener('change', () => {
    const file = avatarFile.files && avatarFile.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      addMessage('Выберите файл изображения.', 'sys');
      return;
    }
    if (file.size > 3 * 1024 * 1024) {
      addMessage('Фото слишком большое (максимум 3 МБ).', 'sys');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      // ресайз до 256px
      const img = new Image();
      img.onload = () => {
        const maxSide = 256;
        let w = img.width, h = img.height;
        if (w > h && w > maxSide) { h = Math.round(h * maxSide / w); w = maxSide; }
        else if (h >= w && h > maxSide) { w = Math.round(w * maxSide / h); h = maxSide; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        pendingAvatar = canvas.toDataURL('image/jpeg', 0.85);
        updateAvatarPreview(pendingAvatar);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    avatarFile.value = '';
  });

  removeAvatarBtn.addEventListener('click', () => {
    pendingAvatar = '';
    updateAvatarPreview('');
  });

  // ---------- Голоса ----------
  function getRuVoices() {
    if (!('speechSynthesis' in window)) return [];
    return window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  }
  function scoreVoice(v) {
    let s = 0;
    if (!v.localService) s += 10;
    if (/neural|natural|enhanced|premium|online/i.test(v.name)) s += 20;
    if (/google/i.test(v.name)) s += 5;
    if (/svetlana|dmitry|milena|alena|yuri|elena|anna/i.test(v.name)) s += 3;
    return s;
  }
  function pickBestVoice(voices) {
    if (!voices.length) return null;
    return [...voices].sort((a,b) => scoreVoice(b) - scoreVoice(a))[0];
  }
  function refreshVoiceList(keepSelection) {
    const voices = getRuVoices();
    voiceSelect.innerHTML = '';
    if (!voices.length) {
      const opt = document.createElement('option');
      opt.textContent = 'Русские голоса не найдены';
      opt.disabled = true;
      voiceSelect.appendChild(opt);
      selectedVoice = null;
      return;
    }
    voices.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = `${v.name} — ${v.localService ? 'локальный' : 'сетевой'}`;
      voiceSelect.appendChild(opt);
    });
    let targetURI = keepSelection ? savedVoiceURI : '';
    let found = voices.find(v => v.voiceURI === targetURI);
    if (!found) {
      const best = pickBestVoice(voices);
      if (best) { targetURI = best.voiceURI; found = best; }
    }
    if (found) { selectedVoice = found; voiceSelect.value = found.voiceURI; }
    else { selectedVoice = voices[0]; voiceSelect.value = voices[0].voiceURI; }
  }
  function populateVoices() { refreshVoiceList(true); }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = populateVoices;
    setTimeout(populateVoices, 100);
  }

  // ---------- UI ----------
  function updateTitle() {
    chatTitle.textContent = personaName || 'Mistral';
    document.title = 'Чат с ' + (personaName || 'Mistral');
    renderAvatar(avatarData);
  }

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function buildSystemPrompt() {
    return `Ты — персонаж по имени ${personaName}. Твой характер: ${personaDesc}.
Отвечай на русском языке (если пользователь не попросил иначе).
Важно: твои ответы будут озвучены голосом, поэтому не используй эмодзи, markdown, списки, форматирование и специальные символы. Пиши обычным текстом, коротко и естественно, как в живой речи.`;
  }

  async function callMistral(userText) {
    const systemPrompt = buildSystemPrompt();
    const history = messages.slice(-20);
    const payload = {
      model: 'mistral-small-latest',
      messages: [
        { role: 'system', content: systemPrompt },
        ...history,
        { role: 'user', content: userText }
      ],
      temperature: 0.7,
      max_tokens: 300
    };
    const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      let errText = '';
      try { const err = await res.json(); errText = err.error?.message || err.message || JSON.stringify(err); }
      catch (e) { errText = 'HTTP ' + res.status; }
      throw new Error('Ошибка API: ' + errText);
    }
    const data = await res.json();
    return (data.choices?.[0]?.message?.content || '').trim();
  }

  // ---------- Озвучка ----------
  function prepareText(text) {
    let t = text.replace(/[*_`#>]/g, '').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/\s+/g, ' ').trim();
    t = t.replace(/([.!?;:])\s+/g, '$1 ... ');
    if (t.length > 600) t = t.slice(0, 600).replace(/\s+\S*$/, '') + '.';
    return t;
  }
  function speak(text, override) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const t = prepareText(text);
    if (!t) return;
    const utt = new SpeechSynthesisUtterance(t);
    utt.lang = 'ru-RU';
    if (selectedVoice) utt.voice = selectedVoice;
    utt.rate = override?.rate ?? speechRate;
    utt.pitch = override?.pitch ?? speechPitch;
    utt.volume = 1.0;
    window.speechSynthesis.speak(utt);
  }

  // ---------- Логика чата ----------
  async function handleUserText(text) {
    if (isProcessing) return;
    if (!text || !text.trim()) return;
    if (!apiKey) { addMessage('Сначала введите API ключ в настройках ⚙️', 'sys'); return; }

    isProcessing = true;
    micBtn.disabled = true;
    addMessage(text, 'user');
    messages.push({ role: 'user', content: text });

    showTyping();
    try {
      const reply = await callMistral(text);
      hideTyping();
      if (reply) {
        addMessage(reply, 'bot');
        messages.push({ role: 'assistant', content: reply });
        speak(reply);
      } else {
        addMessage('(Пустой ответ)', 'sys');
      }
    } catch (e) {
      hideTyping();
      console.error(e);
      addMessage('Ошибка: ' + e.message, 'sys');  } finally {
    isProcessing = false;
    micBtn.disabled = false;
    sendBtn.disabled = !textInput.value.trim();
  }
}

  // ---------- Распознавание ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      if (transcript && transcript.trim()) handleUserText(transcript.trim());
    };
    recognition.onerror = (e) => {
      if (e.error === 'not-allowed') addMessage('Доступ к микрофону запрещён.', 'sys');
      else if (e.error === 'no-speech') addMessage('Речь не распознана, попробуйте ещё раз.', 'sys');
    };
    recognition.onend = () => {
      if (isRecording) {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtn.textContent = '🎤 Удерживайте для речи';
      }
    };
  }

  function startRecording() {
    if (!recognition) { addMessage('Браузер не поддерживает распознавание речи.', 'sys'); return; }
    if (isProcessing) return;
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    try {
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '🔴 Говорите... (отпустите)';
      recognition.start();
    } catch (e) { console.warn(e); }
  }
  function stopRecording() {
    if (!recognition || !isRecording) return;
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤 Удерживайте для речи';
    try { recognition.stop(); } catch (e) {}
  }

  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!micBtn.disabled) startRecording(); }, { passive: false });
  micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); }, { passive: false });
  micBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopRecording(); }, { passive: false });
  micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); if (!micBtn.disabled) startRecording(); });
  micBtn.addEventListener('mouseup', (e) => { e.preventDefault(); stopRecording(); });
  micBtn.addEventListener('mouseleave', () => { if (isRecording) stopRecording(); });

// ---------- Текстовый ввод ----------
function sendTextMessage() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  textInput.style.height = 'auto';
  sendBtn.disabled = true;
  handleUserText(text);
}

sendBtn.addEventListener('click', sendTextMessage);

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendTextMessage();
  }
});

textInput.addEventListener('input', () => {
  textInput.style.height = 'auto';
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px';
  sendBtn.disabled = !textInput.value.trim() || !apiKey;
});

  // ---------- Настройки ----------
  function syncSliders() {
    rateDisplay.textContent = Number(rateInput.value).toFixed(2);
    pitchDisplay.textContent = Number(pitchInput.value).toFixed(2);
  }
  function openSettings() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    apiKeyInput.value = apiKey;
    nameInput.value = personaName;
    personaInput.value = personaDesc;
    pendingAvatar = null;
    updateAvatarPreview(avatarData);
    refreshVoiceList(true);
    rateInput.value = speechRate;
    pitchInput.value = speechPitch;
    syncSliders();
    modal.classList.remove('hidden');
  }
  function closeSettings() { modal.classList.add('hidden'); }

  settingsBtn.addEventListener('click', openSettings);
  cancelBtn.addEventListener('click', closeSettings);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeSettings(); });

  rateInput.addEventListener('input', syncSliders);
  pitchInput.addEventListener('input', syncSliders);
  voiceSelect.addEventListener('change', () => {
    const v = getRuVoices().find(x => x.voiceURI === voiceSelect.value);
    if (v) selectedVoice = v;
  });

  testVoiceBtn.addEventListener('click', () => {
    if (!selectedVoice) { addMessage('Русские голоса не найдены в системе.', 'sys'); return; }
    speak('Привет! Так будет звучать мой голос. Проверим скорость и тональность.',
      { rate: parseFloat(rateInput.value), pitch: parseFloat(pitchInput.value) });
  });

  saveBtn.addEventListener('click', () => {
    apiKey = apiKeyInput.value.trim();
    personaName = nameInput.value.trim() || 'Mistral';
    personaDesc = personaInput.value.trim() || 'Ты дружелюбный и полезный ассистент.';
    savedVoiceURI = voiceSelect.value || '';
    speechRate = parseFloat(rateInput.value) || 0.95;
    speechPitch = parseFloat(pitchInput.value) || 1.0;

    // применяем аватар
    if (pendingAvatar !== null) {
      avatarData = pendingAvatar;
      if (avatarData) localStorage.setItem(LS_AVATAR, avatarData);
      else localStorage.removeItem(LS_AVATAR);
      pendingAvatar = null;
    }

    localStorage.setItem(LS_API_KEY, apiKey);
    localStorage.setItem(LS_NAME, personaName);
    localStorage.setItem(LS_PERSONA, personaDesc);
    localStorage.setItem(LS_VOICE, savedVoiceURI);
    localStorage.setItem(LS_RATE, speechRate);
    localStorage.setItem(LS_PITCH, speechPitch);

    updateTitle();
micBtn.disabled = !apiKey;
textInput.disabled = !apiKey;
sendBtn.disabled = !apiKey || !textInput.value.trim();
closeSettings();
    addMessage('Настройки сохранены. Персонаж: ' + personaName, 'sys');
  });

  // ---------- Инициализация ----------
  updateTitle();
micBtn.disabled = !apiKey;
textInput.disabled = !apiKey;
sendBtn.disabled = !apiKey;
textInput.style.height = 'auto';

if (!apiKey) {
    addMessage('Добро пожаловать! Нажмите ⚙️ вверху и введите API ключ Mistral.', 'sys');
    setTimeout(openSettings, 300);
  } else {
    addMessage('Привет! Я ' + personaName + '. Удерживайте кнопку внизу и говорите.', 'sys');
  }
})();
</script>
<script>
(function() {
  "use strict";
  function openGame(url, title) {
    const oldOverlay = document.querySelector('.transition-overlay');
    if (oldOverlay) oldOverlay.remove();
    const overlay = document.createElement('div');
    overlay.className = 'transition-overlay';
    const topBar = document.createElement('div');
    topBar.className = 'transition-topbar';
    const backBtn = document.createElement('button');
    backBtn.className = 'transition-back';
    backBtn.textContent = '← Назад';
    backBtn.onclick = function() { overlay.remove(); };
    const titleEl = document.createElement('span');
    titleEl.className = 'transition-title';
    titleEl.textContent = title || '🌐 Загрузка...';
    topBar.appendChild(backBtn); topBar.appendChild(titleEl); overlay.appendChild(topBar);
    const iframe = document.createElement('iframe');
    iframe.className = 'transition-iframe';
    iframe.src = url;
    iframe.allow = 'camera; microphone; payment; fullscreen; geolocation; downloads';
    iframe.sandbox = 'allow-same-origin allow-scripts allow-forms allow-modals allow-popups allow-presentation allow-downloads';
    overlay.appendChild(iframe); document.body.appendChild(overlay);
    const escapeHandler = function(e) {
      if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escapeHandler); }
    };
    document.addEventListener('keydown', escapeHandler);
    iframe.onload = function() {
      try {
        const frameTitle = iframe.contentDocument?.title;
        if (frameTitle && frameTitle !== '' && frameTitle !== 'Загрузка...') titleEl.textContent = frameTitle;
      } catch (e) {}
    };
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    window.addEventListener('message', function(event) {
      if (event.source !== iframe.contentWindow) return;
      const data = event.data;
      if (data && data.type === 'download') handleDownload(data.content, data.filename, data.mimeType);
    });
    return overlay;
  }
  function handleDownload(content, filename, mimeType) {
    try {
      if (typeof content === 'string' && content.startsWith('http')) {
        const a = document.createElement('a');
        a.href = content; a.download = filename || 'download'; a.target = '_blank';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        showNotification('✅ Скачивание началось!', 'success');
        return;
      }
      let blob;
      if (typeof content === 'string') blob = new Blob([content], { type: mimeType || 'text/plain;charset=utf-8' });
      else if (content instanceof Blob) blob = content;
      else throw new Error('Неподдерживаемый формат данных');
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename || 'download';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
      showNotification('✅ Файл "' + (filename || 'download') + '" сохранён!', 'success');
    } catch (error) {
      console.error('Ошибка скачивания:', error);
      showNotification('❌ Ошибка скачивания: ' + error.message, 'error');
    }
  }
  function showNotification(message, type) {
    const old = document.querySelector('.download-notification');
    if (old) old.remove();
    const notification = document.createElement('div');
    notification.className = 'download-notification ' + (type || '');
    notification.textContent = message;
    document.body.appendChild(notification);
    setTimeout(function() {
      notification.style.opacity = '0';
      notification.style.transition = 'opacity 0.5s';
      setTimeout(function() { notification.remove(); }, 500);
    }, 3000);
  }
  window.openGame = openGame;
  window.handleDownload = handleDownload;
  window.showNotification = showNotification;
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistration().then(function(r) {
      if (r) return;
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }).catch(function(){});
  }
  function init() { registerSW(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
